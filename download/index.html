<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>download</title>
<style>
:root {
  --paper: #f2e9d3;
  --paper2: #e6d9b8;
  --ink: #2a2017;
  --ink-soft: #6b5a43;
  --hi: #f7d98a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1d1913;
    --paper2: #2a241a;
    --ink: #e9dcc0;
    --ink-soft: #a89874;
    --hi: #5b4a1c;
  }
}
:root[data-theme="dark"] {
  --paper: #1d1913;
  --paper2: #2a241a;
  --ink: #e9dcc0;
  --ink-soft: #a89874;
  --hi: #5b4a1c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--paper);
  color: var(--ink);
  font-family: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", serif;
  line-height: 1.7;
}
.wrap { max-width: 640px; margin: 0 auto; }
.lead { text-align: center; font-size: 14px; margin: 8px 0; }
.hint { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 4px 0 0; }
.note { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 16px 0 0; }
a { color: var(--ink); }
svg { display: block; width: 100%; height: auto; }

.ink { stroke: var(--ink); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.paperfill { fill: var(--paper); }
.ray { stroke: var(--ink); stroke-width: 1; opacity: .55; }
.br-o { stroke: var(--ink); fill: none; stroke-linecap: round; }
.br-i { stroke: var(--paper); fill: none; stroke-linecap: round; }
.trunk { fill: url(#hatch); stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
.grain { stroke: var(--ink); stroke-width: .9; fill: none; opacity: .75; }
.title-t { font-size: 22px; font-weight: 700; fill: var(--ink); text-anchor: middle; letter-spacing: .06em; }
.title-s { font-size: 11px; fill: var(--ink-soft); text-anchor: middle; }

.sway { animation: sway 5s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.4deg); } }
@media (prefers-reduced-motion: reduce) { .sway { animation: none; } }

a.fruit, a.rootlink { cursor: pointer; text-decoration: none; outline: none; }
.face { fill: var(--paper); stroke: var(--ink); stroke-width: 2.2; transition: fill .15s; }
.ring { fill: none; stroke: var(--ink); stroke-width: .9; }
.shade { fill: none; stroke: url(#hatch); stroke-width: 5; opacity: .8; }
.face-g { transition: transform .15s; }
a.fruit:hover .face-g, a.fruit:focus-visible .face-g { transform: scale(1.07); }
a.fruit:hover .face, a.fruit:focus-visible .face,
a.rootlink:hover .lab, a.rootlink:focus-visible .lab { fill: var(--hi); }
a.fruit:focus-visible .face, a.rootlink:focus-visible .lab { stroke-width: 4; }
.f-name { font-weight: 700; fill: var(--ink); text-anchor: middle; }
.f-sub { fill: var(--ink-soft); text-anchor: middle; }
.lab { fill: var(--paper); stroke: var(--ink); stroke-width: 1.6; transition: fill .15s; }
.r-name { font-size: 11px; fill: var(--ink); text-anchor: middle; }
.base-t { font-size: 13px; font-weight: 700; fill: var(--ink); text-anchor: middle; }

#tip {
  position: fixed;
  z-index: 10;
  max-width: 280px;
  padding: 8px 12px;
  background: var(--paper);
  border: 1.5px solid var(--ink);
  box-shadow: 3px 3px 0 var(--ink-soft);
  font-size: 13px;
  line-height: 1.6;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
}
#tip.on { opacity: 1; }
#tip b { display: block; font-size: 15px; }
#tip i { display: block; font-style: normal; color: var(--ink-soft); font-size: 12px; margin-bottom: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">ふだん使っているツールの、Release フォルダ（GitHub）へのリンク集。Windows 用です。<br>
  フォルダに exe と、動かすのに必要な dll が入っています。dll があるツールは、exe と同じフォルダに置いて使ってください。</p>
  <p class="hint">🍎 果実をクリックすると Release フォルダ ／ 🌿 根っこをクリックすると 3D 図解（設計図）が開きます</p>

  <svg id="tree" viewBox="0 0 640 1640" role="group" aria-label="ツールを果実にした木"></svg>

  <p class="note">※ Launcher だけは、.NET 10 デスクトップランタイムが入っている PC で動きます。入っていない場合は、起動時に案内が出ます。
  <a href="https://dotnet.microsoft.com/ja-jp/download/dotnet/10.0">ランタイムのダウンロード</a></p>
</div>
<div id="tip" role="tooltip"></div>

<script>
(function () {
  var GH = 'https://github.com/koichi210/';
  // x, y = 果実の中心。左右・高さはわざと不規則にしてある
  var TOOLS = [
    { name: 'Cheetos', sub: '画面キャプチャ', tech: 'WPF / .NET Framework', x: 205, y: 340,
      href: GH + 'Essentials/tree/main/Cheetos/Cheetos/bin/Release',
      desc: '画面（全画面・いまのモニター・いまのウィンドウ）を、決めた間隔で連続キャプチャして保存するツール。' },
    { name: 'ColorConvert', sub: '色の確認・変換', tech: 'WPF / .NET Framework', x: 450, y: 405,
      href: GH + 'CS_Wpf/tree/main/ColorConvert/ColorConvert/bin/Release',
      desc: 'R・G・B のスライダーと数値で色を作って、色の値を確認・変換できるツール。' },
    { name: 'DuplicateFinder', sub: '重複ファイル削除', tech: 'WPF / .NET Framework 4.8', x: 95, y: 510,
      href: GH + 'Essentials/tree/main/DuplicateFinder/DuplicateFinder/bin/Release',
      desc: '複数のフォルダから中身が同じファイルを探し出して、選んで削除できるツール。大きなファイルも先頭・末尾から順に比べて速く判定します。' },
    { name: 'EventRecorder', sub: 'マクロ記録・再生', tech: 'WPF / .NET Framework 4.8 / x64', x: 530, y: 580,
      href: GH + 'Essentials/tree/main/EventRecorder/EventRecorder/bin/Release',
      desc: 'キーボードとマウスの操作を記録して、そのまま再生できるツール。プレイリストで複数の記録をつなげて、ループ再生もできます。' },
    { name: 'FFEdit', sub: '名前の一括変換', tech: 'WPF / .NET Framework', x: 215, y: 655,
      href: GH + 'Essentials/tree/main/FFEdit/FFEdit/bin/Release',
      desc: 'フォルダ内のファイル・フォルダの名前を、通し番号などでまとめて変換するツール。タイムスタンプの更新もできます。' },
    { name: 'FileArranger', sub: 'ファイル整理', tech: 'WPF / .NET Framework', x: 430, y: 750,
      href: GH + 'Essentials/tree/main/FileArranger/FileArranger/bin/Release',
      desc: 'フォルダの移動や名前変更、ファイル名での並べ替え、ファイルの移動・振り分けをまとめて行う整理ツール。' },
    { name: 'Launcher', sub: 'ランチャー', tech: 'WPF / .NET 10（ランタイムが必要）', x: 90, y: 820,
      href: GH + 'Essentials/tree/main/Launcher/Launcher/bin/Release/net10.0-windows',
      desc: 'よく使う exe や URL を登録しておいて、ワンクリックで起動できるランチャー。セクションごとに分けて、折りたたんで表示できます。※ .NET 10 デスクトップランタイムが必要です。' },
    { name: 'Mailer', sub: 'メール作成', tech: 'WPF / .NET Framework', x: 545, y: 910,
      href: GH + 'Essentials/tree/main/Mailer/Mailer/bin/Release',
      desc: '宛先・件名・本文を決めておいて、ブラウザのメール作成画面をワンクリックで開くツール。日付入りの件名を、日をずらしてまとめて作ることもできます。' },
    { name: 'Othello', sub: 'ゲーム · C#', tech: 'C# / WPF / .NET Framework', x: 225, y: 965,
      href: GH + 'Essentials/tree/main/Othello/Othello/bin/Release',
      desc: 'オセロ。人対人・人対COM・COM対COM の対戦ができて、一手戻す・一手進めるも使えます。' },
    { name: 'DigitalClock', sub: '時計', tech: 'WPF / .NET Framework', x: 440, y: 1045,
      href: GH + 'Essentials/tree/main/DigitalClock/DigitalClock/bin/Release',
      desc: '時刻だけを大きく表示する、シンプルなデジタル時計。' },
    { name: 'MotionCapture', sub: '画面録画', tech: 'WPF / .NET Framework', x: 110, y: 1125,
      href: GH + 'CS_Wpf/tree/main/MotionCapture/MotionCapture/bin/Release',
      desc: '画面の指定した範囲を、FPS や画質を決めて動画（AVI）として録画するツール。' },
    { name: 'OthelloMfc', sub: 'ゲーム · C++', tech: 'C++ / MFC', x: 535, y: 1210,
      href: GH + 'Essentials/tree/main/OthelloMfc/Release',
      desc: 'オセロ。C++（MFC）で作った版です。' },
    { name: 'LoginHistory', sub: '稼働ログ', tech: 'C++ / MFC', x: 230, y: 1230,
      href: GH + 'Essentials/tree/main/LoginHistory/Release',
      desc: 'PC が動いていた時刻を、一定の間隔でログファイルに書き残していくツール。' }
  ];
  // 根っこ＝設計図（../doc/Essentials/ 配下）
  var DOCS = ['Cheetos', 'DuplicateFinder', 'EventRecorder', 'FFEdit', 'FileArranger', 'Launcher',
              'Mailer', 'Othello', 'DigitalClock', 'OthelloMfc', 'LoginHistory'];

  // 毎回同じ形になるよう、乱数は種を固定
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var rnd = rng(20261030);
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function f(n) { return Math.round(n * 10) / 10; }
  // 点列をなめらかな線にする（中点を通る二次ベジェ）
  function smooth(p) {
    var d = 'M' + f(p[0][0]) + ',' + f(p[0][1]);
    for (var i = 1; i < p.length - 1; i++) {
      d += ' Q' + f(p[i][0]) + ',' + f(p[i][1]) + ' ' +
           f((p[i][0] + p[i + 1][0]) / 2) + ',' + f((p[i][1] + p[i + 1][1]) / 2);
    }
    var l = p[p.length - 1];
    return d + ' L' + f(l[0]) + ',' + f(l[1]);
  }
  function bez(p0, p1, p2, p3, t) {
    var u = 1 - t;
    return [
      u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]
    ];
  }

  var CX = 320, TOP = 188, BOT = 1322, R = 56;
  var out = [];

  out.push('<defs>' +
    '<pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(70)">' +
    '<rect width="5" height="5" fill="var(--paper)"/>' +
    '<line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width=".9" opacity=".55"/></pattern></defs>');

  // 頂上の光線
  var ox = CX, oy = 130;
  for (var i = 0; i < 72; i++) {
    var a = Math.PI * 2 * i / 72 + rnd() * 0.03;
    var r0 = 66, r1 = (i % 3 === 0 ? 150 : i % 3 === 1 ? 105 : 125) + rnd() * 45;
    out.push('<line class="ray" x1="' + f(ox + Math.cos(a) * r0) + '" y1="' + f(oy + Math.sin(a) * r0) +
             '" x2="' + f(ox + Math.cos(a) * r1) + '" y2="' + f(oy + Math.sin(a) * r1) + '"/>');
  }

  // 根っこ（幹より先に描いて、付け根を幹で隠す）
  var rootTips = DOCS.map(function (name, i) {
    return { name: name, x: 52 + i * 53.6, y: [1430, 1500, 1570][i % 3] };
  });
  rootTips.forEach(function (t) {
    var p0 = [CX, BOT - 6], p1 = [CX + (t.x - CX) * 0.2, BOT + (t.y - BOT) * 0.45],
        p2 = [t.x + (rnd() - 0.5) * 14, t.y - 90], p3 = [t.x, t.y - 14];
    var d = 'M' + p0 + ' C' + p1 + ' ' + p2 + ' ' + p3;
    out.push('<path class="br-o" stroke-width="8" d="' + d + '"/><path class="br-i" stroke-width="4.2" d="' + d + '"/>');
    // ひげ根
    for (var k = 0; k < 3; k++) {
      var s = bez(p0, p1, p2, p3, 0.35 + k * 0.2), dir = k % 2 ? 1 : -1;
      out.push('<path class="ink" stroke-width="1.3" d="M' + f(s[0]) + ',' + f(s[1]) + ' q' +
               f(dir * (10 + rnd() * 10)) + ',' + f(8 + rnd() * 8) + ' ' + f(dir * (16 + rnd() * 14)) + ',' + f(22 + rnd() * 16) + '"/>');
    }
  });

  // 果実をぶら下げる枝
  var fruits = [];
  TOOLS.forEach(function (t, i) {
    var s = t.x < CX ? -1 : 1;
    var tipY = t.y - R - 30, tipX = t.x + (rnd() - 0.5) * 8, ay = tipY + 70 + rnd() * 10;
    var p0 = [CX, ay], p1 = [CX + (t.x - CX) * 0.3, ay - 4 + rnd() * 12],
        p2 = [CX + (t.x - CX) * 0.72, tipY - 22 - rnd() * 14], p3 = [tipX, tipY];
    var d = 'M' + p0 + ' C' + p1 + ' ' + p2 + ' ' + p3;
    out.push('<path class="br-o" stroke-width="10" d="' + d + '"/><path class="br-i" stroke-width="6" d="' + d + '"/>');
    fruits.push({ t: t, i: i, s: s, tipX: tipX, tipY: tipY });
  });

  // 実のならない小枝（葉つき）
  [[-1, 470, 62, -38], [1, 250, 66, -36], [-1, 860, 64, -28], [1, 1295, 78, -16]].forEach(function (w) {
    var s = w[0], y = w[1], len = w[2], rise = w[3];
    var p0 = [CX, y], p1 = [CX + s * len * 0.4, y - 2], p2 = [CX + s * len * 0.8, y + rise * 0.6], p3 = [CX + s * len, y + rise];
    var d = 'M' + p0 + ' C' + p1 + ' ' + p2 + ' ' + p3;
    out.push('<path class="br-o" stroke-width="6.5" d="' + d + '"/><path class="br-i" stroke-width="3" d="' + d + '"/>');
    for (var k = 0; k < 4; k++) {
      var q = bez(p0, p1, p2, p3, 0.45 + k * 0.17), sd = k % 2 ? 1 : -1;
      out.push('<path class="ink paperfill" stroke-width="1.2" d="M' + f(q[0]) + ',' + f(q[1]) + ' q' +
               f(s * 8) + ',' + f(sd * 10) + ' ' + f(s * 18) + ',' + f(sd * 4) + ' q' + f(-s * 8) + ',' + f(-sd * 2) + ' ' + f(-s * 18) + ',' + f(-sd * 4) + '"/>');
    }
  });

  // 幹
  var L = [], Rr = [];
  function tx(y) { return CX + Math.sin(y / 95) * 4 + Math.sin(y / 37) * 1.5; }
  function tw(y) {
    var t = (y - TOP) / (BOT - TOP);
    var w = 14 + t * 12 + Math.sin(y / 53 + 1) * 2.2;
    if (y > BOT - 60) { var u = (y - (BOT - 60)) / 60; w += u * u * 26; }
    return w;
  }
  for (var y = TOP; y <= BOT; y += 14) {
    L.push([tx(y) - tw(y) + (rnd() - 0.5) * 1.4, y]);
    Rr.push([tx(y) + tw(y) + (rnd() - 0.5) * 1.4, y]);
  }
  out.push('<path class="trunk" d="' + smooth(L) + ' ' + smooth(Rr.slice().reverse()).replace(/^M/, 'L') + ' Z"/>');
  [0.22, 0.5, 0.76].forEach(function (k, n) {
    var pts = [];
    for (var j = 2; j < L.length - 3; j++) {
      pts.push([L[j][0] + (Rr[j][0] - L[j][0]) * k + Math.sin(L[j][1] / 23 + n * 3) * 1.6, L[j][1]]);
    }
    out.push('<path class="grain" d="' + smooth(pts) + '"/>');
  });

  // 頂上の円（タイトル）
  out.push('<circle class="face" cx="' + CX + '" cy="' + oy + '" r="58"/>' +
           '<circle class="ring" cx="' + CX + '" cy="' + oy + '" r="52"/>' +
           '<circle class="shade" cx="' + CX + '" cy="' + oy + '" r="55.5"/>' +
           '<text class="title-t" x="' + CX + '" y="' + (oy + 4) + '">download</text>' +
           '<text class="title-s" x="' + CX + '" y="' + (oy + 24) + '">Windows ツール</text>');

  // 果実
  fruits.forEach(function (o) {
    var t = o.t, s = o.s, cx = t.x, cy = t.y;
    var nameSize = Math.min(15, 98 / (t.name.length * 0.56));
    var subSize = Math.min(10.5, 84 / t.sub.length);
    var dur = (4 + rnd() * 3).toFixed(1), del = (rnd() * 5).toFixed(1);
    out.push('<g class="sway" style="transform-origin:' + f(o.tipX) + 'px ' + f(o.tipY) + 'px;animation-duration:' + dur + 's;animation-delay:-' + del + 's">' +
      '<path class="ink" stroke-width="2.4" d="M' + f(o.tipX) + ',' + f(o.tipY) + ' Q' + f(cx + s * 3) + ',' + f(o.tipY + 14) + ' ' + f(cx) + ',' + f(cy - R) + '"/>' +
      '<path class="ink paperfill" stroke-width="1.3" d="M' + f(o.tipX) + ',' + f(o.tipY + 4) + ' q' + f(-s * 12) + ',-12 ' + f(-s * 26) + ',-4 q' + f(s * 12) + ',12 ' + f(s * 26) + ',4"/>' +
      '<a class="fruit" href="' + esc(t.href) + '" data-i="' + o.i + '" aria-label="' + esc(t.name + '：' + t.desc) + '">' +
      '<g class="face-g" style="transform-origin:' + cx + 'px ' + cy + 'px">' +
      '<circle class="face" cx="' + cx + '" cy="' + cy + '" r="' + R + '"/>' +
      '<circle class="shade" cx="' + cx + '" cy="' + cy + '" r="' + (R - 2.5) + '"/>' +
      '<circle class="ring" cx="' + cx + '" cy="' + cy + '" r="' + (R - 5) + '"/>' +
      '<text class="f-name" x="' + cx + '" y="' + (cy - 3) + '" font-size="' + f(nameSize) + '">' + esc(t.name) + '</text>' +
      '<text class="f-sub" x="' + cx + '" y="' + (cy + 15) + '" font-size="' + f(subSize) + '">' + esc(t.sub) + '</text>' +
      '</g></a></g>');
  });

  // 根の付け根のラベルと、根の先のラベル（どちらも設計図へのリンク）
  out.push('<a class="rootlink" href="../doc/Essentials/" aria-label="Essentials 設計図（一覧）">' +
           '<ellipse class="lab" cx="' + CX + '" cy="' + (BOT + 30) + '" rx="84" ry="18"/>' +
           '<text class="base-t" x="' + CX + '" y="' + (BOT + 35) + '">Essentials 設計図</text></a>');
  rootTips.forEach(function (t) {
    var w = Math.max(64, t.name.length * 6.6 + 24);
    out.push('<a class="rootlink" href="../doc/Essentials/' + esc(t.name) + '/" aria-label="' + esc(t.name) + ' の設計図">' +
             '<rect class="lab" x="' + f(t.x - w / 2) + '" y="' + (t.y - 14) + '" width="' + f(w) + '" height="26" rx="13"/>' +
             '<text class="r-name" x="' + f(t.x) + '" y="' + (t.y + 4) + '">' + esc(t.name) + '</text></a>');
  });

  var svg = document.getElementById('tree');
  svg.innerHTML = out.join('');

  // 果実にカーソルを乗せる／フォーカスすると説明を出す
  var tip = document.getElementById('tip');
  function show(a) {
    var t = TOOLS[+a.getAttribute('data-i')];
    tip.innerHTML = '<b>' + esc(t.name) + '</b><i>' + esc(t.tech) + '</i>' + esc(t.desc);
    var r = a.getBoundingClientRect();
    var tw2 = tip.offsetWidth, th = tip.offsetHeight;
    var left = Math.min(Math.max(8, r.left + r.width / 2 - tw2 / 2), window.innerWidth - tw2 - 8);
    var top = r.bottom + 10;
    if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 10);
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    tip.classList.add('on');
  }
  function hide() { tip.classList.remove('on'); }
  svg.addEventListener('mouseover', function (e) { var a = e.target.closest('a.fruit'); if (a) show(a); });
  svg.addEventListener('mouseout', function (e) { if (e.target.closest('a.fruit')) hide(); });
  svg.addEventListener('focusin', function (e) { var a = e.target.closest('a.fruit'); if (a) show(a); });
  svg.addEventListener('focusout', hide);
  window.addEventListener('scroll', hide, { passive: true });
})();
</script>
</body>
</html>
