<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrawlArena | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var T = THREE;

  // ---------- アリーナ（src/data/maps.json）：1280×768px → 3D（64px = 1マス、中央が原点） ----------
  function P(px, py, y) { return [px / 64 - 10, y || 0, py / 64 - 6]; }
  function U(px) { return px / 64; }
  // キャラの見た目の半径は「コードの半径 × 1.6」（小さすぎて見えないので。比率はコードどおり）
  var R_ASSAULT = 20 * 1.6 / 64, R_TANK = 26 * 1.6 / 64, R_SNIPER = 16 * 1.6 / 64;
  var SPAWN_ME = P(160, 618), SPAWN_BOT = P(1120, 150);
  var OBST = [[460, 284, 100, 60], [820, 484, 100, 60], [460, 484, 60, 100], [820, 284, 60, 100]];
  var BUSH = [[190, 190, 220, 200], [1090, 190, 220, 200], [190, 578, 220, 200], [1090, 578, 220, 200]];
  var ME_COL = '#66ccff', BOT_COL = '#ff4444';

  // ---------- 13体（characters.json の並び＝キャラ選択画面の並び）。名前は載せず、色とタイプで呼ぶ ----------
  // [色, 色の呼び名, 攻撃, HP, 移動速度, 必殺技タイプ, 解放条件]
  var ROSTER = [
    ['#66ccff', '水色', '遠距離', 3400, 260, '吸込', '最初から'],
    ['#ff6633', 'オレンジ', '近接', 5200, 200, '爆発', '最初から'],
    ['#ffdd44', '黄色', '遠距離', 2800, 230, '必中', '最初から'],
    ['#4a4a66', '紺', '遠距離', 3000, 300, '必中', 'Lv2・300'],
    ['#9933cc', '紫', '近接', 5600, 190, '爆発', 'Lv3・450'],
    ['#dddddd', '白', '近接', 3600, 250, '必中', 'Lv2・300'],
    ['#ff3399', 'ピンク', '遠距離', 6000, 240, '爆発', 'Lv8・1400'],
    ['#660022', 'えんじ', '遠距離', 3100, 210, '必中', 'Lv6・900'],
    ['#ff99cc', 'うすピンク', '遠距離', 2400, 220, '吸込', 'Lv4・600'],
    ['#33cc99', '青緑', '遠距離', 5800, 210, '爆発', 'Lv7・1100'],
    ['#333333', '黒', '近接', 3300, 290, '必中', 'Lv3・450'],
    ['#ff8899', 'ローズ', '遠距離', 2600, 220, '吸込', 'Lv3・450'],
    ['#88aa33', '黄緑', '近接', 2900, 250, '爆発', 'Lv1・150'],
  ];
  var MULT = [1.0, 1.03, 1.06, 1.09, 1.12, 1.16, 1.20, 1.24, 1.28, 1.33]; // progression.json
  var COST = [50, 80, 120, 170, 230, 300, 380, 470, 570];

  var rosterHtml = '<table><tr><th>#</th><th>色</th><th>攻撃</th><th>HP</th><th>速さ</th><th>必殺技</th><th>解放</th></tr>' +
    ROSTER.map(function (r, i) {
      return '<tr><td>' + (i + 1) + '</td><td><span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:' + r[0] +
        ';border:1px solid #fff8;vertical-align:-1px"></span> ' + r[1] + '</td><td>' + (r[2] === '近接' ? '近' : '遠') + '</td><td>' + r[3] + '</td><td>' + r[4] +
        '</td><td>' + r[5] + '</td><td>' + r[6] + '</td></tr>';
    }).join('') + '</table>';

  // ---------- 舞台の置き場所 ----------
  // 舞台は横一列に離して置く（カメラの奥に別の舞台が映りこまないように）
  var LX = -40, LZ = 0;    // 始め方
  var SX = -80, SZ = 0;    // キャラ選択画面の模型
  var KX = 40, KZ = 0;     // 操作（キー・マウス）
  var GX = 80, GZ = 0;     // 必殺技ゲージ
  var UX = 120, UZ = 0;    // 必殺技3タイプ
  var RX = -120, RZ = 0;   // キャラ一覧
  var VX = 160, VZ = 0;    // 育成
  function HPm(x, y, h) { return [SX + (x - 640) / 100, h == null ? 0.1 : h, SZ + (y - 384) / 100]; } // 選択画面 1280×768 → 模型

  // ---------- 小物 ----------
  var shown = {};
  function setL(g, id, text, o) {
    if (shown[id] === text) return;
    shown[id] = text;
    g.setLabel(id, text, o);
  }
  function fighter(g, id, color, r, pos, o) {
    o = o || {};
    g.group(id, { pos: pos, parent: o.parent });
    g.cylinder({ id: id + '-body', parent: id, radius: r, height: 0.42, pos: [0, 0.22, 0], color: color, emissive: color, emissiveIntensity: 0.18 });
    g.group(id + '-aim', { parent: id });
    g.box({ parent: id + '-aim', size: [0.42, 0.08, 0.12], pos: [r + 0.3, 0.3, 0], color: '#ffffff', edges: false });
    g.box({ id: id + '-hpbg', parent: id, size: [1.0, 0.06, 0.16], pos: [0, 0.75, -r - 0.2], color: '#222222', edges: false });
    g.box({ id: id + '-hp', parent: id, size: [1.0, 0.08, 0.17], pos: [0, 0.77, -r - 0.2], color: '#33dd55', edges: false });
    if (o.label) g.label(o.label, [0, 0.9, r + 0.7], { id: id + '-lbl', parent: id, size: o.labelSize || 0.32, bg: '#000000aa', color: o.labelColor });
  }
  function setHp(g, id, ratio) {
    ratio = Math.max(0, Math.min(1, ratio));
    var fg = g.get(id + '-hp');
    fg.scale.x = Math.max(ratio, 0.001);
    fg.position.x = -(1 - ratio) * 0.5;
    g.setColor(fg, ratio > 0.5 ? '#33dd55' : ratio > 0.25 ? '#dddd33' : '#dd3333');
  }
  function aimAt(g, id, a) { g.get(id + '-aim').rotation.y = -a; }
  function aimTo(g, id, from, to) { aimAt(g, id, Math.atan2(to[2] - from[2], to[0] - from[0])); }
  function ring(g, id, r, color, o) {
    o = o || {};
    var m = new T.Mesh(new T.RingGeometry(r - (o.w || 0.04), r + (o.w || 0.04), 96),
      new T.MeshBasicMaterial({ color: color, transparent: true, opacity: o.opacity || 0.9, side: T.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    var p = o.pos || [0, 0.06, 0];
    m.position.set(p[0], p[1], p[2]);
    return g.add(id, m, o.parent);
  }
  function disc(g, id, r, color, o) {
    o = o || {};
    var m = new T.Mesh(new T.CircleGeometry(r, 64),
      new T.MeshBasicMaterial({ color: color, transparent: true, opacity: o.opacity || 0.3, side: T.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    var p = o.pos || [0, 0.05, 0];
    m.position.set(p[0], p[1], p[2]);
    return g.add(id, m, o.parent);
  }
  // 扇形（+x 方向を中心に、全角 deg 度）
  function sector(g, id, r, deg, color, o) {
    o = o || {};
    var h = deg * Math.PI / 360;
    var m = new T.Mesh(new T.CircleGeometry(r, 48, -h, 2 * h),
      new T.MeshBasicMaterial({ color: color, transparent: true, opacity: o.opacity || 0.35, side: T.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = o.y || 0.05;
    return g.add(id, m, o.parent);
  }
  function bullet(g, id, color) {
    return g.sphere({ id: id, radius: 0.13, color: color, emissive: color, emissiveIntensity: 0.8 });
  }
  // 弾を from→to へ（t0 秒に発射、dur 秒で到着）。飛んでいる間だけ見せる
  function shot(g, id, from, to, t0, dur, tt) {
    var o = g.get(id), k = (tt - t0) / dur;
    if (k < 0 || k > 1) { o.visible = false; return; }
    o.visible = true;
    g.lerpPos(o, [from[0], 0.3, from[2]], [to[0], 0.3, to[2]], k);
  }
  function L3(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }
  function ids(prefix, n) { var a = []; for (var i = 0; i < n; i++) a.push(prefix + i); return a; }

  // ステップ1・15 で使う配置
  var S1_ME = P(330, 384), S1_BOT = P(800, 384);
  function duel(g, t) {
    g.setPos('me', S1_ME); g.setPos('bot', S1_BOT);
    aimAt(g, 'me', 0); aimAt(g, 'bot', Math.PI);
    var tt = t % 3;
    shot(g, 'b1-0', L3(S1_ME, S1_BOT, 0.06), L3(S1_ME, S1_BOT, 0.94), 0.2, 0.75, tt);
    shot(g, 'b1-1', L3(S1_BOT, S1_ME, 0.06), L3(S1_BOT, S1_ME, 0.94), 1.5, 0.75, tt);
    setHp(g, 'bot', 1 - 0.12 * Math.floor((t + 2.05) / 3));
    setHp(g, 'me', 1 - 0.12 * Math.floor((t + 0.75) / 3));
  }

  var ARENA = ['arena', 'me', 'bot'];

  var CFG = {
    title: 'BrawlArena 遊び方',
    back: '../index.html',
    subtitle: '上から見下ろしたアリーナで、ボットと1対1で撃ち合う対戦アクション。はじめての人向けのチュートリアル',
    camera: { pos: [0, 17, 10.5], target: [0, 0, 0.3] },

    build: function (g) {
      // ======================= アリーナ =======================
      g.group('arena', {});
      g.plate({ id: 'ar-floor', parent: 'arena', size: [20, 12], pos: [0, 0.02, 0], color: '#1e3a1e', opacity: 1, radius: 0.05 });
      g.line([[-10, 0.08, -6], [10, 0.08, -6], [10, 0.08, 6], [-10, 0.08, 6], [-10, 0.08, -6]], { parent: 'arena', color: '#ffffff', opacity: 0.6 });
      OBST.forEach(function (o, i) {
        g.box({ id: 'obs' + i, parent: 'arena', size: [U(o[2]), 0.7, U(o[3])], pos: P(o[0], o[1], 0.35), color: '#6b6b55', edgeColor: '#ffffff' });
      });
      BUSH.forEach(function (b, i) {
        g.box({ id: 'bush' + i, parent: 'arena', size: [U(b[2]), 0.3, U(b[3])], pos: P(b[0], b[1], 0.15), color: '#2f9a45', opacity: 0.5, edges: false });
      });
      ring(g, 'sp-me', 0.55, ME_COL, { parent: 'arena', pos: [SPAWN_ME[0], 0.07, SPAWN_ME[2]] });
      ring(g, 'sp-bot', 0.55, BOT_COL, { parent: 'arena', pos: [SPAWN_BOT[0], 0.07, SPAWN_BOT[2]] });

      fighter(g, 'me', ME_COL, R_ASSAULT, SPAWN_ME, { label: 'あなた' });
      fighter(g, 'bot', BOT_COL, R_ASSAULT, SPAWN_BOT, { label: 'ボット' });
      g.label('？ 見失った…', [0, 0.9, R_ASSAULT + 0.7], { id: 'bot-q', parent: 'bot', size: 0.32, bg: '#000000aa', color: '#ffd166' });
      ['b1-0', 'b1-1'].forEach(function (id, i) { bullet(g, id, i ? BOT_COL : ME_COL); });

      // STEP1・15
      g.label('制限時間 2分 ／ キル数が多いほうが勝ち', [0, 1.0, -6.9], { id: 'l1-goal', size: 0.5, color: C.gold, bg: '#000000aa' });
      g.label('あなたのスタート地点', [SPAWN_ME[0] + 0.4, 0.6, SPAWN_ME[2] + 1.0], { id: 'l1-spme', size: 0.3, color: ME_COL, bg: '#000000aa' });
      g.label('ボットのスタート地点', [SPAWN_BOT[0] - 0.4, 0.6, SPAWN_BOT[2] - 1.0], { id: 'l1-spbot', size: 0.3, color: '#ff8888', bg: '#000000aa' });
      g.label('壁', P(640, 384, 0.6), { id: 'l1-wall', size: 0.3, bg: '#000000aa' });
      g.label('茂み', P(190, 190, 0.6), { id: 'l1-bush', size: 0.3, color: '#9be59b', bg: '#000000aa' });

      // STEP4：画面の見方（ゲーム画面の左上と上の文字）
      g.label('キャラ名  HP: 3400/3400\n弾: 2/3\n必殺技「技名」: 42%\nキル: あなた 1 - ボット(キャラ名) 0', P(250, 82, 0.3), { id: 'hud-tl', size: 0.36, bg: '#000000cc' });
      g.label('残り 1:42', P(640, 40, 0.3), { id: 'hud-tm', size: 0.4, bg: '#000000cc' });
      g.label('頭の上のバー＝HP\n緑 → 黄 → 赤', [S1_BOT[0] + 1.0, 0.6, S1_BOT[2] + 2.8], { id: 'hud-bar', size: 0.3, color: C.gold, bg: '#000000aa' });

      // STEP6：遠距離
      for (var i = 0; i < 6; i++) bullet(g, 'b6-' + i, ME_COL);
      for (i = 0; i < 3; i++) g.box({ id: 'pip' + i, parent: 'me', size: [0.24, 0.1, 0.12], pos: [-0.3 + i * 0.3, 0.77, -R_ASSAULT - 0.5], color: '#ffdd44', edges: false });
      g.label('弾: 3/3', [0, 1.6, -0.5], { id: 'l6-ammo', parent: 'me', size: 0.3, bg: '#000000aa' });
      g.line([P(230, 384, 0.12), P(700, 384, 0.12)], { id: 'l6-line', color: '#ffffff', dashed: true, opacity: 0.8 });
      g.box({ id: 'l6-end', size: [0.06, 0.4, 0.5], pos: P(700, 384, 0.2), color: '#ffffff', edges: false });
      g.label('射程 500（ここで弾が消える）', P(700, 384, 0.5).map(function (v, k) { return k === 2 ? v + 1.5 : v; }), { id: 'l6-range', size: 0.28, bg: '#000000aa' });

      // STEP7：近接（タンク型＝オレンジ）
      fighter(g, 'tank', '#ff6633', R_TANK, P(330, 384), { label: 'あなた（近接タイプ）', labelSize: 0.28 });
      sector(g, 'sec7', U(140), 100, '#ffd166', { parent: 'tank', opacity: 0.3, y: 0.09 });
      sector(g, 'sec7f', U(140), 100, '#ffd166', { parent: 'tank', opacity: 0.7, y: 0.1 });
      fighter(g, 'ghost7', '#aa6666', R_ASSAULT, P(560, 384), { label: '届かない', labelSize: 0.28 });
      g.label('扇形 100°・距離 140まで', P(330, 384, 0.4).map(function (v, k) { return k === 2 ? v + 2.2 : v; }), { id: 'l7-a', size: 0.3, color: C.gold, bg: '#000000aa' });

      // STEP8：壁
      for (i = 0; i < 3; i++) bullet(g, 'b8-' + i, BOT_COL);
      g.label('弾は壁に当たると消える', P(820, 484, 1.4), { id: 'l8-wall', size: 0.3, color: C.gold, bg: '#000000aa' });
      g.label('ボット：壁があっても\nかまわず撃ってくる', [0.3, 0.9, 1.6], { id: 'l8-bot', parent: 'bot', size: 0.28, bg: '#000000aa' });
      g.label('あなた：壁のかげで安全', [0, 0.9, 1.2], { id: 'l8-me', parent: 'me', size: 0.28, color: ME_COL, bg: '#000000aa' });

      // STEP9：茂み
      ring(g, 'ring9', U(110), '#ffd166', { parent: 'me', pos: [0, 0.4, 0], w: 0.05 });
      g.label('この輪（110）の中まで\n近づかれると見つかる', [0, 0.5, -2.5], { id: 'l9-ring', parent: 'me', size: 0.26, color: C.gold, bg: '#000000aa' });

      // STEP12：やられたら
      for (i = 0; i < 3; i++) bullet(g, 'b12-' + i, ME_COL);
      g.label('撃破！ キル +1', P(800, 384, 1.4), { id: 'l12-ko', size: 0.5, color: C.good, bg: '#000000aa' });
      g.label('復活まで 3', [SPAWN_BOT[0] - 0.6, 1.0, SPAWN_BOT[2] + 2.4], { id: 'l12-cd', size: 0.44, bg: '#000000aa' });
      g.label('1.5秒間 無敵（点滅）', [SPAWN_BOT[0] - 0.8, 1.0, SPAWN_BOT[2] + 2.4], { id: 'l12-inv', size: 0.42, color: C.gold, bg: '#000000aa' });
      g.label('キル: あなた 0 - ボット 0', P(240, 50, 0.3), { id: 'l12-score', size: 0.42, bg: '#000000cc' });

      // ======================= 始め方 =======================
      g.plate({ id: 'la-floor', size: [15, 9], pos: [LX, 0.02, LZ], color: '#231f33', opacity: 0.95 });
      g.plate({ id: 'la-folder', size: [3.6, 3.6], pos: [LX - 3.8, 0.05, LZ + 0.6], color: '#c9a227', opacity: 0.9, label: 'BrawlArena フォルダ', labelSize: 0.32, labelColor: '#ffe9a8', labelBg: '#000000aa', labelOffset: [0, 0.4, 2.2] });
      g.card({ id: 'la-card', pos: [LX - 3.8, 1.3, LZ + 0.6], lying: false, text: '📄', sub: 'ダブル\nクリック', color: '#2e7d32', w: 1.3 });
      g.label('play.html', [LX - 3.8, 2.75, LZ + 0.6], { id: 'la-name', size: 0.38, bg: '#000000cc' });
      g.arrow([LX - 2.8, 1.3, LZ + 0.6], [LX + 0.2, 1.3, LZ + 0.6], { id: 'la-arrow', color: C.gold, lift: 0.8, radius: 0.07 });
      g.box({ id: 'la-mon', size: [5, 3.2, 0.25], pos: [LX + 3.4, 1.9, LZ + 0.2], color: '#333344' });
      g.box({ id: 'la-scr', size: [4.5, 2.7, 0.05], pos: [LX + 3.4, 1.95, LZ + 0.36], color: '#1e3a1e', emissive: '#1e3a1e', emissiveIntensity: 0.6, edges: false });
      g.sphere({ id: 'la-p1', radius: 0.17, pos: [LX + 2.0, 1.4, LZ + 0.45], color: ME_COL, emissive: ME_COL, emissiveIntensity: 0.5 });
      g.sphere({ id: 'la-p2', radius: 0.17, pos: [LX + 4.8, 2.5, LZ + 0.45], color: BOT_COL, emissive: BOT_COL, emissiveIntensity: 0.5 });
      g.box({ id: 'la-stand', size: [0.4, 0.4, 0.4], pos: [LX + 3.4, 0.2, LZ + 0.2], color: '#333344' });
      g.label('ブラウザでゲームが始まる', [LX + 3.4, 4.0, LZ + 0.2], { id: 'la-mlbl', size: 0.34, bg: '#000000aa' });
      g.sphere({ id: 'la-net', radius: 0.8, pos: [LX - 0.6, 4.6, LZ - 3.2], color: '#7ea8ff', emissive: '#7ea8ff', emissiveIntensity: 0.25, label: 'インターネット', labelSize: 0.3, labelBg: '#000000aa' });
      g.flow([LX - 0.2, 4.2, LZ - 2.8], [LX + 2.4, 3.3, LZ + 0.1], { id: 'la-flow', color: C.data, lift: 0.4, count: 5 });
      g.label('ゲームの部品（Phaser）を\nネットから読みこむ', [LX - 3.4, 3.9, LZ - 2.6], { id: 'la-nlbl', size: 0.28, color: C.data, bg: '#000000aa' });
      g.label('LAN対戦・2人対戦はまだ無いよ（あなた1人 vs ボット）', [LX, 0.3, LZ + 4.0], { id: 'la-solo', size: 0.32, color: '#ffcf80', bg: '#000000aa' });

      // ======================= キャラ選択画面の模型 =======================
      g.plate({ id: 'se-scr', size: [12.8, 7.68], pos: [SX, 0.02, SZ], color: '#12241a', opacity: 1, radius: 0.08 });
      g.label('💎 魔素: 0', HPm(110, 26, 0.3), { id: 'se-stone', size: 0.3, color: '#ffdd44' });
      g.label('プレイヤーLv1（XP 0/100）', HPm(1100, 26, 0.3), { id: 'se-plv', size: 0.3, color: '#99ccff' });
      g.label('キャラを選択（クリック）', HPm(640, 72, 0.3), { id: 'se-title', size: 0.34 });
      g.group('se-cells', {});
      ROSTER.forEach(function (r, i) {
        var x = 200 + (i % 4) * 280, y = 140 + Math.floor(i / 4) * 155;
        var open = r[6] === '最初から';
        g.cylinder({ id: 'se-c' + i, parent: 'se-cells', radius: 0.3, height: 0.12, pos: HPm(x, y, 0.1), color: open ? r[0] : '#333333', emissive: open ? r[0] : '#000000', emissiveIntensity: 0.2 });
        if (open) {
          g.label('Lv1', HPm(x, y - 46, 0.3), { id: 'se-lv' + i, parent: 'se-cells', size: 0.2, color: '#cccccc' });
          g.label(r[2] + ' / HP' + r[3], HPm(x, y + 52, 0.12), { id: 'se-st' + i, parent: 'se-cells', size: 0.2, color: '#99cc99' });
          g.box({ id: 'se-up' + i, parent: 'se-cells', size: [1.2, 0.06, 0.24], pos: HPm(x, y + 92, 0.08), color: '#1a1a1a', edges: false, label: '▲ Lvアップ (50)', labelSize: 0.19, labelColor: '#ffdd44', labelBg: '#000000aa', labelOffset: [0, 0.18, 0] });
        } else {
          g.label('🔒', HPm(x, y, 0.35), { id: 'se-lk' + i, parent: 'se-cells', size: 0.24, bg: null });
          var lv = r[6].split('・');
          g.label('プレイヤー' + lv[0] + '\n魔素' + lv[1], HPm(x, y + 60, 0.12), { id: 'se-rq' + i, parent: 'se-cells', size: 0.19, color: '#cc88cc' });
        }
      });
