<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrawlArena | 仕組み図解</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var T = THREE;
  // ゲーム内の座標（1280×768 px）→ 3D（1タイル64px = 1マス、中央が原点）
  function P(px, py, y) { return [px / 64 - 10, y || 0, py / 64 - 6]; }
  function U(px) { return px / 64; }          // 距離（px）→ 3D の長さ
  // キャラの見た目の半径は「コードの半径 × 1.6」（小さすぎて見えないので。比率はコードどおり）
  var R_ASSAULT = 20 * 1.6 / 64, R_TANK = 26 * 1.6 / 64, R_SNIPER = 16 * 1.6 / 64;

  var PLAYER_SPAWN = P(160, 768 - 150), ENEMY_SPAWN = P(1280 - 160, 150);
  var OBSTACLES = [[460, 284, 100, 60], [820, 484, 100, 60], [460, 484, 60, 100], [820, 284, 60, 100]];
  var BUSHES = [[190, 190, 220, 200], [1090, 190, 220, 200], [190, 578, 220, 200], [1090, 578, 220, 200]];
  var ARCH = 30; // アーキテクチャ図は x=30 付近

  // 13体（characters.json の並び順）。名前は載せず、性能だけ
  var ROSTER = [
    ['assault', 'ranged', 3400, '#66ccff', 'pull'], ['tank', 'melee', 5200, '#ff6633', 'burst'], ['sniper', 'ranged', 2800, '#ffdd44', 'crit'],
    ['assault', 'ranged', 3000, '#4a4a66', 'crit'], ['tank', 'melee', 5600, '#9933cc', 'burst'], ['assault', 'melee', 3600, '#dddddd', 'crit'],
    ['tank', 'ranged', 6000, '#ff3399', 'burst'], ['sniper', 'ranged', 3100, '#660022', 'crit'], ['sniper', 'ranged', 2400, '#ff99cc', 'pull'],
    ['tank', 'ranged', 5800, '#33cc99', 'burst'], ['assault', 'melee', 3300, '#333333', 'crit'], ['sniper', 'ranged', 2600, '#ff8899', 'pull'],
    ['assault', 'melee', 2900, '#88aa33', 'burst'],
  ];
  var MULT = [1.0, 1.03, 1.06, 1.09, 1.12, 1.16, 1.20, 1.24, 1.28, 1.33];
  var COST = [50, 80, 120, 170, 230, 300, 380, 470, 570];

  var shown = {};
  function setL(g, id, text, o) {
    if (shown[id] === text) return;
    shown[id] = text;
    g.setLabel(id, text, o);
  }

  function fighter(g, id, color, r, pos, label) {
    g.group(id, { pos: pos });
    g.cylinder({ id: id + '-body', parent: id, radius: r, height: 0.42, pos: [0, 0.22, 0], color: color, emissive: color, emissiveIntensity: 0.15 });
    g.group(id + '-aim', { parent: id });
    g.box({ parent: id + '-aim', size: [0.42, 0.08, 0.12], pos: [r + 0.3, 0.3, 0], color: '#ffffff', edges: false });
    if (label) g.label(label, [0, 1.15, 0], { id: id + '-lbl', parent: id, size: 0.26, bg: '#000000aa' });
  }
  // a = 3D の xz 平面での角度（+x が 0、+z 向きが正）
  function aimAt(g, id, a) { g.get(id + '-aim').rotation.y = -a; }
  function ring(g, id, r, color, o) {
    o = o || {};
    var m = new T.Mesh(new T.RingGeometry(r - (o.w || 0.04), r + (o.w || 0.04), 96),
      new T.MeshBasicMaterial({ color: color, transparent: true, opacity: o.opacity || 0.9, side: T.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    var p = o.pos || [0, 0.06, 0];
    m.position.set(p[0], p[1], p[2]);
    return g.add(id, m, o.parent);
  }
  // 扇形（+x 方向を中心に、全角 deg 度）。親グループの rotation.y で向きを変える
  function sector(g, id, r, deg, color, o) {
    o = o || {};
    var h = deg * Math.PI / 360;
    var m = new T.Mesh(new T.CircleGeometry(r, 48, -h, 2 * h),
      new T.MeshBasicMaterial({ color: color, transparent: true, opacity: o.opacity || 0.35, side: T.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.y = 0.05;
    return g.add(id, m, o.parent);
  }
  function dist2(a, b) { return Math.hypot(a[0] - b[0], a[2] - b[2]); }
  function lerp3(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k]; }

  // 遠距離攻撃：撃ちっぱなしのときの発射時刻（0.5秒間隔×3発 → 以後は1.5秒ごとのチャージ待ち）
  var SHOTS = [0, 0.5, 1.0, 1.5, 3.0, 4.5];
  function ammoAt(t) {
    // 発射で -1、1.5秒ごとのチャージで +1（チャージの瞬間に即発射されるので表示上は 0 に戻る）
    if (t < 0.5) return 2; if (t < 1.0) return 1; return 0;
  }

  GameGuide.start({
    title: 'BrawlArena',
    back: '../index.html',
    subtitle: '見下ろし視点で撃ち合う1対1のアリーナバトル（TypeScript＋Phaser 3＋Vite）',
    camera: { pos: [0, 15, 12], target: [0, 0, 0] },

    build: function (g) {
      // ---------- アリーナ（1280×768px → 20×12マス） ----------
      g.plate({ id: 'arena', size: [20, 12], pos: [0, 0.01, 0], color: '#1e3a1e', opacity: 0.95, radius: 0.05 });
      g.line([[-10, 0.08, -6], [10, 0.08, -6], [10, 0.08, 6], [-10, 0.08, 6], [-10, 0.08, -6]], { id: 'arena-edge', color: '#ffffff', opacity: 0.6 });
      g.label('アリーナ 1280×768px（20×12マス）', [0, 0.3, -6.7], { id: 'lbl-arena', size: 0.32, color: '#cfe8cf' });

      g.group('bushes', {});
      BUSHES.forEach(function (b, i) {
        g.plate({ id: 'bush' + i, parent: 'bushes', size: [U(b[2]), U(b[3])], pos: P(b[0], b[1], 0.05), color: '#2f8f45', opacity: 0.55, radius: 0.3 });
        for (var k = 0; k < 6; k++) {
          var c = P(b[0], b[1]);
          g.sphere({ parent: 'bushes', radius: 0.32, pos: [c[0] + ((k % 3) - 1) * 1.0, 0.22, c[2] + (k < 3 ? -0.6 : 0.6)], color: '#3aa055', opacity: 0.55 });
        }
      });
      g.label('茂み', P(190, 190, 1.0), { id: 'lbl-bush', size: 0.3, color: '#bff5c8' });
      g.group('obstacles', {});
      OBSTACLES.forEach(function (o, i) {
        g.box({ id: 'obs' + i, parent: 'obstacles', size: [U(o[2]), 0.8, U(o[3])], pos: P(o[0], o[1], 0.4), color: '#6b6b55' });
      });
      g.label('障害物（弾も止まる）', P(640, 384, 1.4), { id: 'lbl-obs', size: 0.3, color: '#e8e2c0' });
      g.cylinder({ id: 'sp-me', radius: 0.7, height: 0.04, pos: [PLAYER_SPAWN[0], 0.05, PLAYER_SPAWN[2]], color: C.me, opacity: 0.45 });
      g.cylinder({ id: 'sp-op', radius: 0.7, height: 0.04, pos: [ENEMY_SPAWN[0], 0.05, ENEMY_SPAWN[2]], color: C.enemy, opacity: 0.45 });
      g.label('あなたの出現地点', [PLAYER_SPAWN[0] + 0.3, 0.3, PLAYER_SPAWN[2] + 1.3], { id: 'lbl-sp-me', size: 0.26, color: '#cfe1ff' });
      g.label('ボットの出現地点', [ENEMY_SPAWN[0] - 0.3, 0.3, ENEMY_SPAWN[2] - 1.3], { id: 'lbl-sp-op', size: 0.26, color: '#ffd0d4' });

      // ---------- 戦うキャラ ----------
      fighter(g, 'me', '#66ccff', R_ASSAULT, PLAYER_SPAWN, 'あなた');
      fighter(g, 'bot', '#ff4444', R_TANK, ENEMY_SPAWN, 'ボット');
      aimAt(g, 'me', -0.6); aimAt(g, 'bot', Math.PI - 0.6);

      // 3. 移動と照準
      g.group('cursor', { pos: [0, 0, 0] });
      ring(g, 'cursor-ring', 0.3, '#ffffff', { parent: 'cursor', w: 0.05 });
      g.label('マウス', [0, 0.6, 0], { parent: 'cursor', size: 0.24, color: '#ffffff' });
      g.label('', [0, 0, 0], { id: 'move-lbl', size: 0.28, bg: '#000000aa', color: C.gold });

      // 4. 遠距離攻撃
      for (var i = 0; i < 4; i++) g.sphere({ id: 'pj' + i, radius: 0.16, pos: [0, -5, 0], color: '#66ccff', emissive: '#66ccff', emissiveIntensity: 0.6 });
      ring(g, 'range-assault', U(500), '#66ccff', { pos: [-6, 0.06, 0], opacity: 0.6 });
      g.label('射程 500px', [-6 + U(500) - 0.2, 0.4, -0.6], { id: 'lbl-range', size: 0.28, color: '#9fdcff' });
      g.label('弾 3/3', [-6, 1.9, 0], { id: 'ammo-lbl', size: 0.34, bg: '#000000aa', color: '#ffffff' });

      // 5. 近接攻撃
      g.group('cone', { pos: [0, 0, 0] });
      sector(g, 'cone-fan', U(140), 100, C.server, { parent: 'cone', opacity: 0.4 });
      ring(g, 'melee-range', U(140), C.server, { pos: [0, 0.06, 0], opacity: 0.5 });
      g.sphere({ id: 'dummy0', radius: 0.32, pos: [1.6, 0.32, 0.5], color: '#888899' });
      g.sphere({ id: 'dummy1', radius: 0.32, pos: [0.4, 0.32, -1.7], color: '#888899' });
      g.sphere({ id: 'dummy2', radius: 0.32, pos: [3.0, 0.32, -0.3], color: '#888899' });
      g.label('射程 140px・扇 100°', [0, 0.3, 2.7], { id: 'lbl-cone', size: 0.28, color: '#ffd0a0' });
      g.label('射程の外', [3.0, 1.0, -0.3], { id: 'lbl-far', size: 0.24, color: '#cccccc' });

      // 6. 13体の一覧
      g.group('roster', { pos: [0, 0, 9.2] });
      ROSTER.forEach(function (c, i) {
        var r = (c[0] === 'tank' ? 26 : c[0] === 'sniper' ? 16 : 20) / 40;
        var h = c[2] / 2000;
        var x = (i - 6) * 1.45;
        g.cylinder({ parent: 'roster', radius: r, height: h, pos: [x, h / 2, 0], color: c[3], emissive: c[3], emissiveIntensity: 0.12 });
        g.label((c[1] === 'melee' ? '近' : '遠') + '\n' + c[2], [x, h + 0.75, 0], { parent: 'roster', size: 0.3, color: '#ffffff' });
        if (i < 3) g.label('最初から', [x, 0.25, 0.95], { parent: 'roster', size: 0.26, color: C.gold });
      });
      g.label('太さ＝アーキタイプ（タンク＞アサルト＞スナイパー）　高さ＝HP　近/遠＝通常攻撃の種類', [0, 0.25, 2.2], { parent: 'roster', size: 0.36, color: '#cfd8ff' });

      // 7. ゲージ
      g.group('gauge', { pos: [-2, 0, -2.3] });
      g.box({ parent: 'gauge', size: [3.2, 0.25, 0.4], pos: [0, 0.13, 0], color: '#2a2638' });
      g.box({ id: 'gauge-fill', parent: 'gauge', size: [3.2, 0.3, 0.42], pos: [0, 0.15, 0], color: C.gold, emissive: C.gold, emissiveIntensity: 0.3, edges: false });
      g.label('ゲージ 0 / 1000', [0, 0.9, 0], { id: 'gauge-lbl', parent: 'gauge', size: 0.3, bg: '#000000aa', color: C.gold });
      g.label('', [0, 0, 0], { id: 'hit-lbl', size: 0.34, bg: '#000000aa', color: '#ff6b6b' });

      // 8. 必殺技
      ring(g, 'ult-pull', U(150), '#66ccff', { pos: [0, 0.07, 0] });
      sector(g, 'ult-burst-fill', U(220), 360, C.server, { opacity: 0.25 });
      ring(g, 'ult-burst', U(220), C.server, { pos: [0, 0.07, 0] });
      g.line([[-6, 0.4, 0], [4, 0.4, 0]], { id: 'ult-crit', color: '#ffdd44', opacity: 1 });
      g.label('', [0, 0, 0], { id: 'ult-lbl', size: 0.3, bg: '#000000aa', color: '#ffffff' });
      g.label('', [0, 0, 0], { id: 'ult-dmg', size: 0.36, bg: '#000000aa', color: '#ff6b6b' });
      g.label('', [0, 0, 0], { id: 'ult-dmg2', size: 0.36, bg: '#000000aa', color: '#ff6b6b' });
      g.sphere({ id: 'foe2', radius: 0.32, pos: [-1.8, 0.32, 1.4], color: '#ff4444' });

      // 9. 撃破とリスポーン
      g.label('', [0, 0, 0], { id: 'resp-lbl', size: 0.32, bg: '#000000aa', color: '#ffffff' });
      g.label('キル  あなた 1 − 0 ボット', [0, 3.2, -6.4], { id: 'score-lbl', size: 0.4, bg: '#000000aa', color: '#ffffff' });

      // 10. ステルスとAI
      ring(g, 'reveal', U(110), '#bff5c8', { pos: [0, 0.07, 0], w: 0.05 });
      ring(g, 'pref', U(350), C.enemy, { pos: [0, 0.07, 0], opacity: 0.5 });
      g.label('', [0, 0, 0], { id: 'ai-lbl', size: 0.28, bg: '#000000aa', color: '#ffd0d4' });
      g.sphere({ id: 'botshot', radius: 0.14, pos: [0, -5, 0], color: '#ff4444', emissive: '#ff4444', emissiveIntensity: 0.6 });

      // 12. 成長（キャラLvごとの倍率）
      g.group('prog', { pos: [0, 0, -11] });
      MULT.forEach(function (m, i) {
        var h = (m - 0.9) * 7;
        var x = (i - 4.5) * 1.5;
        var evo = i === 4 || i === 9;
        g.box({ parent: 'prog', size: [0.9, h, 0.9], pos: [x, h / 2, 0], color: evo ? '#ffd700' : '#5ee6a8', emissive: evo ? '#ffd700' : '#000000', emissiveIntensity: 0.25 });
        g.label('Lv' + (i + 1) + (evo ? '★' : '') + '\n×' + m.toFixed(2), [x, h + 0.65, 0], { parent: 'prog', size: 0.22, color: evo ? '#ffd700' : '#ffffff' });
        if (i < 9) g.label('魔素' + COST[i], [x + 0.75, 0.25, 0.9], { parent: 'prog', size: 0.18, color: '#cfd8ff' });
      });
      g.label('キャラLvごとのステータス倍率（HP・通常攻撃・必殺技）　★＝進化', [0, 0.3, 1.9], { parent: 'prog', size: 0.26, color: '#cfd8ff' });

      // ---------- アーキテクチャ図（x=30 付近） ----------
      var A = ARCH;
      function ab(id, size, pos, color, label) { g.box({ id: id, size: size, pos: pos, color: color, label: label, labelSize: 0.34 }); }
      ab('arch-main', [3.6, 0.8, 1.4], [A, 0.4, -6.2], '#4a4466', 'main.ts\nPhaser.Game（1280×768・Arcade物理）');
      ab('arch-boot', [2.8, 0.8, 1.4], [A - 6.5, 0.4, -3], '#4a4466', 'BootScene\n素通り');
      ab('arch-select', [3.2, 0.8, 1.4], [A, 0.4, -3], C.third, 'SelectScene\nキャラ選択・Lvアップ・解放');
      ab('arch-game', [3.2, 0.8, 1.4], [A + 6.5, 0.4, -3], C.server, 'GameScene\n試合・当たり判定・勝敗');
      ab('arch-input', [3.0, 0.7, 1.2], [A - 8, 0.35, 1.0], C.me, 'InputController\nWASD・マウス・Shift');
      ab('arch-ai', [3.0, 0.7, 1.2], [A - 8, 0.35, 3.8], C.enemy, 'AIController\n近づく・撃つ');
      ab('arch-ictrl', [2.8, 0.7, 1.2], [A - 3, 0.35, 2.4], '#7b5cff', 'IController\n（操作の窓口）');
      ab('arch-player', [3.2, 0.9, 1.4], [A + 2.6, 0.45, 2.4], '#2f6fbf', 'Player.ts\nキャラ本体（人もボットも）');
      ab('arch-proj', [2.6, 0.7, 1.2], [A + 7.6, 0.35, 2.4], '#2f6fbf', 'Projectile.ts\n直進する弾');
      ab('arch-chars', [3.0, 0.6, 1.2], [A - 6, 0.3, 6.8], '#2b9a6b', 'characters.json\n13体の性能');
      ab('arch-progj', [3.0, 0.6, 1.2], [A - 1.5, 0.3, 6.8], '#2b9a6b', 'progression.json\n成長の数値');
      ab('arch-store', [3.2, 0.7, 1.2], [A + 3.2, 0.35, 6.8], '#c77dff', 'ProgressionStore.ts\nセーブの読み書き');
      g.cylinder({ id: 'arch-ls', radius: 0.8, height: 0.9, pos: [A + 8, 0.45, 6.8], color: '#8a6d3b', label: 'localStorage\nbrawlarena_save_v1', labelSize: 0.24 });
      g.flow([A, 0.9, -5.5], [A - 6.5, 0.9, -3.7], { id: 'f-main', color: '#b8b2d6', lift: 0.6, count: 4 });
      g.flow([A - 5.1, 0.9, -3], [A - 1.6, 0.9, -3], { id: 'f-boot', color: C.data, lift: 0.6, count: 4 });
      g.flow([A + 1.6, 0.9, -3.2], [A + 4.9, 0.9, -3.2], { id: 'f-sel', color: C.data, lift: 0.8, count: 5 });
      g.flow([A + 4.9, 0.9, -2.6], [A + 1.6, 0.9, -2.6], { id: 'f-back', color: '#b8b2d6', lift: -0.1, count: 3 });
      g.label('characterId', [A + 3.25, 2.0, -3.4], { id: 'lbl-cid', size: 0.24, color: C.data });
      g.flow([A - 6.5, 0.8, 1.0], [A - 4.4, 0.8, 2.2], { id: 'f-in', color: C.me, lift: 0.4, count: 3 });
      g.flow([A - 6.5, 0.8, 3.8], [A - 4.4, 0.8, 2.6], { id: 'f-ai', color: C.enemy, lift: 0.4, count: 3 });
      g.flow([A - 1.6, 0.8, 2.4], [A + 1.0, 0.8, 2.4], { id: 'f-ctrl', color: '#c9b8ff', lift: 0.4, count: 4 });
      g.flow([A + 4.2, 0.8, 2.4], [A + 6.3, 0.8, 2.4], { id: 'f-fire', color: '#66ccff', lift: 0.4, count: 3 });
      g.flow([A + 6.5, 0.9, -2.3], [A + 3.2, 0.9, 1.7], { id: 'f-spawn', color: C.server, lift: 0.8, count: 4 });
      g.flow([A - 6, 0.7, 6.2], [A + 5.6, 0.9, -2.3], { id: 'f-chars', color: '#2b9a6b', lift: 2.6, count: 6 });
      g.flow([A - 0.1, 0.7, 6.8], [A + 1.6, 0.7, 6.8], { id: 'f-progj', color: '#2b9a6b', lift: 0.4, count: 3 });
      g.flow([A + 4.8, 0.7, 6.8], [A + 7.2, 0.7, 6.8], { id: 'f-ls', color: '#c77dff', lift: 0.4, count: 3 });
      g.flow([A + 3.2, 0.8, 6.2], [A + 0.4, 0.9, -2.3], { id: 'f-store-sel', color: '#c77dff', lift: 2.0, count: 5 });
      g.flow([A + 3.6, 0.8, 6.2], [A + 7.2, 0.9, -2.3], { id: 'f-store-game', color: '#c77dff', lift: 2.4, count: 5 });
      g.label('同じ IController として見える', [A - 3, 1.5, 3.9], { id: 'lbl-same', size: 0.24, color: '#c9b8ff', bg: '#00000088' });
    },

    steps: [
      {
        title: 'どんなゲーム？',
        html:
          '<p>上から見下ろしたアリーナで、キャラを動かして <b>弾を撃ち合う</b> 対戦アクション。</p>' +
          '<ul><li>青い丸が <b>あなた</b>、赤い丸が <b>ボット（コンピューター）</b></li>' +
          '<li>試合は <b>2分間</b>。時間切れのときに <b>キル数が多いほうの勝ち</b></li>' +
          '<li>倒されても3秒後に復活するので、何度でも戦える</li>' +
          '<li>勝っても負けても通貨（魔素）がもらえて、キャラを育てられる</li></ul>' +
          '<div class="gg-note">設計書（<code>docs/DESIGN.md</code>）は「3対3のチーム戦」を目標にしているけど、今のコードは <b>あなた1人 対 ボット1体</b>。</div>',
        camera: { pos: [0, 15, 12], target: [0, 0, 0] },
        show: ['lbl-obs'],
        update: function (g, t) {
          aimAt(g, 'me', -0.45 + Math.sin(t) * 0.25);
          aimAt(g, 'bot', Math.PI - 0.45 + Math.sin(t * 1.3) * 0.25);
        },
      },
      {
        title: 'アリーナ：1280×768の草原',
        html:
          '<p>マップは <b>1280×768 ピクセル</b>。64pxを1マスとすると 20×12マスになる。</p>' +
          '<ul><li><b>出現地点</b>：あなたは左下、ボットは右上（点対称）</li>' +
          '<li><b>障害物</b>：中央に4つ。キャラも弾も通れない</li>' +
          '<li><b>茂み</b>：四隅に4つ。通り抜けられて、中に入ると相手から見えにくくなる</li></ul>' +
          '<p>配置は <code>GameScene.ts</code> の先頭にある <code>OBSTACLES</code> と <code>BUSHES</code> という配列に、中心座標と幅・高さで書いてある。</p>' +

          else if (k < 3.6) { bot.visible = false; lbl = '撃破！ 復活まで ' + Math.ceil(3.6 - k) + ' 秒'; g.setPos('resp-lbl', [at[0], 1.2, at[2]]); }
          else if (k < 5.1) { bot.visible = Math.floor(k * 10) % 2 === 0; g.setPos('bot', ENEMY_SPAWN); lbl = '復活！ 1.5秒間 無敵'; g.setPos('resp-lbl', [ENEMY_SPAWN[0], 1.7, ENEMY_SPAWN[2]]); }
          else { bot.visible = true; g.setPos('bot', ENEMY_SPAWN); lbl = 'HP・弾・ゲージ 満タンで再開'; g.setPos('resp-lbl', [ENEMY_SPAWN[0], 1.7, ENEMY_SPAWN[2]]); }
          aimAt(g, 'bot', Math.PI - 0.6);
          setL(g, 'resp-lbl', lbl, { size: 0.32, bg: '#000000aa', color: '#ffffff' });
          setL(g, 'score-lbl', 'キル  あなた ' + (k < 0.6 ? 0 : 1) + ' − 0 ボット　（残り 1:4' + (k < 0.6 ? '2' : '1') + '）', { size: 0.4, bg: '#000000aa', color: '#ffffff' });
        },
      },
      {
        title: '茂みのステルスとボットAI',
        html:
          '<p><b>ボットAI</b>（<code>AIController</code>）はとてもシンプル。</p>' +
          '<ol><li>あなたが見えていなければ、止まって何もしない</li><li>距離が <b>350px</b> より遠ければ近づく（赤い輪）</li>' +
          '<li>距離が自分の射程以内なら撃つ</li><li>ゲージが満タンになったら、見えている限りすぐ必殺技</li></ol>' +
          '<p><b>茂み</b>の中にいて、相手との距離が <b>110px より遠い</b> と「隠れている」扱い（緑の輪の外からは見えない）。</p>' +
          '<ul><li>あなたが茂みに隠れる → ボットはあなたを見失って止まる</li><li>ボットが茂みに隠れる → 画面のボットが薄く（透明度0.2）なる</li></ul>' +
          '<div class="gg-note">ボットが近づくのをやめる距離は350px固定。近接キャラの射程は130〜160pxなので、<b>近接キャラのボットは、あなたが自分から近づかない限り攻撃してこない</b>（コード中にも「射程はAIに渡ってこないので固定値で妥協」とコメントあり）。障害物をよける処理もまだない。</div>' +
          '<p class="gg-files">📄 <code>src/systems/AIController.ts</code>、<code>GameScene.ts</code> の <code>isHiddenFromOpponent()</code></p>',
        camera: { pos: [-1, 13, 11], target: [-1.5, 0, 0.6] },
        focus: ['me', 'bot', 'bushes', 'reveal', 'pref', 'ai-lbl', 'botshot', 'obstacles'],
        show: ['reveal', 'pref', 'ai-lbl', 'botshot'],
        enter: function () { shown['ai-lbl'] = null; },
        update: function (g, t) {
          var k = t % 12;
          var A = [-3.5, 0, 2.6], BUSH = [-7.0, 0, 3.1], B0 = [5.5, 0, -2.5], STOP = U(350);
          var dir = [A[0] - B0[0], 0, A[2] - B0[2]], dl = Math.hypot(dir[0], dir[2]);
          var botStop = [A[0] - dir[0] / dl * STOP, 0, A[2] - dir[2] / dl * STOP];
          var me, bot, lbl, inBush = false;
          if (k < 5.5) {
            me = A;
            var mv = Math.min(k * U(200), dl - STOP) / dl;
            bot = [B0[0] + dir[0] * mv, 0, B0[2] + dir[2] * mv];
            lbl = dist2(bot, A) > STOP + 0.01 ? '遠い → 近づく' : '350pxで止まって撃つ';
          } else {
            var f = g.linear(k, 5.5, 1.6);
            me = lerp3(A, BUSH, f);
            inBush = me[0] < -5.3;
            bot = botStop;
            lbl = inBush ? '見えない… 止まる' : '追いかける';
            if (!inBush) {
              var u = [botStop[0] - me[0], botStop[2] - me[2]], ul = Math.hypot(u[0], u[1]);
              if (ul > STOP) bot = [me[0] + u[0] / ul * STOP, 0, me[2] + u[1] / ul * STOP];
            } else {
              var fe = (5.3 - 3.5) / (7.0 - 3.5); var me2 = lerp3(A, BUSH, fe);
              var u2 = [botStop[0] - me2[0], botStop[2] - me2[2]], ul2 = Math.hypot(u2[0], u2[1]);
              bot = [me2[0] + u2[0] / ul2 * STOP, 0, me2[2] + u2[1] / ul2 * STOP];
            }
          }
          g.setPos('me', me); g.setPos('bot', bot);
          aimAt(g, 'bot', Math.atan2(me[2] - bot[2], me[0] - bot[0]));
          aimAt(g, 'me', Math.atan2(bot[2] - me[2], bot[0] - me[0]));
          g.setPos('reveal', [me[0], 0.13, me[2]]);
          g.get('reveal').visible = k >= 5.5;
          g.setPos('pref', [me[0], 0.07, me[2]]);
          g.get('pref').visible = k < 5.5;
          // 射撃（止まってから）
          var shoot = k < 5.5 && dist2(bot, A) <= STOP + 0.01;
          var sp = g.get('botshot');
          var ph = (k * 1.4) % 1;
          sp.visible = shoot;
          if (shoot) sp.position.set(bot[0] + (me[0] - bot[0]) * ph, 0.3, bot[2] + (me[2] - bot[2]) * ph);
          setL(g, 'ai-lbl', lbl, { size: 0.28, bg: '#000000aa', color: '#ffd0d4' });
          g.setPos('ai-lbl', [bot[0], 2.0, bot[2]]);
        },
      },
      {
        title: 'プログラムの全体構成',
        html:
          '<p>ゲームエンジンは <b>Phaser 3</b>。画面は「シーン」という単位で切り替わる。</p>' +
          '<ul><li><code>main.ts</code>：1280×768の画面とArcade物理を用意して、3つのシーンを登録</li>' +
          '<li><code>BootScene</code> → <code>SelectScene</code>（キャラ選択）→ <code>GameScene</code>（試合）。選んだキャラは <code>characterId</code> として渡す</li>' +
          '<li><code>Player.ts</code>：HP・弾・ゲージ・必殺技など、キャラの中身全部</li>' +
          '<li><code>IController</code>：操作の窓口。人間用（<code>InputController</code>）とボット用（<code>AIController</code>）を差し替えるだけで、同じ <code>Player</code> が動く</li>' +
          '<li><code>data/*.json</code>：数字はここ。<code>ProgressionStore</code> がセーブの読み書きを担当</li></ul>' +
          '<div class="gg-note">ビルドは Vite（<code>npm run dev</code>）。それとは別に、ビルドなしでダブルクリックで遊べる単一ファイル版 <code>play.html</code> がある。ただし <code>src/</code> を直しても <code>play.html</code> には自動で反映されないので、手で移す必要がある。</div>',
        camera: { pos: [ARCH, 16, 17], target: [ARCH, 0, 1] },
        focus: ['arch-main', 'arch-boot', 'arch-select', 'arch-game', 'arch-input', 'arch-ai', 'arch-ictrl', 'arch-player', 'arch-proj',
          'arch-chars', 'arch-progj', 'arch-store', 'arch-ls', 'f-main', 'f-boot', 'f-sel', 'f-back', 'lbl-cid', 'f-in', 'f-ai', 'f-ctrl', 'f-fire',
          'f-spawn', 'f-chars', 'f-progj', 'f-ls', 'f-store-sel', 'f-store-game', 'lbl-same'],
      },
      {
        title: '成長システムとセーブデータ',
        html:
          '<p>試合を重ねると強くなる仕組み。全部 <code>progression.json</code> の数字で動いている。</p>' +
          '<pre><code>もらえる魔素 = (勝ち 80 / 負け 30) + キル数 × 8\nプレイヤーXP = 勝ち 40 / 負け 15</code></pre>' +
          '<ul><li><b>キャラLv</b>（最大10）：魔素を払って上げる。HP・通常攻撃・必殺技のダメージに上の倍率がかかる</li>' +
          '<li><b>進化</b>：Lv5とLv10で1段階ずつ。必殺技だけさらに <b>×(1 + 0.15×進化段階)</b>。見た目は白→金の縁取り</li>' +
          '<li><b>キャラ解放</b>：残り10体は「プレイヤーLv○以上 ＋ 魔素○」で解放（Lv1・150 〜 Lv8・1400）</li></ul>' +
          '<p>ボットは育成の影響を受けない素の強さのまま。育てすぎても難しくなりすぎない。</p>' +
          '<p>セーブはブラウザの <code>localStorage</code>（キー <code>brawlarena_save_v1</code>）。保存できない環境でも、初期状態でゲームは続けられるようにしてある。</p>' +
          '<div class="gg-note">TODO には「マップ開放」も完了と書かれているけど、コードにあるマップは1つだけで、マップ開放の処理は見当たらない。</div>' +
          '<p class="gg-files">📄 <code>src/systems/ProgressionStore.ts</code> の <code>applyLevelToCharacter()</code> / <code>applyMatchResult()</code></p>',
        camera: { pos: [0, 8, 5], target: [0, 1.2, -11] },
        focus: ['prog'],
        show: ['prog'],
      },
    ],
  });
