<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライム建国記 | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;

  // ---------- 世界地図（js/data.js の AXIAL・TERRITORY_DATA を写したもの） ----------
  // [名前, 持ち主, 勢力の強さ, 特産]
  var TERR = [
    ['始まりの森', 'player', 0, 'mana'],
    ['陽だまりの畑', null, 22, 'food'],
    ['鉄鎚の街道', 'iron', 42, 'wood'],
    ['銀霜の高地', null, 30, 'mana'],
    ['涸れ川の里', null, 25, 'food'],
    ['霧影の谷', null, 28, 'wood'],
    ['蒼月の丘', null, 24, 'mana'],
    ['黒曜の岩窟', 'obs', 50, 'mana'],
    ['風切の砦', 'iron', 38, 'wood'],
    ['沼渦の底', null, 33, 'food'],
    ['朽木の砦', null, 27, 'wood'],
    ['灰塵の廃墟', 'obs', 48, 'mana'],
    ['終焉の荒野', 'obs', 66, 'mana'],
  ];
  var AXIAL = [[0, 0], [1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1], [2, 0], [2, -1], [1, 1], [-1, 2], [-2, 1], [2, -2]];
  var OWN_COL = { player: '#4fbd8f', none: '#8f8b78', iron: '#d9b968', obs: '#c8643c' };
  function ownCol(o) { return OWN_COL[o || 'none']; }
  var RES = { mana: '魔素', food: '食料', wood: '木材' };

  // 六角形の位置と柱の高さ（ステップのカメラでも使うので、build より先に計算しておく）
  var HS = 1.2;
  var P = TERR.map(function (t, i) {
    var q = AXIAL[i][0], r = AXIAL[i][1];
    return { x: HS * Math.sqrt(3) * (q + r / 2) - 0.52, z: HS * 1.5 * r, h: 0.25 + t[2] / 55 };
  });
  function TOP(i, dy) { return [P[i].x, P[i].h + (dy == null ? 0.1 : dy), P[i].z]; }
  var ADJ0 = [1, 2, 3, 4, 5, 6];     // 始まりの森のとなり（最初にねらえる6マス）
  var FAR0 = [7, 8, 9, 10, 11, 12];

  // ---------- 舞台の置き場所 ----------
  var SX = -30, SZ = 0;    // 画面の見方
  var LX = -30, LZ = 24;   // 始め方とセーブ
  var FX = 30, FZ = 0;     // 1日の流れ
  var RX = 30, RZ = 22;    // 資源
  var PX = 30, PZ = -22;   // 成功率のしくみ
  var BX = -30, BZ = -22;  // 施設と仲間
  var EX = 0, EZ = -24;    // 進化
  var DX = 0, DZ = 26;     // 外交
  var VX = 60, VZ = 0;      // イベント

  var K = 0.15;           // 成功率のしくみ：力1あたりの柱の高さ
  var MAP_STEPS_CAM = { pos: [1.4, 13, 11], target: [1.4, 0, 0.6] };

  var CFG = {
    title: 'スライム建国記 遊び方',
    back: '../index.html',
    subtitle: '六角形の地図を、交渉と制圧で自分の色に塗りかえていく国づくりゲーム。はじめての人向けのチュートリアル',
    camera: MAP_STEPS_CAM,

    build: function (g) {
      // スライム（少しつぶした球＋目）
      function slime(id, pos, r, col, parent) {
        g.sphere({ id: id, parent: parent, radius: r, pos: pos, color: col, roughness: 0.25, emissive: col, emissiveIntensity: 0.18 });
        g.get(id).scale.set(1, 0.78, 1);
        g.sphere({ parent: id, radius: r * 0.13, pos: [-r * 0.34, r * 0.22, r * 0.88], color: '#15151a' });
        g.sphere({ parent: id, radius: r * 0.13, pos: [r * 0.34, r * 0.22, r * 0.88], color: '#15151a' });
      }

      // ======================= 世界地図 =======================
      g.group('halo', {});
      ADJ0.forEach(function (i) {
        g.cylinder({ id: 'halo' + i, parent: 'halo', radius: 1.26, height: 0.05, segments: 6, pos: [P[i].x, 0.025, P[i].z], color: C.gold, emissive: C.gold, emissiveIntensity: 0.7 });
      });
      TERR.forEach(function (t, i) {
        g.cylinder({ id: 't' + i, radius: 1.08, height: P[i].h, segments: 6, pos: [P[i].x, P[i].h / 2 + 0.03, P[i].z], color: ownCol(t[1]) });
      });
      slime('home-slime', [P[0].x, P[0].h + 0.4, P[0].z], 0.48, '#6fe0b0');

      g.group('nm', {});
      g.group('st', {});
      TERR.forEach(function (t, i) {
        g.label(t[0], TOP(i, 0.45), { id: 'nm' + i, parent: 'nm', size: 0.27, bg: '#000000aa' });
        var s = i === 0 ? t[0] + '\n（本拠地）' : t[0] + '\n強さ ' + t[2];
        g.label(s, TOP(i, 0.55), { id: 'st' + i, parent: 'st', size: 0.24, bg: '#000000bb' });
      });
      g.label('緑：自分の国\n灰：無所属の村\n金：鉄鎚商業連合\n赤茶：黒曜の残党\n柱の高さ＝勢力の強さ', [7.6, 0.8, 1.2], { id: 'legend', size: 0.34, bg: '#000000aa' });

      // STEP6：くわしい情報（地図の下に出るカード）
      g.group('detail', {});
      g.line([TOP(1, 0.2), [5.0, 1.6, -0.6]], { parent: 'detail', color: '#ffffff', opacity: 0.7 });
      g.label('陽だまりの畑［無所属］\n強さ 22・特産 食料', [6.7, 3.0, -0.6], { id: 'dc-head', parent: 'detail', size: 0.27, bg: '#000000dd' });
      g.label('交渉で迎え入れる　42%\n費用：魔素22・食料14', [6.7, 1.7, -0.6], { id: 'dc-b1', parent: 'detail', size: 0.26, bg: '#173b2ddd', border: '#4fbd8f' });
      g.label('制圧して従える　39%\n費用：木材22・魔素14', [6.7, 0.6, -0.6], { id: 'dc-b2', parent: 'detail', size: 0.26, bg: '#3f2116dd', border: '#e08060' });
      g.label('となり＝黄色のふち', [-3.2, 0.4, -4.4], { id: 'adj-lbl', size: 0.34, color: C.gold, bg: '#000000aa' });

      // STEP7：交渉
      g.group('dip', {});
      g.arrow(TOP(0, 0.9), TOP(1, 0.3), { id: 'dip-arrow', parent: 'dip', color: C.good, lift: 1.3, radius: 0.07 });
      g.flow(TOP(0, 0.9), TOP(1, 0.3), { id: 'dip-flow', parent: 'dip', color: '#ffe9a8', lift: 1.3, count: 5, size: 0.11 });
      g.label('交渉 42%\n魔素22・食料14を払う', [P[1].x + 0.2, 3.1, P[1].z - 0.9], { id: 'dip-lbl', parent: 'dip', size: 0.3, color: C.good, bg: '#000000bb' });
      g.label('成功！ 自分の国に\n経験＋10・食料＋11', [P[1].x + 3.0, 1.4, P[1].z + 1.3], { id: 'dip-ok', size: 0.3, color: '#ffffff', bg: '#1f6b4fdd' });

      // STEP8：制圧
      g.group('con', {});
      g.arrow(TOP(0, 0.9), TOP(1, 0.3), { id: 'con-arrow', parent: 'con', color: C.enemy, lift: 1.3, radius: 0.08 });
      g.flow(TOP(0, 0.9), TOP(1, 0.3), { id: 'con-flow', parent: 'con', color: '#ffb0a0', lift: 1.3, count: 7, size: 0.1, speed: 0.6 });
      g.label('制圧 39%\n木材22・魔素14を払う', [P[1].x + 0.2, 3.1, P[1].z - 0.9], { id: 'con-lbl', parent: 'con', size: 0.3, color: '#ff9a9a', bg: '#000000bb' });
      g.label('成功！ 自分の国に\n経験＋16・食料＋13', [P[1].x + 3.0, 1.4, P[1].z + 1.3], { id: 'con-ok', size: 0.3, color: '#ffffff', bg: '#7a2f22dd' });

      // STEP12：周辺勢力
      g.group('ai', {});
      g.arrow(TOP(7, 0.2), TOP(1, 0.3), { id: 'ai-obs', parent: 'ai', color: '#ff7a4a', lift: 1.6, radius: 0.07 });
      g.arrow(TOP(2, 0.2), TOP(1, 0.3), { id: 'ai-iron', parent: 'ai', color: '#ffd166', lift: 1.6, radius: 0.07 });
      g.label('どちらも、いちばん弱い\nとなりの土地をねらう', [7.6, 1.2, -1.4], { id: 'ai-lbl', parent: 'ai', size: 0.3, bg: '#000000bb' });
      g.label('鉄鎚商業連合\n毎日18%で動く', [5.6, 1.8, -4.4], { id: 'ai-iron-lbl', parent: 'ai', size: 0.3, color: '#ffd166', bg: '#000000bb' });
      g.label('黒曜の残党\n毎日35%で動く', [7.2, 1.6, 1.6], { id: 'ai-obs-lbl', parent: 'ai', size: 0.3, color: '#ff9a70', bg: '#000000bb' });

      // ======================= 始め方とセーブ =======================
      g.group('launch', {});
      g.plate({ id: 'l-floor', parent: 'launch', size: [15, 7.5], pos: [LX, 0.02, LZ + 0.8], color: '#1b2c4a', opacity: 0.95 });
      g.card({ id: 'l-file', parent: 'launch', pos: [LX - 5.2, 1.3, LZ], lying: false, text: '📄', sub: 'ダブル\nクリック', color: '#4fbd8f', w: 1.4 });
      g.label('index.html', [LX - 5.2, 0.3, LZ + 0.6], { id: 'l-file-lbl', parent: 'launch', size: 0.34, color: '#ffffff', bg: '#000000aa' });
      g.box({ id: 'l-browser', parent: 'launch', size: [3.2, 2.2, 0.3], pos: [LX, 1.3, LZ], color: '#2d2944', edgeColor: '#7ef0ff' });
      slime('l-slime', [LX, 1.1, LZ + 0.5], 0.42, '#6fe0b0', 'launch');
      g.label('ブラウザで開いて すぐ遊べる', [LX, 2.95, LZ], { id: 'l-browser-lbl', parent: 'launch', size: 0.3, bg: '#000000aa' });
      g.cylinder({ id: 'l-save', parent: 'launch', radius: 0.9, height: 1.4, pos: [LX + 5.2, 0.72, LZ], color: C.server, label: '行動のたびに\nブラウザへ自動保存', labelSize: 0.3, labelBg: '#000000cc', labelOffset: [0, 1.45, 0] });
      g.arrow([LX - 4.2, 1.3, LZ], [LX - 1.8, 1.3, LZ], { id: 'l-a1', parent: 'launch', color: C.gold, lift: 0.6, radius: 0.06 });
      g.flow([LX + 1.8, 1.3, LZ], [LX + 4.2, 1.3, LZ], { id: 'l-f1', parent: 'launch', color: C.data, lift: 0.6, count: 5 });
      g.label('別のブラウザ・別のPCには\n引き継がれない', [LX + 3.4, 0.35, LZ + 2.9], { id: 'l-warn', parent: 'launch', size: 0.28, color: '#ffcf80', bg: '#000000aa' });
      g.box({ id: 'l-reset', parent: 'launch', size: [2.6, 0.3, 0.8], pos: [LX - 2.2, 0.17, LZ + 3.1], color: '#a23b2d', label: '「はじめからやり直す」\n＝セーブを消して最初から', labelSize: 0.26, labelBg: '#000000cc', labelOffset: [0, 0.65, 0] });

      // ======================= 画面の見方（ゲーム画面の模型） =======================
      g.group('scr', {});
      g.plate({ id: 'scr-floor', parent: 'scr', size: [12.4, 10.4], pos: [SX, 0.02, SZ], color: '#8a8470', opacity: 1, radius: 0.1 });
      function ui(id, cx, cz, w, d, col, label, lblOff) {
        g.box({ id: id, parent: 'scr', size: [w, 0.14, d], pos: [SX + cx, 0.1, SZ + cz], color: col, edges: false, label: label, labelSize: 0.28, labelBg: '#000000cc', labelOffset: lblOff || [0, 0.55, 0] });
      }
      ui('u-title', -3.6, -4.55, 4.4, 0.7, '#f5f1e2', 'タイトル');
      ui('u-turn', 2.1, -4.55, 2.8, 0.7, '#f5f1e2', '経過日数・発展度', [-0.2, 0.55, 0]);
      ui('u-next', 4.75, -4.55, 1.9, 0.7, '#2f9e78', '次の日へ', [0.2, 0.55, 0]);
      [['魔素'], ['食料'], ['木材'], ['発展度']].forEach(function (r, i) {
        ui('u-res' + i, -4.35 + i * 2.9, -3.55, 2.6, 0.8, '#f5f1e2', r[0] + (i < 3 ? '\n（+○/日）' : '\n（○/13領地）'));
      });
      ui('u-map', -2.25, -0.75, 7.0, 4.4, '#f5f1e2', '世界地図', [-2.6, 0.45, -1.8]);
      ui('u-detail', -2.25, 0.95, 6.4, 0.8, '#ffffff', 'クリックした土地のくわしい情報', [0, 0.5, 0.1]);
      ui('u-log', -2.25, 3.25, 7.0, 3.2, '#f5f1e2', '年代記（できごとの記録）');
      ui('u-evo', 3.65, -2.65, 4.1, 0.9, '#f5f1e2', 'スライムの成長（進化）', [0, 0.5, 0.05]);
      ui('u-dip', 3.65, -0.85, 4.1, 2.0, '#f5f1e2', '外交（2つの勢力）');
      ui('u-bld', 3.65, 1.35, 4.1, 2.0, '#f5f1e2', '本拠地の施設');
      ui('u-com', 3.65, 3.4, 4.1, 1.7, '#f5f1e2', '仲間（4人）');
      ui('u-reset', 3.65, 4.75, 2.2, 0.4, '#a23b2d', 'はじめからやり直す', [0, 0.5, 0.2]);
      // 模型の地図の中の小さな六角形
      TERR.forEach(function (t, i) {
        g.cylinder({ id: 'u-hex' + i, parent: 'scr', radius: 0.42, height: 0.12, segments: 6, pos: [SX - 2.25 + (P[i].x + 0.52) * 0.4 - 0.2, 0.22, SZ - 0.95 + P[i].z * 0.4], color: ownCol(t[1]) });
      });

      // ======================= 1日の流れ =======================
      g.group('flow', {});
      g.plate({ id: 'f-floor', parent: 'flow', size: [16, 10], pos: [FX, 0.02, FZ + 0.8], color: '#1a1a2e', opacity: 0.95 });
      var FA = [FX - 4.2, 0.35, FZ - 1.6], FB = [FX + 4.2, 0.35, FZ - 1.6], FC = [FX, 0.35, FZ + 3];
      g.cylinder({ id: 'f-a', parent: 'flow', radius: 1.3, height: 0.6, pos: FA, color: '#2f9e78', label: '① 行動する\n資源があるかぎり何回でも', labelSize: 0.32, labelBg: '#000000cc', labelOffset: [0, 0.9, 0] });
      g.cylinder({ id: 'f-b', parent: 'flow', radius: 1.3, height: 0.6, pos: FB, color: '#c9a227', label: '② 「次の日へ」を押す', labelSize: 0.32, labelBg: '#000000cc', labelOffset: [0, 0.9, 0] });
      g.cylinder({ id: 'f-c', parent: 'flow', radius: 1.3, height: 0.6, pos: FC, color: '#3a8fb7', label: '③ 1日が進む', labelSize: 0.32, labelBg: '#000000cc', labelOffset: [0, 0.9, 0] });
      g.arrow([FX - 2.7, 0.6, FZ - 1.6], [FX + 2.7, 0.6, FZ - 1.6], { id: 'f-ab', parent: 'flow', color: C.gold, lift: 0.9, radius: 0.06 });
      g.arrow([FX + 3.3, 0.6, FZ - 0.3], [FX + 1.3, 0.6, FZ + 2.2], { id: 'f-bc', parent: 'flow', color: C.gold, lift: 0.7, radius: 0.06 });
      g.arrow([FX - 1.3, 0.6, FZ + 2.2], [FX - 3.3, 0.6, FZ - 0.3], { id: 'f-ca', parent: 'flow', color: C.gold, lift: 0.7, radius: 0.06 });
      g.label('交渉・制圧\n施設の強化・仲間を鍛える\n贈り物・停戦・同盟', [FX - 4.2, 0.5, FZ + 0.75], { id: 'f-a-list', parent: 'flow', size: 0.27, color: '#bff5dc', bg: '#000000aa' });
      g.label('資源がふえる・経験＋1\nまわりの勢力が動く\n30%でイベント', [FX + 4.4, 0.5, FZ + 3.4], { id: 'f-c-list', parent: 'flow', size: 0.27, color: '#bfe6ff', bg: '#000000aa' });

      // ======================= 資源 =======================
      g.group('res', {});
      g.plate({ id: 'r-floor', parent: 'res', size: [12, 8], pos: [RX, 0.02, RZ + 0.6], color: '#1a1a2e', opacity: 0.95 });
      var RB = [['mana', '#9b7bff', 40, 8, '🔮 魔素'], ['food', '#e8b04a', 60, 12, '🌾 食料'], ['wood', '#a0683f', 50, 10, '🌲 木材']];
      RB.forEach(function (r, i) {
        var x = RX - 3.6 + i * 3.6;
        g.box({ id: 'rb-' + r[0], parent: 'res', size: [1.6, 1, 1.6], pos: [x, 0.5, RZ], color: r[1] });
        g.label(r[4] + ' ' + r[2], [x, 2.2, RZ], { id: 'rb-lbl-' + r[0], parent: 'res', size: 0.36, bg: '#000000bb' });
        g.label('＋' + r[3] + ' /日', [x, 0.3, RZ + 1.7], { id: 'rb-d-' + r[0], parent: 'res', size: 0.32, color: C.good, bg: '#000000aa' });
      });
      g.label('1日目', [RX, 5.8, RZ], { id: 'r-day', parent: 'res', size: 0.42, color: C.gold, bg: '#000000aa' });

      // ======================= 成功率のしくみ =======================
      g.group('pw', {});
      g.plate({ id: 'pw-floor', parent: 'pw', size: [14, 8], pos: [PX, 0.02, PZ + 0.5], color: '#1a1a2e', opacity: 0.95 });
      function stack(prefix, x, segs) {
        var y = 0;
        segs.forEach(function (s, i) {
          g.box({ id: prefix + i, parent: 'pw', size: [1.3, s[0] * K, 1.3], pos: [x, y + s[0] * K / 2, PZ], color: s[1] });
          y += s[0] * K;
        });
        return y;
      }
      stack('pw-d', PX - 4.6, [[3, '#4fbd8f'], [5, '#9b7bff'], [6, '#7ef0ff']]);
      g.box({ id: 'pw-dx', parent: 'pw', size: [1.3, 5 * K, 1.3], pos: [PX - 4.6, 14 * K + 2.5 * K, PZ], color: '#e0d4ff' });
      g.box({ id: 'pw-ds', parent: 'pw', size: [1.3, 22 * K, 1.3], pos: [PX - 2.7, 11 * K, PZ], color: '#8f8b78' });
      stack('pw-c', PX + 2.7, [[3, '#4fbd8f'], [7, '#ff9f43'], [6, '#ff5f6d']]);
      g.box({ id: 'pw-cx', parent: 'pw', size: [1.3, 7 * K, 1.3], pos: [PX + 2.7, 16 * K + 3.5 * K, PZ], color: '#ffd2a8' });
      g.box({ id: 'pw-cs', parent: 'pw', size: [1.3, 22 * K, 1.3], pos: [PX + 4.6, 11 * K, PZ], color: '#8f8b78' });
      g.label('交渉力 14', [PX - 4.6, 14 * K + 0.45, PZ], { id: 'pw-d-lbl', parent: 'pw', size: 0.3, bg: '#000000bb' });
      g.label('制圧力 16', [PX + 2.7, 16 * K + 0.45, PZ], { id: 'pw-c-lbl', parent: 'pw', size: 0.3, bg: '#000000bb' });
      g.label('強さ 22', [PX - 2.7, 22 * K + 0.4, PZ], { id: 'pw-ds-lbl', parent: 'pw', size: 0.3, bg: '#000000bb' });
      g.label('強さ 22', [PX + 4.6, 22 * K + 0.4, PZ], { id: 'pw-cs-lbl', parent: 'pw', size: 0.3, bg: '#000000bb' });
      g.label('交渉 42%', [PX - 3.65, 5.0, PZ], { id: 'pw-dp', parent: 'pw', size: 0.46, color: C.good, bg: '#000000bb' });
      g.label('制圧 39%', [PX + 3.65, 5.0, PZ], { id: 'pw-cp', parent: 'pw', size: 0.46, color: '#ff9a9a', bg: '#000000bb' });
      g.label('領地×3（緑）\n魔導書庫Lv×5（紫）\n知恵袋Lv×6（水色）', [PX - 3.65, 0.3, PZ + 2.3], { id: 'pw-d-leg', parent: 'pw', size: 0.25, bg: '#000000aa' });
      g.label('領地×3（緑）\n訓練場Lv×7（橙）\n猛将Lv×6（赤）', [PX + 3.65, 0.3, PZ + 2.3], { id: 'pw-c-leg', parent: 'pw', size: 0.25, bg: '#000000aa' });
      g.label('相手：陽だまりの畑（強さ22）', [PX, 0.3, PZ - 2.6], { id: 'pw-title', parent: 'pw', size: 0.3, color: C.gold, bg: '#000000aa' });

      // ======================= 施設と仲間 =======================
      g.group('bld', {});
      g.plate({ id: 'b-floor', parent: 'bld', size: [16, 9.5], pos: [BX, 0.02, BZ + 0.6], color: '#231f33', opacity: 0.95 });
      var BLD = [['hall', '集落庁舎\n生産ぜんぶ＋15%', '#c9a227'], ['farm', '農場\n食料＋3', '#e8b04a'], ['workshop', '工房\n木材＋3', '#a0683f'], ['archive', '魔導書庫\n魔素＋3・交渉力＋5', '#9b7bff'], ['training', '訓練場\n制圧力＋7', '#ff7a5c']];
      BLD.forEach(function (b, i) {

          '<ul><li>停戦は、敵対中のときだけ申しこめる。8日たつと敵対にもどって、関係値 −10</li>' +

        camera: { pos: [DX, 11, DZ + 16], target: [DX, 0.5, DZ + 2] },
        focus: ['dipl'],
        update: (function () {
          var last = -1;
          return function (g, t) {
            var k = t % 9;
            var n = Math.min(4, Math.floor(k / 1.4));
            var frac = Math.min(1, g.phase(k - n * 1.4, 0, 0.5));
            var rel = 15 + 12 * Math.max(0, n - 1) + (n > 0 ? 12 * frac : 0);
            var x = DX + rel * 0.08;
            g.get('d-iron').position.x = x;
            g.get('d-iron-lbl').position.x = x;
            var shown = 15 + 12 * n;
            if (shown !== last) { g.setLabel('d-iron-lbl', '鉄鎚 ' + shown, { size: 0.28, color: '#ffe08a', bg: '#000000bb' }); last = shown; }

        focus: ['ev'],
        update: function (g, t) {

      },

          '<li>行動は1日に何回でもOK。終わったら <b>次の日へ</b></li>' +
          '<li><b>施設・仲間</b> を強化して、生産と成功率を上げる</li>' +
          '<li>経験をためて <b>進化</b>（交渉力・制圧力＋8）</li>' +

          '<p>それじゃあ、小さなスライムの国づくり、楽しんでね！🟢</p>',
        camera: MAP_STEPS_CAM,
        show: ['nm'],
        update: function (g, t) {
          var order = [1, 6, 4, 5, 3, 2, 9, 10, 11, 8, 7, 12];
          var n = Math.floor((t % 9) / 0.55);
          order.forEach(function (id, i) { g.setColor('t' + id, i < n ? OWN_COL.player : ownCol(TERR[id][1])); });

  // STEP5：資源のバーを日数に合わせて伸ばす
  function RB_UPDATE(g, day, changed) {
    [['mana', 40, 8, '🔮 魔素'], ['food', 60, 12, '🌾 食料'], ['wood', 50, 10, '🌲 木材']].forEach(function (r) {
      var v = r[1] + r[2] * day;
      var h = v * 0.04;
      var b = g.get('rb-' + r[0]);
      b.scale.y = h; b.position.y = h / 2;
      g.get('rb-lbl-' + r[0]).position.y = h + 0.55;
      if (changed) g.setLabel('rb-lbl-' + r[0], r[3] + ' ' + v, { size: 0.36, bg: '#000000bb' });
    });
    if (changed) g.setLabel('r-day', (day + 1) + '日目', { size: 0.42, color: C.gold, bg: '#000000aa' });
  }

  GameGuide.start(CFG);
  // guide.js はタイトルに「仕組み図解」と付けるので、このページ用に付け直す

})();
