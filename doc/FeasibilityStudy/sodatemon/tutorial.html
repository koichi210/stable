<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>そだてもん | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var GREEN = '#5c7a52', PAPER = '#f5f0e1', ACCENT = '#b1402a', GOLD = '#b6892f', PLAYER = '#44ff44';

  // ---------- 舞台の置き場所（ステップのカメラでも使うので start より前に決めておく） ----------
  var OV = [0, 0, 0];        // 全体の流れ
  var LN = [-28, 0, 0];      // 起動のしかた
  var SC = [-28, 0, -26];    // 画面の見方
  var QZ = [0, 0, 26];       // ラーニング（クイズ）
  var RW = [28, 0, 26];      // 正解のごほうび
  var GA = [28, 0, 0];       // ガチャ
  var CH = [56, 0, 0];       // キャラを育てる
  var AW = [28, 0, -26];     // 覚醒
  var SY = [46, 0, -26];     // 合成
  var CP = [64, 0, -26];     // 編成
  var MAP = [0, 0, -32];     // 日本統一マップ
  var BAT = [-28, 0, 26];    // バトル
  var SV = [56, 0, 26];      // セーブ
  function P(b, d) { return [b[0] + d[0], b[1] + d[1], b[2] + d[2]]; }

  // ---------- sodatemon-magna.html の TERRITORIES（x, y, となり）と WARLORDS（勢力の色）を写したもの ----------
  var TERR = {
    '沖縄': [0, 0, ['鹿児島']], '鹿児島': [1, 0, ['沖縄', '宮崎', '長崎']], '宮崎': [2, 0, ['鹿児島', '大分']],
    '長崎': [0, 1, ['鹿児島', '佐賀']], '佐賀': [1, 1, ['長崎', '福岡', '熊本']], '福岡': [2, 1, ['佐賀', '大分']],
    '熊本': [1, 2, ['佐賀', '大分']], '大分': [2, 2, ['宮崎', '福岡', '熊本', '香川']],
    '香川': [3, 1, ['大分', '愛媛', '徳島']], '愛媛': [3, 2, ['香川', '徳島', '高知', '広島']], '徳島': [4, 1, ['香川', '愛媛', '高知']],
    '高知': [4, 2, ['愛媛', '徳島', '兵庫']], '広島': [3, 3, ['愛媛', '岡山', '島根']], '岡山': [4, 3, ['広島', '兵庫', '鳥取']],
    '島根': [2, 3, ['広島', '鳥取']], '鳥取': [4, 4, ['岡山', '島根', '兵庫']], '兵庫': [5, 2, ['高知', '岡山', '鳥取', '京都', '奈良']],
    '京都': [5, 3, ['兵庫', '滋賀', '奈良']], '奈良': [6, 3, ['兵庫', '京都', '三重']], '滋賀': [5, 4, ['京都', '岐阜']],
    '三重': [6, 4, ['奈良', '岐阜', '愛知']], '岐阜': [5, 5, ['滋賀', '三重', '愛知', '長野']], '愛知': [6, 5, ['三重', '岐阜', '静岡']],
    '静岡': [7, 5, ['愛知', '長野', '山梨', '神奈川']], '長野': [6, 6, ['岐阜', '静岡', '山梨', '群馬', '新潟']], '山梨': [7, 6, ['静岡', '長野', '東京']],
    '神奈川': [8, 5, ['静岡', '東京', '埼玉']], '東京': [8, 6, ['山梨', '神奈川', '埼玉', '千葉']], '埼玉': [8, 7, ['東京', '神奈川', '千葉', '栃木']],
    '千葉': [9, 6, ['東京', '埼玉', '栃木']], '栃木': [8, 8, ['埼玉', '千葉', '群馬', '福島']], '群馬': [7, 7, ['栃木', '新潟', '長野']],
    '新潟': [6, 7, ['長野', '群馬', '福島']], '福島': [8, 9, ['栃木', '新潟', '宮城']], '宮城': [8, 10, ['福島', '岩手']],
    '岩手': [8, 11, ['宮城', '青森']], '青森': [8, 12, ['岩手', '北海道']], '北海道': [8, 13, ['青森']],
  };
  var WARLORDS = [
    ['#ff6b6b', ['沖縄', '鹿児島']], ['#ff8c8c', ['長崎']], ['#ffa5a5', ['宮崎', '大分']], ['#ffb8b8', ['佐賀']],
    ['#ffcccc', ['福岡']], ['#ffdddd', ['熊本']], ['#ffe066', ['高知']], ['#ffd700', ['香川']], ['#ffb600', ['徳島']],
    ['#66b2ff', ['愛媛']], ['#4d94ff', ['広島', '岡山', '島根']], ['#3d84ff', ['鳥取']], ['#ff6b9d', ['兵庫', '京都']],
    ['#c44569', ['奈良']], ['#ff4444', ['滋賀', '三重', '岐阜', '愛知']], ['#ff7755', ['静岡']], ['#ffaa44', ['山梨', '長野']],
    ['#6666ff', ['神奈川', '東京', '埼玉', '千葉']], ['#8844ff', ['新潟', '群馬']], ['#2ec4c4', ['宮城', '栃木']],
    ['#66ff66', ['岩手']], ['#88ff88', ['福島']], ['#aaffaa', ['青森']], ['#cccccc', ['北海道']],
  ];
  var OWNER_COLOR = {};
  WARLORDS.forEach(function (w) { w[1].forEach(function (t) { if (!OWNER_COLOR[t]) OWNER_COLOR[t] = w[0]; }); });
  var NAMES = Object.keys(TERR);
  var CELL = 1.12;
  // ゲーム画面と同じ並び（沖縄が左上・北海道が下）。奥＝画面の上
  function mapPos(name, y) {
    var t = TERR[name];
    return [MAP[0] + (t[0] - 4.5) * CELL, y == null ? 0.05 : y, MAP[2] + (t[1] - 6.5) * CELL];
  }
  // 沖縄から、となりをたどって取っていく順番（まとめのステップで使う）
  var UNIFY = ['沖縄'];
  for (var ui0 = 0; ui0 < UNIFY.length; ui0++) TERR[UNIFY[ui0]][2].forEach(function (m) { if (UNIFY.indexOf(m) < 0) UNIFY.push(m); });
  var CONQUEST = ['沖縄', '鹿児島', '長崎', '宮崎', '佐賀', '大分', '福岡', '香川', '愛媛', '広島'];

  // ---------- バトルの4×4マス ----------
  function cellPos(r, c) { return [BAT[0] + (c - 1.5) * 1.2, 0.05, BAT[2] + (r - 1.5) * 1.2]; }
  var CASTLE_ME = P(BAT, [-3.9, 0, 0]), CASTLE_EN = P(BAT, [3.9, 0, 0]);
  var CELL_IDS = [];
  for (var r0 = 0; r0 < 4; r0++) for (var c0 = 0; c0 < 4; c0++) CELL_IDS.push('cell' + r0 + c0);

  // ラベルの差し替えは、文字が変わったときだけ（毎フレーム作り直さない）
  var shown = {};
  function setLbl(g, id, txt, o) { if (shown[id] === txt) return; g.setLabel(id, txt, o); shown[id] = txt; }
  function bar(g, id, v, max, h) {
    var b = g.get(id); var s = Math.max(0.02, v / max);
    b.scale.y = s; b.position.y = (h * s) / 2 + 0.05;
  }

  // キャラ（ゲームでは文字だけなので、図解用のかんたんな形）
  function creature(g, id, pos, color, parent) {
    g.group(id, { pos: pos, parent: parent });
    g.cylinder({ parent: id, radius: 0.75, height: 0.2, pos: [0, 0.1, 0], color: '#4a4466' });
    g.sphere({ parent: id, radius: 0.6, pos: [0, 0.8, 0], color: color || '#8fc27a' });
    g.sphere({ parent: id, radius: 0.08, pos: [-0.2, 0.92, 0.53], color: '#2b2620' });
    g.sphere({ parent: id, radius: 0.08, pos: [0.2, 0.92, 0.53], color: '#2b2620' });
    var lf = g.sphere({ parent: id, radius: 0.22, pos: [0, 1.48, 0], color: GREEN });
    lf.scale.set(0.45, 1.1, 0.25);
  }

  var CFG = {
    title: 'そだてもん 遊び方',
    back: '../index.html',
    subtitle: '勉強クイズに答えてキャラを育て、日本統一をめざす学習ゲーム。はじめての人向けのチュートリアル',
    camera: { pos: [0, 10, 10.5], target: [0, 0.5, 0] },

    build: function (g) {
      // ======================= 全体の流れ（OV） =======================
      g.group('ov', {});
      g.box({ parent: 'ov', id: 'ov-learn', size: [2.8, 0.8, 1.6], pos: [0, 0.4, 3.2], color: GREEN, label: '📚 ラーニング\nクイズに答える', labelSize: 0.32, labelBg: '#000000aa' });
      g.box({ parent: 'ov', id: 'ov-gacha', size: [2.8, 0.8, 1.6], pos: [4.8, 0.4, 0], color: GOLD, label: '🎲 ガチャ\nキャラを引く', labelSize: 0.32, labelBg: '#000000aa' });
      g.box({ parent: 'ov', id: 'ov-chars', size: [2.8, 0.8, 1.6], pos: [0, 0.4, -3.2], color: '#7b5cff', label: '👥 キャラ\n育てる・覚醒', labelSize: 0.32, labelBg: '#000000aa' });
      g.box({ parent: 'ov', id: 'ov-battle', size: [2.8, 0.8, 1.6], pos: [-4.8, 0.4, 0], color: ACCENT, label: '⚔️ バトル\n日本統一', labelSize: 0.32, labelBg: '#000000aa' });
      g.arrow([1.6, 0.6, 2.8], [4.1, 0.6, 0.9], { parent: 'ov', color: C.gold, lift: 0.8, label: 'コイン +10', labelSize: 0.28, labelBg: '#000000aa' });
      g.arrow([4.1, 0.6, -0.9], [1.6, 0.6, -2.8], { parent: 'ov', color: '#c77dff', lift: 0.8, label: 'キャラが出る', labelSize: 0.28, labelColor: '#e2c9ff', labelBg: '#000000aa' });
      g.arrow([0.3, 0.6, 2.3], [0.3, 0.6, -2.3], { parent: 'ov', color: C.good, lift: 1.4, label: '正解でキャラLv+1', labelSize: 0.28, labelBg: '#000000aa' });
      g.arrow([-1.6, 0.6, 2.8], [-4.1, 0.6, 0.9], { parent: 'ov', color: '#ff9f80', lift: 0.8, label: 'バトルもクイズ', labelSize: 0.28, labelBg: '#000000aa' });
      g.label('🎯 ゴール：日本の38マスを ぜんぶ自分の色に！', [0, 0.5, 5.6], { id: 'ov-goal', size: 0.4, color: C.gold, bg: '#000000aa' });

      // ======================= 起動のしかた（LN） =======================
      g.group('ln', {});
      g.plate({ parent: 'ln', id: 'ln-folder', size: [5.6, 4.6], pos: P(LN, [-2.6, 0.03, 0.2]), color: '#6b5a3a', opacity: 1,
        label: '📁 sodatemon フォルダ', labelOffset: [-0.6, 0.4, 2.7], labelSize: 0.36, labelBg: '#000000aa' });
      g.box({ parent: 'ln', id: 'ln-magna', size: [2.2, 0.5, 1.2], pos: P(LN, [-3.3, 0.3, -0.6]), color: '#ffd166', edgeColor: '#ffffff' });
      g.label('sodatemon-magna.html\n（これを開く！）', P(LN, [-3.3, 1.4, -0.6]), { parent: 'ln', id: 'ln-magna-l', size: 0.3, color: '#ffe7a8', bg: '#000000cc' });
      for (var f = 0; f < 6; f++) {
        g.box({ parent: 'ln', size: [0.75, 0.2, 0.55], pos: P(LN, [-4.5 + (f % 3) * 0.95, 0.12, 1.0 + Math.floor(f / 3) * 0.75]), color: '#8a8599', edges: false });
      }
      g.label('ほかのHTML 11個\n（古い版・お試し版）', P(LN, [-0.9, 0.7, 1.5]), { parent: 'ln', id: 'ln-others', size: 0.26, color: '#d8d4e8', bg: '#000000aa' });
      g.box({ parent: 'ln', id: 'ln-browser', size: [4.2, 2.8, 0.2], pos: P(LN, [3.6, 1.5, -0.6]), color: '#dfe3ea' });
      g.box({ parent: 'ln', size: [3.8, 2.1, 0.05], pos: P(LN, [3.6, 1.4, -0.47]), color: PAPER, edges: false });
      g.label('そだてもん', P(LN, [3.6, 1.6, -0.3]), { parent: 'ln', id: 'ln-title', size: 0.42, color: '#2b2620' });
      g.label('ブラウザ（Chrome・Edge など）', P(LN, [3.6, 3.4, -0.6]), { parent: 'ln', id: 'ln-browser-l', size: 0.3, bg: '#000000aa' });
      g.arrow(P(LN, [-2.0, 0.6, -0.6]), P(LN, [1.4, 1.0, -0.4]), { parent: 'ln', id: 'ln-arrow', color: C.gold, lift: 1.4, radius: 0.07 });
      g.label('ダブルクリック！', P(LN, [-0.3, 2.6, -0.6]), { parent: 'ln', id: 'ln-dbl', size: 0.34, color: C.gold, bg: '#000000aa' });
      g.label('インストールも .bat もいらないよ', P(LN, [3.6, 0.4, 2.2]), { parent: 'ln', id: 'ln-note', size: 0.32, color: C.good, bg: '#000000aa' });

      // ======================= 画面の見方（SC） =======================
      // ゲーム画面（だいたい 1100×760px）を 1/100 の模型にする
      function HP(x, y, h) { return [SC[0] + (x - 550) / 100, h == null ? 0.12 : h, SC[2] + (y - 400) / 100]; }
      g.group('sc', {});
      g.plate({ parent: 'sc', id: 'scr', size: [11.4, 8.2], pos: [SC[0], 0.02, SC[2]], color: '#b9ae8c', opacity: 1, radius: 0.1 });
      function ui(id, x, y, w, h, col, label, lblOff, lblSize) {
        g.box({ parent: 'sc', id: id, size: [w / 100, 0.14, h / 100], pos: HP(x, y, 0.1), color: col, edgeColor: '#6b6355', label: label, labelSize: lblSize || 0.28, labelBg: '#000000cc', labelOffset: lblOff || [0, 0.6, 0] });
      }
      ui('ui-coin', 149, 110, 250, 64, '#fffdf6', '💰 コイン 5000');
      ui('ui-xp', 416, 110, 250, 64, '#fffdf6', '⭐ XP 0');
      ui('ui-lv', 683, 110, 250, 64, '#fffdf6', '📚 レベル Lv1');
      ui('ui-cost', 951, 110, 250, 64, '#fffdf6', 'コスト（今は飾り）');
      var MENU = ['ラーニング', 'ガチャ', '編成', 'バトル', 'キャラ', 'オプション'];
      MENU.forEach(function (m, i) {
        ui('ui-m' + i, 105 + i * 178, 190, 168, 44, i === 0 ? ACCENT : '#fffdf6', m, [0, 0.55, 0], 0.26);
      });
      ui('ui-body', 550, 520, 1060, 440, '#fffdf6', 'えらんだメニューの画面\n（さいしょは ラーニング）', [0, 0.7, 0], 0.34);
      g.label('いちばん上：自分の数字　その下：メニュー6つ', [SC[0], 0.4, SC[2] - 4.7], { parent: 'sc', id: 'sc-title', size: 0.34, color: '#ffffff', bg: '#000000aa' });

      // ======================= ラーニング（QZ） =======================
      g.group('qz', {});
      g.box({ parent: 'qz', id: 'qz-board', size: [7.4, 2.6, 0.15], pos: P(QZ, [0, 1.6, -2.2]), color: PAPER, edges: false });
      g.label('もんだい：5 × 4 ＝ ？', P(QZ, [0, 2.2, -2.0]), { parent: 'qz', id: 'qz-q', size: 0.5, color: '#2b2620' });
      g.label('（このページ用の例。本物は学年ごとの問題）', P(QZ, [0, 1.25, -2.0]), { parent: 'qz', id: 'qz-q2', size: 0.26, color: '#6b6355' });
      ['小6', '中1', '中2', '中3'].forEach(function (s, i) {
        g.box({ parent: 'qz', id: 'qz-tab' + i, size: [1.5, 0.22, 0.6], pos: P(QZ, [-2.55 + i * 1.7, 0.12, -1.0]), color: i === 0 ? ACCENT : '#fffdf6', edges: false });
        g.label(s + ' ' + (i === 3 ? 39 : 40) + '問', P(QZ, [-2.55 + i * 1.7, 0.55, -1.0]), { parent: 'qz', id: 'qz-tabl' + i, size: 0.26, bg: '#000000aa' });
      });
      ['9', '20', '25', '45'].forEach(function (c, i) {
        g.plate({ parent: 'qz', id: 'qz-c' + i, size: [1.5, 0.9], pos: P(QZ, [-2.55 + i * 1.7, 0.05, 0.4]), color: '#fffdf6', opacity: 1,
          label: c, labelOffset: [0, 0.1, 0.12], labelSize: 0.42, labelColor: '#2b2620' });
      });
      g.box({ parent: 'qz', id: 'qz-next', size: [6.6, 0.25, 0.6], pos: P(QZ, [0, 0.13, 1.9]), color: ACCENT, edges: false });
      g.label('次の問題へ', P(QZ, [0, 0.55, 1.9]), { parent: 'qz', id: 'qz-next-l', size: 0.3, bg: '#000000aa' });
      g.label('4つから1つえらんでね', P(QZ, [0, 3.4, -2.2]), { parent: 'qz', id: 'qz-msg', size: 0.36, bg: '#000000aa', color: '#bff5d9' });

      // ======================= 正解のごほうび（RW） =======================
      g.group('rw', {});
      g.sphere({ parent: 'rw', id: 'rw-ok', radius: 0.7, pos: P(RW, [-4.2, 0.8, 0]), color: C.good, emissive: C.good, emissiveIntensity: 0.3 });
      g.label('正解！', P(RW, [-4.2, 2.1, 0]), { parent: 'rw', id: 'rw-ok-l', size: 0.4, color: C.good, bg: '#000000aa' });
      for (var k = 0; k < 10; k++) {
        g.cylinder({ parent: 'rw', id: 'rw-coin' + k, radius: 0.4, height: 0.1, pos: P(RW, [-1.4, 0.08 + k * 0.12, -0.6]), color: '#ffd166', metalness: 0.6, roughness: 0.3 });
      }
      g.cylinder({ parent: 'rw', id: 'rw-fly', radius: 0.3, height: 0.08, pos: P(RW, [-4.2, 0.8, 0]), color: '#ffd166', metalness: 0.6, roughness: 0.3 });
      g.label('コイン 5000', P(RW, [-1.4, 2.3, -0.6]), { parent: 'rw', id: 'rw-coins', size: 0.3, color: '#ffd166', bg: '#000000aa' });
      g.box({ parent: 'rw', id: 'rw-xp-track', size: [0.6, 3, 0.6], pos: P(RW, [1.0, 1.55, -0.6]), color: '#3a3555', opacity: 0.5, edges: true });
      g.box({ parent: 'rw', id: 'rw-xp', size: [0.62, 3, 0.62], pos: P(RW, [1.0, 1.55, -0.6]), color: '#7ef0ff', emissive: '#2aa0b0', emissiveIntensity: 0.3, edges: false });
      g.label('XP 0', P(RW, [1.0, 3.6, -0.6]), { parent: 'rw', id: 'rw-xps', size: 0.3, color: '#7ef0ff', bg: '#000000aa' });
      g.label('XP 100ごとに\nプレイヤーLv+1', P(RW, [1.0, 0.4, 1.0]), { parent: 'rw', id: 'rw-xp-note', size: 0.24, color: '#bfefff', bg: '#000000aa' });
      creature(g, 'rw-char', P(RW, [3.6, 0, -0.6]), '#8fc27a', 'rw');
      g.label('えらんだキャラ Lv1', P(RW, [3.6, 2.4, -0.6]), { parent: 'rw', id: 'rw-lv', size: 0.3, color: '#e2c9ff', bg: '#000000aa' });
      g.label('', P(RW, [0, 0.4, 2.4]), { parent: 'rw', id: 'rw-msg', size: 0.34, color: '#bff5d9', bg: '#000000aa' });

      // ======================= ガチャ（GA） =======================
      g.group('ga', {});
      g.box({ parent: 'ga', id: 'ga-base', size: [2.0, 1.4, 1.6], pos: P(GA, [-3.4, 0.7, 0]), color: ACCENT });
      g.sphere({ parent: 'ga', id: 'ga-glass', radius: 1.15, pos: P(GA, [-3.4, 2.5, 0]), color: '#cfe8ff', opacity: 0.3 });
      ['#ff6b6b', '#ffd166', '#5ee6a8', '#7ef0ff', '#c77dff', '#ff9f43'].forEach(function (c, i) {
        g.sphere({ parent: 'ga', radius: 0.26, pos: P(GA, [-3.4 + Math.cos(i) * 0.55, 2.05 + (i % 3) * 0.3, Math.sin(i * 1.7) * 0.5]), color: c });
      });
      g.sphere({ parent: 'ga', id: 'ga-cap', radius: 0.26, pos: P(GA, [-3.4, 0.7, 0.9]), color: '#ffd166' });
      var RCOL = ['#b8b2d6', '#8fc4ff', '#5ee6a8', '#ffd166', '#ff9f43', '#ff5f6d'];
      for (var rr = 0; rr < 6; rr++) {
        g.cylinder({ parent: 'ga', id: 'ga-bar' + rr, radius: 0.32, height: 1.6, pos: P(GA, [-0.8 + rr * 1.0, 0.8, 0]), color: RCOL[rr] });
        g.label('★' + (rr + 1) + '\n1/6', P(GA, [-0.8 + rr * 1.0, 2.2, 0]), { parent: 'ga', id: 'ga-bl' + rr, size: 0.26, bg: '#00000088' });
