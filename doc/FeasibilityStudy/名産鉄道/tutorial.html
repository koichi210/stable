<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名産鉄道 | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;

  // ---------- 日本地図（src/data/prefectures.json の id・名前・座標・隣の県を写したもの） ----------
  var PREFS = [
    [1,'北海道',700,80,[2]],
    [2,'青森県',650,150,[1,3,5]],
    [3,'岩手県',680,190,[2,4,5]],
    [4,'宮城県',670,230,[3,5,6,7]],
    [5,'秋田県',620,180,[2,3,4,6]],
    [6,'山形県',630,230,[4,5,7,15]],
    [7,'福島県',650,270,[4,6,8,9,10,15]],
    [8,'茨城県',680,320,[7,9,11,12]],
    [9,'栃木県',650,300,[7,8,10,11]],
    [10,'群馬県',610,300,[7,9,11,15,20]],
    [11,'埼玉県',630,330,[8,9,10,12,13,19,20]],
    [12,'千葉県',690,350,[8,11,13]],
    [13,'東京都',650,350,[11,12,14,19]],
    [14,'神奈川県',630,370,[13,19,22]],
    [15,'新潟県',570,260,[6,7,10,16,20]],
    [16,'富山県',540,300,[15,17,20,21]],
    [17,'石川県',510,290,[16,18,21]],
    [18,'福井県',500,330,[17,21,25,26]],
    [19,'山梨県',600,340,[11,13,14,20,22]],
    [20,'長野県',570,310,[10,11,15,16,19,21,22,23]],
    [21,'岐阜県',520,350,[16,17,18,20,23,24,25]],
    [22,'静岡県',600,380,[14,19,20,23]],
    [23,'愛知県',540,380,[20,21,22,24]],
    [24,'三重県',510,400,[21,23,25,26,29,30]],
    [25,'滋賀県',490,370,[18,21,24,26]],
    [26,'京都府',470,360,[18,24,25,27,28,29]],
    [27,'大阪府',460,390,[26,28,29,30]],
    [28,'兵庫県',420,380,[26,27,31,33]],
    [29,'奈良県',480,400,[24,26,27,30]],
    [30,'和歌山県',460,430,[24,27,29]],
    [31,'鳥取県',390,380,[28,32,33]],
    [32,'島根県',350,390,[31,33,34]],
    [33,'岡山県',410,410,[28,31,32,34,37]],
    [34,'広島県',350,420,[32,33,35]],
    [35,'山口県',300,430,[34,40]],
    [36,'徳島県',440,450,[37,38,39]],
    [37,'香川県',420,440,[33,36,38]],
    [38,'愛媛県',370,450,[36,37,39]],
    [39,'高知県',410,470,[36,38]],
    [40,'福岡県',260,470,[35,41,42,43,44]],
    [41,'佐賀県',230,480,[40,42]],
    [42,'長崎県',200,490,[40,41]],
    [43,'熊本県',250,510,[40,44,45,46]],
    [44,'大分県',290,500,[40,43,45]],
    [45,'宮崎県',280,540,[43,44,46]],
    [46,'鹿児島県',240,560,[43,45,47]],
    [47,'沖縄県',150,650,[46]],
  ];
  // src/game/data.ts の MAJOR_CITY_IDS（大都市＝武器屋・防具屋がある県）
  var MAJOR = [1, 2, 4, 6, 8, 11, 13, 15, 17, 20, 22, 23, 24, 26, 27, 28, 30, 33, 34, 37, 39, 40, 43, 45, 47];
  var isMajor = {};
  MAJOR.forEach(function (id) { isMajor[id] = true; });

  // ゲーム画面のコマの色（GameScene.ts の TOKEN_COLORS）
  var PCOL = ['#ff5555', '#5599ff', '#55dd55', '#ffcc33'];

  var NODE_Y = 0.12; // 県の丸の上面
  var P = {};
  function MX(x) { return (x - 430) / 22; }
  function MZ(y) { return (y - 365) / 22; }
  // 県の位置（ステップのカメラでも使うので build より先に計算しておく）
  PREFS.forEach(function (r) { P[r[0]] = { x: MX(r[2]), z: MZ(r[3]), name: r[1], nb: r[4] }; });
  function top(id, dy) { var p = P[id]; return [p.x, NODE_Y + (dy == null ? 0 : dy), p.z]; }
  // 4人が同じ県にいるときは、ゲームと同じように円形にずらして置く
  function slot(id, i) { var a = (i / 4) * Math.PI * 2; return [P[id].x + Math.cos(a) * 0.55, NODE_Y, P[id].z + Math.sin(a) * 0.55]; }

  // ---------- 舞台の置き場所 ----------
  var TX = -36, TZ = -16;   // タイトル画面（起動）
  var SX = -36, SZ = 0;     // ゲーム画面の模型
  var GX = 36, GZ = -16;    // ゴール（資産）
  var KX = 36, KZ = 0;      // 到着くじ
  var PX = 36, PZ = 16;     // 名産品ショップ
  var BX = -36, BZ = 16;    // バトル
  var RX = -36, RZ = 33;    // 領土と政策
  var EX = 36, EZ = 33;     // ターンの終わり
  var LX = 0, LZ = 34;      // LAN対戦
  // ゲーム画面 1000×750 → 10×7.5 の板
  function HP(x0, z0, x, y, h) { return [x0 + (x - 500) / 100, h == null ? 0.1 : h, z0 + (y - 375) / 100]; }

  // STEP10〜11：バトルの棒グラフ
  var S = 0.00012;
  // [id, x, 下の高さ, 値, 色, ラベル]
  var SEG = [
    ['bs-me-sol', -1, 0, 10000, '#ff8888', '兵隊 10000'], ['bs-me-w', -1, 10000, 20000, '#ff9a55', '大砲 20000'], ['bs-me-a', -1, 30000, 3000, '#77bbee', '革鎧 3000'],
    ['bs-en-sol', 1, 0, 20000, '#88aaff', '兵隊 20000'], ['bs-en-a', 1, 20000, 8000, '#77bbee', '鉄鎧 8000'],
  ];

  // ステップ5：東京 → 山梨 → 静岡 → 愛知（サイコロ3）
  var ROUTE = [13, 19, 22, 23];

  var CFG = {
    title: '名産鉄道 遊び方',
    back: '../index.html',
    subtitle: 'サイコロで47都道府県を旅して名産品を集める、すごろく＋兵隊バトルのゲーム。はじめての人向けのチュートリアル',
    camera: { pos: [-0.5, 29, 17.5], target: [-0.5, 0, 2.2] },

    build: function (g) {
      // ======================= 日本地図 =======================
      g.group('rails', {});
      var seen = {};
      PREFS.forEach(function (r) {
        r[4].forEach(function (n) {
          var k = Math.min(r[0], n) + '-' + Math.max(r[0], n);
          if (seen[k]) return;
          seen[k] = true;
          g.line([[P[r[0]].x, 0.05, P[r[0]].z], [P[n].x, 0.05, P[n].z]], { parent: 'rails', color: '#6f9ccc', opacity: 0.85 });
        });
      });
      PREFS.forEach(function (r) {
        var m = isMajor[r[0]];
        g.cylinder({ id: 'n' + r[0], radius: 0.36, height: 0.22, pos: [P[r[0]].x, 0.11, P[r[0]].z], color: m ? '#ffdd55' : '#e6e6ee', emissive: m ? '#aa8800' : '#000000', emissiveIntensity: m ? 0.35 : 1 });
      });

      // 汽車のコマ
      function train(id, col, pos) {
        g.group(id, { pos: pos });
        g.box({ parent: id, size: [0.7, 0.32, 0.4], pos: [0.05, 0.2, 0], color: col, edges: false });
        g.box({ parent: id, size: [0.28, 0.26, 0.4], pos: [-0.2, 0.48, 0], color: col, edges: false });
        g.cylinder({ parent: id, radius: 0.07, height: 0.24, pos: [0.25, 0.48, 0], color: '#333344' });
      }
      for (var i = 0; i < 4; i++) train('tr' + i, PCOL[i], slot(13, i));

      // STEP1：あいさつ
      g.label('東京都（ここからスタート）', top(13, 2.2), { id: 'w-tokyo', size: 0.6, bg: '#000000aa' });
      g.label('毛ガニ 900円', top(1, 1.1), { id: 'w-p1', size: 0.5, color: C.gold, bg: '#000000aa' });
      g.label('ゴーヤー 300円', [P[47].x + 2.8, 1.1, P[47].z - 1.2], { id: 'w-p2', size: 0.5, color: C.gold, bg: '#000000aa' });
      g.label('たこ焼き 300円', [P[27].x - 2.2, 1.6, P[27].z + 1.2], { id: 'w-p3', size: 0.5, color: C.gold, bg: '#000000aa' });
      g.label('明太子 600円', top(40, 1.3), { id: 'w-p4', size: 0.5, color: C.gold, bg: '#000000aa' });
      g.label('黄色い丸＝大都市（武器屋・防具屋がある）\n線でつながった隣の県へ進む', [-5.5, 0.8, -9.5], { id: 'legend', size: 0.55, bg: '#000000aa' });

      // STEP5：サイコロ
      g.box({ id: 'dice', size: [1.2, 1.2, 1.2], pos: [10.5, 0.6, 4.2], color: '#fafafa', radius: 0.12 });
      [[-0.32, -0.32], [0, 0], [0.32, 0.32]].forEach(function (q) {
        g.sphere({ parent: 'dice', radius: 0.11, pos: [q[0], 0.6, q[1]], color: '#222233' });
      });
      g.sphere({ parent: 'dice', radius: 0.11, pos: [0.6, 0, 0], color: '#cc2222' });
      [[-0.3, -0.3], [0.3, 0.3]].forEach(function (q) { g.sphere({ parent: 'dice', radius: 0.11, pos: [q[0], q[1], 0.6], color: '#222233' }); });
      g.label('3が出た！', [10.5, 2.4, 4.2], { id: 'dice-lbl', size: 0.55, color: C.gold, bg: '#000000aa' });
      g.label('のこり 3マス', [5.6, 2.6, -3.4], { id: 'left-lbl', size: 0.55, bg: '#000000cc' });
      g.group('route-nm', {});
      [[13, '東京都', 0.9, 0.9], [19, '山梨県', 0, -1.0], [22, '静岡県', 0.6, 1.1], [23, '愛知県', -0.4, 1.1]].forEach(function (a) {
        g.label(a[1], [P[a[0]].x + a[2], 0.9, P[a[0]].z + a[3]], { parent: 'route-nm', size: 0.42, bg: '#000000cc' });
      });
      g.group('route-ar', {});
      for (var ri = 0; ri < ROUTE.length - 1; ri++) {
        g.arrow(top(ROUTE[ri], 0.1), top(ROUTE[ri + 1], 0.1), { parent: 'route-ar', color: C.gold, lift: 0.6, radius: 0.05 });
      }

      // STEP6：分かれ道
      g.group('ch-ar', {});
      [11, 12, 14, 19].forEach(function (n) {
        g.arrow(top(13, 0.1), top(n, 0.1), { id: 'cha' + n, parent: 'ch-ar', color: C.data, lift: 0.7, radius: 0.05 });
      });
      g.group('ch-nm', {});
      [[11, '埼玉県', 0, -0.55], [12, '千葉県', 1.3, 0], [14, '神奈川県', 0, 0.75], [19, '山梨県', -1.3, 0]].forEach(function (a) {
        g.label(a[1], [P[a[0]].x + a[2], 0.8, P[a[0]].z + a[3]], { parent: 'ch-nm', size: 0.38, bg: '#000000cc' });
      });
      g.label('どっちに進む？', [14.6, 3.5, -1.4], { id: 'ch-title', size: 0.42, bg: '#111133ee' });
      [['埼玉県', 11], ['千葉県', 12], ['神奈川県', 14], ['山梨県', 19]].forEach(function (a, k) {
        g.label(a[0], [14.6, 2.8 - k * 0.6, -1.4], { id: 'chb' + k, size: 0.38, bg: '#335577' });
      });

      // STEP9：武器屋・防具屋（地図の右下の海の上）
      g.group('gear', {});
      var GEAR = [
        ['弓矢', 500, 3000, '攻'], ['刀', 1500, 8000, '攻'], ['大砲', 3500, 20000, '攻'],
        ['革鎧', 500, 3000, '防'], ['鉄鎧', 1500, 8000, '防'], ['城壁シールド', 3500, 20000, '防'],
      ];
      GEAR.forEach(function (gg, k) {
        var row = Math.floor(k / 3), col = k % 3;
        var h = gg[2] / 20000 * 2.6;
        var x = 3.6 + col * 3.6, z = 7 + row * 4.2;
        g.box({ parent: 'gear', size: [1.1, h, 1.1], pos: [x, h / 2, z], color: row === 0 ? '#ff9a55' : '#77bbee' });
        g.label(gg[0] + '\n' + gg[1] + '円\n' + (gg[3] === '攻' ? '攻撃' : '防御') + gg[2], [x, h + 1.2, z], { parent: 'gear', size: 0.46, bg: '#000000cc' });
      });
      g.label('武器屋', [0.4, 0.6, 7], { parent: 'gear', size: 0.6, color: '#ffaa66', bg: '#000000aa' });
      g.label('防具屋', [0.4, 0.6, 11.2], { parent: 'gear', size: 0.6, color: '#88ccff', bg: '#000000aa' });

      // ======================= タイトル画面（起動） =======================
      g.plate({ id: 't-scr', size: [10, 7.5], pos: [TX, 0.02, TZ], color: '#101020', opacity: 1, radius: 0.1 });
      g.label('名産鉄道', HP(TX, TZ, 500, 90, 0.3), { id: 't-title', size: 0.75, color: '#ffcc00' });
      g.label('全国47都道府県の名産品をあつめよう！', HP(TX, TZ, 500, 160, 0.3), { id: 't-sub', size: 0.3, color: '#ffffff' });
      [['CPU対戦（1人プレイ）', 250], ['LANで部屋をつくる', 320], ['LANの部屋に参加する', 390]].forEach(function (b, k) {
        g.box({ id: 't-b' + k, size: [3.6, 0.14, 0.52], pos: HP(TX, TZ, 500, b[1] + 15, 0.1), color: '#335577', edges: false });
        g.label(b[0], HP(TX, TZ, 500, b[1] + 15, 0.35), { id: 't-bl' + k, size: 0.3, color: '#ffffff' });
      });
      g.label('CPUの人数は？（1〜3）', HP(TX, TZ, 500, 560, 0.6), { id: 't-prompt', size: 0.38, color: '#222222', bg: '#ffffffee', border: '#5599ff' });
      g.cylinder({ id: 't-cursor', radiusTop: 0, radius: 0.18, height: 0.5, segments: 12, pos: HP(TX, TZ, 700, 600, 0.6), rot: [Math.PI, 0, 0], color: '#ffffff' });
      g.label('タイトル画面', [TX, 0.4, TZ - 4.4], { id: 't-cap', size: 0.5, color: '#ffffff' });

      // ======================= ゲーム画面の模型 =======================
      g.plate({ id: 's-scr', size: [10, 7.5], pos: [SX, 0.02, SZ], color: '#101020', opacity: 1, radius: 0.1 });
      g.group('s-map', {});
      PREFS.forEach(function (r) {
        g.box({ parent: 's-map', size: [0.11, 0.06, 0.11], pos: HP(SX, SZ, r[2] + 60, r[3] + 40, 0.08), color: isMajor[r[0]] ? '#ffdd55' : '#ffffff', edges: false });
      });
      for (var ti = 0; ti < 3; ti++) {
        g.sphere({ id: 's-tok' + ti, radius: 0.08, pos: HP(SX, SZ, 710 + Math.cos(ti / 3 * 6.28) * 10, 390 + Math.sin(ti / 3 * 6.28) * 10, 0.12), color: PCOL[ti] });
      }
      function ui(id, x, y, w, h, col, label, off) {
        g.box({ id: id, size: [w / 100, 0.08, h / 100], pos: HP(SX, SZ, x + w / 2, y + h / 2, 0.08), color: col, opacity: 0.9, edges: false, label: label, labelSize: 0.3, labelBg: '#000000cc', labelOffset: off || [0, 0.7, 0] });
      }
      ui('s-turn', 720, 10, 160, 22, '#ffffff', 'ターン 1 / 24', [0, 0.55, -0.35]);
      ui('s-side', 720, 40, 260, 230, '#2a3550', 'みんなのお金・資産\n名産品・兵隊・装備・領土', [0, 0.9, -0.2]);
      ui('s-panel', 700, 280, 280, 300, '#111133', 'ショップ・行き先えらび\n（ここにボタンが出る）', [0, 0.9, 0.3]);
      ui('s-dice', 20, 620, 150, 36, '#335577', '「サイコロをふる」\n「つぎへ」ボタン', [0.6, 0.9, -0.2]);
      ui('s-msg', 20, 680, 650, 50, '#666633', 'お知らせ（出た目・できごと・バトル）', [0, 0.6, 0.55]);
      g.label('日本地図（黄色＝大都市）', HP(SX, SZ, 330, 70, 0.5), { id: 's-maplbl', size: 0.3, bg: '#000000cc' });
      g.label('ゲーム画面', [SX, 0.4, SZ - 4.4], { id: 's-cap', size: 0.5, color: '#ffffff' });

      // ======================= ゴール（資産の合計） =======================
      g.plate({ id: 'g-floor', size: [12, 8], pos: [GX, 0.02, GZ], color: '#231f33', opacity: 0.95 });
      var GOAL = [['あなた', 2500, [900, 800, 600, 400], PCOL[0]], ['CPU1', 4000, [600, 500], PCOL[1]], ['CPU2', 1800, [700, 500, 400, 300], PCOL[2]]];
      GOAL.forEach(function (pl, k) {
        var x = GX - 3.6 + k * 3.6;
        var y = 0.06, s = 0.0005;
        g.box({ id: 'gm' + k, size: [1.4, pl[1] * s, 1.2], pos: [x, y + pl[1] * s / 2, GZ], color: '#e8c547', edges: true });
        y += pl[1] * s;
        pl[2].forEach(function (v, j) {
          g.box({ id: 'gp' + k + '-' + j, size: [1.4, v * s, 1.2], pos: [x, y + v * s / 2, GZ], color: ['#ff8fa3', '#ffb366', '#9be07a', '#8ec5ff'][j], edges: true });
          y += v * s;
        });
        var total = pl[1] + pl[2].reduce(function (a, b) { return a + b; }, 0);
        g.label(pl[0] + '\n' + total + '円', [x, y + 0.8, GZ], { id: 'gl' + k, size: 0.4, color: pl[3], bg: '#000000cc' });
        g.label(pl[0], [x, 0.3, GZ + 1.4], { id: 'gn' + k, size: 0.38, color: pl[3] });
      });
      g.label('🏆 1位', [GX - 3.6, 4.6, GZ], { id: 'g-crown', size: 0.55, color: C.gold, bg: '#000000aa' });
      g.label('黄色＝もちがね　ほかの色＝名産品の値段', [GX, 0.3, GZ + 3.2], { id: 'g-key', size: 0.4, bg: '#000000aa' });

      // ======================= 到着くじ =======================
      g.plate({ id: 'k-floor', size: [13, 8], pos: [KX, 0.02, KZ], color: '#231f33', opacity: 0.95 });
      g.cylinder({ id: 'k-sol', radius: 1.0, height: 1.2, pos: [KX - 4.6, 0.6, KZ], color: '#c0784a', label: '兵隊くじ（50%）', labelSize: 0.38, labelBg: '#000000cc', labelOffset: [0, 1.3, 0] });
      g.label('当たり：野武士が仲間に！\n兵隊 ＋10000人', [KX - 4.6, 0.4, KZ + 2.4], { id: 'k-sol-r', size: 0.36, color: C.good, bg: '#000000cc' });
      g.cylinder({ id: 'k-ev', radius: 1.0, height: 1.2, pos: [KX - 0.6, 0.6, KZ - 2.4], color: '#7a5cc0', label: 'できごとくじ（50%）', labelSize: 0.38, labelBg: '#000000cc', labelOffset: [0, 1.3, 0] });
      var EVS = [['盗賊', '兵隊−20%', C.enemy], ['豊作', 'お金＋800円', '#2e9d5a'], ['募集', '兵隊＋20%', '#2e9d5a'], ['商人', 'お金＋500円', '#2e9d5a'], ['疫病', '兵隊−15%', C.enemy], ['戦利品', 'お金+1000円', '#2e9d5a']];
      EVS.forEach(function (e, k) {
        var col = k % 3, row = Math.floor(k / 3);
        g.card({ id: 'ev' + k, pos: [KX + 1.9 + col * 1.5, 2.3 - row * 1.75, KZ + 0.6], lying: false, text: e[0], sub: e[1], color: e[2], w: 1.15 });
      });
      g.label('当たったら6つのうち1つ', [KX + 3.4, 0.3, KZ + 2.6], { id: 'k-ev-r', size: 0.36, bg: '#000000cc' });

      // ======================= 名産品ショップ =======================
      g.plate({ id: 'p-floor', size: [13, 8], pos: [PX, 0.02, PZ], color: '#231f33', opacity: 0.95 });
      g.label('愛知県のショップ', [PX - 3, 4.4, PZ - 1], { id: 'p-title', size: 0.45, bg: '#111133ee' });
      g.card({ id: 'pc0', pos: [PX - 4, 2.4, PZ - 1], lying: false, text: '800円', sub: 'ひつまぶし', color: '#d9534f', w: 1.5 });
      g.card({ id: 'pc1', pos: [PX - 2, 2.4, PZ - 1], lying: false, text: '400円', sub: 'きしめん', color: '#d9534f', w: 1.5 });
      g.plate({ id: 'p-tray', size: [5, 2.6], pos: [PX + 3, 0.05, PZ + 0.8], color: '#3a3555', opacity: 1 });
      g.label('あなたの名産品', [PX + 3, 0.4, PZ + 2.6], { id: 'p-tray-l', size: 0.4, bg: '#000000aa' });

      {

        html:

          '<ol><li><b>ホスト役のPC（1台だけ）</b> で、<code>名産鉄道</code> フォルダの <b>みんなで遊ぶ（LAN対戦）</b> をダブルクリック<br>' +

        title: 'まとめ',
        html:
