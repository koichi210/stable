<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcanaExplosion | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;

  // マークの色（カードの枠と文字）
  var SC = { S: '#3a3f8f', H: '#d63031', D: '#e67e22', C: '#16a085' };

  // ---------- 舞台の置き場所（ステップのカメラでも使うので start より先に決めておく） ----------
  var AR = {
    board: [0, 0],      // 盤面（ようこそ・撃破・まとめ）
    launch: [-34, 0],   // 起動とモード選び
    screen: [34, 0],    // 画面の見方
    stats: [0, -34],    // カードの強さ
    turn: [-34, -34],   // ターンの始まり
    act: [34, -34],     // 1ターンにできること
    dmg: [0, 34],       // ダメージ計算
    fat: [-34, 34],     // 疲労と退場
    jqk: [34, 34],      // J・Q・K の技
    ace: [0, 68],       // A と魔王
    item: [-34, 68],    // アイテム
    tf: [34, 68],       // 第三勢力
    lan: [0, -68],      // ネットワーク対戦
  };
  function CAM(k, p, t) {
    var a = AR[k];
    return { pos: [a[0] + p[0], p[1], a[1] + p[2]], target: [a[0] + t[0], t[1], a[1] + t[2]] };
  }
  var CAM_BOARD = CAM('board', [0, 9.5, 19.5], [0, 2.0, 0]);

  var CFG = {
    title: 'ArcanaExplosion 遊び方',
    back: '../index.html',
    subtitle: 'トランプがキャラクターとアイテムに変身して戦うカードバトル。はじめての人向けのチュートリアル',
    camera: CAM_BOARD,

    build: function (g) {
      function grp(id, k) { return g.group(id, { pos: [AR[k][0], 0, AR[k][1]] }); }
      function L(id, parent, text, pos, size, color, bg) {
        return g.label(text, pos, { id: id, parent: parent, size: size || 0.34, color: color, bg: bg === undefined ? '#000000aa' : bg });
      }
      function card(id, parent, pos, text, sub, color, w, more) {
        var o = { id: id, parent: parent, pos: pos, lying: false, text: text, sub: sub, color: color, w: w || 1.2 };
        if (more) for (var k in more) o[k] = more[k];
        return g.card(o);
      }

      // ======================= 盤面（ようこそ・撃破・まとめ） =======================
      grp('a-board', 'board');
      g.plate({ id: 'bd-floor', parent: 'a-board', size: [19.5, 9.5], pos: [0, 0.02, 0], color: '#241f38', opacity: 0.95 });
      // トレーナーHP（柱の高さ＝HP）
      g.box({ id: 'bd-hp-me', parent: 'a-board', size: [1.1, 3, 1.1], pos: [-8.2, 1.5, 0], color: C.me });
      g.box({ id: 'bd-hp-op', parent: 'a-board', size: [1.1, 3, 1.1], pos: [8.2, 1.5, 0], color: C.enemy });
      L('bd-hp-me-l', 'a-board', 'あなたのトレーナー\nHP 200', [-8.2, 3.8, 0], 0.34);
      L('bd-hp-op-l', 'a-board', '相手のトレーナー\nHP 200', [8.2, 3.8, 0], 0.34);
      // バトル場
      card('bd-bat-me', 'a-board', [-4.4, 2.75, -0.6], '♦10', '攻120\n防80', SC.D, 1.5);
      card('bd-bat-op', 'a-board', [4.4, 2.75, -0.6], '♠9', '攻120\n防60', SC.S, 1.5);
      L('bd-bat-me-l', 'a-board', 'バトル場', [-4.4, 4.25, -0.6], 0.34, '#ffd166');
      L('bd-bat-op-l', 'a-board', 'バトル場', [4.4, 4.25, -0.6], 0.34, '#ffd166');
      // デッキ（控え3枠）
      [['♥Q', '攻100\n防140', SC.H], ['♣5', '攻50\n防50', SC.C], ['♠3', '攻60\n防10', SC.S]].forEach(function (c, i) {
        card('bd-dk-me' + i, 'a-board', [-5.8 + i * 1.4, 0.8, 1.7], c[0], c[1], c[2], 0.95);
        card('bd-dk-op' + i, 'a-board', [3.0 + i * 1.4, 0.8, 1.7], ['♥Q', '♦6', '♣9'][i], ['攻100\n防140', '攻80\n防40', '攻90\n防90'][i], [SC.H, SC.D, SC.C][i], 0.95, { faceDown: true, backColor: '#6a2c3e' });
      });
      L('bd-dk-me-l', 'a-board', 'デッキ（控え3枠）', [-4.4, 0.3, 3.15], 0.3);
      L('bd-dk-op-l', 'a-board', 'デッキ（相手には伏せ札）', [4.4, 0.3, 3.15], 0.3);
      L('bd-vs', 'a-board', 'VS', [0, 2.7, -0.6], 0.8, '#ffffff', null);
      L('bd-goal', 'a-board', '相手のトレーナーHPを 0 にしたら勝ち！', [0, 5.5, -0.6], 0.5, C.gold);
      // STEP8：撃破
      g.group('bd-s8', { parent: 'a-board' });
      g.arrow([-3.5, 3.0, -0.6], [3.5, 3.0, -0.6], { id: 'bd8-atk', parent: 'bd-s8', color: C.gold, lift: 1.4, radius: 0.07 });
      L('bd8-ko', 'bd-s8', '撃破！', [4.4, 1.6, 0.6], 0.7, C.enemy);
      L('bd8-hp', 'bd-s8', '−30', [8.2, 4.75, 0], 0.6, C.enemy);
      L('bd8-note', 'bd-s8', '倒されたキャラクターの持ち主は トレーナーHP −30', [0, 5.5, -0.6], 0.42, C.gold);
      g.arrow([3.0, 1.6, 1.7], [4.2, 1.9, -0.4], { id: 'bd8-pro', parent: 'bd-s8', color: C.good, lift: 0.8, radius: 0.05 });
      L('bd8-pro-l', 'bd-s8', 'デッキから1体えらんで\nバトル場へ', [1.3, 1.25, 2.4], 0.3, C.good);

      // ======================= 起動とモード選び =======================
      grp('a-launch', 'launch');
      g.plate({ id: 'ln-floor', parent: 'a-launch', size: [21, 9], pos: [0.6, 0.02, 0], color: '#1b2c4a', opacity: 0.95 });
      g.box({ id: 'ln-bat1', parent: 'a-launch', size: [2.6, 0.5, 1.5], pos: [-7, 0.25, -2], color: '#43a047' });
      g.box({ id: 'ln-bat2', parent: 'a-launch', size: [2.6, 0.5, 1.5], pos: [-7, 0.25, 2], color: '#1e88e5' });
      L('ln-bat1-l', 'a-launch', 'ひとりで遊ぶ.bat\n（このPCだけ）', [-7, 1.25, -2], 0.3);
      L('ln-bat2-l', 'a-launch', 'みんなで遊ぶ（スマホもOK）.bat\n（スマホ・ほかのPCからも）', [-7, 1.25, 2], 0.3);
      g.box({ id: 'ln-con', parent: 'a-launch', size: [2.6, 1.9, 0.25], pos: [-2.6, 1.1, 0], color: '#111111', edgeColor: '#7ef0ff' });
      L('ln-con-l', 'a-launch', '黒い画面\n（サーバー）\n遊ぶあいだは\n閉じないでね', [-2.6, 1.1, 0.35], 0.3, '#ffffff', null);
      g.arrow([-5.6, 0.6, -1.7], [-3.8, 0.9, -0.2], { id: 'ln-a1', parent: 'a-launch', color: C.gold, lift: 0.5 });
      g.arrow([-5.6, 0.6, 1.7], [-3.8, 0.9, 0.2], { id: 'ln-a2', parent: 'a-launch', color: C.gold, lift: 0.5 });
      var PNL = [
        ['① スキンをえらぶ\nカードの名前や\n絵柄のセット', '#7b5cff'],
        ['② 遊びかた\n🤖 CPU対戦\n🌐 ネットワーク対戦', '#ff9f43'],
        ['③ CPUの強さ\n🐣初級 ⚔️中級\n🔥上級', '#5ee6a8'],
      ];
      PNL.forEach(function (p, i) {
        var x = 1.6 + i * 3.4;
        g.box({ id: 'ln-p' + i, parent: 'a-launch', size: [3.1, 2.3, 0.12], pos: [x, 1.35, 0], color: '#f4f2ff', edgeColor: p[1] });
        L('ln-p' + i + '-l', 'a-launch', p[0], [x, 1.35, 0.2], 0.32, '#ffffff', '#000000cc');
        if (i < 2) g.arrow([x + 1.5, 1.25, 0.1], [x + 1.9, 1.25, 0.1], { id: 'ln-pa' + i, parent: 'a-launch', color: C.gold, lift: 0.25, head: 0.2 });
      });
      g.arrow([-1.4, 1.0, 0.1], [0.1, 1.2, 0.1], { id: 'ln-a3', parent: 'a-launch', color: C.data, lift: 0.4 });
      L('ln-br', 'a-launch', 'ブラウザが自動で開くよ', [4.9, 3.0, 0], 0.36, C.data);

      // ======================= 画面の見方（ゲーム画面の模型） =======================
      grp('a-screen', 'screen');
      g.plate({ id: 'sc-floor', parent: 'a-screen', size: [12.6, 10.4], pos: [-0.5, 0.02, 0], color: '#bdb8d6', opacity: 1, radius: 0.1 });
      function ui(id, x, z, w, d, col) {
        g.box({ id: id, parent: 'a-screen', size: [w, 0.12, d], pos: [x, 0.1, z], color: col, edges: false });
      }
      var RX = -9.0; // 左の説明ラベルの列
      ui('sc-top', -0.5, -4.75, 12.2, 0.55, '#3b3561');
      ui('sc-ophp', -3.0, -3.9, 6.0, 0.4, C.enemy);
      ui('sc-opbat', -5.4, -2.9, 0.7, 0.95, SC.S);
      [0, 1, 2].forEach(function (i) { ui('sc-opdk' + i, -4.3 + i * 0.9, -2.9, 0.7, 0.95, '#6a2c3e'); });
      ui('sc-tf', -0.9, -2.9, 0.7, 0.95, C.third);
      ui('sc-vs', -3.0, -1.95, 6.6, 0.06, '#555577');
      ui('sc-mybat', -5.4, -1.0, 0.7, 0.95, SC.D);
      ui('sc-end', -3.6, -1.0, 1.6, 0.45, '#e53935');
      [0, 1, 2].forEach(function (i) { ui('sc-mydk' + i, -5.4 + i * 0.9, 0.15, 0.7, 0.95, '#4a6fa5'); });
      ui('sc-myhp', -3.0, 1.15, 6.0, 0.4, C.me);
      [0, 1, 2, 3].forEach(function (i) { ui('sc-ch' + i, -5.5 + i * 0.8, 2.25, 0.6, 0.85, '#8e7cc3'); });
      [0, 1, 2, 3, 4].forEach(function (i) { ui('sc-it' + i, -5.5 + i * 0.8, 3.35, 0.6, 0.85, '#2e7d32'); });
      ui('sc-hint', -3.0, 4.3, 6.0, 0.35, '#fff3b0');
      ui('sc-side', 3.9, -0.2, 3.2, 8.4, '#2a2a40');
      L('sc-l-top', 'a-screen', 'ターン数・図鑑・⚙️オプション', [RX, 0.3, -4.75], 0.34);
      L('sc-l-ophp', 'a-screen', '相手のトレーナーHP', [RX, 0.3, -3.9], 0.34, '#ffb3b8');
      L('sc-l-opbat', 'a-screen', '相手のバトル場・デッキ', [RX, 0.3, -2.9], 0.34, '#ffb3b8');
      L('sc-l-tf', 'a-screen', '第三勢力', [-0.9, 0.75, -2.9], 0.26, '#e3c2ff');
      L('sc-l-mybat', 'a-screen', '自分のバトル場', [RX, 0.3, -1.0], 0.34, '#bcdcff');
      L('sc-l-end', 'a-screen', 'ターン終了', [-3.6, 0.65, -1.0], 0.26, '#ffffff');
      L('sc-l-mydk', 'a-screen', '自分のデッキ（控え3枠）', [RX, 0.3, 0.15], 0.34, '#bcdcff');
      L('sc-l-myhp', 'a-screen', '自分のトレーナーHP', [RX, 0.3, 1.15], 0.34, '#bcdcff');
      L('sc-l-ch', 'a-screen', 'ベンチ（出す前のキャラ）', [RX, 0.3, 2.25], 0.34, '#d9ccff');
      L('sc-l-it', 'a-screen', 'アイテム手札', [RX, 0.3, 3.35], 0.34, '#b9f0c0');
      L('sc-l-hint', 'a-screen', '案内メッセージ', [RX, 0.3, 4.3], 0.34);
      L('sc-l-side', 'a-screen', 'ログ\nルール\nアイテム一覧\nキャラ一覧', [3.9, 0.6, -0.2], 0.3);

      // ======================= カードの強さ =======================
      grp('a-stats', 'stats');
      g.plate({ id: 'st-floor', parent: 'a-stats', size: [14.5, 7], pos: [0, 0.02, 0.6], color: '#241f38', opacity: 0.95 });
      var STATS = [
        ['S', '♠7', 100, 40, '♠ スペード\n攻+30・防−30'],
        ['H', '♥7', 50, 90, '♥ ハート\n攻−20・防+20'],
        ['D', '♦7', 90, 50, '♦ ダイヤ\n攻+20・防−20'],
        ['C', '♣7', 70, 70, '♣ クラブ\nそのまま'],
      ];
      STATS.forEach(function (s, i) {
        var cx = -5.1 + i * 3.4;
        card('st-c' + i, 'a-stats', [cx - 0.7, 1.15, 0.6], s[1], '攻' + s[2] + '\n防' + s[3], SC[s[0]], 1.15);
        g.box({ id: 'st-a' + i, parent: 'a-stats', size: [0.45, s[2] / 40, 0.45], pos: [cx + 0.55, s[2] / 80, 0.3], color: '#ff6b6b' });
        g.box({ id: 'st-d' + i, parent: 'a-stats', size: [0.45, s[3] / 40, 0.45], pos: [cx + 1.1, s[3] / 80, 0.3], color: '#4fa3ff' });
        L('st-al' + i, 'a-stats', '攻' + s[2], [cx + 0.55, s[2] / 40 + 0.3, 0.3], 0.24, '#ffb3b3');
        L('st-dl' + i, 'a-stats', '防' + s[3], [cx + 1.1, s[3] / 40 + 0.62, 0.3], 0.24, '#b3d4ff');
        L('st-sl' + i, 'a-stats', s[4], [cx, 0.3, 2.65], 0.28);
      });
      L('st-title', 'a-stats', '強さ ＝ 数字×10 ＋ マークのクセ', [0, 4.0, 0.3], 0.45, C.gold);

      // ======================= ターンの始まり =======================
      grp('a-turn', 'turn');
      g.plate({ id: 'tn-floor', parent: 'a-turn', size: [15, 10], pos: [0, 0.02, -0.4], color: '#231f33', opacity: 0.95 });
      var TSEQ = ['① 疲労が1へる', '② 毒などのダメージ', '③ キャラを1枚引く', '④ アイテムを1枚引く'];
      TSEQ.forEach(function (s, i) {
        var x = -5.1 + i * 3.4;
        g.cylinder({ id: 'tn-s' + i, parent: 'a-turn', radius: 0.55, height: 0.3, pos: [x, 0.17, -4.4], color: '#555066' });
        L('tn-sl' + i, 'a-turn', s, [x, 0.95, -4.4], 0.32);
      });
      g.box({ id: 'tn-cdeck', parent: 'a-turn', size: [1.0, 0.6, 1.4], pos: [-5.2, 0.3, -1.0], color: '#3b2f7a' });
      g.box({ id: 'tn-ideck', parent: 'a-turn', size: [1.0, 0.6, 1.4], pos: [-5.2, 0.3, 2.2], color: '#2e5d3a' });
      L('tn-cdeck-l', 'a-turn', 'キャラクター山札\n（1人1組 52枚）', [-5.2, 1.25, -0.6], 0.26);
      L('tn-ideck-l', 'a-turn', 'アイテム山札\n（2人で共有 52枚）', [-5.2, 1.25, 2.6], 0.26);
      [['♣8', '攻80\n防80', SC.C], ['♥4', '攻20\n防60', SC.H]].forEach(function (c, i) {
        card('tn-ch' + i, 'a-turn', [-0.6 + i * 1.25, 0.9, -1.0], c[0], c[1], c[2], 1.1);
      });
      card('tn-chnew', 'a-turn', [1.9, 0.9, -1.0], '♦J', '攻130\n防90', SC.D, 1.1);
      [['♥5', SC.H], ['♦3', SC.D], ['♠8', SC.S]].forEach(function (c, i) {
        card('tn-it' + i, 'a-turn', [-0.6 + i * 1.25, 0.9, 2.2], c[0], 'アイテム', c[1], 1.1, { face: '#f3fff4' });
      });
      card('tn-itnew', 'a-turn', [3.15, 0.9, 2.2], '♣4', 'アイテム', SC.C, 1.1, { face: '#f3fff4' });
      L('tn-ch-l', 'a-turn', 'ベンチ\n（キャラ手札）\n最大7枚', [5.4, 0.9, -1.0], 0.32, '#d9ccff');
      L('tn-it-l', 'a-turn', 'アイテム手札\n最大7枚', [5.4, 0.9, 2.2], 0.32, '#b9f0c0');

      // ======================= 1ターンにできること =======================
      grp('a-act', 'act');
      g.plate({ id: 'ac-floor', parent: 'a-act', size: [17, 8], pos: [0.3, 0.02, 0.4], color: '#231f33', opacity: 0.95 });
      var ACTS = [
        ['⚔️ 攻撃\n1ターン 1回', '相手のバトル場を\nクリック'],
        ['🔄 交代\n1ターン 1回', '自分のデッキを\nクリック'],
        ['🎒 アイテム\n1ターン 1枚', 'アイテム手札を\nクリック'],
        ['🃏 配置\n何回でも', 'ベンチのカードを\nクリック'],
      ];
      ACTS.forEach(function (a, i) {
        var x = -6.3 + i * 3.0;
        g.cylinder({ id: 'ac-p' + i, parent: 'a-act', radius: 1.0, height: 0.6, pos: [x, 0.3, 0], color: '#555066' });
        L('ac-pl' + i, 'a-act', a[0], [x, 1.55, 0], 0.32);
        L('ac-ph' + i, 'a-act', a[1], [x, 0.3, 2.05], 0.27, '#d8d4f0');
      });
      g.box({ id: 'ac-end', parent: 'a-act', size: [2.6, 0.5, 1.2], pos: [6.2, 0.25, 0], color: '#666666' });
      L('ac-end-l', 'a-act', 'ターン終了ボタン', [6.2, 2.85, 0], 0.3);
      [['#e53935'], ['#43a047'], ['#ffc107']].forEach(function (c, i) {
        g.sphere({ id: 'ac-lamp' + i, parent: 'a-act', radius: 0.32, pos: [5.4 + i * 0.8, 1.65, 0], color: '#333333' });
      });
      L('ac-lamp-l', 'a-act', '赤：まだ攻撃できる\n緑：攻撃した\n金：もうできる事なし', [6.2, 0.3, 2.35], 0.27);

      // ======================= ダメージ計算 =======================
      grp('a-dmg', 'dmg');
      g.plate({ id: 'dm-floor', parent: 'a-dmg', size: [16.5, 8], pos: [0.5, 0.02, 0.6], color: '#1a1a2e', opacity: 0.95 });
      card('dm-me', 'a-dmg', [-5.6, 1.5, 0], '♦10', '攻120\n防80', SC.D, 1.5);
      card('dm-op', 'a-dmg', [4.4, 1.5, 0], '♥5', '攻30\n防70', SC.H, 1.5);
      L('dm-me-l', 'a-dmg', 'あなたのバトル場', [-5.6, 3.05, 0], 0.32, '#bcdcff');
      L('dm-op-l', 'a-dmg', '相手のバトル場', [4.4, 3.05, 0], 0.32, '#ffb3b8');
      g.box({ id: 'dm-atk', parent: 'a-dmg', size: [0.8, 1, 0.8], pos: [-3.4, 1.5, 0], color: '#ff6b6b' });
      g.box({ id: 'dm-def', parent: 'a-dmg', size: [0.8, 1, 0.8], pos: [2.3, 0.875, 0], color: '#4fa3ff' });
      g.box({ id: 'dm-hp', parent: 'a-dmg', size: [0.8, 1, 0.8], pos: [6.6, 1.25, 0], color: C.good });
      L('dm-atk-l', 'a-dmg', '攻撃 120', [-3.4, 3.4, 0], 0.32, '#ffb3b3');
      L('dm-def-l', 'a-dmg', '防御 70', [2.3, 2.15, 0], 0.32, '#b3d4ff');
      L('dm-hp-l', 'a-dmg', 'HP 100', [6.6, 2.9, 0], 0.32, C.good);
      g.arrow([-3.0, 3.1, 0], [1.9, 1.9, 0], { id: 'dm-arrow', parent: 'a-dmg', color: C.gold, lift: 1.2, radius: 0.06 });
      L('dm-f', 'a-dmg', '120 − 70 ＝ 50 ダメージ！', [-0.5, 4.5, 0], 0.48, C.gold);
      L('dm-min', 'a-dmg', '防御のほうが高くても、最低 10 ダメージは入るよ', [0.5, 0.3, 3.2], 0.32);

      // ======================= 疲労と退場 =======================
      grp('a-fat', 'fat');
      g.plate({ id: 'ft-floor', parent: 'a-fat', size: [16, 8], pos: [0, 0.02, 0.5], color: '#231f33', opacity: 0.95 });
      var FT = [
        ['⚔️ 攻撃！\n疲労 2', '#c0392b'],
        ['😴 攻撃できない\n疲労 1', '#5d6d7e'],
        ['⚔️ 攻撃！\n疲労 2', '#c0392b'],
        ['🚪 退場\n（3ターンまで）', '#7f8c8d'],
      ];
      FT.forEach(function (f, i) {
        var x = -5.4 + i * 3.6;
