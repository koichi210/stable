<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>太平洋海戦 | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var S3 = Math.sqrt(3);
  var ROT = [0, Math.PI / 6, 0]; // 6角柱を「平らな頭(flat-top)」向きにする

  // ---------- 色（src/view/HexMapView.ts と同じ） ----------
  var PCOL = '#4aa3ff', CCOL = '#ff5c5c';   // あなた / CPU
  var PBASE = '#306aa6', CBASE = '#a63c3c'; // 前線基地は持ち主の色を35%暗く
  var KCOL = { ocean: '#1b4f72', resource: '#2e8b57', land: '#4a7a3c' };
  var KH = { ocean: 0.14, resource: 0.2, land: 0.42, base: 0.26, capital: 0.3 }; // 模型でのマスの高さ
  var FALLEN = '#55525e';

  // ---------- ヘクス座標（src/logic/hexGrid.ts と同じ計算） ----------
  var DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
  function nbs(a) { return DIRS.map(function (d) { return { q: a.q + d[0], r: a.r + d[1] }; }); }
  function dist(a, b) { return Math.max(Math.abs(a.q - b.q), Math.abs(a.r - b.r), Math.abs((-a.q - a.r) - (-b.q - b.r))); }
  function eq(a, b) { return a.q === b.q && a.r === b.r; }
  function key(a) { return a.q + '_' + a.r; }
  function inRadius(R) {
    var out = [];
    for (var q = -R; q <= R; q++) {
      for (var r = Math.max(-R, -q - R); r <= Math.min(R, -q + R); r++) out.push({ q: q, r: r });
    }
    return out;
  }
  function inRange(c, R) { return inRadius(R).map(function (d) { return { q: c.q + d.q, r: c.r + d.r }; }); }
  function rot120(a, times) {
    var x = a.q, z = a.r, y = -x - z;
    for (var i = 0; i < times; i++) { var t = x; x = y; y = z; z = t; }
    return { q: x, r: z };
  }

  // ---------- 地図（src/logic/mapData.ts と同じ） ----------
  var PCAP = { q: -4, r: 0 }, CCAP = { q: 4, r: 0 };
  var PBASES = nbs(PCAP), CBASES = nbs(CCAP);
  var RES = [[-2, -2], [2, -2], [-2, 2], [2, 2], [0, -4], [0, 4]].map(function (a) { return { q: a[0], r: a[1] }; });
  var PAC_LAND = [{ q: 0, r: 0 }, { q: 1, r: -1 }, { q: -1, r: 1 }];
  function has(list, p) { return list.some(function (s) { return eq(s, p); }); }
  function buildMap(id) {
    return inRadius(5).map(function (p) {
      if (eq(p, PCAP)) return { q: p.q, r: p.r, kind: 'capital', owner: 'player' };
      if (eq(p, CCAP)) return { q: p.q, r: p.r, kind: 'capital', owner: 'cpu' };
      if (has(PBASES, p)) return { q: p.q, r: p.r, kind: 'base', owner: 'player' };
      if (has(CBASES, p)) return { q: p.q, r: p.r, kind: 'base', owner: 'cpu' };
      if (has(RES, p)) return { q: p.q, r: p.r, kind: 'resource' };
      var land;
      if (id === 'asia') land = !(p.q >= -1 && p.q <= 1);
      else if (id === 'europe') land = p.r < 3;
      else land = has(PAC_LAND, p);
      return { q: p.q, r: p.r, kind: land ? 'land' : 'ocean' };
    });
  }
  // 世界編（src/logic/worldMapData.ts と同じ）
  var WF = ['asia', 'europe', 'americas'];
  var WCOL = { asia: '#c0392b', europe: '#2c3e8c', americas: '#27ae60' };
  var WBASE = { asia: '#7d251c', europe: '#1d285b', americas: '#19713f' };
  var WCAP = { asia: { q: -6, r: 0 } };
  WCAP.europe = rot120(WCAP.asia, 1); WCAP.americas = rot120(WCAP.asia, 2);
  var WRES = [];
  WF.forEach(function (f, i) { [{ q: -4, r: 2 }, { q: -2, r: 4 }].forEach(function (s) { WRES.push(i ? rot120(s, i) : s); }); });
  function buildWorld() {
    return inRadius(7).map(function (p) {
      for (var i = 0; i < 3; i++) if (eq(p, WCAP[WF[i]])) return { q: p.q, r: p.r, kind: 'capital', owner: WF[i] };
      for (var j = 0; j < 3; j++) if (has(nbs(WCAP[WF[j]]), p)) return { q: p.q, r: p.r, kind: 'base', owner: WF[j] };
      if (has(WRES, p)) return { q: p.q, r: p.r, kind: 'resource' };
      return { q: p.q, r: p.r, kind: dist(p, { q: 0, r: 0 }) <= 3 ? 'ocean' : 'land' };
    });
  }

  var PAC = buildMap('pacific');
  var AT = {};
  PAC.forEach(function (t) { AT[key(t)] = t; });

  // 太平洋編の地図（メインの模型）の座標。1マス＝半径1
  function MP(q, r, dy) {
    var t = AT[q + '_' + r];
    return [1.5 * q, (t ? KH[t.kind] : 0.14) + (dy || 0), S3 * (q / 2 + r)];
  }
  var AIR = 1.15; // 航空機は艦艇より上を飛ぶ（ゲームでも少し上にずらして描いている）

  // 選んだ潜水艦の移動範囲（GameScene.showRanges と同じ：幅優先探索、島・地図の外・艦艇がいるマスは通れない）
  var SEA_UNITS = { '-5_3': 1, '1_0': 1, '1_1': 1 };
  function reachable(start, move, blocked) {
    var seen = {}; seen[key(start)] = 0;
    var queue = [start], out = [];
    while (queue.length) {
      var cur = queue.shift(), d = seen[key(cur)];
      if (d > 0) out.push(cur);
      if (d >= move) continue;
      nbs(cur).forEach(function (n) {
        if (seen[key(n)] != null || blocked(n)) return;
        seen[key(n)] = d + 1; queue.push(n);
      });
    }
    return out;
  }
  var SUB0 = { q: -5, r: 2 }, SUB1 = { q: -2, r: 2 };
  var SUB_MOVE = reachable(SUB0, 3, function (p) { var t = AT[key(p)]; return !t || t.kind === 'land' || SEA_UNITS[key(p)]; });
  function atkTiles(c, R) { return inRange(c, R).filter(function (p) { return AT[key(p)] && !eq(p, c); }); }
  var SUB_ATK0 = atkTiles(SUB0, 1), SUB_ATK1 = atkTiles(SUB1, 1);
  var PSUB_PATH = [MP(-5, 2), MP(-4, 2), MP(-3, 2), MP(-2, 2)];
  var CSUB_PATH = [MP(1, 0), MP(2, 0), MP(2, 1), MP(2, 2)];

  // ---------- 舞台の置き場所 ----------
  var BX = -34, BZ = -26;   // 起動のしかた
  var TZ = -30;             // 戦域（3つの小さな地図）
  var SX = -34;             // ゲーム画面の模型
  var GX = 34, GZ = -26;    // マスの種類
  var UX = 34, UZ = 0;      // 海軍と空軍
  var KX = 34, KZ = 26;     // 攻撃とダメージ
  var EZ = 30;              // 資源と建造（x=0）
  var WX = -34, WZ = 28;    // 世界編
  var LX = -34, LZ = 56;    // LAN対戦
  function HP(x, y, h) { return [SX + (x - 700) / 100, h == null ? 0.12 : h, (y - 450) / 100]; } // ゲーム画面 1400×900 → 模型

  function along(g, id, pts, k) {
    var n = pts.length - 1, x = Math.max(0, Math.min(1, k)) * n;
    var i = Math.min(n - 1, Math.floor(x));
    g.lerpPos(id, pts[i], pts[i + 1], x - i);
  }
  function hpColor(ratio) { return ratio > 0.5 ? '#4caf50' : ratio > 0.25 ? '#ffc107' : '#f44336'; }

  var CFG = {
    title: '太平洋海戦 遊び方',
    back: '../index.html',
    subtitle: '六角形のマスで海軍・空軍・陸軍を動かして、相手の王都を落とすターン制ストラテジー。はじめての人向けのチュートリアル',
    camera: { pos: [0, 17, 13.5], target: [0, 0, 0.6] },

    build: function (g) {
      // ---------------------------------------------------------------- 部品
      function hexTile(parent, id, x, z, h, radius, color, o) {
        o = o || {};
        return g.cylinder({ id: id, parent: parent, radius: radius, height: h, segments: 6, rot: ROT, pos: [x, h / 2, z], color: color, emissive: o.emissive, emissiveIntensity: o.ei });
      }
      function overlay(parent, list, color, op, s, ox, oz, hFn) {
        list.forEach(function (p) {
          var x = (ox || 0) + 1.5 * p.q * (s || 1), z = (oz || 0) + S3 * (s || 1) * (p.q / 2 + p.r);
          var h = hFn ? hFn(p) : MP(p.q, p.r)[1];
          g.cylinder({ parent: parent, radius: 0.86 * (s || 1), height: 0.04, segments: 6, rot: ROT, pos: [x, h + 0.03, z], color: color, opacity: op, emissive: color, emissiveIntensity: 0.6 });
        });
      }
      // ユニットの模型。owner の色で塗る（ゲームでも持ち主の色の丸いコマ）
      function unit(id, type, color, pos, o) {
        o = o || {};
        g.group(id, { pos: pos, parent: o.parent });
        var grp = g.get(id);
        function b(size, p, col) { g.box({ parent: id, size: size, pos: p, color: col || color, edges: false }); }
        function c(o2) { o2.parent = id; o2.color = o2.color || color; g.cylinder(o2); }
        if (type === 'battleship') {
          b([0.95, 0.22, 0.36], [0, 0.11, 0]);
          b([0.3, 0.24, 0.22], [-0.05, 0.34, 0], '#e8e8e8');
          b([0.3, 0.07, 0.07], [0.3, 0.27, 0], '#e8e8e8');
        } else if (type === 'carrier') {
          b([1.05, 0.16, 0.48], [0, 0.08, 0]);
          b([0.95, 0.02, 0.07], [0, 0.17, 0.02], '#f4f4f4');
          b([0.16, 0.24, 0.12], [0.22, 0.28, -0.18], '#e8e8e8');
        } else if (type === 'submarine') {
          c({ radius: 0.13, height: 0.85, rot: [0, 0, Math.PI / 2], pos: [0, 0.12, 0] });
          b([0.18, 0.2, 0.09], [0.05, 0.3, 0], '#e8e8e8');
        } else if (type === 'reconnaissance') {
          b([0.62, 0.1, 0.13], [0, 0, 0]);
          b([0.17, 0.04, 0.8], [0.04, 0.02, 0], '#e8e8e8');
          b([0.1, 0.16, 0.28], [-0.27, 0.07, 0]);
        } else if (type === 'bomber') {
          b([0.85, 0.15, 0.2], [0, 0, 0]);
          b([0.26, 0.05, 1.15], [0.04, 0.02, 0], '#e8e8e8');
          b([0.12, 0.2, 0.38], [-0.36, 0.09, 0]);
          b([0.1, 0.08, 0.1], [0.07, -0.05, 0.32], '#e8e8e8');
          b([0.1, 0.08, 0.1], [0.07, -0.05, -0.32], '#e8e8e8');
        } else if (type === 'infantry') {
          [-0.17, 0.17].forEach(function (dx, i) {
            c({ radius: 0.11, height: 0.32, pos: [dx, 0.16, i ? 0.08 : -0.08] });
            g.sphere({ parent: id, radius: 0.1, pos: [dx, 0.42, i ? 0.08 : -0.08], color: '#f2d3b0' });
          });
        } else if (type === 'tank') {
          b([0.64, 0.2, 0.44], [0, 0.1, 0]);
          c({ radius: 0.16, height: 0.14, pos: [0, 0.27, 0] });
          b([0.42, 0.06, 0.06], [0.3, 0.28, 0], '#333333');
        }
        if (o.scale) grp.scale.setScalar(o.scale);
        return grp;
      }
      // HPバー（ゲームではユニットの下の細いバー）
      function hpBar(id, pos, w, ratio, parent) {
        g.group(id, { pos: pos, parent: parent });
        g.box({ parent: id, size: [w + 0.06, 0.1, 0.16], pos: [0, 0, 0], color: '#222222', edges: false });
        g.box({ id: id + '-fg', parent: id, size: [w, 0.12, 0.12], pos: [-(w / 2) * (1 - ratio), 0.01, 0], color: hpColor(ratio), edges: false });
        g.get(id + '-fg').scale.x = ratio;
      }
      function setHp(id, w, ratio) {
        var fg = g.get(id + '-fg');
        fg.scale.x = Math.max(ratio, 0.001);
        fg.position.x = -(w / 2) * (1 - ratio);
        g.setColor(fg, hpColor(ratio));
      }
      g.setHp = setHp;
      // 建物（基地・王都）
      function building(id, parent, x, y, z, kind, roofCol) {
        if (kind === 'capital') {
          g.box({ id: id, parent: parent, size: [0.74, 0.46, 0.74], pos: [x, y + 0.23, z], color: '#efe2b8', edges: false });
          g.cylinder({ parent: id, radiusTop: 0, radius: 0.56, height: 0.42, segments: 4, rot: [0, Math.PI / 4, 0], pos: [0, 0.44, 0], color: roofCol });
          g.box({ parent: id, size: [0.03, 0.42, 0.03], pos: [0, 0.82, 0], color: '#dddddd', edges: false });
          g.box({ parent: id, size: [0.24, 0.14, 0.02], pos: [0.13, 0.95, 0], color: roofCol, edges: false });
        } else {
          g.box({ id: id, parent: parent, size: [0.46, 0.3, 0.46], pos: [x, y + 0.15, z], color: '#d6ccaa', edges: false });
          g.cylinder({ parent: id, radiusTop: 0, radius: 0.36, height: 0.24, segments: 4, rot: [0, Math.PI / 4, 0], pos: [0, 0.27, 0], color: roofCol });
        }
      }
      // 小さな地図（戦域・画面の模型・世界編で使い回す）
      function miniMap(parent, tiles, ox, oy, oz, s, colorOf, hScale) {
        tiles.forEach(function (t) {
          var x = ox + 1.5 * t.q * s, z = oz + S3 * s * (t.q / 2 + t.r);
          var h = KH[t.kind] * (hScale || 1);
          g.cylinder({ parent: parent, radius: 0.93 * s, height: h, segments: 6, rot: ROT, pos: [x, oy + h / 2, z], color: colorOf(t) });
          if (t.kind === 'resource') g.cylinder({ parent: parent, radius: 0.32 * s, height: 0.03, pos: [x, oy + h + 0.015, z], color: '#ffd166', emissive: '#ffb000', emissiveIntensity: 0.35 });
        });
      }
      function pacColor(t) {
        if (t.kind === 'capital') return t.owner === 'player' ? PCOL : CCOL;
        if (t.kind === 'base') return t.owner === 'player' ? PBASE : CBASE;
        return KCOL[t.kind];
      }

      // ======================= メインの地図（太平洋編） =======================
      g.group('map', {});
      PAC.forEach(function (t) {
        var x = 1.5 * t.q, z = S3 * (t.q / 2 + t.r), h = KH[t.kind], k = key(t);
        if (t.kind === 'resource' || t.kind === 'land') {
          // 領土の枠線（ゲームでも持ち主の色の太い枠になる）
          hexTile('map', 'bd' + k, x, z, h * 0.85, 0.99, '#0a2540');
          hexTile('map', 't' + k, x, z, h, 0.8, KCOL[t.kind]);
        } else {
          hexTile('map', 't' + k, x, z, h, 0.95, pacColor(t));
        }
        if (t.kind === 'resource') g.cylinder({ id: 'coin' + k, parent: 'map', radius: 0.32, height: 0.05, pos: [x, h + 0.025, z], color: '#ffd166', emissive: '#ffb000', emissiveIntensity: 0.35 });
        if (t.kind === 'land') g.cylinder({ parent: 'map', radiusTop: 0, radius: 0.15, height: 0.38, pos: [x + 0.42, h + 0.19, z - 0.3], color: '#2f5e2a' });
        if (t.kind === 'base' || t.kind === 'capital') building('bld' + k, 'map', x, h, z, t.kind, t.owner === 'player' ? PCOL : CCOL);
      });
      g.label('あなたの王都', MP(-4, 0, 1.75), { id: 'nm-pcap', size: 0.45, color: PCOL, bg: '#000000bb' });
      g.label('CPUの王都', MP(4, 0, 1.75), { id: 'nm-ccap', size: 0.45, color: CCOL, bg: '#000000bb' });
      g.label('資源マス', MP(0, -4, 0.75), { id: 'nm-res', size: 0.38, color: '#ffd166', bg: '#000000aa' });
      g.label('島', MP(0, 0, 1.0), { id: 'nm-land', size: 0.38, color: '#d8e8c8', bg: '#000000aa' });

      // 最初のユニット（太平洋編：王都から3マス以内の空いている海に、潜水艦＋戦艦）
      unit('u-psub', 'submarine', PCOL, MP(-5, 2));
      unit('u-pbb', 'battleship', PCOL, MP(-5, 3));
      unit('u-csub', 'submarine', CCOL, MP(1, 0));
      unit('u-cbb', 'battleship', CCOL, MP(1, 1));
      var T3 = g.THREE;
      var ring = new T3.Mesh(new T3.TorusGeometry(0.66, 0.07, 8, 40), new T3.MeshStandardMaterial({ color: '#ffff00', emissive: '#ffff00', emissiveIntensity: 0.7 }));
      ring.rotation.x = Math.PI / 2;
      ring.position.set(MP(-5, 2)[0], MP(-5, 2)[1] + 0.05, MP(-5, 2)[2]);
      g.add('sel-ring', ring);

      // STEP6：移動範囲（白）・攻撃範囲（赤）
      g.group('mv', {}); overlay('mv', SUB_MOVE, '#ffffff', 0.35);
      g.group('atk0', {}); overlay('atk0', SUB_ATK0, '#ff3b30', 0.5);
      g.group('atk1', {}); overlay('atk1', SUB_ATK1, '#ff3b30', 0.5);
      g.label('動けるマス（白）', MP(-3, 0, 1.0), { id: 'mv-lbl', size: 0.4, bg: '#000000bb' });
      g.label('攻撃が届くマス（赤）', MP(-5, 4, 1.2), { id: 'atk-lbl', size: 0.4, color: '#ff8a80', bg: '#000000bb' });
      g.label('①左クリックで選ぶ', MP(-5, 1, 1.5), { id: 's6-1', size: 0.4, color: '#ffff66', bg: '#000000bb' });
      g.label('②白いマスをクリックで移動', MP(-2, 0, 1.4), { id: 's6-2', size: 0.4, color: C.gold, bg: '#000000bb' });

      // STEP9：陸軍の配備（緑＝配備できる陸地）
      g.group('dep', {}); overlay('dep', PAC_LAND, '#44dd66', 0.55);
      unit('u-pinf', 'infantry', PCOL, MP(-1, 1));
      g.label('配備できる陸地（緑）\n王都から5マス以内', MP(1, -2, 1.5), { id: 'dep-lbl', size: 0.36, color: '#7dff9a', bg: '#000000bb' });
      g.label('歩兵を配備！\nこの島が自分の領土に（＋8）', MP(-2, 3, 1.2), { id: 'inf-lbl', size: 0.36, color: PCOL, bg: '#000000bb' });

      // STEP11：領土
      g.label('資源マスを取った！ ＋5', MP(-2, 2, 1.6), { id: 'cap-p', size: 0.4, color: PCOL, bg: '#000000bb' });
      g.label('CPUも取った ＋5', MP(2, 2, 1.6), { id: 'cap-c', size: 0.4, color: CCOL, bg: '#000000bb' });

      // STEP12：前線基地と王都
      unit('u-pcar', 'carrier', PCOL, MP(2, 1));
      unit('u-pbomb', 'bomber', PCOL, MP(2, 0, AIR));
      g.group('hp12', {});
      [3, 4].forEach(function (i) { var b = CBASES[i]; g.label('HP30', MP(b.q, b.r, 0.95), { id: 'hpb' + i, parent: 'hp12', size: 0.34, bg: '#000000cc' }); });
      g.label('HP60', MP(4, 0, 1.55), { id: 'hpcap', parent: 'hp12', size: 0.34, color: '#ffe066', bg: '#000000cc' });
      g.label('🔒', MP(4, 0, 2.15), { id: 'lock', size: 0.5, bg: '#000000aa' });
      g.label('となり合う2つの基地を\nHP0にすると…', MP(1, 3, 1.4), { id: 'b-lbl1', size: 0.36, bg: '#000000bb' });
      g.label('王都を攻撃できる！\n（届くのは2マス先まで撃てる空母）', MP(3, -3, 1.4), { id: 'b-lbl2', size: 0.36, color: C.gold, bg: '#000000bb' });
      g.label('勝利！', MP(4, 0, 2.9), { id: 'b-win', size: 0.7, color: C.good, bg: '#000000bb' });
      g.arrow(MP(2, 0, AIR - 0.1), MP(3, 0, 0.35), { id: 'a-b1', color: C.gold, lift: 0.4, radius: 0.05 });
      g.arrow(MP(2, 1, 0.3), MP(3, 1, 0.35), { id: 'a-b2', color: C.gold, lift: 0.7, radius: 0.05 });
      g.arrow(MP(2, 1, 0.3), MP(4, 0, 0.5), { id: 'a-cap', color: '#ff7043', lift: 1.4, radius: 0.07 });

      // ======================= 起動のしかた =======================
      g.group('boot', {});
      g.plate({ id: 'boot-floor', parent: 'boot', size: [15, 8], pos: [BX, 0.02, BZ], color: '#1b2c4a', opacity: 0.95 });
      g.box({ id: 'bat1', parent: 'boot', size: [1.3, 1.6, 0.12], pos: [BX - 5, 0.85, BZ - 1.6], color: '#f2f2f2', label: 'あそぶ.bat\n（ひとりで・CPU対戦）', labelSize: 0.34, labelBg: '#000000cc', labelOffset: [0, 1.4, 0] });

          // CBASES の並び：(5,0) (5,-1) (4,-1) (3,0) (3,1) (4,1) → 3番と4番がとなり合う2つ
          [3, 4].forEach(function (i) {
            var b = CBASES[i];
            g.setLabel('hpb' + i, 'HP' + hpA, { size: 0.34, color: hpA === 0 ? '#ff8a80' : '#ffffff', bg: '#000000cc' });
            if (hpA === 0) { g.setColor('t' + key(b), FALLEN); g.setColor('bld' + key(b), FALLEN); }
          });
          g.get('a-b1').visible = tt > 0.2 && tt < 1.8;
          g.get('a-b2').visible = tt > 0.2 && tt < 1.8;
          g.get('b-lbl1').visible = tt < 1.9;
          g.get('lock').visible = tt < 1.9;
          g.get('b-lbl2').visible = tt > 1.9;
          g.get('a-cap').visible = tt > 2.1 && tt < 4.6;
          var kc = g.linear(tt, 2.3, 2.2);
          var hpC = Math.ceil(60 * (1 - kc));
          g.setLabel('hpcap', 'HP' + hpC, { size: 0.34, color: hpC === 0 ? '#ff8a80' : '#ffe066', bg: '#000000cc' });
          g.get('b-win').visible = tt > 4.6;
          if (tt > 4.6) g.pulse('b-win', t, 0.1);
          if (tt > 2.1 && tt < 4.6) g.pulse('bld4_0', t * 2, 0.06);
        },
      },
      {

          '<li>最後に残った1勢力の勝ち！</li></ul>' +
          '<div class="gg-note">世界編とヨーロッパ編では、王都のまわりが陸地で囲まれていて、作った艦艇が海まで出られないよ。空軍と陸軍で戦おう。空母が使えないので王都を落とすのはむずかしいけど、相手のユニットを全滅させても脱落させられるよ。</div>',
        camera: { pos: [WX, 17, WZ + 13.5], target: [WX, 0, WZ + 0.8] },
        focus: ['world'],
        update: function (g, t) {
          var k = Math.floor(t / 1.5) % 3;
          ['w-a1', 'w-a2', 'w-a3'].forEach(function (id, i) { g.get(id).visible = i === k; });
        },
      },
      {
        title: 'LAN対戦（2人で遊ぶ）',
        html:
          '<p>同じ Wi-Fi につながっていれば、2人で対戦できるよ。</p>' +
          '<ol><li><b>ホスト役のPC（1台だけ）</b> で <b>みんなで遊ぶ（LAN対戦）.bat</b> をダブルクリック</li>' +
          '<li>黒い画面に出るアドレス（<code>http://PCの名前/</code> や <code>http://192.168.x.x/</code>）を、相手のPCのブラウザで開く</li>' +
          '<li>2人とも、タイトルの <b>🌐 みんなで遊ぶ（LAN対戦）</b> を押す</li>' +
          '<li>片方が <b>ルームを作る</b> → 戦域（と国）を選ぶ。4けたのルーム番号が出る</li>' +

        camera: { pos: [LX, 9.5, LZ + 11.5], target: [LX, 0.8, LZ] },
