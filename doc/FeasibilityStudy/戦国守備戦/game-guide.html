  function MZ(y) { return (y - 450) / 32; }

  // ---------- 合戦ボード（BattleScene の 7×7） ----------
  var BX = 22, BZ = 0, CELL = 1.1;
  function cell(x, y, h) { return [BX + (x - 3) * CELL, h == null ? 0.05 : h, BZ + (y - 3) * CELL]; }
  // 地形の一例（generateTerrain() の決まり：上下2行は平地、中央列は街道、両端中央は城）
  var TERRAIN = {};
  function terr(x, y) { return TERRAIN[x + ',' + y] || 'plain'; }
  (function () {
    for (var y = 2; y <= 4; y++) TERRAIN['3,' + y] = 'road';
    TERRAIN['3,0'] = 'castle'; TERRAIN['3,6'] = 'castle';
    TERRAIN['1,2'] = 'mountain'; TERRAIN['5,2'] = 'forest'; TERRAIN['0,3'] = 'forest';
    TERRAIN['2,3'] = 'river'; TERRAIN['6,3'] = 'mountain'; TERRAIN['4,4'] = 'river'; TERRAIN['5,4'] = 'forest';
  })();
  var TERR_COL = { mountain: '#6b5844', forest: '#2d5a3d', river: '#2a5d8f', castle: '#8a8a8a', road: '#c2a878' };
  var TERR_CH = { mountain: '山', forest: '森', river: '川', castle: '城', road: '道' };
  var TYPE_CH = { general: '将', cavalry: '騎', spear: '槍', bow: '弓', ninja: '忍', cannon: '砲' };
  // [id, 陣営(a=攻め/赤 d=守り/青), 兵種, x, y]
  var PIECES = [
    ['a-gen', 'a', 'general', 3, 5], ['a-cav0', 'a', 'cavalry', 0, 5], ['a-cav1', 'a', 'cavalry', 5, 5],
    ['a-spr0', 'a', 'spear', 1, 5], ['a-spr1', 'a', 'spear', 3, 4], ['a-bow0', 'a', 'bow', 2, 5],
    ['a-bow1', 'a', 'bow', 6, 4], ['a-nin0', 'a', 'ninja', 4, 5], ['a-nin1', 'a', 'ninja', 0, 4],

    ['d-gen', 'd', 'general', 3, 1], ['d-cav0', 'd', 'cavalry', 1, 1], ['d-cav1', 'd', 'cavalry', 6, 2],

    ['d-can0', 'd', 'cannon', 6, 1], ['d-can1', 'd', 'cannon', 2, 2],
  ];
  var PC = {}; PIECES.forEach(function (p) { PC[p[0]] = p; });
  function pieceAt(x, y) { for (var i = 0; i < PIECES.length; i++) if (PIECES[i][3] === x && PIECES[i][4] === y) return PIECES[i]; return null; }

  // getValidMoves() の移植（将棋の駒の動き）
  function getMoves(pc) {
    var own = pc[1], type = pc[2], ux = pc[3], uy = pc[4];
    var fwd = own === 'a' ? -1 : 1, res = [];
    function inB(x, y) { return x >= 0 && x < 7 && y >= 0 && y < 7; }
    function river(x, y) { return terr(x, y) === 'river'; }
    function ownAt(x, y) { var q = pieceAt(x, y); return q && q[1] === own; }
    function add(x, y) { if (inB(x, y) && !ownAt(x, y) && (type === 'ninja' || !river(x, y))) res.push([x, y, !!pieceAt(x, y)]); }
    function slide(dx, dy) {
      var x = ux + dx, y = uy + dy, n = 0;
      while (inB(x, y) && n < 6) {
        if (river(x, y)) break;
        var q = pieceAt(x, y);
        if (q) { if (q[1] !== own) res.push([x, y, true]); break; }
        res.push([x, y, false]); x += dx; y += dy; n++;
      }
    }
    if (type === 'general') { for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) if (dx || dy) add(ux + dx, uy + dy); }
    if (type === 'cavalry') { slide(1, 0); slide(-1, 0); slide(0, 1); slide(0, -1); }
    if (type === 'spear') slide(0, fwd);
    if (type === 'bow') { slide(1, 1); slide(1, -1); slide(-1, 1); slide(-1, -1); }
    if (type === 'ninja') { add(ux + 1, uy + fwd * 2); add(ux - 1, uy + fwd * 2); }
    if (type === 'cannon') { add(ux, uy + fwd); add(ux, uy - fwd); add(ux + 1, uy); add(ux - 1, uy); add(ux + 1, uy + fwd); add(ux - 1, uy + fwd); }
    return res;
  }

      });
      g.label('赤：プレイヤー1（あなた）21県\n青緑：プレイヤー2（CPU）24県\n橙：秦　黄：漢（2国は同盟）', [-10.5, 0.6, 3.5], { id: 'legend', size: 0.6, bg: '#000000aa' });

      // STEP2: 地図の作り方
      g.label('prefectures.json の x, y\n→ そのまま地図の位置', [-7.2, 0.6, 1.5], { id: 'lbl-xy', size: 0.45, color: C.data, bg: '#000000aa' });
      g.label('{ "id": 13, "name": "東京都",\n  "x": 750, "y": 360,\n  "owner": "player1",\n  "troops": 8500,\n  "neighbors": [8, 11, 12, 14] }', [-3.2, 2.6, -6.2], { id: 'lbl-json', size: 0.5, color: '#e8e4ff', bg: '#1d1a2ccc' });
      g.arrow([1.2, 1.6, -5.2], [P[13].x - 0.1, P[13].h + 0.2, P[13].z], { id: 'json-arrow', color: C.data, lift: 0.6 });

      // STEP3: ターン（人口 +1000）

      });
      g.group('m-arrows', {});
      [17, 18, 24].forEach(function (id) {
        g.arrow(top(id), top(25, 0.25), { id: 'ma' + id, parent: 'm-arrows', color: C.gold, lift: 1.1, radius: 0.05 });
      });
      g.label('Shift+左クリックで出撃元（緑）\n右クリックで敵の県へ出撃', [4.6, 2.6, 1.6], { id: 'm-lbl', size: 0.34, bg: '#000000aa' });
      g.label('合戦へ！', top(25, 2.3), { id: 'm-go', size: 0.5, color: C.gold, bg: '#000000aa' });

      // ======================= 合戦ボード =======================
      for (var y = 0; y < 7; y++) for (var x = 0; x < 7; x++) {
        var t = terr(x, y);
        var col = t === 'plain' ? ((x + y) % 2 ? '#4b4d58' : '#3c3e48') : TERR_COL[t];
        g.plate({ id: 'cell-' + x + '-' + y, size: [CELL - 0.06, CELL - 0.06], pos: cell(x, y, 0.03), color: col, opacity: 1, radius: 0.06 });
        if (t !== 'plain') g.label(TERR_CH[t], [cell(x, y)[0] - 0.36, 0.25, cell(x, y)[2] + 0.36], { id: 'tch-' + x + '-' + y, size: 0.24, color: '#ffffffcc' });
      }
      g.label('守り側（青）', [BX, 0.4, BZ - 4.5], { id: 'b-top', size: 0.36, color: OWNER_COL[2] });
      g.label('攻め側（赤）＝出撃したあなた', [BX, 0.4, BZ + 4.5], { id: 'b-bot', size: 0.36, color: OWNER_COL[1] });
      PIECES.forEach(function (p) {
        var gen = p[2] === 'general';
        g.cylinder({
          id: p[0], radius: gen ? 0.44 : 0.36, height: gen ? 0.4 : 0.28, pos: cell(p[3], p[4], gen ? 0.25 : 0.19),
