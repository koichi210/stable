<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>覇権戦国 | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var P1C = '#ff6b6b', P2C = '#4ecdc4';           // ゲーム画面の駒の色（index.html の .piece.p1 / .p2）
  var GREEN = '#5ee6a8', ORANGE = '#ff9f43', GOLD = '#ffd166';
  // 兵種の色（相性の図と駒の柱でそろえる）
  var TC = { spear: '#e67e22', bow: '#27ae60', cavalry: '#8e44ad', infantry: '#95a5a6' };

  // ---------- 初期配置（src/game/data/pieces.ts の INITIAL_LAYOUT を写したもの） ----------
  // 記号: K=王将 R=飛車 B=角 s=槍兵 b=弓兵 c=騎兵 i=歩兵
  var CH = { K: '王', R: '飛', B: '角', s: '槍', b: '弓', c: '馬', i: '歩' };
  var LAYOUT = [
    [1, 0, 'Ksbcicbss'], [1, 1, 'sbciRicbs'],
    [2, 6, 'iiiiBiiii'], [2, 7, 'sbciRicbK'],
  ];

  // 盤のマス (x, y) → 3D。y=0 が画面の上（プレイヤー1側）
  function B(x, y, h) { return [x - 4, h == null ? 0.06 : h, y - 4]; }

  // ---------- 舞台の置き場所（ステップのカメラでも使うので先に決めておく） ----------
  var SAX = -60;   // ゲームの始め方
  var SCX = -30;   // 画面の見方
  var LUX = 30;    // 駒の種類
  var MVX = 60;    // 動ける範囲
  var CDX = 90;    // アイテムカード
  var RZ = 32;     // 奥の列
  var LNX = -60;   // LAN対戦（奥の列）
  var ATX = -30;   // 攻めるとどうなる？（奥の列）
  var FRX = 0;     // 正面戦闘のダメージ（奥の列）
  var AFX = 30;    // 相性（奥の列）
  var ABX = 60;    // 能力（奥の列）

  var LB = '#000000aa';

  // 正面戦闘の例（rules.ts の resolveBattle で計算した値）
  var EX = [
    ['① 相手より少ない', '歩', 1000, 750, '槍', 1200, '歩は 250 減る\n1000 → 750'],
    ['② 相手と同じ', '歩', 1000, 750, '歩', 1000, '相打ち：250 減る\n1000 → 750'],
    ['③ 相手より多い', '飛', 2500, 1000, '歩', 1000, '飛は差の 1500 減る\n2500 → 1000'],
  ];

  // 駒＝円盤＋1文字のラベル。group にしてまとめて動かせるようにする
  function piece(g, id, pos, color, ch, o) {
    o = o || {};
    g.group(id, { pos: pos, parent: o.parent });
    g.cylinder({ parent: id, radius: o.r || 0.38, height: 0.2, pos: [0, 0.1, 0], color: color,
      emissive: o.king ? GOLD : '#000000', emissiveIntensity: o.king ? 0.35 : 1 });
    if (ch) g.label(ch, [0, o.ly || 0.48, 0], { id: o.labelId, parent: id, size: o.size || 0.3, bg: LB });
  }

  // n×n の小さい盤。cell(i, j) で 3D 座標を返す
  function miniBoard(g, parent, cx, cz, n, colorFn) {
    var half = (n - 1) / 2;
    for (var j = 0; j < n; j++) for (var i = 0; i < n; i++) {
      g.plate({ parent: parent, size: [0.94, 0.94], pos: [cx + i - half, 0.03, cz + j - half], color: colorFn ? colorFn(i, j) : '#2d2944', opacity: 0.95, radius: 0.05 });
    }
    return function (i, j, h) { return [cx + i - half, h == null ? 0.06 : h, cz + j - half]; };
  }
  // 順番に光らせるとき、光っていないものは元の大きさにもどす
  function pulseOne(g, ids, k, t, amp) {
    ids.forEach(function (id, i) {
      var o = g.get(id);
      if (i === k) g.pulse(o, t, amp);
      else if (o.userData.pulseBase) o.scale.copy(o.userData.pulseBase);
    });
  }
  function mark(g, parent, pos, color, op) {
    g.plate({ parent: parent, size: [0.8, 0.8], pos: [pos[0], 0.08, pos[2]], color: color, opacity: op == null ? 0.75 : op, radius: 0.08 });
  }

  var CFG = {
    title: '覇権戦国 遊び方',
    back: '../index.html',
    subtitle: '兵数を持った駒で戦う、将棋みたいな戦国バトル（開発中の「将棋版」）。はじめての人向けのチュートリアル',
    camera: { pos: [0, 12, 10.5], target: [0, 0, 0.2] },

    build: function (g) {
      // ======================= 本盤 9×9 =======================
      g.group('board', {});
      g.box({ parent: 'board', size: [9.5, 0.08, 9.5], pos: [0, -0.02, 0], color: '#2a2a2a', edges: false });
      for (var y = 0; y < 9; y++) for (var x = 0; x < 9; x++) {
        // index.html と同じく、上半分（y<4.5）は赤っぽい陣地、下半分は緑っぽい陣地
        g.plate({ parent: 'board', size: [0.94, 0.94], pos: B(x, y, 0.03), color: y < 4.5 ? '#4a2a32' : '#24423f', opacity: 0.95, radius: 0.06 });
      }
      g.group('pcs', {});
      LAYOUT.forEach(function (r) {
        [].forEach.call(r[2], function (sym, x) {
          piece(g, 'pc-' + x + '-' + r[1], B(x, r[1]), r[0] === 1 ? P1C : P2C, CH[sym], { parent: 'pcs', king: sym === 'K' });
        });
      });
      g.label('プレイヤー1（赤）\nCPU対戦では あなた', [0, 0.4, -5.6], { id: 'lbl-p1', size: 0.34, color: P1C, bg: LB });
      g.label('プレイヤー2（青緑）\nCPU対戦では CPU', [0, 0.4, 5.6], { id: 'lbl-p2', size: 0.34, color: P2C, bg: LB });
      g.label('王将「北海道」', [-3.2, 1.35, -4.2], { id: 'lbl-k1', size: 0.32, color: P1C, bg: '#000000cc' });
      g.label('王将「沖縄県」', [3.3, 0.35, 4.0], { id: 'lbl-k2', size: 0.32, color: P2C, bg: '#000000cc' });
      g.label('相手の王将を取ったら勝ち！', [0, 0.5, -0.5], { id: 'win-lbl', size: 0.5, color: GOLD, bg: '#000000cc' });

      // STEP5：最初の並び
      g.label('プレイヤー1には「角」がいない', [1.8, 1.3, -1.6], { id: 'noB-lbl', size: 0.3, color: GOLD, bg: '#000000cc' });
      g.label('角（プレイヤー2だけ）', [0, 1.0, 1.0], { id: 'lbl-b2', size: 0.3, color: P2C, bg: '#000000cc' });
      g.label('いちばん下の段は空き', [0, 0.35, 4.0], { id: 'lbl-empty', size: 0.28, color: '#cccccc', bg: LB });

      // STEP6：動かし方（プレイヤー1の歩 (3,1) → (3,2)）
      g.plate({ id: 'sel', size: [0.92, 0.92], pos: B(3, 1, 0.08), color: '#ffee55', opacity: 0.7, radius: 0.08 });
      g.group('mvh', {});
      [[2, 2], [3, 2], [4, 2]].forEach(function (c) { mark(g, 'mvh', B(c[0], c[1]), GREEN); });
      g.label('① 自分の駒をクリック', [-2.9, 0.4, -0.9], { id: 'op-l1', size: 0.3, bg: '#000000cc' });
      g.label('② 緑のマスが動ける場所', [2.6, 0.4, -0.9], { id: 'op-l2', size: 0.3, color: GREEN, bg: '#000000cc' });
      g.label('③ 動かしたら自動で相手の番', [0, 1.6, 0.4], { id: 'turn-lbl', size: 0.34, color: GOLD, bg: '#000000cc' });

      // STEP11：成り
      g.plate({ id: 'zone1', size: [9, 3], pos: [0, 0.075, 3], color: P1C, opacity: 0.3, radius: 0.1 });
      g.plate({ id: 'zone2', size: [9, 3], pos: [0, 0.075, -3], color: P2C, opacity: 0.3, radius: 0.1 });
      g.label('プレイヤー1（赤）が成れる3段', [0, 0.35, 5.0], { id: 'zl1', size: 0.32, color: P1C, bg: LB });
      g.label('プレイヤー2（青緑）が成れる3段', [0, 0.35, -5.0], { id: 'zl2', size: 0.32, color: P2C, bg: LB });
      g.group('promo', { pos: B(5, 5) });
      g.cylinder({ id: 'promo-ring', parent: 'promo', radius: 0.46, height: 0.08, pos: [0, 0.04, 0], color: GOLD, emissive: GOLD, emissiveIntensity: 0.5 });
      g.cylinder({ parent: 'promo', radius: 0.38, height: 0.2, pos: [0, 0.14, 0], color: P1C });
      g.label('弓\n1000', [0, 0.62, 0], { id: 'promo-l1', parent: 'promo', size: 0.28, bg: LB });
      g.label('弓\n2000', [0, 0.62, 0], { id: 'promo-l2', parent: 'promo', size: 0.28, color: GOLD, bg: LB });
      g.label('「弓兵 を成りますか？\n（兵数が2倍になります）」\n→ OK を押す', [-2.4, 2.3, 2.2], { id: 'promo-dlg', size: 0.3, bg: '#000000dd' });
      g.label('成った！ 兵数 ×2', [1.6, 1.9, 1.6], { id: 'promo-ok', size: 0.36, color: GOLD, bg: '#000000cc' });

      // ======================= ゲームの始め方 =======================
      g.group('st', {});
      var PX = [SAX - 5.8, SAX, SAX + 5.8];
      ['① 最初の画面', '② 難易度を選ぶ', '③ 配置方法を選ぶ'].forEach(function (t, i) {
        g.plate({ parent: 'st', size: [4.6, 4.4], pos: [PX[i], 0.02, 0.2], color: '#33333d', opacity: 1, radius: 0.12 });
        g.label(t, [PX[i], 0.4, -2.5], { parent: 'st', size: 0.36, bg: LB });
      });
      function btn(id, x, z, w, text, col) {
        g.box({ id: id, parent: 'st', size: [w, 0.16, 0.66], pos: [x, 0.1, z], color: col || P2C, edges: false,
          label: text, labelSize: 0.3, labelBg: '#000000bb', labelOffset: [0, 0.32, 0] });
      }
      btn('st-cpu', PX[0], -1.1, 2.6, 'CPU対戦', GOLD);
      btn('st-host', PX[0], 0.2, 2.6, 'ホストになる');
      btn('st-guest', PX[0], 1.5, 2.6, 'ゲストで参加');
      btn('st-d0', PX[1] - 1.1, -0.9, 1.7, '初級');
      btn('st-d1', PX[1] + 1.1, -0.9, 1.7, '中級');
      btn('st-d2', PX[1] - 1.1, 0.7, 1.7, '上級');
      btn('st-d3', PX[1] + 1.1, 0.7, 1.7, '鬼級');
      btn('st-auto', PX[2], -1.0, 2.6, '自動配置', GOLD);
      btn('st-man', PX[2], 0.3, 2.6, '手動配置', '#666666');
      g.label('手動はまだ作りかけ\n（どちらも自動配置）', [PX[2], 0.3, 1.5], { parent: 'st', size: 0.24, color: '#ffcf80', bg: LB });
      g.label('CPUの強さ', [PX[1], 0.3, 1.8], { parent: 'st', size: 0.26, color: '#cccccc', bg: LB });
      g.arrow([PX[0] + 2.2, 0.3, 0.2], [PX[1] - 2.2, 0.3, 0.2], { parent: 'st', color: GOLD, lift: 0.6, radius: 0.06 });
      g.arrow([PX[1] + 2.2, 0.3, 0.2], [PX[2] - 2.2, 0.3, 0.2], { parent: 'st', color: GOLD, lift: 0.6, radius: 0.06 });
      g.label('index.html をダブルクリック → ブラウザで開く', [SAX, 0.4, -3.6], { parent: 'st', size: 0.38, color: GOLD, bg: LB });
      g.label('対戦スタート！', [PX[2], 0.4, 3.0], { id: 'st-go', parent: 'st', size: 0.34, color: GREEN, bg: LB });

      // ======================= 画面の見方（ゲーム画面の模型） =======================
      g.group('scr', {});
      g.plate({ parent: 'scr', size: [14, 9.8], pos: [SCX, 0.02, 0.2], color: '#2b2b2b', opacity: 1, radius: 0.1 });
      g.label('覇権戦国 - 将棋版', [SCX, 0.3, -4.1], { parent: 'scr', size: 0.36, color: '#ffffff' });
      g.box({ id: 'scr-i1', parent: 'scr', size: [4.4, 0.1, 1.2], pos: [SCX - 3.2, 0.08, -2.9], color: '#4a2a2a', edges: false, label: 'プレイヤー1の情報', labelSize: 0.28, labelColor: P1C, labelBg: '#000000cc', labelOffset: [0, 0.35, 0] });
      g.box({ id: 'scr-i2', parent: 'scr', size: [4.4, 0.1, 1.2], pos: [SCX + 3.2, 0.08, -2.9], color: '#1f3a38', edges: false, label: 'プレイヤー2の情報', labelSize: 0.28, labelColor: P2C, labelBg: '#000000cc', labelOffset: [0, 0.35, 0] });
      g.group('scr-board', {});
      for (var sy = 0; sy < 9; sy++) for (var sx = 0; sx < 9; sx++) {
        var pc = (sy <= 1) ? P1C : (sy === 6 || sy === 7) ? P2C : (sy < 4.5 ? '#4a2a32' : '#24423f');
        g.box({ parent: 'scr-board', size: [0.42, (sy <= 1 || sy === 6 || sy === 7) ? 0.16 : 0.08, 0.42], pos: [SCX - 3.2 + (sx - 4) * 0.47, 0.1, 1.0 + (sy - 4) * 0.47], color: pc, edges: false });
      }
      g.label('盤（9×9）', [SCX - 3.2, 0.3, 3.8], { id: 'scr-board-l', parent: 'scr', size: 0.3, bg: '#000000cc' });
      g.box({ id: 'scr-log', parent: 'scr', size: [4.4, 0.1, 1.9], pos: [SCX + 3.2, 0.08, -0.7], color: '#222222', edges: false, label: 'ログ（何が起きたか）', labelSize: 0.28, labelBg: '#000000cc', labelOffset: [0, 0.35, 0] });
      g.box({ id: 'scr-hand', parent: 'scr', size: [4.4, 0.1, 1.9], pos: [SCX + 3.2, 0.08, 1.6], color: '#1a2a1a', edges: false });
      for (var k = 0; k < 4; k++) {
        g.box({ parent: 'scr-hand', size: [1.8, 0.06, 0.5], pos: [SCX + 2.2 + (k % 2) * 2.0, 0.16, 1.25 + Math.floor(k / 2) * 0.7], color: '#2a4a2a', edgeColor: P2C });
      }
      g.label('手札（アイテムカード）', [SCX + 3.2, 0.5, 1.6], { id: 'scr-hand-l', parent: 'scr', size: 0.28, bg: '#000000cc' });
      [['scr-b1', 1.7], ['scr-b2', 3.3], ['scr-b3', 4.9]].forEach(function (b) {
        g.box({ id: b[0], parent: 'scr', size: [1.4, 0.15, 0.5], pos: [SCX + b[1], 0.1, 3.3], color: P2C, edges: false });
      });
      g.label('能力を使う／ターン終了／ゲームリセット', [SCX + 3.3, 0.35, 4.2], { id: 'scr-btn-l', parent: 'scr', size: 0.28, bg: '#000000cc' });

      // ======================= 駒の種類と兵数 =======================
      g.group('lu', {});
      [['王', '王将', 3000, '槍兵あつかい', TC.spear, true], ['飛', '飛車', 2500, '騎兵あつかい', TC.cavalry], ['角', '角', 2500, '弓兵あつかい', TC.bow],
        ['槍', '槍兵', 1200, '', TC.spear], ['弓', '弓兵', 1000, '', TC.bow], ['馬', '騎兵', 1100, '', TC.cavalry], ['歩', '歩兵', 1000, '', TC.infantry]].forEach(function (p, i) {
        var h = p[2] / 1000 * 0.9, x = LUX + (i - 3) * 2.1;
        g.cylinder({ id: 'lu' + i, parent: 'lu', radius: 0.62, height: h, pos: [x, h / 2, 0], color: p[4], emissive: p[5] ? GOLD : '#000000', emissiveIntensity: p[5] ? 0.25 : 1,
          label: p[0] + '\n' + p[2], labelSize: 0.4, labelBg: LB, labelOffset: [0, h / 2 + 0.65, 0] });
        g.label(p[1] + (p[3] ? '\n' + p[3] : ''), [x, 0.05, 2.0], { parent: 'lu', size: 0.32, bg: LB });
      });
      g.label('柱の高さ＝最初の兵数', [LUX + 1.05, 3.4, 0], { parent: 'lu', size: 0.3, color: '#cccccc', bg: LB });

      // ======================= 動ける範囲（小さい盤3つ） =======================
      g.group('rng', {});
      var ra = miniBoard(g, 'rng', MVX - 6.5, 0, 5);
      piece(g, 'rA-p', ra(2, 2), P1C, '歩', { parent: 'rng' });
      [[1, 1], [2, 1], [3, 1], [1, 2], [3, 2], [1, 3], [2, 3], [3, 3]].forEach(function (c) { mark(g, 'rng', ra(c[0], c[1]), GREEN); });
      g.label('王将・槍・弓・馬・歩\nまわり1マス', [MVX - 6.5, 0.4, -3.4], { parent: 'rng', size: 0.4, bg: LB });

      var rb = miniBoard(g, 'rng', MVX, 0, 5);
      piece(g, 'rB-p', rb(2, 2), P1C, '飛', { parent: 'rng' });
      piece(g, 'rB-own', rb(2, 0), P1C, '槍', { parent: 'rng' });
      piece(g, 'rB-en', rb(4, 2), P2C, '歩', { parent: 'rng' });
      [[2, 1], [2, 3], [2, 4], [1, 2], [0, 2], [3, 2]].forEach(function (c) { mark(g, 'rng', rb(c[0], c[1]), GREEN); });
      mark(g, 'rng', rb(4, 2), ORANGE, 0.85);
      g.label('飛車\n縦・横にどこまでも', [MVX, 0.4, -3.4], { parent: 'rng', size: 0.4, bg: LB });
      g.label('味方で止まる', [MVX - 1.6, 0.9, -2.0], { parent: 'rng', size: 0.3, color: '#ffcf80', bg: '#000000cc' });
      g.label('敵は攻撃できる', [MVX + 2.0, 0.3, 1.1], { parent: 'rng', size: 0.3, color: ORANGE, bg: '#000000cc' });

      var rc = miniBoard(g, 'rng', MVX + 6.5, 0, 5);
      piece(g, 'rC-p', rc(2, 2), P1C, '角', { parent: 'rng' });
      [[1, 1], [0, 0], [3, 1], [4, 0], [1, 3], [0, 4], [3, 3], [4, 4]].forEach(function (c) { mark(g, 'rng', rc(c[0], c[1]), GREEN); });
      g.label('角\nななめにどこまでも', [MVX + 6.5, 0.4, -3.4], { parent: 'rng', size: 0.4, bg: LB });
      g.label('緑＝動けるマス　オレンジ＝攻撃できるマス', [MVX, 0.3, 3.5], { parent: 'rng', size: 0.4, bg: LB });

      // ======================= 攻めるとどうなる？ =======================
      g.group('at', {});
      var ac = miniBoard(g, 'at', ATX, RZ, 5, function (i, j) { return j >= 2 ? '#5a4a1e' : '#3a2a5a'; });
      g.group('at-a', { pos: ac(2, 1), parent: 'at' });
      g.cylinder({ parent: 'at-a', radius: 0.38, height: 0.2, pos: [0, 0.1, 0], color: P1C });
      g.label('槍\n1200', [0, 0.6, 0], { id: 'at-a1', parent: 'at-a', size: 0.26, bg: LB });
      g.label('槍\n950', [0, 0.6, 0], { id: 'at-a2', parent: 'at-a', size: 0.26, color: GOLD, bg: LB });
      piece(g, 'at-f', ac(2, 2), P2C, '馬\n1100', { parent: 'at', size: 0.26, ly: 0.6 });
      piece(g, 'at-s', ac(3, 1), P2C, '弓\n1000', { parent: 'at', size: 0.26, ly: 0.6 });
      g.arrow(ac(2, 1, 0.35), ac(2, 2, 0.35), { id: 'at-arF', parent: 'at', color: GOLD, lift: 0.9, radius: 0.05, head: 0.22 });
      g.arrow(ac(2, 1, 0.35), ac(3, 1, 0.35), { id: 'at-arS', parent: 'at', color: C.third, lift: 0.9, radius: 0.05, head: 0.22, label: '横', labelSize: 0.24, labelBg: '#000000cc' });
      g.label('前（正面）', [ATX, 0.3, RZ + 2.95], { parent: 'at', size: 0.32, color: GOLD, bg: LB });
      g.label('横・後ろ（奇襲）', [ATX, 0.3, RZ - 2.95], { parent: 'at', size: 0.32, color: C.third, bg: LB });
      g.arrow([ATX - 3.1, 0.25, RZ - 1.6], [ATX - 3.1, 0.25, RZ + 1.9], { parent: 'at', color: P1C, lift: 0.2, radius: 0.06 });
      g.label('プレイヤー1は\n下が「前」', [ATX - 3.1, 1.0, RZ + 0.1], { parent: 'at', size: 0.26, color: P1C, bg: '#000000cc' });
      g.label('横から攻めた！\n弓は消える\n槍は 250 減って 950', [ATX + 3.3, 1.6, RZ - 0.6], { id: 'at-res', parent: 'at', size: 0.28, color: GOLD, bg: '#000000cc' });

      // ======================= 正面戦闘のダメージ（棒グラフ） =======================
      g.group('fr', {});
      EX.forEach(function (e, i) {
        var cx = FRX + (i - 1) * 5.4;
        g.label(e[0], [cx, 3.7, RZ], { parent: 'fr', size: 0.36, color: '#ffffff', bg: LB });
        g.box({ id: 'fr-a' + i, parent: 'fr', size: [1.2, 1, 1.0], pos: [cx - 0.85, e[2] / 2000, RZ], color: P1C });
