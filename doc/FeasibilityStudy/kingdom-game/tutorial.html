<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陣形と城壁（仮） | 遊び方チュートリアル</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var ME = '#4fa3ff', EN = '#ff5f6d', DONE = '#55607a';

  // ---------- 地形（js/board.js の TERRAIN_INFO と同じ） ----------
  var TER = {
    P: { name: '平地', col: '#56763f', h: 0.12 },
    H: { name: '丘', col: '#9a7a4a', h: 0.34 },
    F: { name: '森', col: '#2b5e35', h: 0.12 },
    R: { name: '河川', col: '#2c6cb0', h: 0.06 },
  };
  var MOVE_COST = { P: 1, H: 1, F: 1, R: 2 };

  // ---------- 中華編 ステージ1「蟻ヶ原の初陣」（js/stages.js の field1） ----------
  var FIELD = ['PPHPHPP', 'PFPPPFP', 'PPRRRPP', 'PHPPPHP', 'PPPPPPP', 'PPPPPPP'];
  var TS = 1.2;
  function BP(r, c, y) { return [(c - 3) * TS, y == null ? 0.1 : y, (r - 2.5) * TS]; }
  function tileTop(t) { return TER[t].h; }

  var UT = {
    infantry: { name: '歩兵', icon: '🛡️', cost: 2, hp: 32, atk: 9, range: 1, move: 2 },
    cavalry: { name: '騎兵', icon: '🐎', cost: 3, hp: 28, atk: 11, range: 1, move: 3 },
    archer: { name: '弓兵', icon: '🏹', cost: 2, hp: 20, atk: 10, range: 2, move: 1 },
    pike: { name: '戟兵', icon: '🗡️', cost: 3, hp: 38, atk: 8, range: 1, move: 1 },
  };
  var ENEMY = [['eInf1', 2, 1, 'infantry'], ['eInf2', 2, 5, 'infantry'], ['eArc', 1, 3, 'archer'], ['eCav', 2, 3, 'cavalry']];
  var MINE = [['pInf', 4, 1, 'infantry'], ['pCav', 4, 3, 'cavalry'], ['pArc', 5, 5, 'archer']];

  // STEP7：騎兵(4,3)・移動力3 の「動けるマス」を、ゲームと同じダイクストラ法で先に計算しておく
  var BLOCK = {};
  ENEMY.concat(MINE).forEach(function (u) { BLOCK[u[1] + ',' + u[2]] = true; });
  BLOCK['0,3'] = true; BLOCK['5,3'] = true; // 本陣
  function reachable(sr, sc, budget) {
    var dist = {}; dist[sr + ',' + sc] = 0;
    var done = {};
    for (;;) {
      var cur = null, cc = Infinity;
      Object.keys(dist).forEach(function (k) { if (!done[k] && dist[k] < cc) { cur = k; cc = dist[k]; } });
      if (cur === null) break;
      done[cur] = true;
      var rc = cur.split(',').map(Number);
      [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(function (d) {
        var nr = rc[0] + d[0], nc = rc[1] + d[1];
        if (nr < 0 || nr > 5 || nc < 0 || nc > 6) return;
        var k = nr + ',' + nc;
        if (BLOCK[k]) return;
        var cost = cc + MOVE_COST[FIELD[nr][nc]];
        if (cost > budget) return;
        if (dist[k] == null || cost < dist[k]) dist[k] = cost;
      });
    }
    delete dist[sr + ',' + sc];
    return Object.keys(dist);
  }
  var CAV_REACH = reachable(4, 3, 3);

  // ---------- 舞台の置き場所 ----------
  var DZ = 22;              // ダメージ計算
  var SZ = -24;             // 攻城戦
  var TX = -30;             // タイトル画面
  var SX = -30, SSZ = 24;   // 戦闘画面
  var HX = -30, HZ = -24;   // 武将・編成
  var UX = 30;              // 兵種
  var JX = 30, JZ = -24;    // 三すくみ
  var LX = 30, LZ = 24;     // 地形
  var QX = -62;             // 国盗り編
  var PX = 62;              // CPU対戦
  function SP(r, c, y) { return [(c - 3) * TS, y == null ? 0.1 : y, SZ + (r - 3) * TS]; }
  function PP(x, y, h) { return [PX + (x - 5.5), h == null ? 0.1 : h, (y - 4.5)]; }
  function QP(x, y, h) { return [QX + (x - 39) * 0.2, h == null ? 0.1 : h, (y - 52) * 0.17]; }

  // ---------- 国盗り編（js/provinces.js の PROVINCES） ----------
  var PROV = [
    ['owari', '尾張', ['mikawa', 'mino', 'ise'], 40, 55, 0],
    ['mikawa', '三河', ['owari', 'ise', 'totomi'], 55, 62, 2],
    ['mino', '美濃', ['owari', 'omi', 'shinano'], 38, 33, 1],
    ['ise', '伊勢', ['owari', 'mikawa', 'yamato'], 33, 78, 1],
    ['omi', '近江', ['mino', 'echizen', 'yamashiro'], 18, 35, 2],
    ['suruga', '駿河', ['totomi', 'kai', 'musashi'], 70, 55, 2],
    ['kai', '甲斐', ['suruga', 'shinano', 'kouzuke'], 76, 33, 3],
    ['echizen', '越前', ['omi', 'kaga'], 10, 14, 3],
    ['totomi', '遠江', ['mikawa', 'suruga'], 62, 60, 2],
    ['shinano', '信濃', ['mino', 'kai'], 55, 40, 2],
    ['kaga', '加賀', ['echizen'], 14, 22, 4],
    ['musashi', '武蔵', ['suruga', 'kouzuke'], 68, 44, 3],
    ['kouzuke', '上野', ['kai', 'musashi', 'mutsu'], 66, 26, 4],
    ['mutsu', '陸奥', ['kouzuke'], 75, 8, 5],
    ['yamashiro', '山城', ['omi', 'yamato', 'harima'], 10, 46, 3],
    ['yamato', '大和', ['ise', 'yamashiro'], 18, 64, 2],
    ['harima', '播磨', ['yamashiro', 'aki'], 2, 50, 4],
    ['aki', '安芸', ['harima', 'iyo'], 2, 74, 5],
    ['iyo', '伊予', ['aki', 'chikuzen'], 10, 90, 5],
    ['chikuzen', '筑前', ['iyo'], 2, 95, 6],
  ];
  var PV = {};
  PROV.forEach(function (p) { PV[p[0]] = p; });
  function provH(p) { return 0.25 + p[5] * 0.32; }

  // ---------- CPU対戦のマップ（12×10。ゲームでは毎回ランダムなので、ここでは一例） ----------
  var PT_COL = { plain: '#4f6a3a', mountain: '#7a6e58', forest: '#2f5c33', water: '#2c6cb0' };
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  var PMAP = [];
  for (var yy = 0; yy < 10; yy++) {
    PMAP.push([]);
    for (var xx = 0; xx < 12; xx++) {
      var r0 = rnd();
      PMAP[yy].push(r0 < 0.15 ? 'water' : r0 < 0.35 ? 'mountain' : r0 < 0.5 ? 'forest' : 'plain');
    }
  }
  // 船の説明用に水路を1本通し、王都や説明に使うマスは平地にしておく
  [[2, 6], [3, 6], [4, 6], [5, 6], [6, 6], [7, 6], [7, 7], [8, 5]].forEach(function (p) { PMAP[p[1]][p[0]] = 'water'; });
  [[1, 1], [10, 8], [4, 3], [6, 4], [3, 3], [1, 4], [2, 2], [3, 1], [2, 3], [5, 3], [4, 2], [9, 7], [8, 8], [9, 6], [8, 7]].forEach(function (p) { PMAP[p[1]][p[0]] = 'plain'; });
  function pdist(a, b, x, y) { return Math.abs(a - x) + Math.abs(b - y); }

  var CFG = {
    title: '陣形と城壁（仮） 遊び方',
    back: '../index.html',
    subtitle: '兵の相性と地形を読んで戦う、マス目の作戦バトル。はじめての人向けのチュートリアル',
    camera: { pos: [0, 9.5, 9.2], target: [0, 0, 0.3] },

    build: function (g) {
      // ======================= メインの盤（蟻ヶ原の初陣） =======================
      g.group('board', {});
      FIELD.forEach(function (row, r) {
        row.split('').forEach(function (t, c) {
          var h = tileTop(t);
          g.box({ parent: 'board', size: [TS - 0.06, h, TS - 0.06], pos: BP(r, c, h / 2), color: TER[t].col, edgeColor: '#000000' });
          if (t === 'F') {
            [[-0.3, -0.25], [0.28, -0.1], [-0.05, 0.3]].forEach(function (o) {
              var p = BP(r, c, 0.36);
              g.cylinder({ parent: 'board', radiusTop: 0.02, radius: 0.16, height: 0.42, segments: 8, pos: [p[0] + o[0], 0.33, p[2] + o[1]], color: '#1f7a3a' });
            });
          }
        });
      });
      function piece(id, r, c, owner, type, top, parent) {
        var u = UT[type];
        var h = top == null ? 0.12 : top;
        return g.cylinder({ id: id, parent: parent, radius: 0.38, height: 0.5, pos: BP(r, c, h + 0.25), color: owner, label: u.icon + u.name, labelSize: 0.26, labelBg: '#000000bb', labelOffset: [0, 0.62, 0] });
      }
      function hq(id, pos, owner) {
        return g.box({ id: id, size: [0.8, 0.9, 0.8], pos: pos, color: owner, label: '🚩本陣', labelSize: 0.28, labelBg: '#000000bb', labelOffset: [0, 0.85, 0] });
      }
      hq('eHQ', BP(0, 3, 0.57), EN);
      hq('pHQ', BP(5, 3, 0.57), ME);
      ENEMY.forEach(function (u) { piece(u[0], u[1], u[2], EN, u[3], tileTop(FIELD[u[1]][u[2]])); });
      MINE.forEach(function (u) { piece(u[0], u[1], u[2], ME, u[3]); });
      g.label('敵の本陣を倒せば勝ち！', [0, 2.3, -4.4], { id: 'win-lbl', size: 0.42, color: C.gold, bg: '#000000aa' });
      g.label('自分の本陣がやられたら負け', [0, 0.2, 4.9], { id: 'lose-lbl', size: 0.42, color: '#ff9fa8', bg: '#000000aa' });

      // STEP4：配置エリア・手札・コスト
      g.group('dz', {});
      [4, 5].forEach(function (r) {
        for (var c = 0; c < 7; c++) g.box({ parent: 'dz', size: [TS - 0.2, 0.04, TS - 0.2], pos: BP(r, c, 0.16), color: '#5aa8ff', opacity: 0.45, edges: false });
      });
      g.label('配置エリア（下の2列）', [-5.0, 0.3, 4.6], { id: 'dz-lbl', size: 0.34, color: '#9fd0ff', bg: '#000000aa' });
      g.group('hand', {});
      [['infantry', '🛡️'], ['cavalry', '🐎'], ['archer', '🏹'], ['pike', '🗡️']].forEach(function (h, i) {
        g.card({ id: 'hand-' + h[0], parent: 'hand', pos: [-2.7 + i * 1.8, 0.95, 5.7], lying: false, text: h[1], sub: UT[h[0]].name + '\nコスト' + UT[h[0]].cost, color: '#3a7bd5', w: 1.15 });
      });
      g.label('配置できるユニット（カードを押す）', [0, 0.1, 7.0], { id: 'hand-lbl', size: 0.32, bg: '#000000aa' });
      g.group('cost', {});
      for (var k = 0; k < 14; k++) {
        g.box({ id: 'cost' + k, parent: 'cost', size: [1.0, 0.24, 1.0], pos: [5.6, 0.14 + k * 0.28, 1.2], color: '#3a3555', edgeColor: '#ffd166' });
      }
      g.label('コスト 6 / 14', [5.6, 4.6, 1.2], { id: 'cost-lbl', size: 0.36, color: C.gold, bg: '#000000cc' });

      // STEP7：動けるマス・行動済み・敵の攻撃
      g.group('reach', {});
      CAV_REACH.forEach(function (k) {
        var rc = k.split(',').map(Number);
        var t = FIELD[rc[0]][rc[1]];
        g.box({ parent: 'reach', size: [TS - 0.18, 0.05, TS - 0.18], pos: BP(rc[0], rc[1], tileTop(t) + 0.04), color: '#5ab0ff', opacity: 0.7, edges: false, emissive: '#2a70c0', emissiveIntensity: 0.5 });
      });
      g.cylinder({ id: 'sel-ring', radius: 0.55, height: 0.06, pos: BP(4, 3, 0.16), color: '#ffe066', emissive: '#ffcc00', emissiveIntensity: 0.6 });
      g.label('青いマス＝動ける場所', [5.4, 1.2, 1.0], { id: 'reach-lbl', size: 0.34, color: '#9fd0ff', bg: '#000000aa' });
      g.label('行動済み（灰色）', [2.2, 0.9, 1.3], { id: 'acted-lbl', size: 0.32, bg: '#000000aa' });
      g.arrow(BP(2, 3, 0.7), BP(3, 3, 0.7), { id: 'e-atk', color: '#ff3344', lift: 1.3, radius: 0.09 });
      g.label('ターン終了 → 敵の番\n隣の騎兵が攻撃してくる！', [-3.6, 2.4, -1.2], { id: 'eturn-lbl', size: 0.32, color: '#ffb3ba', bg: '#000000cc' });
      g.label('次のターン：コスト＋2', [5.2, 1.6, -2.4], { id: 'next-lbl', size: 0.32, color: C.gold, bg: '#000000aa' });

      // ======================= タイトル画面 =======================
      g.plate({ id: 't-scr', size: [13, 9], pos: [TX, 0.02, 0], color: '#1d2433', opacity: 1 });
      g.label('⚔️ 陣形と城壁（仮）', [TX - 2.3, 0.5, -3.7], { id: 't-title', size: 0.5, color: '#ffffff' });
      var TB = [
        ['はじめる（中華編）', '#3a7bd5', 'ステージを順にクリア'],
        ['歴史編（日本合戦史）', '#3a7bd5', '有名な合戦10ステージ'],
        ['国盗り編（戦国日本）', '#2e9d6a', '地図で20か国を集める'],
        ['編成', '#8a6bd1', '武将・城を持ち込む'],
        ['PVP編成', '#d07a2e', 'CPU対戦用の編成'],
        ['CPU対戦', '#d07a2e', '別ルールでCPUと勝負'],
        ['ユニット図鑑', '#d07a2e', 'CPU対戦のユニット一覧'],
      ];
      TB.forEach(function (b, i) {
        g.box({ id: 'tb' + i, size: [4.2, 0.2, 0.72], pos: [TX - 2.3, 0.12, -2.55 + i * 0.95], color: b[1], label: b[0], labelSize: 0.3, labelBg: '#00000000', labelOffset: [0, 0.14, 0.05] });
        g.label('→ ' + b[2], [TX + 2.5, 0.3, -2.55 + i * 0.95], { id: 'tbn' + i, size: 0.3, color: '#dfe6ff', bg: '#000000aa' });
      });

      // ======================= 戦闘画面の模型 =======================
      g.plate({ id: 's-scr', size: [14, 9.4], pos: [SX, 0.02, SSZ], color: '#dcdcdc', opacity: 1 });
      g.box({ id: 's-bar', size: [13.2, 0.14, 0.7], pos: [SX, 0.1, SSZ - 4.0], color: '#2a3550', edges: false, label: 'ステージ名｜ターン｜コスト｜本陣のHP', labelSize: 0.3, labelBg: '#00000000', labelOffset: [0, 0.1, 0.05] });
      g.group('s-board', {});
      FIELD.forEach(function (row, r) {
        row.split('').forEach(function (t, c) {
          g.box({ parent: 's-board', size: [0.88, 0.1, 0.88], pos: [SX - 3.4 + (c - 3) * 0.92, 0.1, SSZ + 0.2 + (r - 2.5) * 0.92], color: TER[t].col, edges: false });
        });
      });
      [[0, 3, EN], [1, 3, EN], [2, 1, EN], [2, 5, EN], [2, 3, EN], [5, 3, ME], [4, 2, ME], [4, 4, ME]].forEach(function (u, i) {
        g.cylinder({ parent: 's-board', radius: 0.28, height: 0.24, pos: [SX - 3.4 + (u[1] - 3) * 0.92, 0.27, SSZ + 0.2 + (u[0] - 2.5) * 0.92], color: u[2] });
      });
      g.label('盤（マス目）', [SX - 3.4, 0.6, SSZ - 3.1], { id: 's-board-lbl', size: 0.32, color: '#111111', bg: '#ffffffcc' });
      function sbox(id, z, d, col, text) {
        g.box({ id: id, size: [5.0, 0.14, d], pos: [SX + 3.9, 0.1, z], color: col, edges: false, label: text, labelSize: 0.28, labelBg: '#00000000', labelOffset: [0, 0.3, 0] });
      }
      sbox('s-sel', SSZ - 2.3, 1.7, '#3d4f7a', '選んだユニットの情報\n待機・スキル・キャンセル');
      sbox('s-hand', SSZ + 0.0, 1.9, '#2f6db3', '配置できるユニット\n（カードとコスト）');
      sbox('s-log', SSZ + 2.3, 1.7, '#4a4a4a', '戦況ログ\n（何が起きたか）');
      g.box({ id: 's-end', size: [3.2, 0.2, 0.7], pos: [SX, 0.12, SSZ + 4.0], color: '#d2691e', edges: false, label: 'ターン終了', labelSize: 0.32, labelBg: '#00000000', labelOffset: [0, 0.3, 0] });

      // ======================= 兵種 =======================
      g.plate({ id: 'u-floor', size: [14, 6], pos: [UX, 0.02, 0], color: '#231f33', opacity: 0.95 });
      ['infantry', 'cavalry', 'archer', 'pike'].forEach(function (k, i) {
        var u = UT[k], h = u.hp / 16;
        var x = UX - 5.1 + i * 3.4;
        g.cylinder({ id: 'ut-' + k, radius: 0.75, height: h, pos: [x, h / 2 + 0.05, 0.6], color: k === 'pike' ? '#9c8cff' : ME });
        g.label(u.icon + ' ' + u.name, [x, h + 0.6, 0.6], { id: 'utn-' + k, size: 0.42, bg: '#000000cc' });
        g.label('コスト' + u.cost + '　HP' + u.hp + '\n攻撃' + u.atk + '　射程' + u.range + '\n移動' + u.move, [x, 0.4, 2.5], { id: 'uts-' + k, size: 0.3, bg: '#000000cc' });
      });
      g.label('柱の高さ＝HP（体力）', [UX, 0.4, -2.3], { id: 'u-note', size: 0.34, color: C.good, bg: '#000000aa' });

      // ======================= 三すくみ =======================
      g.plate({ id: 'j-floor', size: [15, 9], pos: [JX, 0.02, JZ], color: '#1a1a2e', opacity: 0.95 });
      var JP = { infantry: [JX - 4.2, 0.45, JZ - 1.4], cavalry: [JX + 2.2, 0.45, JZ - 1.4], archer: [JX - 1.0, 0.45, JZ + 2.6] };
      Object.keys(JP).forEach(function (k) {
        g.cylinder({ id: 'j-' + k, radius: 1.0, height: 0.7, pos: JP[k], color: ME, label: UT[k].icon + ' ' + UT[k].name, labelSize: 0.5, labelBg: '#000000cc', labelOffset: [0, 0.9, 0] });
      });
      function jA(a, b) { var A = JP[a], B = JP[b]; var d = [B[0] - A[0], B[2] - A[2]]; var n = Math.hypot(d[0], d[1]); return [[A[0] + d[0] / n * 1.5, 0.95, A[2] + d[1] / n * 1.5], [B[0] - d[0] / n * 1.5, 0.95, B[2] - d[1] / n * 1.5]]; }
      [['infantry', 'cavalry'], ['cavalry', 'archer'], ['archer', 'infantry']].forEach(function (p, i) {
        var e = jA(p[0], p[1]);
        g.arrow(e[0], e[1], { id: 'ja' + i, color: C.gold, lift: 0.8, radius: 0.08, label: UT[p[0]].name + 'は' + UT[p[1]].name + 'に強い', labelSize: 0.32, labelBg: '#000000cc' });
      });
      g.label('有利な相手への攻撃は ×1.5', [JX - 1.0, 0.4, JZ + 4.6], { id: 'j-bonus', size: 0.45, color: C.good, bg: '#000000aa' });
      g.cylinder({ id: 'j-pike', radius: 0.9, height: 0.7, pos: [JX + 5.4, 0.45, JZ + 2.2], color: '#9c8cff', label: '🗡️ 戟兵', labelSize: 0.45, labelBg: '#000000cc', labelOffset: [0, 0.9, 0] });
      g.label('相性なし\nそのかわり\n守り＋2', [JX + 5.4, 0.5, JZ + 3.9], { id: 'j-pike-lbl', size: 0.3, bg: '#000000cc' });

      // ======================= 地形 =======================
      g.plate({ id: 'l-floor', size: [14, 7], pos: [LX, 0.02, LZ], color: '#231f33', opacity: 0.95 });
      var LT = [
        ['P', '平地', '移動コスト1\n守り ±0'],
        ['H', '⛰️ 丘', '移動コスト1\n守り ＋3'],
        ['F', '🌲 森', '移動コスト1\n守り ＋1\n弓兵は射程＋1'],
        ['R', '🌊 河川', '移動コスト2\n守り －1'],
      ];
      LT.forEach(function (t, i) {
        var x = LX - 5.1 + i * 3.4, h = TER[t[0]].h * 2;
        g.box({ id: 'lt' + i, size: [2.6, h, 2.6], pos: [x, h / 2 + 0.04, LZ - 0.4], color: TER[t[0]].col, edgeColor: '#000000' });
        g.cylinder({ id: 'lp' + i, radius: 0.45, height: 0.5, pos: [x, h + 0.29, LZ - 0.4], color: i === 2 ? ME : '#cfd6e6' });
        g.label(t[1], [x, h + 1.25, LZ - 0.4], { id: 'ltn' + i, size: 0.42, bg: '#000000cc' });
        g.label(t[2], [x, 0.4, LZ + 1.9], { id: 'lts' + i, size: 0.3, bg: '#000000cc' });
      });
      g.label('守り＝その上にいるユニットが受けるダメージを減らす', [LX, 0.4, LZ + 3.1], { id: 'l-note', size: 0.28, color: '#cfd6e6', bg: '#000000aa' });

      // ======================= ダメージ計算 =======================
      g.plate({ id: 'd-floor', size: [14, 7], pos: [0, 0.02, DZ], color: '#1a1a2e', opacity: 0.95 });
      g.box({ id: 'd-t1', size: [2.2, 0.12, 2.2], pos: [-4.4, 0.08, DZ], color: TER.P.col });

          '<li>CPUは、効果のある武将を2〜3人と、いろいろな兵種のユニットで編成を組んで配置する</li></ul>',
        camera: { pos: [PX - 0.5, 12.5, 9.5], target: [PX - 0.5, 0, -0.2] },
        focus: ['pm', 'p-cap0', 'p-cap1', 'pd0', 'pd1', 'pd2', 'pd3', 'pd4', 'pd-fort', 'pd-ship', 'pe0', 'pe1', 'pe2', 'pe3', 'p-cost'],
        show: ['pd0', 'pd1', 'pd2', 'pd3', 'pd4', 'pd-fort', 'pd-ship', 'p-cost'],
        update: function (g, t) {
          var tt = t % 9;
          var order = [['pd0', 2], ['pd1', 2], ['pd2', 3], ['pd3', 2], ['pd4', 2], ['pd-fort', 12], ['pd-ship', 25]];
          var cost = 0;
          order.forEach(function (o, i) {
            var on = tt > 0.4 + i * 0.6;
            var s = on ? Math.max(0.001, g.phase(tt, 0.4 + i * 0.6, 0.3)) : 0.001;
            g.get(o[0]).scale.set(s, s, s);
            if (on) cost += o[1];
          });
          g.setLabel('p-cost', 'コスト ' + cost + ' / 50（武将＋ユニット＋拠点＋船）', { size: 0.34, color: C.gold, bg: '#000000cc' });
        },
      },
      {
        title: 'CPU対戦②：戦い方',
        html:
          '<p>CPU対戦では、<b>1ターンにできる行動は全軍で1回だけ</b>。次のどれか1つをしたら、「<b>ターン進める</b>」を押してね（何もせずに進めてもOK）。</p>' +
          '<ul><li>自分のユニットを押して、<b>2マス以内</b> の空いているマスへ <b>移動</b></li>' +
          '<li>自分のユニットを押して、<b>射程以内</b> の敵（ユニット・拠点・船・王都）を押して <b>攻撃</b>。射程はユニットごとにちがう（ユニット図鑑の「射程」。歩兵・騎馬は1、弓・鉄砲は2〜3、大砲は2〜3）</li>' +
          '<li>船を動かす（水の上を3マス）／船から攻撃（2マス以内で、水路でつながっている相手。ダメージ43〜57）</li>' +
          '<li><b>アイテム</b> を使う。ターンを進めるたびに1個もらえる。🧪回復薬＝味方のHPを最大の30%回復、💥奇襲＝どこにいる敵でも40ダメージ</li></ul>' +
          '<p><b>ダメージ</b>：攻撃力（武将の効果こみ）→ 相性が有利なら×1.5 → 運で0.8〜1.2倍 → 相手ユニットの今のHPの1/10を引く。</p>' +
          '<table><tr><th>攻める側</th><th>強い相手（×1.5）</th></tr>' +
          '<tr><td>歩兵系</td><td>弓兵系・鉄砲系（槍兵だけは騎馬系）</td></tr>' +
          '<tr><td>騎馬系</td><td>歩兵系</td></tr>' +
          '<tr><td>弓兵系</td><td>騎馬系</td></tr>' +
          '<tr><td>鉄砲系</td><td>騎馬系（銃槍兵は歩兵系にも）</td></tr>' +
          '<tr><td>大砲系</td><td>ユニットにはなし（大砲は、だれに攻撃されても×1.5くらう）。かわりに <b>拠点・王都には×3</b> の大ダメージ</td></tr></table>' +
          '<div class="gg-note">ステージの三すくみとは <b>向きがちがう</b> から注意してね！ 相手の <b>王都（HP1000）</b> を0にしたら勝ち。ターン数の制限はないよ。</div>',
        camera: { pos: [PX + 0.6, 12.5, 9.5], target: [PX + 0.6, 0, -0.2] },
        focus: ['pm', 'p-cap0', 'p-cap1', 'pd0', 'pd1', 'pd2', 'pd3', 'pd4', 'pd-fort', 'pd-ship', 'pe0', 'pe1', 'pe2', 'pe3', 'pe-near', 'p-move', 'p-atk', 'p-selring', 'p-sel-lbl', 'p-atk-arrow', 'p-range-lbl', 'p-dmg-lbl', 'p-caphp', 'p-caphp-lbl', 'p-one'],
        show: ['pd0', 'pd1', 'pd2', 'pd3', 'pd4', 'pd-fort', 'pd-ship', 'pe-near', 'p-move', 'p-atk', 'p-selring', 'p-sel-lbl', 'p-atk-arrow', 'p-range-lbl', 'p-dmg-lbl', 'p-caphp', 'p-caphp-lbl', 'p-one'],
        update: function (g, t) {
          var tt = t % 8;
          g.get('p-move').visible = tt < 2.6;
          g.get('p-atk').visible = tt >= 2.6;
          g.get('p-atk-arrow').visible = tt > 3.6;
          g.get('p-dmg-lbl').visible = tt > 3.6;
          ['pd-fort', 'pd-ship'].forEach(function (id) { g.get(id).userData.label.visible = false; });
          g.pulse('p-selring', t, 0.1);
          g.pulse('p-caphp', t, 0.04);
        },
      },
      {
        title: 'まとめ',
        html:
          '<ol><li><b>index.html</b> を開いて、まずは <b>はじめる（中華編）</b> から</li>' +
          '<li>カードを押して、<b>下の2列</b> にユニットを配置（コストに注意）</li>' +
          '<li>ユニットを押して、青いマスへ <b>移動</b> か、赤い敵を <b>攻撃</b>（1体1ターン1回）</li>' +
          '<li><b>歩兵＞騎兵＞弓兵＞歩兵</b> の相性で ×1.5 を狙う</li>' +
          '<li><b>丘（守り＋3）</b> や森を使って、川の中では戦わない</li>' +
          '<li>敵の <b>本陣</b> を倒せば勝ち。攻城戦は <b>衝車</b> で <b>城門</b> を壊す</li>' +
          '<li>なれたら <b>歴史編</b>・<b>国盗り編</b>・<b>CPU対戦</b> にも挑戦！</li></ol>' +
          '<p>それじゃあ、陣形を組んで勝利をめざしてね！⚔️</p>',
        camera: { pos: [0, 9.8, 9.6], target: [0, 0, 0.2] },
        focus: ['board', 'eHQ', 'pHQ', 'eInf1', 'eInf2', 'eArc', 'eCav', 'pInf', 'pCav', 'pArc', 'win-lbl'],
        show: ['win-lbl', 'pInf', 'pArc'],
        update: function (g, t) { g.pulse('eHQ', t, 0.12); g.pulse('pHQ', t + 1, 0.08); },
      },
    ],
  };

  GameGuide.start(CFG);
  // guide.js はタイトルに「仕組み図解」と付けるので、このページ用に付け直す
  document.addEventListener('DOMContentLoaded', function () { document.title = '陣形と城壁（仮） | 遊び方チュートリアル'; });
})();
</script>
