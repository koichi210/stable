<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陣形と城壁（仮） — stable</title>
<meta name="theme-color" content="#07040f">
<link rel="stylesheet" href="../../../portal/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../../../portal/catalog.js"></script>
<script src="../../../portal/magic.js"></script>
<script src="../../../portal/toolpage.js"></script>
</head>
<body>
<script>
ToolPage.start({
  root: '../../../',
  id: 'kingdom-game',
  caption: '兵の相性と地形を読んで戦う、マス目の陣形バトル（攻城戦・国盗りつき）',
  lead: 'マス目の盤に<b>歩兵・騎兵・弓兵・戟兵</b>を置いて、敵の本陣を倒すターン制の作戦ゲームです。' +
        '<code>index.html</code> をダブルクリックするだけで動く素の JavaScript で、ファイルは「データ → ルール → CPU の思考 → 画面（<code>*-ui.js</code>）」に分かれ、すべて <code>window.KG</code> にぶら下がります。' +
        'ルールのファイルは画面に触らないので、国盗り編も同じ戦闘ルールをそのまま使い回しています。',
  say: ['インストールなしでブラウザだけで遊びたい', '兵の相性と地形で作戦を考えたい', 'ビルドなしの JavaScript で役割を分けた作りを見たい'],
  sayTitle: 'こんなときに',
  nodes: [
    { id: 'player', type: 'person', label: 'プレイヤー', sub: '自軍（青）', at: [-8.5, 0], desc: 'ステージを選び、ユニットを置いて動かす。相手はいつも CPU の軍（赤）。' },
    { id: 'web', type: 'screen', label: 'ブラウザの画面', sub: '*-ui.js', at: [-4.4, 0],
      desc: '盤の描画とクリックの受付だけをする画面。戦闘は <code>ui.js</code>、国盗りの地図は <code>conquest-ui.js</code>、CPU 対戦は <code>pvp-*-ui.js</code>。ルールは持っていない。' },
    { id: 'main', type: 'main', label: 'main.js', sub: 'screens.js で画面切替', at: [0, 0],
      desc: '起動とタイトルのボタン、中華編・歴史編・国盗り編の画面遷移を受け持つ。画面の切り替えは必ず <code>KG.screens.show("名前")</code> で 1 画面だけ表示する。' },
    { id: 'battle', type: 'code', label: 'battle.js', sub: 'board.js・siege.js', at: [3.6, -3.6],
      desc: '戦闘ルールの中心。配置・移動・攻撃・ターン進行・勝敗を決める。移動できるマスは <code>board.js</code>（ダイクストラ法）、城壁・城門・矢櫓は <code>siege.js</code>。' },
    { id: 'ai', type: 'code', label: 'ai.js', sub: '敵軍の思考', at: [7.6, -3.6],
      desc: 'ルールで決めた簡単な AI。射程内に味方がいれば HP がいちばん少ない相手を攻撃し、いなければいちばん近い味方へ進む。' },
    { id: 'conquest', type: 'code', label: 'conquest.js', sub: 'provinces.js', at: [5.2, 0],
      desc: '国盗り編の状態（20 か国・兵糧・ターン）を持つ。合戦になると <code>provinces.js</code> が国の強さからステージをその場で作り、battle.js に渡す。' },
    { id: 'pvp', type: 'code', label: 'pvp-battle.js', sub: 'pvp-ai.js・pvp-ship.js', at: [3.6, 3.6],
      desc: 'CPU 対戦の別ルール。大きいマップで拠点と王都を取り合い、王都が落ちたら負け。CPU は <code>pvp-ai.js</code>（easy / normal / hard）、船は <code>pvp-ship.js</code>。' },
    { id: 'data', type: 'data', label: 'units.js ほか', sub: '兵種・ステージ', at: [8.8, 2.2],
      desc: '兵種（<code>units.js</code>）・武将（<code>characters.js</code>）・城（<code>castles.js</code>）・ステージ（<code>stages.js</code> / <code>history-stages.js</code>）など、数字と定義だけのファイル。' },
    { id: 'save', type: 'store', label: 'localStorage', sub: 'save.js・roster.js', at: [0, 4],
      desc: 'クリアしたステージ（<code>save.js</code>）、持ち込む武将・城（<code>roster.js</code>）、CPU 対戦の編成（<code>pvp-formations.js</code>）をブラウザの中に保存する。別のブラウザ・別の PC には引き継がれない。' },
  ],
  links: [['player', 'web'], ['web', 'main'], ['main', 'battle', true], ['main', 'conquest'], ['main', 'pvp', true],
    ['battle', 'ai'], ['conquest', 'data', true], ['battle', 'data', true], ['pvp', 'data', true], ['main', 'save', true]],
  steps: [
    { by: 'player', title: 'モードとステージを選ぶ', flow: [['player', 'web'], ['web', 'main']],
      text: 'タイトルで「はじめる（中華編）」「歴史編」「国盗り編」「CPU対戦」などを選ぶ。<code>main.js</code> が <code>KG.screens.show()</code> で画面を 1 つだけ出す。',
      note: 'ステージは、前のステージをクリアすると次が開く（中華編と歴史編は別々に進む）' },
    { by: 'battle', title: 'コストを払ってユニットを置く', flow: [['web', 'main'], ['main', 'battle'], ['battle', 'data']],
      text: '手札のカードを押して、下の 2 列の空きマスに置く。最初のステージはコスト 6 から始まり、毎ターン +2（最大 14）。兵種の HP・攻撃・射程は <code>units.js</code> から読む。' },
    { by: 'battle', title: '動かす・攻撃する', flow: [['main', 'battle']],
      text: '1 体が 1 ターンにできるのは移動か攻撃のどちらか 1 回。動けるマスは <code>board.js</code> が地形の移動コスト（川は 2）を見ながらダイクストラ法で求める。' },
    { by: 'battle', title: 'ダメージは相性と地形で決まる', flow: [['battle', 'data']],
      text: '<code>computeDamage()</code> は「攻撃力 → 相性が有利なら 1.5 倍 → 地形の守り（丘 +3・森 +1・川 −1）と戟兵の守りを引く」の順で計算し、最低でも 1 ダメージ。' },
    { by: 'ai', title: 'ターン終了で敵の番', flow: [['battle', 'ai'], ['ai', 'battle']],
      text: '「ターン終了」を押すと <code>endPlayerTurn()</code> が敵の思考（<code>ai.js</code>）を呼び、勝敗を判定してから次のターンへ進める。',
      note: 'battle.js は ai.js を直接読まず、引数で受け取る（ルールが AI に依存しないようにするため）' },
    { by: 'main', title: '勝敗とクリアの記録', flow: [['battle', 'main'], ['main', 'save']],
      text: '敵の本陣を倒す（攻城戦は城門を壊す）と勝ち、自分の本陣がやられるか制限ターンを過ぎると負け。クリアしたステージは <code>save.js</code> が localStorage に書く。' },
    { by: 'conquest', title: '国盗り編：交渉か制圧', flow: [['main', 'conquest'], ['conquest', 'data'], ['main', 'battle']],
      text: '隣の国に兵糧を払って「交渉」（成功は確率）か、「制圧」で合戦する。合戦のステージは <code>provinces.js</code> が国の強さから即席で作り、いつもの battle.js で戦う。全部の国を従えたら天下統一。' },
    { by: 'pvp', title: 'CPU 対戦は別ルール', flow: [['main', 'pvp'], ['pvp', 'data'], ['main', 'save']],
      text: '15 枠の編成を組んで難易度を選び、配置 → 戦闘。拠点を落としながら相手の王都を狙う。編成は localStorage に保存される。' },
  ],
  pages: [
    { href: 'tutorial.html', icon: '🎓', title: '遊び方チュートリアル', desc: '画面の見方・配置とコスト・4つの兵種・兵の相性・地形・ダメージ計算・攻城戦・武将と編成・国盗り編・CPU対戦まで（全15ステップ）' },
    { href: 'game-guide.html', icon: '🧩', title: '仕組み図解', desc: '盤面と地形・移動できるマス（ダイクストラ法）・ダメージ計算・敵AIの考え方・国盗り編の合戦の作り方・プログラムの全体構成と保存まで、立体図で' },
  ],
  note: 'ソースは非公開の <code>FeasibilityStudy/kingdom-game</code>。タイトルはまだ仮です。武将や中華編の地名はすべてオリジナルの名前です。',
});
</script>
</body>
</html>
