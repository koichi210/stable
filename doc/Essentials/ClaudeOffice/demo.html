<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>箱庭ダッシュボード 機能デモ</title>
<!--
  箱庭ダッシュボード(Claude Office)の機能ごとのデモ(1機能=1本の短い動画風ページ)。demo.html?f=presence のように機能を指定します。
  ・画面は、実際のアプリを動かして撮ったスクショ(demo-img/)に、カーソル・クリック・ズーム・目印・字幕を時間軸で重ねたものです。
  ・撮影に使ったのは、架空のプロジェクト名・架空の会話・架空の使用率だけを入れた「ダミーの ~/.claude」です(本物の会話記録は使っていません)。
  ・再生部分は ../lib/demo-player.js(Essentials共通)。座標はスクショ(1600x900)の画素です。
  ・アプリの見た目を変えたら、スクショを撮り直してください。
-->
<script src="../lib/demo-player.js"></script>
</head>
<body>
<script>
(function () {

    win: { x: 360, y: 70, w: 440, h: 560 }, winX: [775, 92], winTa: [580, 347], winSend: { x: 740, y: 386, w: 48, h: 27 }, winVsc: { x: 372, y: 280, w: 219, h: 27 },

    // ================= 全体紹介 =================
    { id: 'overview', icon: '🎬', title: '全体紹介（約2分）', sec: 'まずは全体を見る', top: true,

      script: function (d) {
        d.chapter('はじめに'); d.scene('base'); d.cursor(800, 480, { dur: 0 });

        d.scene('notify', { fade: 300 }); d.cursor(P.notify[0], P.notify[1], { dur: 700 }); d.click();
        cap(d, '「通知」の設定では、返事が終わったときに Windows の通知を出すかどうか、文面、出さない時間帯などを決められます。', 7000);

        d.chapter('おわり'); d.scene('base', { fade: 400 }); d.cursor(800, 480, { dur: 900 });

      } },

    // ================= いま何をしているか =================

        d.chapter('おやすみ');

        d.mark(P.card.garden, { dur: 3500, label: '❓ 返事待ち' });
        cap(d, '右の一覧では、最後が質問で終わっている会話に「❓ 返事待ち」のバッジが付きます。', 5000);
        d.mark(P.card.photo, { dur: 3500, label: '⏳ 裏で作業中' });

        d.mark(P.card.typing, { dur: 3500, label: '✅ 完了' });

      } },

      } },

    // ================= 日別タイムライン =================

    // 台本では画像を拡張子なしの名前(base など)で書く。ここで .jpg を足す
    features: FEATURES.map(function (f) {
      var body = f.script;
      f.script = function (d) {
        var sc = d.scene, om = d.mark, ow = d.wait, pend = [];
        d.scene = function (n, o) { sc(n + '.jpg', o); };
        // 目印は、そのあとに続く字幕(wait)が終わるまで出しておく
        d.mark = function (r, o) { pend.push([r, o]); };
        d.wait = function (ms) { pend.forEach(function (p) { om(p[0], { label: p[1] && p[1].label, dur: Math.max(1500, ms - 300) }); }); pend = []; ow(ms); };
        body(d);
      };
      return f;
    })
