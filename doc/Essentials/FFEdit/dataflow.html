<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFEdit データの流れ</title>
<link rel="stylesheet" href="../lib/guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../lib/guide.js"></script>
</head>
<body>
<script>
(function () {
  var T = THREE, C = GameGuide.colors;
  var SX = 13;                           // 工程(ステージ)どうしの間隔。ファイルのブロックがこの間を流れていく
  var GREY = new T.Color('#4d4a63');

  // ---- 説明用のファイル6個(ダミー)。OSが返す順に並べてある ----
  var F = [
    { n: 'IMG_2.jpg', c: '#4fa3ff' },
    { n: 'IMG_10.jpg', c: '#5ee6a8' },
    { n: 'IMG_1.jpg', c: '#ffd166' },
    { n: 'IMG_20.jpg', c: '#c77dff' },
    { n: 'IMG_3.jpg', c: '#ff9f43' },
    { n: 'IMG_11.jpg', c: '#7ef0ff' },
  ];
  var RANK = [1, 3, 0, 5, 2, 4];                       // 自然順での順位(0始まり)
  var SELID = [2, 0, 4, 1];                            // 選択した4件(一覧の上から) = IMG_1, IMG_2, IMG_3, IMG_10
  var NEWNAME = { 2: '001.jpg', 0: '002.jpg', 4: '003.jpg', 1: '004.jpg' };
  function isSel(i) { return RANK[i] < 4; }
  function rz(r) { return -5.25 + r * 2.1; }           // 一覧の行のz
  function az(r) { return -4.5 + r * 3; }              // 処理中の列のz

  // ブロックの置き場所。ステージ k の中心は x = SX*k
  function P(k, i) {
    var r = RANK[i], sel = r < 4, lx, z, st = Math.min(k, 6);
    if (k === 0) { lx = -3 + (i % 3) * 3; z = -1.8 + Math.floor(i / 3) * 3.6; }
    else if (k === 1 || k >= 6) { lx = 0; z = rz(r); }
    else if (k === 2) { lx = sel ? 2.2 : -2.2; z = rz(r); }
    else if (k === 3) { if (sel) { lx = -3.6 + r * 2.4; z = -5; } else { lx = -2.2; z = rz(r); st = 2; } }
    else if (k === 4) { if (sel) { lx = 0; z = az(r); } else { lx = -2.2; z = rz(r); st = 2; } }
    else { if (sel) { lx = -1.5; z = az(r); } else { lx = -2.2; z = rz(r); st = 2; } }
    return [SX * st + lx, 0.32, z];
  }

  var files = [];
  var slabA = [], slabB = [];
  var STACK_A = [SX * 5 + 4.4, 0, 0], STACK_B = [SX * 6 + 5, 0, 0];
  function slotPos(base, j) { return [base[0], 0.28 + j * 0.5, base[2]]; }

  function setName(m, txt) {
    if (m.userData.txt === txt) return;
    m.userData.txt = txt;
    window.__g.setLabel(m.userData.label, txt, { size: 0.34 });
  }

  // ステップ k の毎フレームの処理。位置・色・名前は t から決める(途中のステップへ飛んでも壊れない)
  function tick(g, t, k) {
    var ph = k === 0 ? 1 : g.phase(t, 0, 2.0);
    var i, j, m, r, sel, tint, col, txt, a, b;
    for (i = 0; i < F.length; i++) {
      m = files[i]; r = RANK[i]; sel = r < 4;
      if (!sel && k >= 3 && k <= 5) { m.visible = false; continue; }
      m.visible = true;
      if (k === 7) {
        g.setPos(m, P(6, i));
      } else if (!sel && k === 6) {
        g.setPos(m, P(6, i));
      } else {
        a = P(k === 0 ? 0 : k - 1, i); b = P(k, i);
        g.lerpPos(m, a, b, ph);
      }
      // 対象外の2件は、選ばれなかった時点で灰色になる(②以降)
      tint = 0;
      if (!sel) tint = k === 2 ? g.phase(t, 0.8, 0.8) : (k >= 6 ? 1 : 0);
      col = new T.Color(F[i].c);
      if (k === 7 && sel) {                                    // 復元: 戻った瞬間に光る
        var tp = 0.6 + 0.8 * (3 - r) + 0.9;
        col.lerp(new T.Color('#ffffff'), Math.max(0, 1 - Math.abs(t - tp) / 0.5) * 0.7);
      }
      col.lerp(GREY, tint);
      m.material.color.copy(col);
      m.scale.setScalar(1 - 0.25 * tint);
      // 名前
      txt = F[i].n;
      if (sel) {
        if (k === 4) { if (t > 1.9 + 0.6 * r) txt = NEWNAME[i]; }
        else if (k >= 5 && k <= 6) txt = NEWNAME[i];
        else if (k === 7) { if (t < 0.6 + 0.8 * (3 - r) + 0.9) txt = NEWNAME[i]; }
      }
      setName(m, txt);
    }
    // ⑤ 復元用スタックにたまっていく
    for (j = 0; j < 4; j++) {
      var s = slabA[j], idj = SELID[j];
      var kA = g.phase(t, 0.7 + 0.7 * j, 0.9);
      if (k === 5) {
        s.visible = t > 0.65 + 0.7 * j;
        g.arcPos(s, [P(5, idj)[0], 0.5, P(5, idj)[2]], slotPos(STACK_A, j), kA, 2);
      }
      // ⑦ 復元: 上からひとつずつ取り出して、元の名前に戻す
      var sb = slabB[j], kB = g.phase(t, 0.6 + 0.8 * (3 - j), 0.9);
      if (k === 7) {
        sb.visible = kB < 0.999;
        g.arcPos(sb, slotPos(STACK_B, j), [P(6, idj)[0], 0.5, P(6, idj)[2]], kB, 2);
        sb.scale.setScalar(1 - 0.6 * kB);
      }
    }
  }

  function look(k) {
    var x = SX * k;
    if (k === 0) return { pos: [x, 14, 14], target: [x, 0.3, 0] };
    if (k === 1 || k === 2) return { pos: [x, 18, 13], target: [x, 0.3, 0.5] };
    if (k === 3) return { pos: [x, 18, 15], target: [x, 0.3, 1.8] };
    if (k === 4) return { pos: [x, 17, 13], target: [x, 0.3, 0.5] };
    if (k === 5) return { pos: [x + 1.8, 17, 13], target: [x + 1.8, 0.3, 0.5] };
    return { pos: [SX * 6 + 2, 18, 13], target: [SX * 6 + 2, 0.3, 0.5] };
  }

  function step(k, title, html, show, extra) {
    return {
      title: title, html: html, camera: look(k), show: ['belt'].concat(show || []),
      enter: function (g) { files.forEach(function (m, i) { m.userData.txt = F[i].n; }); },
      update: function (g, t) { tick(g, t, k); if (extra) extra(g, t); },
    };
  }

  function stagePlates(g) {
    var titles = ['⓪ 対象フォルダ(OSが返す順)', '① 一覧 ListBox(自然順)', '② 処理対象 GetFileList()', '③ 実行 → タブで処理を選ぶ', '④ Rename: 新しい名前を計算', '⑤ File.Move + 復元用の記録', '⑥ 一覧を更新 / ⑦ 復元'];
    for (var k = 0; k <= 6; k++) {
      g.plate({ parent: 'belt', id: 'st' + k, size: [11, 16], pos: [SX * k, 0.03, 0], color: '#211e33', label: titles[k], labelSize: 0.46, labelOffset: [0, 0.3, -8.6], labelColor: '#ffffff' });
      if (k < 6) {
        g.arrow([SX * k + 5.8, 0.5, 0], [SX * (k + 1) - 5.8, 0.5, 0], { parent: 'belt', id: 'ar' + k, color: C.gold, lift: 0.4, head: 0.4 });
        g.flow([SX * k + 5.8, 0.5, 0], [SX * (k + 1) - 5.8, 0.5, 0], { parent: 'belt', id: 'fl' + k, color: C.data, lift: 0.4, count: 4, size: 0.12 });
      }
    }
  }

  var NAVY = '#2e2a4a';
  function ovr(s) { s.camera = { pos: [39, 56, 66], target: [39, 0, 1] }; return s; }

  GameGuide.start({
    title: 'FFEdit データの流れ',
    subtitle: 'フォルダ → 一覧 → 処理対象 → 新しい名前 → 実際の移動と記録 → 一覧更新 → 復元。ブロックが流れていく',
    camera: { pos: [39, 56, 66], target: [39, 0, 1] },
    floor: false,

    build: function (g) {
      window.__g = g;
      g.scene.fog = null;
      g.controls.maxDistance = 130;
      g.group('belt'); g.group('ts'); g.group('fn'); g.group('st');
      stagePlates(g);
      var B = function (o) { o.parent = 'belt'; return o; };
      var i, j, k;

      // ⓪ 対象フォルダ
      g.plate(B({ id: 'folder', size: [9.4, 11], pos: [0, 0.07, 0], color: '#3a3560', label: '対象フォルダ(例: Trip)', labelSize: 0.36, labelOffset: [0, 0.3, -5.1] }));
      g.label('色 = ファイルの違い(同じ色は同じファイル)\nOSが返す順は、数字の順とは限らない', [0, 0.5, 6.2], { parent: 'belt', size: 0.32, color: '#ffffff' });

      // ① 一覧
      g.plate(B({ id: 'listbox', size: [6.4, 13.6], pos: [SX, 0.07, 0], color: '#2d2944', label: 'listBox', labelSize: 0.34, labelOffset: [0, 0.3, -7.4] }));
      g.label('Array.Sort(elements,\n  NaturalStringComparer.Instance)\n数字の並びは数値として比べる:\nIMG_2 は IMG_10 より前', [SX + 0.4, 0.5, 6.9], { parent: 'belt', id: 'n-sort', size: 0.3 });
      for (i = 0; i < 6; i++) {
        g.label((i + 1) + '', [SX - 2.3, 0.5, rz(i)], { parent: 'belt', size: 0.26, color: '#b8b2d6' });
      }

      // ② 処理対象
      g.plate(B({ id: 'p-skip', size: [3.8, 13.6], pos: [SX * 2 - 2.2, 0.07, 0], color: '#2a2740', label: '選ばなかった\n(対象外)', labelSize: 0.32, labelOffset: [0, 0.3, -7.6] }));
      g.plate(B({ id: 'p-pick', size: [3.8, 13.6], pos: [SX * 2 + 2.2, 0.07, 0], color: '#35456b', label: '選んだ4件\n(対象)', labelSize: 0.32, labelOffset: [0, 0.3, -7.6] }));
      g.label('「選択項目のみ」ON:\n一覧で選択した項目だけ\nOFFなら一覧の全件', [SX * 2 + 0.2, 0.5, 6.9], { parent: 'belt', id: 'n-pick', size: 0.3 });

      // ③ タブで処理を選ぶ
      var lanes = ['名称変換 → Rename.Execute()', 'タイムスタンプ → TimeStamp.Execute()', '機能 → Function.Execute()'];
      for (j = 0; j < 3; j++) {
        g.plate(B({ id: 'lane' + j, size: [10, 4], pos: [SX * 3, 0.07, -5 + j * 5.5], color: j === 0 ? '#3d4f86' : '#2a2740', label: lanes[j], labelSize: 0.32, labelOffset: [0, 0.3, -2.4] }));
      }
      g.label('tabControl.SelectedIndex で分岐\n(button_Execute_Click)', [SX * 3, 0.5, 8.9], { parent: 'belt', id: 'n-tab', size: 0.32 });

      // ④ 名前を計算
      g.plate(B({ id: 'p-calc', size: [8.4, 14], pos: [SX * 4, 0.07, 0], color: NAVY }));
      for (j = 0; j < 4; j++) {
        g.label('index ' + j + ' → 1+' + j + ' = ' + (j + 1) + '\n0埋め3桁 → ' + NEWNAME[SELID[j]].replace('.jpg', ''), [SX * 4 + 3.2, 0.55, az(j)], { parent: 'belt', id: 'calc' + j, size: 0.3, color: C.gold });
      }
      g.label('GetChangedName(name, index)\n→ GetNumberedName', [SX * 4 - 0.5, 0.5, 8.0], { parent: 'belt', id: 'n-calc', size: 0.32 });

      // ⑤ 実際に変える + 復元用スタック
      g.plate(B({ id: 'p-move', size: [4.6, 14], pos: [SX * 5 - 1.5, 0.07, 0], color: NAVY, label: '同じフォルダの中で\nFile.Move(src → dst)', labelSize: 0.28, labelOffset: [0, 0.3, 7.4] }));
      g.label('復元スタック\n(StcProcessMemory)', [STACK_A[0], 3.9, 0], { parent: 'belt', id: 'n-stackA', size: 0.32, color: C.gold });
      g.label('① Increment\nSerialNumber()\n② 成功した1件ごとに\nAddRestoreItem(src, dst)', [SX * 5 + 4.4, 0.5, 5.4], { parent: 'belt', id: 'n-stackA2', size: 0.32 });
      g.label('積まれる中身 (src → dst)\nIMG_1.jpg → 001.jpg\nIMG_2.jpg → 002.jpg\nIMG_3.jpg → 003.jpg\nIMG_10.jpg → 004.jpg', [SX * 5 + 4.4, 0.5, -5.6], { parent: 'belt', id: 'n-stackA3', size: 0.28, color: C.gold });
      for (j = 0; j < 4; j++) {
        slabA[j] = g.box(B({ id: 'sA' + j, size: [3.2, 0.4, 1.7], pos: slotPos(STACK_A, j), color: '#d6a63a', edges: true }));
        slabA[j].visible = false;
      }

      // ⑥ ⑦ 一覧の更新と復元
      g.plate(B({ id: 'listbox2', size: [6.4, 13.6], pos: [SX * 6, 0.07, 0], color: '#2d2944', label: 'listBox(UpdateListBox)', labelSize: 0.32, labelOffset: [0, 0.3, -7.4] }));
      g.label('IMG_11 / IMG_20 は\n対象外だったのでそのまま', [SX * 6 + 0.3, 0.5, 6.9], { parent: 'belt', id: 'n-list2', size: 0.3 });
      g.label('復元スタック\n(あとから入れた順に取り出す)', [STACK_B[0], 3.9, 0], { parent: 'belt', id: 'n-stackB', size: 0.3, color: C.gold });
      g.label('「復元」: DecrementSerialNumber()\n→ HasRestoreItem() の間\nPopRestoreItem → Move(dst → src)', [STACK_B[0] - 0.4, 0.5, 5.9], { parent: 'belt', id: 'n-stackB2', size: 0.32 });
      g.label('取り出す順: 004 → 003 → 002 → 001', [STACK_B[0], 0.5, -5.2], { parent: 'belt', id: 'n-stackB3', size: 0.3, color: C.gold });
      for (j = 0; j < 4; j++) {
        slabB[j] = g.box(B({ id: 'sB' + j, size: [3.2, 0.4, 1.7], pos: slotPos(STACK_B, j), color: '#d6a63a', edges: true }));
      }

      // ファイルのブロック
      F.forEach(function (f, n) {
        files[n] = g.box(B({ id: 'f' + n, size: [1.9, 0.5, 0.9], pos: P(0, n), color: f.c, label: f.n, labelSize: 0.34, labelOffset: [0, 1.05, 0], edges: true }));
        files[n].userData.txt = f.n;
      });

      // ------------------------------------------------ タイムスタンプのシーン
      var TS = function (o) { o.parent = 'ts'; return o; };
      g.plate(TS({ id: 'ts-base', size: [5.6, 4], pos: [-9, 0.07, -3.5], color: '#3a3560', label: '基準日時 (BaseTicks)\n2024/05/03 9:00:00', labelSize: 0.39, labelOffset: [0, 0.3, 0] }));
      g.plate(TS({ id: 'ts-int', size: [5.6, 3], pos: [-9, 0.07, 2.5], color: '#3a3560', label: '加算間隔 (IntervalTicks)\n1分', labelSize: 0.39, labelOffset: [0, 0.3, 0] }));
      g.label('1件目 = 基準日時\ni件目 = BaseTicks + IntervalTicks × i', [0, 0.5, -8], { parent: 'ts', size: 0.47, color: C.gold });
      g.label('FileList の並び順 = 一覧の並び順', [0, 0.5, 7.8], { parent: 'ts', size: 0.39 });
      var tsFiles = [], tsClock = [], tsBars = [], tsTime = [];
      for (j = 0; j < 4; j++) {
        var zz = az(j), nm = NEWNAME[SELID[j]];
        g.box(TS({ id: 'tsf' + j, size: [1.9, 0.5, 0.9], pos: [0, 0.32, zz], color: F[SELID[j]].c, label: nm, labelSize: 0.35, labelOffset: [0, 0.85, 0] }));
        tsClock[j] = g.cylinder(TS({ id: 'tsc' + j, radius: 0.6, height: 0.14, pos: [5.2, 0.3, zz], color: '#4d4a63', segments: 40 }));
        tsTime[j] = g.label('9:0' + j + ':00', [5.2, 1.1, zz], { parent: 'ts', id: 'tst' + j, size: 0.39, color: '#ffffff' });
        tsBars[j] = [];
        ['#4fa3ff', '#5ee6a8', '#ff9f43'].forEach(function (cc, q) {
          var lab = j === 0 ? ['作成', '更新', 'アクセス'][q] : null;
          tsBars[j][q] = g.box(TS({ id: 'tsb' + j + '_' + q, size: [0.7, 0.35, 0.7], pos: [7.4 + q * 1.3, 0.3, zz], color: cc, emissive: cc, emissiveIntensity: 0.3, edges: false, label: lab, labelSize: 0.34, labelOffset: [0, 0.8, -0.9] }));
        });
        g.flow([-6.1, 0.6, -3.5], [4.4, 0.6, zz], { parent: 'ts', id: 'tsfl' + j, color: C.gold, lift: 1.4 + 0.4 * j, count: 3, size: 0.13, speed: 0.3 });
      }
      g.label('更新対象にチェックした日時だけ書き換える\n(FileInfo.CreationTime / LastWriteTime / LastAccessTime)', [8.2, 0.5, 7.2], { parent: 'ts', size: 0.36 });

      // ------------------------------------------------ 機能のシーン
      var FN = function (o) { o.parent = 'fn'; return o; };
      var rows = [-8, 0, 8];
      g.plate(FN({ id: 'fn-l0', size: [6.4, 5], pos: [-8, 0.07, rows[0]], color: '#3a3560', label: '元フォルダ', labelSize: 0.39, labelOffset: [-1.9, 0.3, -2.7] }));
      g.plate(FN({ id: 'fn-r0', size: [6.4, 5], pos: [8, 0.07, rows[0]], color: '#35456b', label: '移動先 (DestDir)', labelSize: 0.39, labelOffset: [-1.5, 0.3, -2.7] }));
      g.plate(FN({ id: 'fn-l1', size: [6.4, 5], pos: [-8, 0.07, rows[1]], color: '#3a3560', label: '元フォルダ', labelSize: 0.39, labelOffset: [-1.9, 0.3, -2.7] }));
      g.plate(FN({ id: 'fn-r1', size: [6.4, 5], pos: [8, 0.07, rows[1]], color: '#35456b', label: '移動先 (DestDir)', labelSize: 0.39, labelOffset: [-1.5, 0.3, -2.7] }));
      g.plate(FN({ id: 'fn-l2', size: [6.4, 5], pos: [-8, 0.07, rows[2]], color: '#3a3560', label: '対象フォルダ', labelSize: 0.39, labelOffset: [-1.7, 0.3, -2.7] }));
      g.label('移動 (Move)\nFile.Move / Directory.Move\n→ 成功したら AddRestoreItem(記録)', [0, 0.5, rows[0]], { parent: 'fn', size: 0.39, color: C.gold });
      g.label('コピー (Copy)\nFile.Copy(フォルダは未対応)\n→ 記録しない = 復元できない', [0, 0.5, rows[1]], { parent: 'fn', size: 0.39, color: C.data });
      g.label('空のフォルダを削除 (DelEmptyDir)\ncmd: dir /ad /b /s | sort /r → rd\n(rd は空のフォルダしか消せない)', [2.2, 0.5, rows[2]], { parent: 'fn', size: 0.39, color: C.enemy });
      g.label('移動先 = DestDir\\ファイル名だけ(サブフォルダは付かない)', [0, 0.5, -12.4], { parent: 'fn', size: 0.39 });
      var mv = [], cp = [], cg = [], fd = [];
      for (j = 0; j < 3; j++) {
        var xs = -9.6 + j * 1.9;
        mv[j] = g.box(FN({ id: 'mv' + j, size: [1.5, 0.5, 0.9], pos: [xs, 0.32, rows[0]], color: F[SELID[j]].c, label: F[SELID[j]].n.replace('.jpg', ''), labelSize: 0.38, labelOffset: [0, 0.9, 0] }));
        cp[j] = g.box(FN({ id: 'cp' + j, size: [1.5, 0.5, 0.9], pos: [xs, 0.32, rows[1]], color: F[SELID[j]].c, label: F[SELID[j]].n.replace('.jpg', ''), labelSize: 0.38, labelOffset: [0, 0.9, 0] }));
        cg[j] = g.box(FN({ id: 'cg' + j, size: [1.5, 0.5, 0.9], pos: [xs, 0.32, rows[1]], color: F[SELID[j]].c, opacity: 0.8, label: '(コピー)', labelSize: 0.32, labelOffset: [0, 0.9, 0] }));
        cg[j].visible = false;
      }
      var fdNames = ['photos', 'old(空)', 'tmp(空)'];
      for (j = 0; j < 3; j++) {
        fd[j] = g.box(FN({ id: 'fd' + j, size: [1.9, 0.4, 1.5], pos: [-9.6 + j * 2.2, 0.27, rows[2]], color: '#e0b85a', label: fdNames[j], labelSize: 0.31, labelOffset: [0, 0.7, 0] }));
      }
      g.box(FN({ id: 'fd-inner', size: [0.9, 0.3, 0.6], pos: [-9.6, 0.65, rows[2]], color: '#4fa3ff', edges: false }));
      g.label('photos は中にファイルがあるので残る', [-5.8, 0.5, rows[2] + 3.3], { parent: 'fn', size: 0.34 });

      // ------------------------------------------------ 設定の保存と読み込みのシーン
      var ST = function (o) { o.parent = 'st'; return o; };
      var ctl = ['comboBox_TargetDir\n(対象フォルダの履歴)', 'comboBox_String1\n(入力欄1の履歴)', 'comboBox_String2\n(入力欄2の履歴)', 'textBox_Target_Extension\n(フィルター)'];
      for (j = 0; j < 4; j++) {
        g.box(ST({ id: 'ctl' + j, size: [5.2, 0.7, 1.7], pos: [-12.5, 0.4, -6 + j * 4], color: '#4fa3ff', radius: 0.1, label: ctl[j], labelSize: 0.34, labelOffset: [0, 1, 0] }));

      {
        title: 'タイムスタンプの流れ',
