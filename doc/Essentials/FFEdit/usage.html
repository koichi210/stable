<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FFEdit 使い方</title>
<link rel="stylesheet" href="../lib/guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../lib/guide.js"></script>
<script src="ffe-img.js"></script>
<script src="ffe-common.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var XS = [-15.2, -7.6, 0, 7.6, 15.2];   // 5枚のスクショパネルの中心x(左から list / set / done / time / func)
  var GOLD = C.gold;
  var OVERVIEW = { pos: [0, 4.3, 38], target: [0, 3.9, 0] };

  GameGuide.start({
    title: 'FFEdit 使い方',
    subtitle: '実際の画面で、リストアップ → 名前を一括変換 → 実行 → 復元、タイムスタンプ、移動・コピーまでを1歩ずつ',
    camera: OVERVIEW,
    floor: false,

    build: function (g) {
      FFE.panel(g, 'p-list', 'list', XS[0]);
      FFE.panel(g, 'p-set', 'set', XS[1]);
      FFE.panel(g, 'p-done', 'done', XS[2]);
      FFE.panel(g, 'p-time', 'time', XS[3]);
      FFE.panel(g, 'p-func', 'func', XS[4]);
      var ly = FFE.H + 1.6;
      g.label('① リストアップ後\n(ダミーのファイル8件)', [XS[0], ly, 0.3], { size: 0.55, color: '#fff' });
      g.label('② 通し番号の設定\n(3桁・実行前)', [XS[1], ly, 0.3], { size: 0.55, color: '#fff' });
      g.label('③ 「実行」のあと', [XS[2], ly, 0.3], { size: 0.55, color: '#fff' });
      g.label('④ タイムスタンプ', [XS[3], ly, 0.3], { size: 0.55, color: '#fff' });
      g.label('⑤ 機能(移動・コピー)', [XS[4], ly, 0.3], { size: 0.55, color: '#fff' });
      g.arrow([XS[0] + 3.4, 4.2, 0.3], [XS[1] - 3.4, 4.2, 0.3], { color: GOLD, lift: 0.4, label: '設定', labelSize: 0.26 });
      g.arrow([XS[1] + 3.4, 4.2, 0.3], [XS[2] - 3.4, 4.2, 0.3], { color: GOLD, lift: 0.4, label: '実行', labelSize: 0.26 });

      // ステップごとに出す注目枠（ピクセルはスクショ上の座標）
      var L = XS[0], S = XS[1], D = XS[2], T = XS[3], F = XS[4];
      FFE.hl(g, 'h-dir', L, 79, 36, 395, 58);
      FFE.hl(g, 'h-listup', L, 403, 36, 479, 58, C.good);
      FFE.hl(g, 'h-list', L, 261, 65, 479, 488, C.good);
      FFE.hl(g, 'h-status', L, 13, 499, 250, 522, C.enemy);
      FFE.hl(g, 'h-target', L, 13, 70, 256, 192);
      FFE.hl(g, 'h-num', S, 21, 230, 244, 298);
      FFE.hl(g, 'h-digit', S, 163, 252, 236, 274, C.good);
      FFE.hl(g, 'h-modes', S, 21, 300, 244, 415);
      FFE.hl(g, 'h-str', S, 40, 422, 248, 470, C.good);
      FFE.hl(g, 'h-tabs', S, 13, 203, 189, 224, C.good);
      FFE.hl(g, 'h-done-list', D, 261, 65, 479, 488, C.good);
      FFE.hl(g, 'h-exec', D, 414, 499, 479, 522);
      FFE.hl(g, 'h-restore', D, 347, 499, 408, 522, C.enemy);
      FFE.hl(g, 'h-tabs-t', T, 13, 203, 189, 224, C.good);
      FFE.hl(g, 'h-date', T, 21, 255, 248, 303);
      FFE.hl(g, 'h-interval', T, 21, 318, 248, 360, C.good);
      FFE.hl(g, 'h-tsel', T, 23, 385, 248, 468, C.enemy);
      FFE.hl(g, 'h-fn-radio', F, 21, 232, 170, 290);
      FFE.hl(g, 'h-fn-dir', F, 35, 290, 248, 332, C.good);
      FFE.hl(g, 'h-savebtn', L, 259, 499, 339, 522, C.good);
    },

    steps: [
      {
        title: '全体の流れ',
        camera: OVERVIEW,
        html:
          '<p><b>FFEdit</b> は、フォルダの中のファイル(またはフォルダ)の<b>名前をまとめて変える</b>Windowsアプリ(WPF)です。名前の変換のほかに、<b>タイムスタンプの更新</b>と<b>移動・コピー・空フォルダの削除</b>もできます。</p>' +
          '<ol><li>上の「対象フォルダ」を決めて<b>リストアップ</b></li><li>下のタブで処理を選ぶ(<b>名称変換</b> / <b>タイムスタンプ</b> / <b>機能</b>)</li><li><b>実行</b>。間違えたら<b>復元</b></li></ol>' +
          '<p>写っているのは、このガイド用に作った<b>ダミーフォルダ</b>(<code>IMG_4821.jpg</code> など、中身が数バイトのファイル8個)です。ドラッグで回転、ホイールで拡大できます。</p>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml</code> / <code>MainWindow.xaml.cs</code></p>',
      },
      {
        title: '1. 対象フォルダを決めてリストアップ',
        camera: FFE.cam(XS[0], 246, 110, 8.4),
        show: ['h-dir', 'h-listup'],
        html:
          '<p>画面上の「対象フォルダ」にパスを入れて<b>リストアップ</b>を押すと、右の一覧にそのフォルダの中身が出ます。</p>' +
          '<ul><li>パスは<b>手入力</b>のほか、フォルダ(ファイルでも、その親フォルダ)を<b>ドラッグ＆ドロップ</b>で入れられます(入れただけでは一覧は変わらないので、このあと「リストアップ」)</li>' +
          '<li>以前入れたパスは<b>履歴</b>としてコンボボックスに残ります(「設定保存」を押したぶん)</li>' +
          '<li>欄で <code>Enter</code> を押すと、そのフォルダを<b>エクスプローラーで開きます</b></li>' +
          '<li>一覧は<b>自然順</b>。<code>IMG_2</code> が <code>IMG_10</code> より先に並びます</li></ul>' +
          '<p>一覧には、対象フォルダからの<b>相対パス</b>が出ます(サブフォルダ内のファイルなら <code>sub\\a.jpg</code> のように)。</p>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>UpdateListBox</code>、<code>_Common\\Wpf\\WpfPathDropControls.cs</code> の <code>ComboBoxEx</code>、<code>_Common\\NaturalStringComparer.cs</code></p>',
      },
      {
        title: '2. 「対象」の条件',
        camera: FFE.cam(XS[0], 246, 180, 9),
        show: ['h-target'],
        html:
          '<table><tr><th>項目</th><th>意味</th></tr>' +
          '<tr><td>フォルダ / ファイル</td><td>一覧に出すのが<b>フォルダ</b>か<b>ファイル</b>か。名前を変えるのも、この一覧に出ているものだけ</td></tr>' +
          '<tr><td>フィルター</td><td><code>*.jpg</code> のようなワイルドカード。<b>Enterで一覧を更新</b>(入力のたびに更新すると重いため)。空欄は <code>*</code> 扱い</td></tr>' +
          '<tr><td>サブフォルダも表示</td><td>サブフォルダの中まで一覧に含める(<code>AllDirectories</code>)</td></tr>' +
          '<tr><td>選択項目のみ</td><td>ONにすると、<b>一覧で選んだ項目だけ</b>を処理対象にする。OFFなら一覧の全件</td></tr></table>' +
          '<p>フォルダ/ファイル・サブフォルダのどちらかを切り替えると、一覧は自動で作り直されます。</p>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>UpdateListBox</code> / <code>GetFileList</code>(選択のみ → <code>WpfControlUtils.GetSelectedNames</code>)</p>',
      },
      {
        title: '3. 一覧の操作(Ctrl+A / コピー / Delete)',
        camera: FFE.cam(XS[0], 246, 290, 9.2),
        show: ['h-list', 'h-status'],
        html:
          '<p>一覧では複数選択(<code>Extended</code>)ができ、下のステータスバーに「総数=8 選択数=0」のように件数が出ます。</p>' +
          '<ul><li><code>Ctrl+A</code>: 全選択</li><li><code>Ctrl+C</code>: 選んだ名前をクリップボードへ</li><li><code>Ctrl+Shift+C</code>: <b>フルパス</b>でクリップボードへ</li></ul>' +
          '<div class="gg-note"><b>注意</b>: 一覧で <code>Delete</code> キーを押すと、確認(はい/いいえ)のあと、選んだファイル・フォルダを<b>ごみ箱を通さずに完全削除</b>します。「復元」でも戻せません。このガイドの撮影では押していません。</div>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>listBox_PreviewKeyDown</code> / <code>UpdateStatusBar</code></p>',
      },
      {
        title: '4. 名称変換: 通し番号',
        camera: FFE.cam(XS[1], 246, 265, 9),
        show: ['h-num', 'h-digit', 'h-tabs'],
        html:
          '<p>「名称変換」タブの1つ目が<b>通し番号</b>。一覧の並び順に、<code>001.jpg</code>、<code>002.jpg</code>… と付け替えます。</p>' +
          '<ul><li><b>最初の値</b>: 開始番号(整数。空欄や数字以外だと実行前にメッセージ)</li>' +
          '<li><b>桁</b>: <code>自動</code>、または 1〜6桁で0埋め。「自動」は<b>件数と最後の番号の大きい方の桁数</b>に合わせる(95から10件なら95〜104で3桁)ので、名前順がずれません</li>' +
          '<li><b>もとのファイル名を残す</b>: ONなら <code>001IMG_4821.jpg</code> のように<b>連番＋元の名前</b></li>' +
          '<li>拡張子は元のまま</li></ul>' +
          '<p>写真は「3桁」にしたところ(まだ実行前)。一覧はまだ <code>IMG_4821.jpg</code> のままです。</p>' +
          '<p class="gg-files">📄 <code>Rename.cs</code> の <code>GetNumberedName</code> / <code>GetAutoPaddingDigits</code>、<code>MainWindow.xaml.cs</code> の <code>GetPaddingDigits</code></p>',
      },
      {
        title: '5. 実行 → 結果、そして復元',
        camera: FFE.cam(XS[2], 246, 265, 9),
        show: ['h-done-list', 'h-exec', 'h-restore'],
        html:
          '<p><b>実行</b>を押すと、一覧の全件(「選択項目のみ」なら選択分)が一気にリネームされ、一覧が更新されます。③では <code>001.jpg</code>〜<code>008.jpg</code> になりました。</p>' +
          '<p>うまく変えられなかった項目があれば、「いくつかの処理が失敗しました。」のダイアログに <code>Src=…</code> / <code>Dst=…</code> で一覧表示されます(他の項目は処理されたまま)。</p>' +
          '<p><b>復元</b>を押すと、<b>直前の操作1回分</b>が元の名前に戻ります。続けて押せば、さらに前の操作へ戻れます。もう戻せないときは「これ以上復元できません」。</p>' +
          '<div class="gg-note">復元は<b>このアプリを開いている間だけ</b>有効です(記録はメモリ上)。閉じると戻せません。また、復元の対象は<b>名称変換</b>と<b>機能(移動)</b>のタブの操作で、タイムスタンプやコピー・空フォルダ削除は戻せません。</div>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>button_Execute_Click</code> / <code>button_Restore_Click</code>、<code>FileMng.cs</code> の <code>RestoreAll</code></p>',
      },
      {
        title: '6. ほかの変換(7種類)',
        camera: FFE.cam(XS[1], 246, 265, 9),
        show: ['h-modes', 'h-str'],
        html:
          '<table><tr><th>モード</th><th>動き</th></tr>' +
          '<tr><td>通し番号</td><td>連番に付け替え(前のステップ)</td></tr>' +
          '<tr><td>フォルダ名をファイル名に追加</td><td>サブフォルダ内のファイルに、フォルダ名を頭に付ける(<code>sub\\a.jpg</code> → <code>sub\\sub_a.jpg</code>)。「サブフォルダも表示」と組み合わせる</td></tr>' +
          '<tr><td>指定文字数だけ削除</td><td>「先頭から」N文字、「後方から」N文字(拡張子は除いて数える)を削る</td></tr>' +
          '<tr><td>拡張子変更</td><td>新しい拡張子。<code>.jpg</code> と点付きで入れてもOK。空欄だと実行前にメッセージ</td></tr>' +
          '<tr><td>指定文字の削除</td><td>入れた文字列を名前から消す</td></tr>' +
          '<tr><td>文字の追加</td><td>「先頭に追加」「後方に追加」(後方は拡張子の前)</td></tr>' +
          '<tr><td>文字の置換</td><td>「置換前」→「置換後」</td></tr></table>' +
          '<p>下の2つの入力欄(ラベルが「先頭から/後方から」「置換前/置換後」…と<b>モードごとに変わる</b>)は履歴つきで、「設定保存」で残せます。削る文字数が数字でない・名前より長いなどの<b>その1件だけ</b>がエラー一覧に出て、他は処理されます。</p>' +
          '<p class="gg-files">📄 <code>Rename.cs</code> の <code>ChangeType</code> / <code>GetChangedName</code>、<code>MainWindow.xaml.cs</code> の <code>SetNameChangeControlLabel</code> / <code>UpdateNameChangeControl</code></p>',
      },
      {
        title: '7. タイムスタンプの更新',
        camera: FFE.cam(XS[3], 246, 265, 9),
        show: ['h-tabs-t', 'h-date', 'h-interval', 'h-tsel'],
        html:
          '<p>「タイムスタンプ」タブは、対象の<b>作成・更新・アクセス日時</b>を書き換えます。④は「2024/05/03 9:00:00 から<b>1分ずつ</b>」にしたところ。</p>' +
          '<ul><li><b>基準日</b>と下の<b>時刻</b>(<code>H:mm:ss</code>。▲▼ボタン・<code>↑↓</code>キーで、<b>カーソルのある欄(時/分/秒)</b>だけ増減。桁上がりはしない)が<b>1件目</b>の日時</li>' +
          '<li><b>加算間隔</b>(無し/秒/分/時間/日)を<b>1件ごとに足す</b>。「無し」なら全件が同じ日時</li>' +
          '<li><b>更新対象</b>: 作成日時・更新日時・アクセス日時のチェックしたものだけ</li></ul>' +
          '<p>ダミーでは、8個が <code>9:00</code>、<code>9:01</code>、…、<code>9:07</code> になりました(実行して確認済み)。写真の並びを撮影順に見せたいときなどに使えます。</p>' +
          '<div class="gg-note">タイムスタンプの更新は「復元」で戻せません。</div>' +
          '<p class="gg-files">📄 <code>TimeStamp.cs</code>、<code>TimeText.cs</code>、<code>MainWindow.xaml.cs</code> の <code>ChangeTimeStamp</code> / <code>GetTickTime</code></p>',
      },
      {
        title: '8. 機能: 移動・コピー・空フォルダの削除',
        camera: FFE.cam(XS[4], 246, 265, 9),
        show: ['h-fn-radio', 'h-fn-dir'],
        html:
          '<table><tr><th>機能</th><th>動き</th></tr>' +
          '<tr><td>空のフォルダを削除</td><td>一覧の各フォルダの<b>中にある空のサブフォルダ</b>を、深い方から消す(「対象=フォルダ」で使う)。<b>戻せません</b></td></tr>' +
          '<tr><td>移動</td><td>一覧の項目を移動先へ移す。<b>復元で元に戻せます</b></td></tr>' +
          '<tr><td>コピー</td><td>ファイルを移動先へコピー(フォルダのコピーは未対応)。復元の対象外</td></tr></table>' +
          '<ul><li><b>フォルダを指定する</b>: OFFなら<b>対象フォルダ自体</b>が移動先。ONなら、下の欄(例: <code>R:\\Sorted</code>)へ。移動先は無ければ作ります</li>' +
          '<li>移動先では<b>ファイル名だけ</b>が使われる。サブフォルダの中身を、フォルダ指定なしで「移動」すると、<b>対象フォルダ直下へ集める</b>使い方もできます</li>' +
          '<li>移動先に同名があるなど失敗した項目は、エラー一覧に出ます</li></ul>' +
          '<p>⑤は「移動」で「フォルダを指定する」を入れたところ(ダミーでも押していません)。</p>' +
          '<p class="gg-files">📄 <code>Function.cs</code>、<code>FileMng.cs</code> の <code>Move</code> / <code>Copy</code> / <code>DeleteBlankDir</code></p>',
      },
      {
        title: 'おまけ: 設定の保存と保存先',
        camera: FFE.cam(XS[0], 246, 380, 9),
        show: ['h-savebtn'],
        html:
          '<p><b>設定保存</b>ボタン(または <code>Ctrl+S</code>)で、対象フォルダの履歴・下の2つの入力欄の履歴・フィルターを <code>FFEdit.json</code> に保存し、次回起動で復元します(押したときだけ保存。選んだモードやチェックは保存しません)。</p>' +
          '<ul><li>既定の保存先は <code>%LOCALAPPDATA%\\FFEdit\\</code>。exeと同じ場所の <code>DataFolder.txt</code>(1行目が保存先のパス)で場所を変えられます</li>' +
          '<li>タイトルバーを右クリック → <b>データ保存先を変更</b> でフォルダを選ぶと、設定ファイルを新しい場所へ引っ越せます。完了後は再起動せず、その場で新しい場所の設定を読み込みます(無ければ空っぽの初期状態)</li>' +
          '<li>ファイルが無い・壊れていても既定値で起動します</li></ul>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>SaveSetting</code> / <code>LoadProc</code> / <code>MoveSettingFile</code>、<code>_Common\\UserDataLocation.cs</code></p>',
      },
    ],
  });
})();
</script>
</body>
</html>
