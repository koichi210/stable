<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockRadar — stable</title>
<meta name="theme-color" content="#07040f">
<link rel="stylesheet" href="../../../portal/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../../../portal/catalog.js"></script>
<script src="../../../portal/magic.js"></script>
<script src="../../../portal/toolpage.js"></script>
</head>
<body>
<script>
ToolPage.start({
  root: '../../../',
  id: 'StockRadar',
  caption: '日本株の買い候補と、利確・損切りの目安を、決まったルールで一覧にする',
  lead: '日本株の<b>買い候補</b>と、買ったあとに売る値段（<b>利確・損切り</b>）の目安を、ボタンを押した時点のデータで一覧にするローカル専用ツールです（Node.js、npm パッケージなし）。' +
        '期間（<b>短期</b> 1〜2週間／<b>長期</b> 半年〜1年）と、100株を買うのに使える予算を入れると、Yahoo! Finance の公開データを決まったルールで点数にして、上位20銘柄を並べます。空売りの候補は出しません。',
  say: ['予算の中で買える日本株の候補を知りたい', '買ったあと、どこで売るかの目安がほしい', 'PER・PBR やゴールデンクロスで絞りたい', '前に調べた候補がその後どうなったか見たい'],
  sayTitle: 'こんなときに',
  nodes: [
    { id: 'user', type: 'person', label: '使う人', at: [-8.6, 0],
      desc: '期間と予算を入れて「買い候補を探す」を押し、結果のカードを見比べる人。' },
    { id: 'screen', type: 'screen', label: '株レーダーの画面', sub: 'public/', at: [-4.6, -2.6],
      desc: 'ブラウザで開く画面（<code>public/app.js</code>）。銘柄ごとのカードに、買いスコア・買いの範囲・利確・損切り・チャート・押しポイントを出す。下線の言葉を押すと用語集が開く。' },
    { id: 'ls', type: 'store', label: 'ブラウザの記録', sub: 'localStorage', at: [-5.4, 3.2],
      desc: '入力した予算・前回の結果・並び順を、ブラウザの localStorage に覚えておく。' },
    { id: 'app', type: 'main', label: 'StockRadar', sub: 'server.js', at: [-0.4, 0],
      desc: 'Node.js のサーバー。待ち受けは <code>127.0.0.1:8766</code> だけ。<code>/api/scan</code>（買い候補）・<code>/api/chart</code>（チャート）・<code>/api/snapshots</code>（スナップショット）を受け持つ。' },
    { id: 'snap', type: 'store', label: 'スナップショット', sub: 'snapshots/*.json', at: [0.6, 4.6],
      desc: '「📸 この結果を保存」で、調べた結果を <code>%LOCALAPPDATA%\\StockRadar\\snapshots\\&lt;保存した時刻&gt;.json</code> に1つずつ保存する。サーバーが書くのはこれだけ（ほかはログ）。' },
    { id: 'yahoo', type: 'service', label: 'Yahoo! Finance', sub: '株価・配当', at: [3.8, -3.2],
      desc: '公開データ（スクリーナー・日足・週足・配当履歴。約20分遅れ）。日足・週足は10分、配当は12時間覚えておく。' },
    { id: 'yjp', type: 'service', label: 'Yahoo!ファイナンス', sub: '優待ページ', at: [8.4, -2.2],
      desc: '日本の Yahoo!ファイナンスの優待ページ（<code>/quote/XXXX.T/incentive</code>）。HTML から読み取っている。' },
    { id: 'analyze', type: 'code', label: '判定のルール', sub: 'analyze.js', at: [4.8, 1.4],
      desc: '短期は <code>analyzeShort</code>（25日線・75日線・RSI・ATR・出来高）、長期は <code>analyzeLong</code>（PER・PBR・ROE・配当利回り・200日線など）で点を付け、買い・利確・損切りの値段を決める。' },
  ],
  links: [['user', 'screen'], ['screen', 'ls'], ['screen', 'app'], ['app', 'yahoo'], ['app', 'yjp'], ['app', 'analyze'], ['app', 'snap']],
  steps: [
    { by: 'user', title: '期間と予算を入れる', flow: [['user', 'screen'], ['screen', 'ls']],
      text: '期間（短期／長期）と、100株を買うのに使える予算（上限・下限）を入れる。必要なら PER・PBR・ゴールデンクロス／デッドクロスで絞り込む。入力はブラウザに覚えておく。' },
    { by: 'screen', title: '「買い候補を探す」でサーバーへ', flow: [['screen', 'app']],
      text: '画面が <code>/api/scan</code> に条件を送る。同じ条件なら3分間は前回の結果をそのまま返す。' },
    { by: 'app', title: 'Yahoo! Finance から集める', flow: [['app', 'yahoo'], ['yahoo', 'app']],
      text: 'スクリーナーで、100株の金額が予算に収まり、時価総額500億円以上の東証の銘柄を集める。日経平均の日足も取って、地合い（25日線・75日線との位置）を出す。PER・PBR の絞り込みは、日足を取る前に済ませる。',
      note: 'データは約20分遅れ' },
    { by: 'analyze', title: '決まったルールで点を付ける', flow: [['app', 'analyze'], ['analyze', 'app']],
      text: '短期は「押し目」「高値ブレイク」「決算後の初動」の形を日足から探し、長期は PER・PBR・ROE・配当利回り・200日線などで加点・減点する。',
      note: '短期は、7日以内に決算発表がある銘柄と、1日の売買代金が3億円未満の銘柄を外す。長期は赤字の銘柄を外す' },
    { by: 'analyze', title: '買い・利確・損切りの値段を出す', flow: [['analyze', 'app']],
      text: '短期は、損切りを買いから ATR の1.5倍下（7%より深くしない）、利確を損切り幅の2倍上にして、期限は10営業日。長期は、損切り10%下・利確20%上（52週高値が手前にあればその手前）。' },
    { by: 'app', title: '上位20銘柄に配当・優待を足して返す', flow: [['app', 'yahoo'], ['app', 'yjp'], ['yjp', 'app'], ['app', 'screen']],
      text: '点の高い順に20銘柄だけ、配当（100株での年額・権利確定月）と株主優待を取って足す。配当・優待は12時間覚えておく。',
      note: '優待ページは HTML から読み取っているので、ページの作りが変わると「取得できませんでした」になる' },
    { by: 'screen', title: 'カードとチャートで見比べる', flow: [['app', 'screen'], ['screen', 'user']],
      text: '銘柄ごとのカードに、買いスコア・買いの範囲・利確・損切り・100株での損益の目安と、押しポイント・気をつけるところを出す。チャート（日足100本・週足78本）は画面に近づいたカードから <code>/api/chart</code> で読み込む。' },
    { by: 'app', title: 'スナップショットで答え合わせ', flow: [['screen', 'app'], ['app', 'snap'], ['snap', 'app'], ['app', 'yahoo']],
      text: '結果を「📸 この結果を保存」で残しておくと、あとで開いたときに、保存した銘柄ごとの今の値段と、利確・損切りのどちらに先に届いたかを表で出す。',
      note: '同じ日に両方届いたときは、1日の中の順番が分からないので「同じ日に両方」とする' },
  ],
  pages: [
    { href: 'demo.html', icon: '📱', title: '機能デモ（実画面）', desc: '全体紹介（約2分）と、機能ごとの短いデモ（全8本）。探す・カードの見かた・チャート・絞り込み・並べ替え・スナップショット・用語集・配当と優待を、実際の画面にカーソルと字幕を重ねて見られる（数値はすべてダミー）' },
    { href: 'https://github.com/koichi210/Essentials/tree/main/StockRadar', icon: '📖', title: 'ソースと README', desc: '判定のルール（短期・長期・絞り込み・配当と優待・スナップショット）の表と、動かし方' },
  ],
  note: 'ソースは <code>Essentials/StockRadar</code>。決まったルールで機械的に判定しているだけで、決算の中身やニュースは読んでいません。<b>値上がりを保証するものではありません。</b>' +
        '待ち受けは <code>127.0.0.1</code> だけです。スマホから開くときは、自分の Tailscale（VPN）につないだ端末だけが開けるようにする仕組み（<code>remote-setup.ps1</code>）があり、インターネットには公開しません。',
});
</script>
</body>
</html>
