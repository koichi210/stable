<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoginHistory — stable</title>
<meta name="theme-color" content="#07040f">
<link rel="stylesheet" href="../../../portal/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<body>
<script>
ToolPage.start({
  root: '../../../',
  id: 'LoginHistory',
  caption: 'ボタンを押すたびに、今の日時をログへ1行書き足す',
  lead: 'PC が動いていた時刻を、ログファイルに1行ずつ書き残す小さな Windows アプリです（C++ / MFC）。' +
        '「ロギング実行」を押すたびに<b>今の日時を1行追記</b>し、前回から設定した間隔どおりでなければ<b>行末に <code>!</code></b> を付けます。' +
        'ずっと動き続ける常駐プログラムではなく、押されたら1行書いて待つだけです。',
  say: ['この PC がいつ動いていたか残したい', '止まっていた時間帯を <code>!</code> で見つけたい', '決めた間隔で記録できているか確かめたい'],
  sayTitle: 'こんなときに',
  shot: { src: 'img/2-path.png', title: 'LoginHistory', cap: '実際の画面（出力先はダミー）' },
  nodes: [
    { id: 'user', type: 'person', label: '使う人', at: [-8.5, 0], desc: '出力先を決めて「ロギング実行」を押す人。' },
    { id: 'dlg', type: 'screen', label: 'ダイアログ', sub: '出力先・ロギング実行', at: [-4.8, -2.8], img: 'img/2-path.png',
      desc: '小さなダイアログが1つだけ。「ログ出力先」の欄（起動のたびに <code>C:\\Alive.log</code> が入る）、「ロギング実行」、閉じるだけの「OK」。' },
    { id: 'app', type: 'main', label: 'LoginHistory', sub: 'OnBnClickedExec', at: [-0.6, 0],
      desc: 'ボタン1つのハンドラ <code>OnBnClickedExec</code> に仕事が集まっている。別スレッドもタイマーもなく、「読む → 比べる → 1行足す」の一直線。' },
    { id: 'clock', type: 'os', label: '今の日時', sub: 'time・localtime_s', at: [-4.4, 4.0],
      desc: '現在のエポック秒を取り、ローカル時刻に直す。ログには <code>YYYY.MM.DD_hh:mm:ss</code> の形で書く。' },
    { id: 'ini', type: 'store', label: 'set.ini', sub: 'Cycle=分（無ければ60）', at: [1.0, 4.6],
      desc: 'カレントフォルダにある設定ファイル。<code>Cycle=分</code> の1行だけを読む。<code>;</code> で始まる行はコメント。無ければ記録間隔は60分。' },
    { id: 'last', type: 'code', label: 'ReadLastTime', sub: '前回の日時', at: [4.0, -0.6],
      desc: 'ログの末尾30バイトから読める行のうち、最後の有効な日時を前回として返す。ファイル全体は読まない。' },
    { id: 'judge', type: 'code', label: 'IsOnSchedule', sub: '前回＋間隔 ±10秒', at: [8.4, -3.8],
      desc: '「前回 + 記録間隔」と今の差が 10 秒以内なら間隔どおり。外れていれば、書く行の末尾に <code> !</code> を足す。' },
    { id: 'log', type: 'file', label: 'ログファイル', sub: '1行ずつ追記', at: [8.4, 3.0],
      desc: '画面で指定した場所のテキストファイル。1行 = 1回の実行。無ければ新しく作り、あれば末尾に足す。過去の行は書き換えない。' },
  ],
  links: [['user', 'dlg'], ['dlg', 'app'], ['clock', 'app'], ['ini', 'app'], ['app', 'last'], ['last', 'judge'], ['log', 'last'], ['judge', 'log'], ['app', 'log']],
  steps: [
    { by: 'user', title: '出力先を決める', flow: [['user', 'dlg']], shot: 'img/1-start.png',
      text: '起動すると「ログ出力先」に毎回 <code>C:\\Alive.log</code> が入る。別の場所に書きたいときは、ログファイルのフルパスに書き換える。',
      note: '入力は保存されない。フォルダは作らないので、無いフォルダを指定すると何も書かれない（エラー表示も出ない）' },
    { by: 'app', title: '「ロギング実行」を押す', flow: [['dlg', 'app']], shot: 'img/2-path.png',
      text: '<code>OnBnClickedExec</code> が、画面の欄の文字を取り込む。このあとの処理は、すべてこの1回の呼び出しの中で終わる。' },
    { by: 'app', title: '記録間隔と今の日時をそろえる', flow: [['ini', 'app'], ['clock', 'app']],
      text: 'カレントフォルダの <code>set.ini</code> から <code>Cycle=分</code> を読み（無ければ60分）、今の日時をローカル時刻で取る。' },
    { by: 'app', title: 'ログを開く（無ければ作る）', flow: [['app', 'log']],
      text: 'ログを読み書き両用で開く。開けなければ新しく作り、今の日時の1行だけ書いて終わる（比べる前回が無いので、印は付かない）。' },
    { by: 'last', title: '前回の日時を読む', flow: [['log', 'last']],
      text: '<code>ReadLastTime</code> がログの末尾30バイトへ移り、読める行のうち最後の有効な日時を前回として返す。' },
    { by: 'judge', title: '間隔どおりかを判定する', flow: [['last', 'judge']],
      text: '<code>IsOnSchedule</code> が「前回 + 間隔」と今を比べ、差が10秒以内なら日時だけ、外れていれば行末に <code> !</code> を付ける。',
      note: '続けて2回押すと間隔から外れるので、2行目には必ず <code>!</code> が付く' },
    { by: 'app', title: '末尾へ1行書き足す', flow: [['judge', 'log']], focus: ['app', 'judge', 'log'],
      text: 'ファイルの末尾へ移って1行書き、閉じる。画面には何も出ず、ダイアログは開いたままなので、続けて押せばまた1行増える（「OK」で閉じる）。' },
  ],
  pages: [
    { href: 'usage.html', icon: '🖱️', title: '使い方', desc: '出力先を決める → ロギング実行 → set.ini で間隔を変える → ログの読みかた（全8ステップ）' },
    { href: 'demo.html', icon: '📱', title: '機能デモ（実画面）', desc: '全体紹介（約2分）と、機能ごとの短いデモ（全4本）。実際のダイアログで、出力先 → ロギング実行 → 「!」の印 → set.ini で間隔 → ログの読みかたを見られる' },
    { href: 'dataflow.html', icon: '🌊', title: 'データの流れ', desc: 'ボタン → set.ini → 現在時刻 → ログを開く → 前回と比べる → 1行追記を、ブロックの流れで追う（全8ステップ）' },
    { href: 'architecture.html', icon: '🧱', title: '内部設計', desc: '<code>LoginHistoryApp</code> / <code>LoginHistoryDlg</code> / <code>ReadLastTime</code> / <code>IsOnSchedule</code> などの役割と依存関係（全8ステップ）' },
  ],
  note: 'ソースは <code>Essentials/LoginHistory/Source</code>（実行ファイルは <code>Essentials/LoginHistory/Release</code>）。画面写真のログ出力先はこのガイド用のダミー、日時の例もダミーです。',
});
</script>
</body>
</html>
