<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<title>DigitalClock — stable</title>
<meta name="theme-color" content="#07040f">
<link rel="stylesheet" href="../../../portal/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<body>
<script>
ToolPage.start({
  root: '../../../',
  id: 'DigitalClock',
  caption: '最前面・半透明の小さな窓に、時刻だけを出しておく',
  lead: '時刻 <code>HH:mm:ss</code> だけを出す、小さなデジタル時計です（C# / WPF）。' +
        'ウィンドウは<b>いつも最前面</b>・<b>半透明</b>・<b>大きさ固定</b>で、時刻の部分をドラッグして好きな場所へ動かせます。' +
        '閉じるときに位置を覚えて、次に起動したときも同じ場所に出ます。設定画面やボタンはありません。',
  say: ['作業のじゃまにならない隅に時刻を出しておきたい', '秒まで見たい', '次に起動したときも同じ場所に出てほしい'],
  sayTitle: 'こんなときに',
  shot: { src: 'img/1-start.png', title: 'Clock', cap: '実際の時計の窓（拡大して表示）' },
  nodes: [
    { id: 'user', type: 'person', label: '使う人', at: [-8.5, 0], desc: '時計を見て、じゃまなら時刻の部分をドラッグして動かす人。' },
    { id: 'win', type: 'screen', label: '時計の窓', sub: 'HH:mm:ss', at: [-4.4, -2.8], img: 'img/1-start.png',

    { id: 'json', type: 'store', label: '位置の保存', sub: 'DigitalClock.json', at: [-4.4, 3.4],

    { id: 'app', type: 'main', label: 'DigitalClock', at: [0, 0],
      desc: 'C# / WPF の画面（<code>MainWindow</code>）。起動時に位置を戻し、タイマーで時刻を書き換え、閉じるときに位置を保存する。' },
    { id: 'timer', type: 'code', label: 'タイマー', sub: '0.5 秒ごと', at: [4.2, -3.6],

    { id: 'logic', type: 'code', label: 'Logic', at: [4.4, 0.4],
      desc: '画面に触らない処理。<code>FormatTime</code> で時刻を <code>HH:mm:ss</code> にし、<code>IsOnScreen</code> で保存位置が画面の中かを確かめる。' },
    { id: 'now', type: 'os', label: 'パソコンの時計', sub: 'DateTime.Now', at: [8.8, 0.4],
      desc: 'いまの時刻の出どころ。DigitalClock の入力はこれと設定ファイル1個だけ。' },
    { id: 'user32', type: 'os', label: 'user32.dll', sub: '半透明にする', at: [3.6, 4.4],
      desc: 'Windows の関数。ウィンドウを「レイヤードウィンドウ」にして、透明度 128（0〜255 の半分）を設定する。' },
  ],
  links: [['user', 'win'], ['win', 'app'], ['app', 'json'], ['timer', 'app'], ['app', 'logic'], ['now', 'logic'], ['app', 'user32']],

    { by: 'app', title: '起動: 最前面・半透明にする', flow: [['app', 'user32'], ['app', 'win']], shot: 'img/3-overlay.png',

    { by: 'timer', title: '0.5 秒ごとに知らせる', flow: [['timer', 'app']],

    { by: 'user', title: '時刻の部分をドラッグして動かす', flow: [['user', 'win'], ['win', 'app']], shot: 'img/3-overlay.png',
      text: '時刻の文字を左ボタンで押したまま動かすと、ウィンドウごと動く（WPF の <code>DragMove</code>）。マウスを重ねると、そのことがツールチップに出る。動かした位置は、この時点では保存しない。' },
    { by: 'app', title: '閉じるときに位置を保存する', flow: [['app', 'json']],
      text: 'タイマーを止めて、いまの左上の位置を JSON に書く。いったん <code>.tmp</code> に書き切ってから置き換えるので、途中で落ちても前のファイルは壊れない。大きさは文字で決まるので保存しない。',
      note: '保存に失敗しても（書き込めない・権限がない）、終了は止めない' },
  ],
  pages: [
    { href: 'usage.html', icon: '🖱️', title: '使い方', desc: '起動 → 時刻が進む → ドラッグで移動 → 半透明で重ねる → 位置を覚える（全7ステップ）' },
    { href: 'demo.html', icon: '📱', title: '機能デモ（実画面）', desc: '全体紹介（約1分15秒）と、機能ごとの短いデモ。時刻の出かた・最前面と半透明・ドラッグで動かす・位置を覚える、を実際の窓の画像で（背景のメモ帳は架空）' },
    { href: 'dataflow.html', icon: '🌊', title: 'データの流れ', desc: '500ms ごとのタイマー → 時刻の整形 → 画面。位置の復元、半透明化の仕掛け、終了時の保存まで（全7ステップ）' },
    { href: 'architecture.html', icon: '🧱', title: '内部設計', desc: '<code>MainWindow</code> / <code>Logic</code> / <code>WindowPlacement</code> と共通部品、<code>user32.dll</code> の関係（全6ステップ）' },
  ],
  note: 'ソースは <code>Essentials/DigitalClock</code>（共通部品は <code>Essentials/_Common</code>）。画面写真は、このガイド用に撮った時計の窓と見本テキストだけです。',
});
