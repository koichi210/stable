<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DigitalClock 機能デモ</title>
<!--
  DigitalClock の機能ごとのデモ(1機能=1本の短い動画風ページ)。demo.html?f=overlay のように機能を指定します。
  ・実際のアプリ(Release の DigitalClock.exe)を起動して撮った窓の画像を、架空のメモ帳(ダミー)の上に、実際の半透明(128/255)で重ねています。
    メモの内容・名前は、すべてデモ用に作った架空のものです。実際のデスクトップは写していません。
  ・窓は1枚ずつ PrintWindow で撮って合成しています(この環境では画面全体の撮影ができないため)。窓の移動は SetWindowPos で行い、
    ドラッグ中の見た目は「途中の位置」の画像で見せています。マウスにカーソルを重ねたときのツールチップは、撮っていません(字幕で説明しています)。
  ・素材は demo-img/ (撮影したままの 1280x720。拡大していない) と demo-pts.js (窓の位置。画像上の画素)。画面を変えたら撮り直してください。
  ・再生部品は ../lib/demo-player.js(Essentials共通)。
-->
<script src="../lib/demo-player.js"></script>
<script src="demo-pts.js"></script>
</head>
<body>
<script>
(function () {
  var FW = 1280, FH = 720;
  var CLOSE_DX = 18, CLOSE_DY = 17; // 窓の右端・上端から、×ボタンの中心まで(画像の画素)

  // ---- 台本の小道具(座標は demo-pts.js から。推測の座標は使わない) ----
  function P(s) { var r = window.DCPts[s]; if (!r) throw new Error('座標なし: ' + s); return r; }
  function ctr(s) { var c = P(s).client; return { x: c[0] + c[2] / 2, y: c[1] + c[3] / 2 }; }
  function closeBtn(s) { var w = P(s).win; return { x: w[0] + w[2] - CLOSE_DX, y: w[1] + CLOSE_DY }; }
  function boxOf(s) { var w = P(s).win, c = P(s).client; return { x: w[0] + 2, y: w[1] + 1, w: w[2] - 4, h: c[1] + c[3] - w[1] - 1, cx: w[0] + w[2] / 2, cy: (w[1] + c[1] + c[3]) / 2 }; }
  function markClock(d, s, label, dur) { var b = boxOf(s); d.mark({ x: b.x - 6, y: b.y - 5, w: b.w + 12, h: b.h + 10 }, { label: label || '', dur: dur || 3500 }); }
  function zoomClock(d, s, o) { // 時計のまわりへズーム(画面と同じ縦横比)
    o = o || {}; var b = boxOf(s), w = o.w || 520, h = w * FH / FW;
    var x = Math.min(Math.max(b.cx - w / 2, 0), FW - w), y = Math.min(Math.max(b.cy - h / 2, 0), FH - h);
    d.cam({ x: x, y: y, w: w, h: h }, { dur: o.dur });
  }
  function at(d, s, o) { var c = ctr(s); d.cursor(c.x, c.y, o); }
  var NOTE = '※ 背景のメモ帳は、デモ用に作った架空のものです(実際の画面ではありません)。';

  // ================= 部品(全体紹介と、機能別の動画で共用) =================
  function segTick(d, detail) {
    d.scene('tick1.jpg'); zoomClock(d, 'tick1', { w: 520, dur: 0 });
    d.cap('時刻は「時:分:秒」の形で出ます。24時間表示で、1桁の数字も 07:04:09 のように0を付けて2桁にそろえます。');
    zoomClock(d, 'tick1', { w: 520 }); markClock(d, 'tick1', '時:分:秒', 3200); d.wait(4200);
    d.scene('tick2.jpg', { fade: 120 });
    d.cap('表示は0.5秒ごとに書き換わるので、秒が進むたびに、数字が変わっていきます。');
    d.wait(4200);
    if (detail) {
      d.cap('設定画面やボタンは、ありません。起動すれば、すぐに時刻が出ます。\n窓の大きさは固定で、変えられません(閉じる「×」だけがあります)。');
      d.wait(5600);
    }
  }

  function segOverlay(d, detail) {
    d.scene('overlay.jpg'); zoomClock(d, 'overlay', { w: 520, dur: 0 });
    d.cap('時計の窓は、いつも最前面です。ほかのウィンドウを重ねても、時計は隠れません。\n' + NOTE);
    markClock(d, 'overlay', '最前面', 3400); d.wait(5000);
    d.cap('そして、半透明です(透明度は半分ほど)。\n後ろにある文字が、時計を通してうっすらと見えています。');
    markClock(d, 'overlay', '半透明', 3400); d.wait(5200);
    d.scene('overlay2.jpg'); d.cap('すこし場所を変えても、同じです。作業中の画面の上に出しておいても、後ろの文字が読めます。');
    zoomClock(d, 'overlay2', { w: 520, dur: 600 }); markClock(d, 'overlay2', '後ろの文字が透ける', 4200); d.wait(5000);
    if (detail) {
      d.cap('文字を読むじゃまにならないように、半透明にしています。\nタイトルバー付きのまま半透明にしているので、窓の上端のタイトルと「×」も、うっすらと見えます。');
      d.wait(6200);
    }
  }

  function segDrag(d, detail) {
    d.scene('drag-a.jpg'); zoomClock(d, 'drag-a', { w: 520, dur: 0 }); d.cursor(ctr('drag-a').x + 160, ctr('drag-a').y + 100, { dur: 0 });
    d.cap('時計は、時刻の部分をドラッグして、好きな場所へ動かせます。\nじゃまな場所に出ていたら、動かしましょう。');
    d.wait(3200);
    d.cap('時刻の文字に、マウスを合わせます。\n(マウスを重ねたままにすると、「時刻の部分を左ドラッグするとウィンドウを移動できる」と、ツールチップで教えてくれます)');
    at(d, 'drag-a', { dur: 1300 }); markClock(d, 'drag-a', '時刻の部分', 4200); d.wait(4200);
    d.cap('時刻の文字を、左ボタンで押したまま動かします。');
    d.click(); d.wait(300);
    var a = ctr('drag-a'), b = ctr('drag-b'), c = ctr('drag-c');
    d.scene('drag-b.jpg', { fade: 120 }); zoomClock(d, 'drag-b', { w: 520, dur: 1100 }); d.cursor(b.x, b.y, { dur: 1100 });
    d.scene('drag-c.jpg', { fade: 120 }); zoomClock(d, 'drag-c', { w: 520, dur: 1100 }); d.cursor(c.x, c.y, { dur: 1100 });
    d.cap('ボタンを離したところに、窓が止まります。');
    d.wait(3600);
    if (detail) {
      d.cap('動かせるのは、時刻の文字の部分です。\n窓の大きさは固定なので、動かしても、大きさは変わりません。');
      d.wait(5200);
    }
  }

  function segRemember(d, detail) {
    d.scene('drag-c.jpg'); zoomClock(d, 'drag-c', { w: 520, dur: 0 }); var c = ctr('drag-c'); d.cursor(c.x, c.y, { dur: 0 });
    d.cap('位置は、閉じるときに自動で覚えます。\n窓の右上の「×」で、時計を閉じてみます。');
    d.wait(2800);
    var x = closeBtn('drag-c'); d.cursor(x.x, x.y, { dur: 1100 }); markClock(d, 'drag-c', '「×」で閉じる', 2800); d.wait(1500); d.click();
    d.scene('closed.jpg'); d.cam(null, { dur: 300 });
    d.cap('閉じたときの左上の位置(Left と Top)が、設定ファイルに保存されます。\n場所は %LOCALAPPDATA%\\DigitalClock\\DigitalClock.json です。\n(いまの画面は、その中身を、架空のメモ帳で開いたものです)');
    d.cursor(FW * 0.72, FH * 0.8, { dur: 600 }); d.wait(7600);
    d.scene('restored.jpg');
    d.cap('次に起動したときは、保存した位置に、そのまま出ます。\n前に動かした場所を、覚えていてくれます。');
    zoomClock(d, 'restored', { w: 520, dur: 600 }); markClock(d, 'restored', '同じ場所に出る', 3600); d.wait(5600);
    if (detail) {
      d.cap('保存した位置が、画面の外になっているとき(モニターを外したあとなど)は、見えない場所に出ないように、初期位置(左上から 100,100 の位置)から始まります。\n設定ファイルが無い・壊れているときも、同じです。');
      d.wait(9000);
    }
  }

  // ================= 台本 =================
  var SCRIPTS = {};

  SCRIPTS.overview = function (d) {
    d.chapter('はじめに');
    d.scene('start.jpg'); zoomClock(d, 'start', { w: 520, dur: 0 });
    d.cap('DigitalClock は、時刻だけを出しておく、小さなデジタル時計です。\n画面の隅に置いて、ちらっと見るための道具です。\n' + NOTE);
    markClock(d, 'start', 'この小さな窓が時計', 4200); d.wait(6500);
    d.cap('このデモでは、時刻の出かた・最前面と半透明・動かしかた・位置の記憶を、順に見ていきます。');
    d.wait(4200);

    d.chapter('時刻が進む'); segTick(d, false);
    d.chapter('最前面・半透明'); segOverlay(d, false);
    d.chapter('動かす'); segDrag(d, false);
    d.chapter('位置を覚える'); segRemember(d, false);

    d.chapter('おわり');
    d.scene('restored.jpg'); zoomClock(d, 'restored', { w: 520 });
    d.cap('以上が、DigitalClock のできることです。\n時刻だけを出して、最前面・半透明で、位置も覚える、シンプルな時計です。\n機能ごとの詳しいデモは、「機能一覧」から見られます。');
    d.wait(7000);
  };

  SCRIPTS.tick = function (d) { d.chapter('時刻の出かた'); segTick(d, true); };
  SCRIPTS.overlay = function (d) { d.chapter('最前面・半透明'); segOverlay(d, true); };
  SCRIPTS.drag = function (d) { d.chapter('ドラッグで動かす'); segDrag(d, true); };
  SCRIPTS.remember = function (d) { d.chapter('位置を覚える'); segRemember(d, true); };

  function feat(id, icon, title, desc, sec) { return { id: id, icon: icon, title: title, desc: desc, sec: sec, script: SCRIPTS[id] }; }
  DesktopDemo.start({
    title: 'DigitalClock 機能デモ', icon: '🕒', back: 'index.html', backLabel: '← DigitalClock の図解にもどる',
    lead: 'DigitalClock は、時刻 <code>HH:mm:ss</code> だけを出す、小さなデジタル時計です。最初に全体紹介(約1分15秒)を見ると、できることがひととおり分かります。そのあと、気になるところを1本ずつの短いデモ(30秒〜1分ほど)で見られます。実際のアプリを起動して撮った窓の画像を、架空のメモ帳の上に重ねています。メモの内容や名前は、すべてデモ用に作った架空のものです。',
    frame: { w: FW, h: FH, title: 'DigitalClock(架空のメモ帳の上に置いたところ)' }, imgBase: 'demo-img/',
    features: [
      feat('overview', '🎬', '全体紹介', '時刻の出かた・最前面と半透明・動かしかた・位置の記憶を、ひととおり。', 'まずは全体を見る'),
      feat('tick', '🕒', '時刻の出かた', '「時:分:秒」の形で、0.5秒ごとに書き換わる。設定画面やボタンは無い。', '機能ごとのデモ'),
      feat('overlay', '🪟', '最前面・半透明', 'ほかの窓の上に出たまま、後ろの文字が透けて読める。', '機能ごとのデモ'),
      feat('drag', '🖱️', 'ドラッグで動かす', '時刻の部分を押したまま動かして、好きな場所へ置く。', '機能ごとのデモ'),
      feat('remember', '💾', '位置を覚える', '閉じるときに位置を保存して、次の起動でも同じ場所に出る。', '機能ごとのデモ')
    ]
  });
})();
</script>
</body>
</html>
