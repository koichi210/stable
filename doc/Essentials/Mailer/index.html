<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mailer — stable</title>
<meta name="theme-color" content="#07040f">
<link rel="stylesheet" href="../../../portal/portal.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="../../../portal/catalog.js"></script>
<script src="../../../portal/magic.js"></script>
<script src="../../../portal/toolpage.js"></script>
</head>
<body>
<script>
ToolPage.start({
  root: '../../../',
  id: 'Mailer',
  caption: '決めておいた宛先・件名・本文で、Gmail の作成画面をボタン1つで開く',
  lead: '宛先・件名・本文をあらかじめ入れておき、ボタン1つでブラウザに <b>Gmail の新規作成画面</b>を開く Windows 用ツールです（C# / WPF）。' +
        '件名には日付に置き換わる記号を書けて、<b>日付を1日ずつずらした作成画面をまとめて開く</b>こともできます。' +
        '開くだけで<b>送信はしません</b>。中身を確かめて、自分で送ります。',
  say: ['毎日同じ宛先に日報を書く', '件名に今日の日付を自動で入れたい', '1週間分の下書きをまとめて開きたい', '宛先のパターンを切り替えて使いたい'],
  sayTitle: 'こんなときに',
  shot: { src: 'img/main-filled.png', title: 'Mailer', cap: '実際の画面（宛先・件名はダミー）' },
  nodes: [
    { id: 'user', type: 'person', label: '使う人', at: [-8.5, 0], desc: '宛先・件名・本文を入れて、「ブラウザで表示」か「一括表示」を押す人。最後に送信ボタンを押すのもこの人。' },
    { id: 'ui', type: 'screen', label: 'Mailer の画面', sub: '宛先・件名・本文', at: [-4.6, -2.8], img: 'img/main-filled.png',
      desc: 'ブラウザパス、To / Cc / Bcc / 件名 / 本文、一括表示の設定（起点日・生成数・Reverse・インターバル）、保存したプロファイルの一覧が並ぶ。' },
    { id: 'json', type: 'store', label: '設定 JSON', sub: 'Mailer.json など', at: [-4.6, 3.4],
      desc: 'ブラウザパス・To・Cc・Bcc・件名・本文の6つを、名前を付けて保存する。既定の場所は <code>%LOCALAPPDATA%\\Mailer\\</code>。' },
    { id: 'app', type: 'main', label: 'Mailer', at: [0, 0],
      desc: 'C# / WPF の画面（<code>MainWindow</code>）。入力を集めて、Gmail の作成画面の URL を組み立て、ブラウザを起動する。' },
    { id: 'logic', type: 'code', label: 'Logic', sub: '日付の置換・エスケープ', at: [4.0, -3.6],
      desc: '画面に依存しない処理をまとめたクラス。件名の置換記号を日付にし、URL に入れる値をエスケープし、URL が長すぎないかを確かめる。' },
    { id: 'url', type: 'data', label: '作成画面の URL', at: [4.6, 0.4],
      desc: '<code>https://mail.google.com/mail/?view=cm&amp;fs=1</code> に、空でない項目だけを <code>to</code> / <code>cc</code> / <code>bcc</code> / <code>su</code>（件名）/ <code>body</code> として付けたもの。' },
    { id: 'batch', type: 'code', label: '一括表示', sub: '日付を1日ずつずらす', at: [2.8, 4.4],
      desc: '起点日から「生成数」の日数ぶん、件名の日付をずらしながら URL を作ってブラウザを開く、をくり返す。' },
    { id: 'browser', type: 'service', label: 'ブラウザ', sub: 'Gmail の作成画面', at: [8.8, 0.4],
      desc: 'ブラウザパスに書いたブラウザ（例: <code>chrome.exe</code>）に URL を渡して起動する。宛先・件名・本文が入った作成画面が開く。' },
  ],
  links: [['user', 'ui'], ['ui', 'app'], ['app', 'json'], ['app', 'logic'], ['logic', 'url'], ['app', 'batch'], ['batch', 'url'], ['url', 'browser']],
  steps: [
    { by: 'user', title: 'ブラウザと宛先・本文を入れる', flow: [['user', 'ui']], shot: 'img/main-filled.png',
      text: 'ブラウザパスに、作成画面を開くブラウザの exe（PATH が通っていれば <code>chrome.exe</code> のように名前だけでよい）を書く。To / Cc / Bcc はカンマ区切りで複数書ける。空の欄は作成画面でも空のまま。' },
    { by: 'user', title: '件名に日付の記号を書く', flow: [['user', 'ui']], shot: 'img/help.png',
      text: '件名には <code>%%today%%</code>・<code>%%tomorrow%%</code>・<code>%%weekend%%</code>（次の金曜）・<code>%%usersday%%</code>（起点日）・<code>%%dayofweek%%</code>（曜日）などを書ける。大文字で書くと年つき・曜日は正式名になる。「ヘルプ」で一覧が出る。',
      note: '置き換わるのは件名だけ。本文に書いた記号はそのまま残る' },
    { by: 'app', title: '「ブラウザで表示」で入力を集める', flow: [['ui', 'app']],
      text: '画面の値をまとめて読み取る。起点日が空なら今日を使う。',
      note: 'ブラウザパスのファイルが見つからないと「ファイルが存在しません」と出して、何も開かない' },
    { by: 'logic', title: '件名を日付に置き換えて、URL にする', flow: [['app', 'logic'], ['logic', 'url']],
      text: '件名の記号を日付に置き換え、各項目をエスケープしてから URL に付ける。「&amp;」「#」「+」「%」や改行が入っていても、途中で切れたり化けたりしない。' },
    { by: 'browser', title: 'ブラウザで作成画面を開く', flow: [['url', 'browser']],
      text: 'ブラウザに URL を渡して起動すると、宛先・件名・本文が入った Gmail の作成画面が開く。<b>送信はしない</b>ので、確かめてから自分で送る。',
      note: 'URL が 32,000 文字を超えるとブラウザに渡せないので、メッセージを出して止める（本文が長すぎるとき）' },
    { by: 'batch', title: '「一括表示」で日付をずらしてまとめて開く', flow: [['app', 'batch'], ['batch', 'url'], ['url', 'browser']],
      text: '起点日から「生成数」の日数ぶん、件名の <code>%%usersday%%</code> を1日ずつ進めて作成画面を開く。Reverse をオンにすると日付の遅い順に開く。宛先と本文は毎回同じ。',
      note: '1通開くごとに「インターバル」の時間だけ待つ。待っている間は画面を操作できない' },
    { by: 'app', title: '設定を名前を付けて保存する', flow: [['app', 'json'], ['json', 'app']],
      text: '「設定保存」で、ブラウザパス・To・Cc・Bcc・件名・本文を名前を付けて JSON に保存し、下の一覧から選ぶと読み込む。<code>Mailer.json</code> は次の起動で自動で読み込まれる。起点日・生成数・Reverse・インターバルは保存しない。' },
  ],
  pages: [
    { href: 'usage.html', icon: '🖱️', title: '使い方', desc: 'ブラウザパス → 宛先 → 件名の置換記号 → 本文 → ブラウザで表示 → 一括表示 → 設定の保存（全8ステップ）' },
    { href: 'dataflow.html', icon: '🔀', title: 'データの流れ', desc: '設定の読み込み → 入力値の取得 → 件名の日付置換 → URL エスケープ → 長さチェックとブラウザ起動 → 保存を、光る粒で追う（全9ステップ）' },
    { href: 'architecture.html', icon: '🧱', title: '内部設計', desc: '<code>MainWindow</code> / <code>Logic</code> / <code>WpfSaveRestore</code> など、画面・ロジック・共有部品・外部の層と依存の向き（全7ステップ）' },
  ],
  note: 'ソースは <code>Essentials/Mailer</code>（共有部品は <code>Essentials/_Common</code>）。画面写真は、図解用に作った<b>ダミー設定</b>（example.com の架空アドレス・架空の件名）で撮ったものです。',
});
</script>
</body>
</html>
