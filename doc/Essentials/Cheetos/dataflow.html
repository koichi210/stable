<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cheetos データの流れ</title>
<link rel="stylesheet" href="../lib/guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../lib/guide.js"></script>
</head>
<body>
<script>
(function () {
  var T = THREE, C = GameGuide.colors;
  var SX = 40;                                   // 場面(ステージ)どうしの間隔。各ステップは自分のステージだけを見る
  function X(k) { return SX * k; }
  var LS = 1.3;                                  // 文字の大きさの倍率(ステージを近くから見るため)
  var XSK = [0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 0.85, 1, 1, 0.85, 1, 0.85];   // ステージごとの横の縮め率(板の寸法が絡む場面は1)
  function P(k, x, y, z) { return [X(k) + x * XSK[k], y, z == null ? 0 : z]; }

  var COL = { ui: '#4fa3ff', th: '#ff9f43', file: '#3fbf8f', work: '#a56bff', json: '#3cc7de', bk: '#7d78a3', dim: '#3a3655', red: '#ff5f6d', gold: '#ffd166', card: '#2d2944' };
  var TITLES = ['全体の流れ', '① 画面の値を撮影スレッドへ', '② ループと行の実行', '③ 撮り方は3通り', '④ 待機と「中断」', '⑤ ファイル名の組み立て',
                '⑥ 進捗の報告', '⑦ 加工の共通パターン', '⑧ PictTrim の中身', '⑨ Rotation の中身', '⑩ DistOrient の中身', '⑪ PictMerge の中身', '⑫ 設定の保存と復元'];

  // 前面を向いた板(カード)。label は板の手前の面に出す
  function card(g, id, k, x, y, w, h, color, label, o) {
    o = o || {};
    var d = o.d || 0.4;
    return g.box({
      id: id, size: [w * XSK[k], h, d], pos: P(k, x, y, o.z || 0), color: color, opacity: o.opacity, edges: o.edges !== false, edgeColor: o.edgeColor,
      emissive: o.emissive, emissiveIntensity: o.ei, label: label, labelSize: (o.ls || 0.34) * LS, labelOffset: [0, 0, d / 2 + 0.05], labelColor: o.lc || '#ffffff',
    });
  }
  function lbl(g, text, k, x, y, o) { o = o || {}; return g.label(text, P(k, x, y, o.z == null ? 0.5 : o.z), { id: o.id, size: (o.size || 0.36) * LS, color: o.color || '#ffffff', bg: o.bg }); }
  function look(k, d) { return { pos: [X(k), 7.6, d || 22], target: [X(k), 7.4, 0] }; }
  function hex(c) { return new T.Color(c); }
  function mix(a, b, k) { return '#' + hex(a).lerp(hex(b), k).getHexString(); }
  function setC(g, id, c) { g.get(id).material.color.set(c); }

  // ---- 場面ごとの状態(update で使う) ----
  var S2_ROWS = [
    { y: 11, cap: true, mouse: false, txt: '1行目  Sleep 3000 / マウスなし / 撮る〇' },
    { y: 8.5, cap: true, mouse: true, txt: '2行目  Sleep 1000 / (640,360)へ移動 / 撮る〇' },
    { y: 6, cap: false, mouse: false, txt: '3行目  Sleep 空欄 / マウスなし / 撮る×' },
  ];
  var S2_NAMES = ['demo_0001_1.png', 'demo_0001_2.png', 'demo_0002_1.png', 'demo_0002_2.png'];
  var S2_SLAB = [];                                    // [{row, loop}] 撮れる順
  [0, 1].forEach(function (l) { [0, 1].forEach(function (r) { S2_SLAB.push({ l: l, r: r }); }); });
  var ROW_DUR = 2.4;

  var S7_FILES = [
    { n: 'demo_0001_1.png', y: 12.2, c: '#4f9dff' }, { n: 'demo_0001_2.png', y: 9.7, c: '#3fbf8f' },
    { n: 'demo_0002_1.png', y: 7.2, c: '#ff9f43' }, { n: 'demo_0002_2.png', y: 4.7, c: '#e86bb0' },
  ];

  // ---- update から使う補助(ステージ作成後に確定する値) ----
  var MH_ = 6;
  var FN_POS = [];
  (function () {
    var ws = [6.2, 2.6, 6.6, 2.0, 1.6, 2.0];
    var tot = ws.reduce(function (a, w) { return a + w + 0.3; }, -0.3), fx = -tot / 2;
    ws.forEach(function (w) { FN_POS.push([fx + w / 2, 8.4]); fx += w + 0.3; });
  })();
  function stopped_(T0) { return T0 >= 3.9; }

  var lastText = {};
  function setText(g, id, text, o) {
    if (lastText[id] === text) return;
    lastText[id] = text;
    o = o || {};
    g.setLabel(id, text, { size: (o.size || 0.36) * LS, color: o.color });
  }

  function setBoxLabel(g, id, text, o) {
    var key = id + '#box';
    if (lastText[key] === text) return;
    lastText[key] = text;
    o = o || {};
    g.setLabel(g.get(id).userData.label, text, { size: (o.size || 0.34) * LS, color: o.color });
  }

  GameGuide.start({
    title: 'Cheetos データの流れ',
    subtitle: '設定 → 撮影スレッド → (動かす・待つ・撮る)×行×繰り返し → PNG → 加工(バックアップ → 加工 → 上書き)。光の粒と板が流れていく',
    camera: look(0),
    floor: false,

    build: function (g) {
      g.scene.fog = null;
      g.controls.maxDistance = 70;
      var k, i;

      // 各ステージの背景と見出し
      for (k = 0; k <= 12; k++) {
        g.box({ id: 'bg' + k, size: [27.4, 16.6, 0.2], pos: P(k, 0, 7.6, -1.3), color: '#1b1830', edges: false });
        lbl(g, TITLES[k], k, 0, 15.6, { size: 0.5, z: 0.2 });
      }

      // ============ 0. 全体の流れ ============
      card(g, 'o-ui', 0, -11.5, 8.5, 5.2, 2.8, COL.ui, '画面の設定\n(MainWindow)');
      card(g, 'o-th', 0, -4.2, 8.5, 5.2, 2.8, COL.th, '撮影スレッド\n(CaptWindow)');
      card(g, 'o-dir', 0, 3.2, 8.5, 5.2, 2.8, COL.file, '保存先フォルダ\ndemo_0001_1.png…');
      card(g, 'o-work', 0, 10.5, 8.5, 5.2, 2.8, COL.work, '加工タブ\n(BackgroundWorker)');
      g.arrow(P(0, -8.7, 8.5), P(0, -6.9, 8.5), { color: C.gold, lift: 0.3, head: 0.3, label: 'Capture', labelSize: 0.28 * LS });
      g.arrow(P(0, -1.5, 8.5), P(0, 0.5, 8.5), { color: C.gold, lift: 0.3, head: 0.3, label: 'PNG保存', labelSize: 0.28 * LS });
      g.arrow(P(0, 5.9, 8.5), P(0, 7.8, 8.5), { color: C.gold, lift: 0.3, head: 0.3, label: '選んで実行', labelSize: 0.28 * LS });
      g.flow(P(0, -8.7, 8.5), P(0, -6.9, 8.5), { color: C.data, lift: 0.3, count: 3, size: 0.12 });
      g.flow(P(0, -1.5, 8.5), P(0, 0.5, 8.5), { color: C.data, lift: 0.3, count: 3, size: 0.12 });
      g.flow(P(0, 5.9, 8.5), P(0, 7.8, 8.5), { color: C.data, lift: 0.3, count: 3, size: 0.12 });
      card(g, 'o-json', 0, -11.5, 2.8, 5.2, 2.4, COL.json, 'Cheetos.json\n(設定の保存)', { lc: '#0d0c13' });
      g.arrow(P(0, -11.9, 4.2), P(0, -11.9, 6.9), { color: C.good, lift: 0.0, head: 0.3 });
      g.arrow(P(0, -11.1, 6.9), P(0, -11.1, 4.2), { color: C.gold, lift: 0.0, head: 0.3 });
      card(g, 'o-bk', 0, 10.5, 2.8, 5.2, 2.4, COL.bk, 'Bk_Trim / Bk_Rotate\n/ Bk_Merge');
      card(g, 'o-over', 0, 3.2, 2.8, 5.2, 2.4, COL.file, '加工した画像\n(同じ場所へ上書き)');
      g.arrow(P(0, 10.0, 7.0), P(0, 4.2, 4.1), { color: C.gold, lift: 0.5, head: 0.3, label: '上書き', labelSize: 0.28 * LS });
      g.arrow(P(0, 11.2, 7.0), P(0, 11.2, 4.1), { color: C.data, lift: 0.0, head: 0.3, label: '先に退避', labelSize: 0.28 * LS, labelColor: C.data });
      lbl(g, 'UIスレッド', 0, -11.5, 10.6, { color: '#bcd6ff', size: 0.34 });
      lbl(g, '別スレッド', 0, -4.2, 10.6, { color: '#ffd9ae', size: 0.34 });
      lbl(g, '別スレッド', 0, 10.5, 10.6, { color: '#e2ccff', size: 0.34 });
      lbl(g, '撮影(CaptureWindow タブ)', 0, -3.5, 13.2, { size: 0.42, color: '#ffd9ae' });
      lbl(g, '加工(PictTrim / Rotation / DistOrient / PictMerge / FileCollect)', 0, 7.5, 13.2, { size: 0.36, color: '#e2ccff' });
      lbl(g, '色つきの板が、ファイル(画像)です', 0, 0, 0.5, { size: 0.34, color: '#b8b2d6' });
      // 流れる画像(板)
      for (i = 0; i < 3; i++) g.box({ id: 'o-pic' + i, size: [0.9, 0.6, 0.2], pos: P(0, -4.2, 8.5, 0.6), color: ['#4f9dff', '#3fbf8f', '#ff9f43'][i], edges: false });

      // ============ 1. 画面の値を撮影スレッドへ ============
      card(g, 'u-ui', 1, -9.5, 7.6, 9.6, 12.2, '#26304f', '', { opacity: 0.9, edgeColor: '#4fa3ff' });
      lbl(g, 'UIスレッド(Button_Capture_Click)', 1, -9.5, 13.9, { size: 0.36, color: '#bcd6ff' });
      var ctl = [
        ['SavePath + SaveFilePrefix\n+ AddTimeStamp', 12.0], ['Capture対象(ラジオ3つ)', 10.2], ['cw_TextBox_Sleep', 8.6], ['cw_TextBox_Loop', 7.2], ['グリッド _cwRows\n(Sleep/X/Y/動作/Capture)', 5.4],
      ];
      ctl.forEach(function (c, j) { card(g, 'u-c' + j, 1, -9.5, c[1], 8, 1.3, COL.ui, c[0], { d: 0.3, ls: 0.3 }); });
      card(g, 'u-th', 1, 9.5, 7.6, 9.6, 12.2, '#4a3524', '', { opacity: 0.9, edgeColor: '#ff9f43' });
      lbl(g, '撮影スレッド(new Thread、STA)', 1, 9.5, 13.9, { size: 0.36, color: '#ffd9ae' });
      var slot = [['filePathPrefix', 12.0], ['captureTarget', 10.2], ['sleepMsecText', 8.6], ['loopCount', 7.2], ['gridRows\n(List<List<String>>のコピー)', 5.4]];
      slot.forEach(function (c, j) { card(g, 'u-s' + j, 1, 9.5, c[1], 8, 1.3, '#6b4a22', c[0], { d: 0.3, ls: 0.3 }); });
      for (i = 0; i < 5; i++) g.box({ id: 'u-pk' + i, size: [1.3, 0.8, 0.5], pos: P(1, -5.4, ctl[i][1], 0.8), color: C.gold, emissive: C.gold, emissiveIntensity: 0.3, edges: false });
      lbl(g, 'ここで全部読み取って、\nコピーを渡す', 1, 0, 12.4, { size: 0.34, color: '#ffd166' });
      lbl(g, '以降、スレッドは画面の\nコントロールに直接さわらない', 1, 0, 5.2, { size: 0.3, color: '#b8b2d6' });
      g.arrow(P(1, 5.2, 1.4), P(1, -5.2, 1.4), { color: C.data, lift: 0.9, head: 0.3, label: 'Dispatcher.Invoke\n(進捗バー・完了・エラー表示だけ)', labelSize: 0.28 * LS });
      g.flow(P(1, 5.2, 1.4), P(1, -5.2, 1.4), { color: C.data, lift: 0.9, count: 5, size: 0.12 });

      // ============ 2. ループと行の実行 ============
      lbl(g, 'ループ 1 / 2', 2, -8, 13.8, { id: 'l-loop', size: 0.5, color: '#ffd166' });
      S2_ROWS.forEach(function (r, j) { card(g, 'l-r' + j, 2, -8, r.y, 10.4, 2.0, '#34304f', r.txt, { d: 0.3, ls: 0.3 }); });
      g.box({ id: 'l-cur', size: [0.6, 2.2, 0.6], pos: P(2, -13.6, 11, 0.5), color: C.gold, emissive: C.gold, emissiveIntensity: 0.5, edges: false });
      card(g, 'l-p1', 2, 3.2, 11, 4.4, 2.0, '#3a3655', '① マウス\nMouseProc', { ls: 0.3 });
      card(g, 'l-p2', 2, 3.2, 8.5, 4.4, 2.0, '#3a3655', '② 待つ\nExecuteSleep', { ls: 0.3 });
      card(g, 'l-p3', 2, 3.2, 6, 4.4, 2.0, '#3a3655', '③ 撮る\nCaptureProc', { ls: 0.3 });
      card(g, 'l-dir', 2, 11.2, 8.4, 5.6, 9.2, COL.file, '', { opacity: 0.35, edgeColor: '#3fbf8f' });
      lbl(g, '保存先フォルダ', 2, 11.2, 13.4, { size: 0.34, color: '#aef0cf' });
      S2_NAMES.forEach(function (n, j) {
        g.box({ id: 'l-s' + j, size: [1.2, 0.8, 0.3], pos: P(2, 3.2, 6, 0.8), color: j < 2 ? '#4f9dff' : '#ff9f43', edges: false, label: n, labelSize: 0.3 * LS, labelOffset: [2.4, 0, 0.1] });
      });
      lbl(g, '表の上の行から順に。全行が終わったら、次のループ(繰り返し)へ', 2, 0, 1.6, { size: 0.32, color: '#b8b2d6' });
      lbl(g, '撮影番号(_1, _2)はループのたびに1へ戻る', 2, 0, 0.5, { size: 0.3, color: '#b8b2d6' });

      // ============ 3. 撮り方は3通り ============
      var lanes = [
        { y: 12, c: ['FullScreen\nCtrl+PrintScreen を送る', 'クリップボード\nに画面の画像', 'Clipboard.GetDataObject\n→ Image', 'Save()\n→ PNG'], f: 'SendKeys.SendWait("^{PRTSC}")' },
        { y: 7.5, c: ['CurrentWindow\nAlt+PrintScreen を送る', 'クリップボード\nに窓の画像', 'Clipboard.GetDataObject\n→ Image', 'Save()\n→ PNG'], f: 'SendKeys.SendWait("%{PRTSC}")' },
        { y: 3, c: ['CurrentScreen\nこの窓があるモニタ', 'Screen.FromControl\n(TargetWindow)', 'GetPhysicalBounds\n(EnumDisplaySettings)', 'CopyFromScreen\n→ Bitmap.Save()'], f: '' },
      ];
      var lx = [-10.8, -3.6, 3.6, 10.8];
      lanes.forEach(function (ln, a) {
        ln.c.forEach(function (t, b) {
          var col = b === 0 ? COL.th : b === 3 ? COL.file : COL.work;
          card(g, 'm-' + a + '-' + b, 3, lx[b], ln.y, 5.4, 2.4, col, t, { ls: 0.27 });
          if (b < 3) {
            g.arrow(P(3, lx[b] + 2.8, ln.y), P(3, lx[b + 1] - 2.8, ln.y), { color: C.gold, lift: 0.2, head: 0.25 });
            g.flow(P(3, lx[b] + 2.8, ln.y), P(3, lx[b + 1] - 2.8, ln.y), { color: C.data, lift: 0.2, count: 2, size: 0.1, speed: 0.5 });
          }
        });
      });
      lbl(g, 'SendKeys とクリップボードは STA スレッドでしか使えない → 撮影用スレッドを STA で起動', 3, 0, 14.0, { size: 0.3, color: '#ffd9ae' });
      lbl(g, 'CurrentScreen は倍率が100%以外のモニタでも欠けないよう、物理ピクセルの範囲で撮る', 3, 0, 0.6, { size: 0.3, color: '#b8b2d6' });

      // ============ 4. 待機と「中断」 ============
      lbl(g, 'Sleep 1500ms の場合(1秒ずつ待つ → 2回 → 2秒)', 4, -4, 13.6, { size: 0.36, color: '#ffffff' });
      lbl(g, 'Sleep 5000ms の途中で「中断」を押した場合', 4, -4, 8.8, { size: 0.36, color: '#ffffff' });
      for (i = 0; i < 5; i++) {
        card(g, 'w1-' + i, 4, -9 + i * 3.6, 11.4, 3.0, 1.8, COL.dim, i < 2 ? '1秒' : '', { ls: 0.3 });
        card(g, 'w2-' + i, 4, -9 + i * 3.6, 6.6, 3.0, 1.8, COL.dim, '1秒', { ls: 0.3 });
      }
      lbl(g, '→ 2回で終わり', 4, 10.4, 11.4, { size: 0.32, color: '#b8b2d6' });
      card(g, 'w-btn', 4, -10, 2.4, 5.0, 1.8, '#4a3a3a', 'ボタン「中断」', { ls: 0.3 });
      card(g, 'w-flag', 4, 2, 2.4, 6.4, 1.8, COL.file, 'IsStopRequest\n= false', { ls: 0.3 });
      g.arrow(P(4, -7.4, 2.4), P(4, -1.3, 2.4), { color: C.enemy, lift: 0.5, head: 0.3, label: '_cw.Stop()', labelSize: 0.3 * LS });
      lbl(g, 'for (timer=0; timer<SleepTime; timer+=1秒)\n{ if (IsStopRequest) break;  Thread.Sleep(1秒); }', 4, 0, 0.5, { size: 0.3, color: '#b8b2d6' });
      lbl(g, '中断で止まる', 4, 12.2, 6.6, { id: 'w-brk', size: 0.32, color: '#ff8a96' });

      // ============ 5. ファイル名の組み立て ============
      var fn = [
        { id: 'f0', t: 'D:\\Temp\\Demo\\Capture\\', w: 6.2, c: COL.ui, note: '保存先\ncw_TextBox_SavePath', sy: 12.5, sx: -9 },
        { id: 'f1', t: 'demo_', w: 2.6, c: COL.ui, note: '接頭辞+「_」', sy: 4.0, sx: -8 },
        { id: 'f2', t: '2026_10_26_10_00_00_', w: 6.6, c: COL.json, note: 'タイムスタンプ\n(ONの時だけ)', sy: 12.5, sx: 3, dim: true },
        { id: 'f3', t: '0001', w: 2.0, c: COL.th, note: 'ループ番号\ni.ToString("D4")', sy: 4.0, sx: 4 },
        { id: 'f4', t: '_1', w: 1.6, c: COL.work, note: '撮影番号 FileIdx\n(撮るたびに+1)', sy: 12.5, sx: 11 },
        { id: 'f5', t: '.png', w: 2.0, c: COL.file, note: '拡張子', sy: 4.0, sx: 12 },
      ];
      var tot = fn.reduce(function (a, f) { return a + f.w + 0.3; }, -0.3), fx = -tot / 2;
      fn.forEach(function (f) { f.fx = fx + f.w / 2; fx += f.w + 0.3; f.fy = 8.4; });
      fn.forEach(function (f) {
        card(g, f.id, 5, f.sx, f.sy, f.w, 1.5, f.c, f.t, { ls: 0.3, opacity: f.dim ? 0.55 : 1 });
        lbl(g, f.note, 5, f.fx, 6.2, { id: f.id + 'n', size: 0.26, color: '#b8b2d6' });
      });
      lbl(g, 'D:\\Temp\\Demo\\Capture\\demo_2026_10_26_10_00_00_0001_1.png', 5, 0, 10.8, { id: 'f-all', size: 0.44, color: '#ffd166' });
      lbl(g, '前半(保存先+接頭辞+時刻)は Capture を押した時に1回だけ作る(Logic.BuildFilePathPrefix)\n後半(ループ番号・撮影番号・.png)は撮るたびに足す', 5, 0, 2.6, { size: 0.3, color: '#b8b2d6' });
      fn.slice().forEach(function () { });

      // ============ 6. 進捗の報告 ============
      card(g, 'p-th', 6, -9, 7.6, 9.6, 11, '#4a3524', '', { opacity: 0.9, edgeColor: '#ff9f43' });
      lbl(g, '撮影スレッド', 6, -9, 12.9, { size: 0.36, color: '#ffd9ae' });
      for (i = 0; i < 4; i++) card(g, 'p-lp' + i, 6, -9, 11 - i * 2.2, 6.4, 1.6, '#6b4a22', 'ループ ' + (i + 1) + ' / 4 完了', { d: 0.3, ls: 0.3 });
      card(g, 'p-ui', 6, 9, 7.6, 12, 11, '#26304f', '', { opacity: 0.9, edgeColor: '#4fa3ff' });
      lbl(g, 'UIスレッド(処理状況)', 6, 9, 12.9, { size: 0.36, color: '#bcd6ff' });
      for (i = 0; i < 4; i++) g.box({ id: 'p-b' + i, size: [2.0, 1.2, 0.3], pos: P(6, 4.8 + i * 2.6, 9.4, 0), color: '#3a3655', edges: true });
      lbl(g, '開始: 10:00:00', 6, 6.8, 7.4, { size: 0.32 });
      lbl(g, '終了予想: (まだ空)', 6, 7.5, 6.2, { id: 'p-exp', size: 0.32, color: '#ffffff' });
      lbl(g, '0/4', 6, 12.6, 6.2, { id: 'p-cnt', size: 0.34, color: '#ffffff' });
      lbl(g, '進捗バー(ProgressBar_Status)', 6, 9, 10.9, { size: 0.28, color: '#b8b2d6' });
      for (i = 0; i < 4; i++) g.box({ id: 'p-pk' + i, size: [1.2, 0.8, 0.5], pos: P(6, -5, 11 - i * 2.2, 0.8), color: C.gold, emissive: C.gold, emissiveIntensity: 0.3, edges: false });
      lbl(g, 'Dispatcher.Invoke\nUpdateProgressBar()', 6, 0, 13.4, { size: 0.3, color: '#7ef0ff' });
      lbl(g, '終了予想 = 開始 + (経過時間 × 全体のループ数 ÷ 終わった数)\n1周目が終わった時に1回だけ表示(Logic.CalcExpectEndTime)', 6, 0, 1.6, { size: 0.3, color: '#b8b2d6' });

      // ============ 7. 加工の共通パターン ============

          '<ul><li>真っ白な帯は PNG で<b>とても小さく</b>圧縮でき、絵のある帯は大きくなる、という性質を使っています。白判定の長さと係数は、スキャン画像に合わせた実測値</li>' +
          '<li>デコードは画像1枚につき1回(<code>Bitmap</code> を左右の判定で使い回し)</li>' +
          '<li>振り分けは <code>FileMove</code>。失敗したものは <code>errorLog</code> にためて、最後にまとめて警告</li></ul>' +
          '<p class="gg-note">図の 739 / 933 は、このガイドの Sample 画面で実際に出た値の例です(<code>BaseSize=933</code>、左右とも739)。横長の方の値は説明用の仮の数字です。</p>' +
          '<p class="gg-files">📄 <code>Logic.cs</code> の <code>IsPortrait</code> / <code>GetTrimmedPngByteLength</code>、<code>DistOrient.cs</code> の <code>bkgWorkerOrient_DoWork</code>、<code>PicEdit.GetCanvasPngByteLength</code></p>',
      },
      // 11
      {
        title: '⑪ PictMerge の中身',
        camera: look(11),
        update: function (g, t) {
          var T0 = t % 10;
          var m1 = g.get('m2-b1'), m2 = g.get('m2-b2'), gh = g.get('m2-g');
          // バックアップ(結合先を先にコピー)
          gh.visible = T0 >= 0.3;
          var kg = g.phase(T0, 0.3, 1.0);
          g.lerpPos(gh, P(11, -9, 8, 0.25), P(11, 8.4, 4.6, 0.3), kg);
          gh.scale.setScalar(g.lerp(1, 0.4, kg));
          // 帯1・帯2を結合先へ
          var a = g.phase(T0, 2.0, 1.3), b = g.phase(T0, 3.6, 1.3);
          g.arcPos(m1, P(11, 0, 8 + MH_ / 2 - MH_ * 0.125, 0.3), P(11, -9, 8 + MH_ / 2 - MH_ * 0.125, 0.5), a, 1.2);
          g.arcPos(m2, P(11, 0, 8 - MH_ / 2 + MH_ * 0.125, 0.3), P(11, -9, 8 - MH_ / 2 + MH_ * 0.125, 0.5), b, 1.2);
          // 結合元をバックアップへ移す
          var s = g.get('m2-s');
          var ks = g.phase(T0, 6.2, 1.5);
          g.lerpPos(s, P(11, 0, 8, 0), P(11, 9.9, 4.6, 0.2), ks);
          s.scale.setScalar(g.lerp(1, 0.45, ks));
        },
        html:
          '<p>PictMerge は「<b>結合先</b>(識別子 <code>_1</code>)に、<b>結合元</b>(<code>_2</code>)の指定範囲を同じ位置へ貼る」処理です(<code>PictMerge.MergeExecute</code>)。</p>' +
          '<ol><li>選んだファイルのうち、名前に「識別子1+拡張子」(<code>_1.png</code>)を含むものだけが対象(<code>IsProcTarget</code>)。結合元の名前は、その部分を識別子2に置き換えて決めます(<code>ResolveMergeFilePath</code>)</li>' +
          '<li>結合先を <code>Bk_Merge</code> へバックアップ(<code>BackUpSourceFile</code>)</li>' +
          '<li>結合先をキャンバスに、結合元の画像を読み込み、<b>「開始,終了」の行ごとに</b>、高さ <code>開始〜終了</code> の帯(幅は画像の全幅)を、結合元から結合先の<b>同じ座標</b>へ <code>DrawImage</code>(<code>-</code> は開始なら0、終了なら画像の下端)</li>' +
          '<li>結合先を上書き保存。<b>結合元は <code>Bk_Merge</code> へ移動</b>(前回のバックアップがあれば置き換える)</li></ol>' +
          '<ul><li>結合先か結合元のファイルが無い項目は、飛ばして「ファイルが存在しません」をエラー欄にためます</li>' +
          '<li>範囲の書式チェックは、<b>始める前にUIスレッドで1回</b>だけ(<code>BuildInvalidTrimHeightsMessage</code>)。画像ごとに高さが違うため、「その画像では範囲外」の行は、その画像だけ飛ばします</li></ul>' +
          '<p class="gg-files">📄 <code>PictMerge.cs</code> の <code>PictMerge</code> クラス(<code>SetTargetFileName</code> / <code>IsProcTarget</code> / <code>BackUpSourceFile</code> / <code>ResolveMergeFilePath</code> / <code>MergeExecute</code>)、<code>PicEdit.CreateSourceImg</code> / <code>MergeExec</code></p>',
      },
      // 12
      {
        title: '⑫ 設定の保存と復元',
        camera: look(12),
        update: function (g, t) { },
        html:
          '<p>画面の値の保存は、<b>入れ物に登録した項目を、そのまま JSON にする</b>しくみです。</p>' +
          '<ol><li><code>RegisterSaveRestoreItems</code> で、<code>_sr.RegisterCtrl("CaptureWindow", "cw_TextBox_SavePath", cw_TextBox_SavePath)</code> のように、<b>コントロールを「属性名|項目名」のキーで登録</b>。表は <code>RegisterGrid("DataGrid", "Cell", Get, Set)</code></li>' +
          '<li><b>保存</b>(<code>Save</code>): 登録した項目の今の値を集めて <code>GenericProfile</code>(<code>Values</code> / <code>Lists</code> / <code>Grids</code>)にし、<code>JsonFileStorage.Save</code> で JSON ファイルへ(<code>AtomicFile</code> で書くので、途中で止まってもファイルが壊れにくい)</li>' +
          '<li><b>復元</b>(<code>Load</code> / <code>LoadOrDefault</code>): JSON を読み、登録した項目へ値を戻す。ファイルに無い項目は<b>登録時の既定値</b>に戻す</li></ol>' +
          '<ul><li>保存先: <code>%LOCALAPPDATA%\\Cheetos\\</code>。<b>exe と同じフォルダの <code>DataFolder.txt</code> の1行目</b>があれば、そのフォルダを使う(<code>UserDataLocation.GetUserDataFolder</code>)</li>' +
          '<li>キーを WinForms 版と同じにしてあり、<b>以前の版の設定ファイルをそのまま読める</b>。キー名の綴りを直した項目は、<code>legacyAttrValue</code> で旧キーも読む</li>' +
          '<li>表のセルを編集中に保存しても、編集中の値を確定してから集める(<code>CommitGridEdit</code>)</li></ul>' +
          '<p class="gg-files">📄 <code>MainWindow.xaml.cs</code> の <code>RegisterSaveRestoreItems</code> / <code>GetGridRows</code> / <code>SetGridRows</code>、<code>_Common/Wpf/WpfSaveRestore.cs</code>、<code>JsonFileStorage.cs</code>、<code>UserDataLocation.cs</code></p>',
      },
    ],
  });

})();
</script>
