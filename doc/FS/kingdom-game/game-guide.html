<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>陣形と城壁（仮） | 仕組み図解</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;

  // ================================================================
  //  ゲームのデータ（kingdom-game/js の値をそのまま写したもの）
  // ================================================================
  var P = 'plain', H = 'hill', F = 'forest', R = 'river';
  var TERR = {
    plain:  { name: '平地', move: 1, def: 0,  col: '#56763f' },
    hill:   { name: '丘',   move: 1, def: 3,  col: '#9a7a4a' },
    forest: { name: '森',   move: 1, def: 1,  col: '#2b5e35' },
    river:  { name: '河川', move: 2, def: -1, col: '#2c6cb0' },
  };
  // stages.js の field1「蟻ヶ原の初陣」
  var FIELD = [
    [P, P, H, P, H, P, P],
    [P, F, P, P, P, F, P],
    [P, P, R, R, R, P, P],
    [P, H, P, P, P, H, P],
    [P, P, P, P, P, P, P],
    [P, P, P, P, P, P, P],
  ];
  // stages.js の siege1「朱鷺口の城攻め」
  var SIEGE = [
    [P, P, P, P, P, P, P],
    [P, P, P, P, P, P, P],
    [P, P, P, P, P, P, P],
    [P, H, P, P, P, H, P],
    [F, P, P, P, P, P, F],
    [P, P, P, P, P, P, P],
    [P, P, P, P, P, P, P],
  ];
  // units.js
  var UT = {
    infantry: { name: '歩兵', hp: 32, atk: 9,  range: 1, move: 2, cat: 'infantry', beats: 'cavalry',  def: 0, cost: 2 },
    cavalry:  { name: '騎兵', hp: 28, atk: 11, range: 1, move: 3, cat: 'cavalry',  beats: 'archer',   def: 0, cost: 3 },
    archer:   { name: '弓兵', hp: 20, atk: 10, range: 2, move: 1, cat: 'archer',   beats: 'infantry', def: 0, cost: 2 },
    pike:     { name: '戟兵', hp: 38, atk: 8,  range: 1, move: 1, cat: 'pike',     beats: null,       def: 2, cost: 3 },
    hq:       { name: '本陣', hp: 50, atk: 4,  range: 1, move: 0, cat: null,       beats: null,       def: 2, cost: 0 },
    ram:      { name: '衝車', hp: 44, atk: 6,  range: 1, move: 1, cat: null,       beats: null,       def: 1, cost: 4, siegeAtk: 20 },
    ladder:   { name: '雲梯', hp: 24, atk: 7,  range: 1, move: 1, cat: null,       beats: null,       def: 0, cost: 3, siegeAtk: 12 },
  };
  // provinces.js の PROVINCES
  var PROV = [
    ['owari', '尾張', ['mikawa', 'mino', 'ise'], 40, 55, 0],
    ['mikawa', '三河', ['owari', 'ise', 'totomi'], 55, 62, 2],
    ['mino', '美濃', ['owari', 'omi', 'shinano'], 38, 33, 1],
    ['ise', '伊勢', ['owari', 'mikawa', 'yamato'], 33, 78, 1],
    ['omi', '近江', ['mino', 'echizen', 'yamashiro'], 18, 35, 2],
    ['suruga', '駿河', ['totomi', 'kai', 'musashi'], 70, 55, 2],
    ['kai', '甲斐', ['suruga', 'shinano', 'kouzuke'], 76, 33, 3],
    ['echizen', '越前', ['omi', 'kaga'], 10, 14, 3],
    ['totomi', '遠江', ['mikawa', 'suruga'], 62, 60, 2],
    ['shinano', '信濃', ['mino', 'kai'], 55, 40, 2],
    ['kaga', '加賀', ['echizen'], 14, 22, 4],
    ['musashi', '武蔵', ['suruga', 'kouzuke'], 68, 44, 3],
    ['kouzuke', '上野', ['kai', 'musashi', 'mutsu'], 66, 26, 4],
    ['mutsu', '陸奥', ['kouzuke'], 75, 8, 5],
    ['yamashiro', '山城', ['omi', 'yamato', 'harima'], 10, 46, 3],
    ['yamato', '大和', ['ise', 'yamashiro'], 18, 64, 2],
    ['harima', '播磨', ['yamashiro', 'aki'], 2, 50, 4],
    ['aki', '安芸', ['harima', 'iyo'], 2, 74, 5],
    ['iyo', '伊予', ['aki', 'chikuzen'], 10, 90, 5],
    ['chikuzen', '筑前', ['iyo'], 2, 95, 6],
  ];

  // ================================================================
  //  ルールの再現（battle.js / board.js / ai.js と同じ計算）
  // ================================================================
  var DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  function tAt(T, r, c) { return (T[r] && T[r][c]) || 'plain'; }
  function manhattan(r1, c1, r2, c2) { return Math.abs(r1 - r2) + Math.abs(c1 - c2); }

  // board.js computeReachable() と同じダイクストラ法
  function computeReachable(T, sr, sc, budget, isBlocked) {
    var rows = T.length, cols = T[0].length;
    var dist = new Map(), visited = new Set();
    function key(r, c) { return r + ',' + c; }
    dist.set(key(sr, sc), 0);
    for (;;) {
      var ck = null, cc = Infinity;
      dist.forEach(function (cost, k) { if (!visited.has(k) && cost < cc) { ck = k; cc = cost; } });
      if (ck === null) break;
      visited.add(ck);
      var rc = ck.split(',').map(Number);
      DIRS.forEach(function (d) {
        var nr = rc[0] + d[0], nc = rc[1] + d[1];
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) return;
        if (isBlocked(nr, nc)) return;
        var cost = cc + TERR[tAt(T, nr, nc)].move;
        if (cost > budget) return;
        var nk = key(nr, nc);
        if (!dist.has(nk) || cost < dist.get(nk)) dist.set(nk, cost);
      });
    }
    dist.delete(key(sr, sc));
    return dist;
  }

  // battle.js computeDamage()
  function computeDamage(att, def, T, mult) {
    var dmg = att.atk;
    if (att.beats && def.cat && att.beats === def.cat) dmg = Math.round(dmg * 1.5);
    dmg -= TERR[tAt(T, def.r, def.c)].def;
    dmg -= def.def || 0;
    dmg = Math.round(dmg * (mult || 1));
    return Math.max(1, dmg);
  }

  function mkUnit(id, owner, type, r, c, label) {
    var u = UT[type];
    return { id: id, owner: owner, type: type, r: r, c: c, hp: u.hp, atk: u.atk, range: u.range, move: u.move,
      cat: u.cat, beats: u.beats, def: u.def, isHQ: type === 'hq', label: label };
  }

  // ai.js runEnemyTurn() と同じ手順で、敵の番に起きることを記録する
  function simEnemyTurn(units, T) {
    var events = [];
    function blocked(r, c) { return units.some(function (u) { return u.r === r && u.c === c; }); }
    function targetsOf(u) {
      var eff = u.range + (tAt(T, u.r, u.c) === 'forest' && u.cat === 'archer' ? 1 : 0);
      return units.filter(function (v) { return v.owner !== u.owner && manhattan(u.r, u.c, v.r, v.c) <= eff; });
    }
    var ids = units.filter(function (u) { return u.owner === 'enemy' && !u.isHQ; }).map(function (u) { return u.id; });
    ids.forEach(function (id) {
      var u = units.filter(function (x) { return x.id === id; })[0];
      if (!u) return;
      var acted = false;
      var targets = targetsOf(u);
      if (targets.length === 0) {
        var pl = units.filter(function (v) { return v.owner === 'player'; });
        if (pl.length) {
          var nearest = pl.slice().sort(function (a, b) { return manhattan(u.r, u.c, a.r, a.c) - manhattan(u.r, u.c, b.r, b.c); })[0];
          var reach = computeReachable(T, u.r, u.c, u.move, blocked);
          var best = null, bestD = manhattan(u.r, u.c, nearest.r, nearest.c);
          reach.forEach(function (cost, k) {
            var rc = k.split(',').map(Number);
            var d = manhattan(rc[0], rc[1], nearest.r, nearest.c);
            if (d < bestD) { bestD = d; best = rc; }
          });
          if (best) {
            events.push({ type: 'move', id: id, who: u.label, toward: nearest.label, from: [u.r, u.c], to: best });
            u.r = best[0]; u.c = best[1]; acted = true; // 移動した時点で acted=true（攻撃はできない）
          }
        }
      }
      if (targets.length > 0 && !acted) {
        var tg = targets.slice().sort(function (a, b) { return a.hp - b.hp; })[0];
        var dmg = computeDamage(u, tg, T);
        tg.hp = Math.max(0, tg.hp - dmg);
        events.push({ type: 'attack', id: id, who: u.label, target: tg.id, tname: tg.label, dmg: dmg, hp: tg.hp, from: [u.r, u.c], at: [tg.r, tg.c] });
        if (tg.hp <= 0) units = units.filter(function (v) { return v.id !== tg.id; });
      }
    });
    return events;
  }

  // 敵の番の例：自軍は 本陣(5,3)・歩兵(4,1)・騎兵(3,3)
  var SIM_UNITS = [
    mkUnit('f-php', 'player', 'hq', 5, 3, '自軍本陣'),
    mkUnit('f-ehq', 'enemy', 'hq', 0, 3, '敵本陣'),
    mkUnit('f-einf1', 'enemy', 'infantry', 2, 1, '敵の歩兵A'),
    mkUnit('f-einf2', 'enemy', 'infantry', 2, 5, '敵の歩兵B'),
    mkUnit('f-earc', 'enemy', 'archer', 1, 3, '敵の弓兵'),
    mkUnit('f-ecav', 'enemy', 'cavalry', 2, 3, '敵の騎兵'),
    mkUnit('f-pinf', 'player', 'infantry', 4, 1, '自軍の歩兵'),
    mkUnit('f-pcav', 'player', 'cavalry', 3, 3, '自軍の騎兵'),
  ];
  var EVENTS = simEnemyTurn(SIM_UNITS.map(function (u) { return Object.assign({}, u); }), FIELD);
  var BASE_POS = {};
  SIM_UNITS.forEach(function (u) { BASE_POS[u.id] = [u.r, u.c]; });
  BASE_POS['f-pcav'] = [4, 3]; // 盤の基本形では騎兵は配置直後の (4,3)

  // 移動範囲の例：騎兵(4,3) 移動3
  var REACH = computeReachable(FIELD, 4, 3, 3, function (r, c) {
    return SIM_UNITS.some(function (u) { var p = BASE_POS[u.id]; return p[0] === r && p[1] === c; });
  });

  // ダメージ計算の例
  var DUEL = [
    { a: 'cavalry', d: 'archer', t: 'plain' },
    { a: 'infantry', d: 'pike', t: 'hill' },
    { a: 'archer', d: 'cavalry', t: 'river' },
    { a: 'infantry', d: 'cavalry', t: 'forest' },
  ].map(function (e) {
    var A = UT[e.a], D = UT[e.d];
    var dmg = computeDamage({ atk: A.atk, beats: A.beats }, { cat: D.cat, def: D.def, r: 0, c: 0 }, [[e.t]]);
    var adv = A.beats === D.cat;
    var s = adv ? A.atk + ' × 1.5 = ' + (A.atk * 1.5) + ' → ' + Math.round(A.atk * 1.5) : String(A.atk);
    var td = TERR[e.t].def, sub = false;
    if (td) { s += (td > 0 ? ' − ' + td : ' + ' + (-td)) + '（' + TERR[e.t].name + '）'; sub = true; }
    if (D.def) { s += ' − ' + D.def + '（' + D.name + 'の守り）'; sub = true; }
    if (sub) s += ' = ' + dmg;
    e.text = A.name + ' → ' + D.name + '（' + TERR[e.t].name + '）\n' + s;
    e.dmg = dmg;
    e.row = '<tr><td>' + A.name + '→' + D.name + '</td><td>' + TERR[e.t].name + '</td><td>' + s.replace(/（[^）]*）/g, '') + '</td><td><b>' + dmg + '</b></td></tr>';
    return e;
  });

  // 攻城戦：矢櫓の狙い（siege.js pickTowerTarget：射程内でHP最小）
  var SIEGE_PL = [
    { id: 's-ram', name: '衝車', r: 1, c: 3, hp: 44, def: 1 },
    { id: 's-lad', name: '雲梯', r: 1, c: 4, hp: 24, def: 0 },
    { id: 's-php', name: '本陣', r: 6, c: 3, hp: 50, def: 2 },
  ];
  function towerPick(tr, tc) {
    var inR = SIEGE_PL.filter(function (u) { return manhattan(tr, tc, u.r, u.c) <= 3; });
    inR.sort(function (a, b) { return a.hp - b.hp; });
    var t = inR[0];
    return { t: t, dmg: Math.max(1, 7 - TERR[tAt(SIEGE, t.r, t.c)].def - t.def) };
  }
  var TOWER_L = towerPick(0, 1), TOWER_R = towerPick(0, 5);

  // ================================================================
  //  座標
  // ================================================================
  var S = 1.2, PY = 0.27;
  function fpos(r, c, y) { return [(c - 3) * S, y == null ? PY : y, (r - 2.5) * S]; }
  var SX = -14;
  function spos(r, c, y) { return [(c - 3) * S, y == null ? PY : y, (r - 3) * S]; } // siege グループ内
  var CZ = -17;
  function cpos(p, y) { return [(p[3] - 39) * 0.2, y == null ? 0.2 : y, (p[4] - 51) * 0.14]; } // conq グループ内
  var PX = -14, PZ = -17, PS = 0.8;
  function ppos(x, y, h) { return [(x - 5.5) * PS, h == null ? 0.2 : h, (y - 4.5) * PS]; } // pvp グループ内
  var ARCH = 20;
  var TRI = [0, 0, 9.5];

  function shorten(a, b, d) {
    var dx = b[0] - a[0], dz = b[2] - a[2], L = Math.sqrt(dx * dx + dz * dz) || 1;
    return [[a[0] + dx / L * d, a[1], a[2] + dz / L * d], [b[0] - dx / L * d, b[1], b[2] - dz / L * d]];
  }

  // 駒（円柱＋ラベル）
  function piece(g, id, parent, text, owner, pos, o) {
    o = o || {};
    var col = owner === 'player' ? C.me : owner === 'enemy' ? C.enemy : (o.color || C.neutral);
    return g.cylinder({ id: id, parent: parent, radius: o.radius || 0.38, height: o.height || 0.3, pos: pos, color: col,
      label: text, labelSize: o.labelSize || 0.24, labelBg: owner === 'player' ? '#0b1f3dcc' : '#3d0b14cc', labelOffset: [0, o.labelY || 0.5, 0] });
  }

  // ラベル書き換えのキャッシュ（毎フレーム作り直さないように）
  var LC = {};
  var TOFF = 0; // 動作確認用の時間オフセット（通常は0）
  function setL(g, key, sprite, text, o) {
    if (LC[key] === text) return;
    LC[key] = text;
    g.setLabel(sprite, text, o);
  }
  function pieceLabel(g, id) { return g.get(id).userData.label; }
  var PL_OPT = { size: 0.24, bg: '#0b1f3dcc' }, EN_OPT = { size: 0.24, bg: '#3d0b14cc' };

  function lunge(k) { return Math.sin(Math.PI * Math.min(1, Math.max(0, k))); }

  // 敵の番（EVENTS）を t0 秒から dur 秒ずつ再生する。戻り値は今再生中のイベント番号
  function playEnemy(g, t, t0, dur, dmgId) {
    var cur = -1;
    var dmgLbl = g.get(dmgId);
    dmgLbl.visible = false;
    EVENTS.forEach(function (e, i) {
      var s = t0 + i * dur;
      if (t >= s) cur = i;
      var k = g.phase(t, s, dur * 0.6);
      if (e.type === 'move') {
        var a = fpos(e.from[0], e.from[1]), b = fpos(e.to[0], e.to[1]);
        g.lerpPos(e.id, a, b, k);
      } else {
        var A = fpos(e.from[0], e.from[1]), B = fpos(e.at[0], e.at[1]);
        var l = lunge(g.linear(t, s, dur * 0.5)) * 0.45;
        g.setPos(e.id, [A[0] + (B[0] - A[0]) * l, PY + l * 0.6, A[2] + (B[2] - A[2]) * l]);
        if (t >= s + dur * 0.25 && t < s + dur) {
          dmgLbl.visible = true;
          var up = g.linear(t, s + dur * 0.25, dur * 0.75);
          dmgLbl.position.set(B[0], 1.3 + up * 0.6, B[2]);
          setL(g, dmgId, dmgLbl, '−' + e.dmg + '（残り' + e.hp + '）', { size: 0.3, color: '#ff8a8a', bg: '#000000bb' });
        }
      }
    });
    return cur;
  }

  // ---- 説明文に使う、計算結果から作った文 ----
  var EVENT_HTML = '<ol>' + EVENTS.map(function (e) {
    if (e.type === 'move') return '<li>' + e.who + '：射程内に敵なし → 一番近い' + e.toward + 'へ (' + e.from.join(',') + ')→(' + e.to.join(',') + ')</li>';
    return '<li>' + e.who + '：射程内でHPが一番低い' + e.tname + 'を攻撃 <b>−' + e.dmg + '</b>（残りHP ' + e.hp + '）</li>';
  }).join('') + '</ol>';
  var riverReach = false;
  REACH.forEach(function (cost, k) { var rc = k.split(',').map(Number); if (FIELD[rc[0]][rc[1]] === R) riverReach = true; });

  GameGuide.start({
    title: '陣形と城壁（仮）',
    back: '../index.html',
    subtitle: '兵種の三すくみ×地形で戦う陣形バトル＋攻城戦＋国盗り（素のHTML/CSS/JavaScript・ビルド不要）',
    camera: { pos: [0, 9.5, 9.5], target: [0, 0, 0.3] },

    build: function (g) {
      // ================= 野戦の盤（蟻ヶ原の初陣 7×6） =================
      g.group('field', {});
      g.plate({ parent: 'field', size: [7 * S + 0.5, 6 * S + 0.5], pos: [0, 0.01, 0], color: '#1d2a1b', opacity: 1, radius: 0.2 });
      for (var r = 0; r < 6; r++) {
        for (var c = 0; c < 7; c++) {
          var t = FIELD[r][c], p = fpos(r, c, 0.05);
          g.plate({ id: 'ft-' + r + '-' + c, parent: 'field', size: [S * 0.94, S * 0.94], pos: p, color: TERR[t].col, opacity: 1, radius: 0.08,
            emissive: t === R ? '#0b2e66' : undefined, emissiveIntensity: t === R ? 0.6 : undefined });
          if (t === H) g.cylinder({ parent: 'field', radiusTop: 0.2, radius: 0.5, height: 0.1, pos: [p[0], 0.13, p[2]], color: '#b08d58' });
          if (t === F) {
            g.cylinder({ parent: 'field', radiusTop: 0.01, radius: 0.17, height: 0.5, pos: [p[0] - 0.33, 0.33, p[2] - 0.3], color: '#3f8a4a', segments: 10 });
            g.cylinder({ parent: 'field', radiusTop: 0.01, radius: 0.14, height: 0.4, pos: [p[0] + 0.34, 0.28, p[2] - 0.32], color: '#3f8a4a', segments: 10 });
          }
        }
      }
      g.plate({ id: 'deploy-zone', parent: 'field', size: [7 * S, 2 * S], pos: [0, 0.1, 2 * S], color: C.me, opacity: 0.2, thickness: 0.01, radius: 0.1 });
      g.label('自軍の配置エリア（4・5行目）', [0, 0.3, 3 * S + 0.65], { id: 'lbl-deploy', parent: 'field', size: 0.26, color: '#bcd6ff' });
      g.label('敵の陣地（0行目に敵本陣）', [0, 0.3, -3 * S - 0.6], { id: 'lbl-enemyside', parent: 'field', size: 0.26, color: '#ffc2c8' });

      // 駒
      g.group('fpieces', {});
      piece(g, 'f-php', 'fpieces', '本陣', 'player', fpos(5, 3));
      piece(g, 'f-ehq', 'fpieces', '本陣', 'enemy', fpos(0, 3));
      piece(g, 'f-einf1', 'fpieces', '歩兵', 'enemy', fpos(2, 1));
      piece(g, 'f-einf2', 'fpieces', '歩兵', 'enemy', fpos(2, 5));
      piece(g, 'f-earc', 'fpieces', '弓兵', 'enemy', fpos(1, 3));
      piece(g, 'f-ecav', 'fpieces', '騎兵', 'enemy', fpos(2, 3));
      piece(g, 'f-pinf', 'fpieces', '歩兵', 'player', fpos(4, 1));
      piece(g, 'f-pcav', 'fpieces', '騎兵', 'player', fpos(4, 3));
      piece(g, 'p-hero', 'fpieces', '白央（武将）', 'player', fpos(4, 2), { color: C.gold });
      g.setColor('p-hero', '#ffd166');

      // 地形の説明ラベル
      g.group('tlabels', {});
      var tl = function (r, c, txt) { var q = fpos(r, c, 1.05); g.label(txt, q, { parent: 'tlabels', size: 0.22, bg: '#000000aa' }); };
      tl(3, 1, '丘：守+3');
      tl(1, 5, '森：守+1\n弓は射程+1');
      tl(2, 4, '河川：移動2\n守−1');
      tl(4, 5, '平地');

      // 配置・ターンの流れ用
      g.label('ターン1　コスト 6 / 14', [0, 2.3, -4.6], { id: 'lbl4', size: 0.36, bg: '#000000bb', color: '#ffd166' });
      g.plate({ id: 'hand4', size: [1.7, 3.0], pos: [5.6, 0.04, 2.0], color: '#2a3550', opacity: 0.9, label: '配置できるユニット', labelOffset: [0, 0.3, -1.8], labelSize: 0.22 });
      [['歩兵 コスト2', -1.05], ['騎兵 コスト3', -0.35], ['弓兵 コスト2', 0.35], ['戟兵 コスト3', 1.05]].forEach(function (h) {
        g.cylinder({ parent: 'hand4', radius: 0.2, height: 0.14, pos: [-0.45, 0.1, h[1]], color: C.me });
