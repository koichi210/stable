<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>そだてもん | 仕組み図解</title>
<link rel="stylesheet" href="./guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="./guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;
  var GREEN = '#5c7a52', PAPER = '#f5f0e1', ACCENT = '#b1402a', GOLD = '#b6892f';
  // 各エリアの中心
  var CR = [-14, 0, 0];     // はじまりの育成（初代）
  var LA = [0, 0, 13];      // ラーニング
  var GA = [13, 0, 0];      // ガチャ
  var AW = [13, 0, 13];     // 覚醒・合成・編成
  var MAP = [0, 0, -16];    // 日本統一マップ
  var BAT = [-16, 0, -15];  // 4×4 バトル
  var ARCH = 30;            // プログラム構成図
  var VER_Z = 12;           // バージョン年表（x=ARCH 付近）

  function P(base, d) { return [base[0] + d[0], base[1] + d[1], base[2] + d[2]]; }

  // ---- sodatemon-magna.html の TERRITORIES / WARLORDS をそのまま写したもの ----
  var TERR = {
    '沖縄': [0, 0, ['鹿児島']], '鹿児島': [1, 0, ['沖縄', '宮崎', '長崎']], '宮崎': [2, 0, ['鹿児島', '大分']],
    '長崎': [0, 1, ['鹿児島', '佐賀']], '佐賀': [1, 1, ['長崎', '福岡', '熊本']], '福岡': [2, 1, ['佐賀', '大分']],
    '熊本': [1, 2, ['佐賀', '大分']], '大分': [2, 2, ['宮崎', '福岡', '熊本', '香川']],
    '香川': [3, 1, ['大分', '愛媛', '徳島']], '愛媛': [3, 2, ['香川', '徳島', '高知', '広島']], '徳島': [4, 1, ['香川', '高知']],
    '高知': [4, 2, ['愛媛', '徳島', '兵庫']], '広島': [3, 3, ['愛媛', '岡山', '島根']], '岡山': [4, 3, ['広島', '兵庫', '鳥取']],
    '島根': [2, 3, ['広島', '鳥取']], '鳥取': [4, 4, ['岡山', '島根', '兵庫']], '兵庫': [5, 2, ['高知', '岡山', '鳥取', '京都', '奈良']],
    '京都': [5, 3, ['兵庫', '滋賀', '奈良']], '奈良': [6, 3, ['兵庫', '京都', '三重']], '滋賀': [5, 4, ['京都', '岐阜']],
    '三重': [6, 4, ['奈良', '岐阜', '愛知']], '岐阜': [5, 5, ['滋賀', '三重', '愛知', '長野']], '愛知': [6, 5, ['三重', '岐阜', '静岡']],
    '静岡': [7, 5, ['愛知', '長野', '山梨', '神奈川']], '長野': [6, 6, ['岐阜', '静岡', '山梨', '新潟']], '山梨': [7, 6, ['静岡', '長野', '東京']],
    '神奈川': [8, 5, ['静岡', '東京', '埼玉']], '東京': [8, 6, ['山梨', '神奈川', '埼玉', '千葉']], '埼玉': [8, 7, ['東京', '神奈川', '千葉', '栃木']],
    '千葉': [9, 6, ['東京', '埼玉', '栃木']], '栃木': [8, 8, ['埼玉', '千葉', '群馬', '福島']], '群馬': [7, 7, ['栃木', '新潟', '長野']],
    '新潟': [6, 7, ['長野', '群馬', '福島']], '福島': [8, 9, ['栃木', '新潟', '宮城']], '宮城': [8, 10, ['福島', '岩手']],
    '岩手': [8, 11, ['宮城', '青森']], '青森': [8, 12, ['岩手', '北海道']], '北海道': [8, 13, ['青森']],
  };
  var WARLORDS = [
    ['#ff6b6b', ['沖縄', '鹿児島']], ['#ff8c8c', ['長崎']], ['#ffa5a5', ['宮崎', '大分']], ['#ffb8b8', ['佐賀']],
    ['#ffcccc', ['福岡']], ['#ffdddd', ['熊本']], ['#ffe066', ['高知']], ['#ffd700', ['香川']], ['#ffb600', ['徳島']],
    ['#66b2ff', ['愛媛']], ['#4d94ff', ['広島', '岡山', '島根']], ['#3d84ff', ['鳥取']], ['#ff6b9d', ['兵庫', '京都']],
    ['#c44569', ['奈良']], ['#ff4444', ['滋賀', '岐阜', '愛知']], ['#ff7755', ['静岡']], ['#ffaa44', ['山梨', '長野']],
    ['#6666ff', ['神奈川', '東京', '埼玉', '千葉']], ['#8844ff', ['新潟', '群馬']], ['#44ff44', ['宮城', '栃木']],
    ['#66ff66', ['岩手']], ['#88ff88', ['福島']], ['#aaffaa', ['青森']], ['#cccccc', ['北海道']],
  ];
  var OWNER_COLOR = {};
  WARLORDS.forEach(function (w) { w[1].forEach(function (t) { if (!OWNER_COLOR[t]) OWNER_COLOR[t] = w[0]; }); });
  var PLAYER_COLOR = '#44ff44';
  var CELL = 1.15;
  function mapPos(name, y) {
    var t = TERR[name];
    return [MAP[0] + (t[0] - 4.5) * CELL, y == null ? 0.05 : y, MAP[2] - (t[1] - 6.5) * CELL];
  }
  var CONQUEST = ['沖縄', '鹿児島', '長崎', '宮崎', '佐賀', '大分', '香川', '愛媛', '広島', '岡山'];

  // ---- 初代の育成 ----
  var STAGES = [['たまご', 0], ['めばえ', 15], ['わかば', 40], ['わかぎ', 80], ['たいじゅ', 140]];
  function stageOf(exp) { var k = 0; STAGES.forEach(function (s, i) { if (exp >= s[1]) k = i; }); return k; }
  function stageX(i) { return CR[0] + (i - 2) * 2.4; }
  function expX(e) { return CR[0] - 5 + Math.min(e, 150) / 150 * 10; }

  // ---- 4×4 バトル ----
  function cellPos(r, c) { return [BAT[0] + (c - 1.5) * 1.2, 0.05, BAT[2] + (r - 1.5) * 1.2]; }
  var CASTLE_ME = P(BAT, [-3.8, 0, 0]), CASTLE_EN = P(BAT, [3.8, 0, 0]);

  var shown = {};
  function setLbl(g, id, txt, o) { if (shown[id] === txt) return; g.setLabel(id, txt, o); shown[id] = txt; }
  function bar(g, id, v, max, h) {
    var b = g.get(id); var s = Math.max(0.02, v / max);
    b.scale.y = s; b.position.y = (h * s) / 2 + 0.05;
  }

  function creature(g, id, stage, pos) {
    g.group(id, { pos: pos });
    g.cylinder({ parent: id, id: id + '-ped', radius: 0.8, height: 0.2, pos: [0, 0.1, 0], color: '#4a4466' });
    if (stage === 0) {
      var egg = g.sphere({ parent: id, id: id + '-egg', radius: 0.55, pos: [0, 0.85, 0], color: '#f3e7c9' });
      egg.scale.set(1, 1.3, 1);
      g.box({ parent: id, size: [0.05, 0.35, 0.05], pos: [-0.12, 1.05, 0.5], rot: [0, 0, 0.5], color: '#8a7a5a', edges: false });
      return;
    }
    var r = [0, 0.42, 0.5, 0.56, 0.62][stage];
    g.sphere({ parent: id, id: id + '-body', radius: r, pos: [0, 0.2 + r, 0], color: '#8fc27a' });
    var ey = 0.2 + r * 1.05;
    g.sphere({ parent: id, radius: 0.06, pos: [-r * 0.35, ey, r * 0.9], color: '#2b2620' });
    g.sphere({ parent: id, radius: 0.06, pos: [r * 0.35, ey, r * 0.9], color: '#2b2620' });
    var top = 0.2 + r * 2;
    var leaves = [[0, 0.25, 0, 0]];
    if (stage >= 2) leaves.push([-0.3, 0.12, 0, 0.9]);
    if (stage >= 3) leaves.push([0.3, 0.12, 0, -0.9]);
    leaves.forEach(function (L) {
      var lf = g.sphere({ parent: id, radius: 0.22, pos: [L[0], top + L[1] - 0.05, L[2]], color: GREEN });
      lf.scale.set(0.45, 1.1, 0.25); lf.rotation.z = L[3];
    });
    if (stage === 4) {
      [-0.22, 0, 0.22].forEach(function (x, i) {
        g.cylinder({ parent: id, radiusTop: 0, radius: 0.09, height: 0.32, pos: [x, top + 0.48 + (i === 1 ? 0.08 : 0), -0.05], color: '#e8c25a', segments: 12 });
      });
    }
  }

  GameGuide.start({
    title: 'そだてもん',
    back: '../index.html',
    subtitle: '勉強クイズに答えて、キャラを育てて日本統一を目指す学習ゲーム（HTML1ファイル＋素の JavaScript、保存は localStorage）',
    camera: { pos: [0, 10, 10], target: [0, 0, 0] },

    build: function (g) {
      // ---------- 全体のループ（原点） ----------
      g.box({ id: 'ov-learn', size: [2.6, 0.8, 1.6], pos: [0, 0.4, 3.2], color: GREEN, label: 'ラーニング\n4択クイズ', labelSize: 0.32 });
      g.box({ id: 'ov-gacha', size: [2.6, 0.8, 1.6], pos: [4.6, 0.4, 0], color: GOLD, label: 'ガチャ\nコインでキャラ', labelSize: 0.32 });
      g.box({ id: 'ov-chars', size: [2.6, 0.8, 1.6], pos: [0, 0.4, -3.2], color: '#7b5cff', label: 'キャラ・編成\n覚醒／合成', labelSize: 0.32 });
      g.box({ id: 'ov-map', size: [2.6, 0.8, 1.6], pos: [-4.6, 0.4, 0], color: ACCENT, label: '日本統一\nクイズで進軍', labelSize: 0.32 });
      g.arrow([1.6, 0.6, 2.8], [3.9, 0.6, 0.9], { id: 'ov-a1', color: C.gold, lift: 0.8, label: 'コイン +10', labelSize: 0.28 });
      g.arrow([3.9, 0.6, -0.9], [1.6, 0.6, -2.8], { id: 'ov-a2', color: '#c77dff', lift: 0.8, label: 'キャラが出る', labelSize: 0.28, labelColor: '#e2c9ff' });
      g.arrow([0.25, 0.6, 2.3], [0.25, 0.6, -2.3], { id: 'ov-a3', color: C.good, lift: 1.4, label: '正解で Lv+1', labelSize: 0.28 });
      g.arrow([-1.6, 0.6, 2.8], [-3.9, 0.6, 0.9], { id: 'ov-a4', color: '#ff9f80', lift: 0.8, label: '戦いもクイズ', labelSize: 0.28 });

      // ---------- 初代の育成（CR） ----------
      for (var s = 0; s < 5; s++) {
        creature(g, 'cr' + s, s, [stageX(s), 0, CR[2] - 0.6]);
        g.label(STAGES[s][0] + '\nexp ' + STAGES[s][1] + '〜', [stageX(s), 2.6, CR[2] - 0.6], { id: 'cr-name' + s, size: 0.26, bg: '#00000088' });
      }
      g.box({ id: 'cr-track', size: [10, 0.12, 0.35], pos: [CR[0], 0.06, CR[2] + 1.6], color: '#3a3555', edges: false });
      g.box({ id: 'cr-fill', size: [1, 0.16, 0.36], pos: [CR[0] - 5, 0.08, CR[2] + 1.6], color: GREEN, edges: false });
      STAGES.forEach(function (st, i) {
        g.box({ id: 'cr-tick' + i, size: [0.05, 0.3, 0.5], pos: [expX(st[1]), 0.15, CR[2] + 1.6], color: '#ffffff', edges: false });
        g.label(String(st[1]), [expX(st[1]), 0.3, CR[2] + 2.2], { id: 'cr-tl' + i, size: 0.22, color: '#e8e4ff' });
      });
      g.label('exp 0', [CR[0], 0.5, CR[2] + 3.0], { id: 'cr-msg', size: 0.32, bg: '#000000aa', color: '#bff5d9' });

      // ---------- ラーニング（LA） ----------
      g.box({ id: 'la-board', size: [7.2, 2.6, 0.15], pos: P(LA, [0, 1.4, -1.6]), color: PAPER, edges: false });
      g.label('小6：水の化学式は？', P(LA, [0, 2.0, -1.4]), { id: 'la-q', size: 0.42, color: '#2b2620' });
      g.label('使用キャラを選んでから答える', P(LA, [0, 1.1, -1.4]), { id: 'la-q2', size: 0.26, color: '#6b6355' });
      ['H2O', 'CO2', 'O2', 'NaCl'].forEach(function (c, i) {
        g.plate({ id: 'la-c' + i, size: [1.5, 0.9], pos: P(LA, [-2.4 + i * 1.6, 0.05, 0.4]), color: '#fffdf6', opacity: 1,
          label: c, labelOffset: [0, 0.35, 0], labelSize: 0.36, labelColor: '#2b2620' });
      });
      g.cylinder({ id: 'la-coin', radius: 0.28, height: 0.08, pos: P(LA, [-2.4, 0.3, 0.4]), color: '#ffd166', metalness: 0.6, roughness: 0.3 });
      g.sphere({ id: 'la-xp', radius: 0.18, pos: P(LA, [-2.4, 0.3, 0.4]), color: '#7ef0ff', emissive: '#2aa0b0' });
      g.label('コイン 5000', P(LA, [-5.2, 0.8, 0.4]), { id: 'la-coins', size: 0.32, color: '#ffd166', bg: '#000000aa' });
      g.label('XP 0（Lv1）', P(LA, [-5.2, 0.8, 1.6]), { id: 'la-xps', size: 0.3, color: '#7ef0ff', bg: '#000000aa' });
      g.cylinder({ id: 'la-ring', radius: 0.85, height: 0.04, pos: P(LA, [4.6, 0.03, 0.5]), color: C.good, emissive: C.good, emissiveIntensity: 0.4 });
      g.card({ id: 'la-char', pos: P(LA, [4.6, 0.06, 0.5]), text: 'A', sub: 'キャラA\n選択中', color: '#7b5cff' });
      g.label('Lv1 / 100', P(LA, [4.6, 1.2, 0.5]), { id: 'la-lv', size: 0.32, color: '#e2c9ff', bg: '#000000aa' });

      // ---------- ガチャ（GA） ----------
      g.box({ id: 'ga-base', size: [2.0, 1.4, 1.6], pos: P(GA, [-3.2, 0.7, 0]), color: ACCENT });
      g.sphere({ id: 'ga-glass', radius: 1.15, pos: P(GA, [-3.2, 2.5, 0]), color: '#cfe8ff', opacity: 0.3 });
      ['#ff6b6b', '#ffd166', '#5ee6a8', '#7ef0ff', '#c77dff', '#ff9f43'].forEach(function (c, i) {
        g.sphere({ id: 'ga-in' + i, radius: 0.26, pos: P(GA, [-3.2 + Math.cos(i) * 0.55, 2.05 + (i % 3) * 0.3, Math.sin(i * 1.7) * 0.5]), color: c });
      });
      g.sphere({ id: 'ga-cap', radius: 0.26, pos: P(GA, [-3.2, 0.7, 0.9]), color: '#ffd166' });
      for (var r = 0; r < 6; r++) {
        g.cylinder({ id: 'ga-bar' + r, radius: 0.3, height: 1.6, pos: P(GA, [-0.6 + r * 0.95, 0.8, 0]), color: ['#b8b2d6', '#8fc4ff', '#5ee6a8', '#ffd166', '#ff9f43', '#ff5f6d'][r] });
        g.label('★' + (r + 1) + '\n1/6', P(GA, [-0.6 + r * 0.95, 2.25, 0]), { id: 'ga-bl' + r, size: 0.24, bg: '#00000088' });
      }
      g.label('キャラ：1連 200／10連 1800\n装備：1連 100／10連 800', P(GA, [-0.6 + 2.4, 0.5, 1.6]), { id: 'ga-price', size: 0.28, color: '#ffe7a8', bg: '#000000aa' });

      // ---------- 覚醒・合成・編成（AW） ----------
      for (var a = 0; a < 3; a++) {
        g.card({ id: 'aw' + a, pos: P(AW, [-1.8 + a * 1.8, 0.06, 0.6]), text: 'A', sub: 'キャラA', color: '#7b5cff' });
        g.label('Lv5', P(AW, [-1.8 + a * 1.8, 1.0, 0.6]), { id: 'aw-l' + a, size: 0.3, bg: '#000000aa', color: '#e2c9ff' });
      }
      g.label('', P(AW, [0, 0.3, 2.6]), { id: 'aw-msg', size: 0.32, bg: '#000000aa', color: C.gold });
      for (var k = 0; k < 5; k++) {
        g.plate({ id: 'cmp' + k, size: [1.1, 1.4], pos: P(AW, [-2.6 + k * 1.3, 0.03, -2.6]), color: '#3a3555', opacity: 0.8 });
      }
      g.label('編成（最大5体）', P(AW, [0, 0.4, -3.75]), { id: 'cmp-lbl', size: 0.28, color: '#e8e4ff' });

      // ---------- 日本統一マップ（MAP） ----------
      var drawn = {};
      Object.keys(TERR).forEach(function (n) {
        g.plate({ id: 'tr-' + n, size: [1.0, 1.0], pos: mapPos(n, 0.04), color: OWNER_COLOR[n], opacity: 0.95, radius: 0.08 });
        g.label(n, mapPos(n, 0.45), { id: 'tl-' + n, size: 0.27, color: '#ffffff', bg: '#00000066' });
        TERR[n][2].forEach(function (m) {
          var key = [n, m].sort().join('-');
          if (drawn[key]) return; drawn[key] = true;
          g.line([mapPos(n, 0.12), mapPos(m, 0.12)], { color: '#ffffff', opacity: 0.35 });
        });
      });
      g.label('スタート：沖縄', P(mapPos('沖縄', 0), [-1.6, 1.0, 0.8]), { id: 'map-start', size: 0.3, color: PLAYER_COLOR, bg: '#000000aa' });
      g.label('38の領土・24の勢力', P(MAP, [0, 0.5, 8.9]), { id: 'map-title', size: 0.34, color: '#e8e4ff' });

      // ---------- 4×4 バトル（BAT） ----------
      for (var rr = 0; rr < 4; rr++) for (var cc = 0; cc < 4; cc++) {
        g.plate({ id: 'cell' + rr + cc, size: [1.05, 1.05], pos: cellPos(rr, cc), color: '#fffdf6', opacity: 0.85, radius: 0.06 });
      }
      g.box({ id: 'castle-me', size: [1.2, 1.2, 1.2], pos: P(CASTLE_ME, [0, 0.6, 0]), color: GREEN, label: '味方の城', labelSize: 0.28 });
      g.box({ id: 'castle-en', size: [1.2, 1.2, 1.2], pos: P(CASTLE_EN, [0, 0.6, 0]), color: ACCENT, label: '敵の城', labelSize: 0.28 });
      g.cylinder({ id: 'food-me-bar', radius: 0.25, height: 3, pos: P(CASTLE_ME, [0, 1.55, 1.6]), color: '#ffd166', emissive: '#ffd166', emissiveIntensity: 0.2 });
      g.cylinder({ id: 'food-en-bar', radius: 0.25, height: 3, pos: P(CASTLE_EN, [0, 1.55, 1.6]), color: '#ff9aa6', emissive: '#ff9aa6', emissiveIntensity: 0.2 });
      g.label('味方の兵糧 1000', P(CASTLE_ME, [0, 3.6, 1.6]), { id: 'food-me', size: 0.28, color: '#ffd166', bg: '#000000aa' });
      g.label('敵の兵糧 1000', P(CASTLE_EN, [0, 3.6, 1.6]), { id: 'food-en', size: 0.28, color: '#ff9aa6', bg: '#000000aa' });
      for (var q = 0; q < 2; q++) {
        g.cylinder({ id: 'stk' + q, radius: 0.38, height: 0.5, pos: cellPos(1, 1), color: GREEN, label: '10', labelSize: 0.3, labelOffset: [0, 0.6, 0] });
      }
      g.label('', P(BAT, [0, 2.8, -2.8]), { id: 'bat-msg', size: 0.34, bg: '#000000aa', color: '#bff5d9' });

      // ---------- プログラム構成（ARCH） ----------
      g.plate({ id: 'arch-file', size: [8, 10.5], pos: [ARCH, 0.02, -0.4], color: '#2a2638', opacity: 0.9,
        label: 'sodatemon-magna.html（この1ファイルに全部入り）', labelOffset: [0, 0.4, -5.6], labelSize: 0.34 });
      g.box({ id: 'arch-css', size: [6.6, 0.4, 1.3], pos: [ARCH, 0.2, -4.4], color: '#4a4466', label: '<style>  見た目（ノート風の色）', labelSize: 0.3 });
      g.box({ id: 'arch-html', size: [6.6, 0.5, 1.5], pos: [ARCH, 0.25, -2.4], color: '#2f4a8a', label: 'HTML：6つの section\nラーニング・ガチャ・編成・バトル・キャラ・オプション', labelSize: 0.28 });
      g.box({ id: 'arch-data', size: [2.9, 0.7, 2.0], pos: [ARCH - 1.85, 0.35, 0.3], color: '#2b9a6b', label: 'データ表（const）\nLEARNING_DATA 159問\nTERRITORIES 38・WARLORDS 24\nキャラ表・RARITIES', labelSize: 0.28 });
      g.box({ id: 'arch-func', size: [2.9, 0.7, 2.0], pos: [ARCH + 1.85, 0.35, 0.3], color: '#7b5cff', label: '関数は window.xxx\nanswerQuestion()\ndoGacha()\nnextSengokuBattleTurn()…', labelSize: 0.28 });
      g.sphere({ id: 'arch-state', radius: 0.75, pos: [ARCH, 0.8, 3.4], color: '#ffd166', emissive: '#ffd166', emissiveIntensity: 0.25, label: 'window.gameState\n（ゲームの状態はぜんぶここ）', labelSize: 0.28 });
      g.cylinder({ id: 'arch-ls', radius: 1.0, height: 1.2, pos: [ARCH + 6.4, 0.6, 3.4], color: C.server, label: 'localStorage\nsodatemon_magna_save', labelSize: 0.28 });
