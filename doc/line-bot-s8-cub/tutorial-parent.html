<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-s8-cub 使い方(保護者向け)</title>
<link rel="stylesheet" href="lib/guide.css">
<link rel="stylesheet" href="lib/cub-tutorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
<script src="menus-data.js"></script>
<script src="lib/cub-menu.js"></script>
</head>
<body>
<script>
(function () {
  var S = CubMenu.step, U = CubMenu.ui;

  var SAMPLE_ANNOUNCE =
    'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。\n\n' +
    '10月17日(土) 秋の野外活動\n集 合 ：  9:00 〇〇公園\n解 散 ：  15:00 〇〇公園\n活動場所： 〇〇公園\nもちもの ： お弁当・水筒・雨具\n\n' +
    '雨天の場合は前日に連絡します。\n\nよろしくお願いします。';

  GameGuide.start({
    title: 'カブ8ちゃん 使い方(保護者向け)',
    subtitle: '保護者の方は操作不要。届くお知らせと、できることの紹介',
    camera: { pos: [0, 4, 11.5], target: [0, 1.7, 0] },
    build: function (g) {
      CubMenu.build(g, ['main']);
    },
    steps: [
      S({
        title: 'カブ8ちゃんって？',
        menu: 'main',
        html:
          '<p>カブ8ちゃんは、<b>カブ隊の活動のお知らせを、LINEグループへ届けてくれるBot</b>です。</p>' +
          '<p>保護者の方が<b>操作することはありません</b>。グループに届いたお知らせを見るだけで大丈夫です。</p>' +
          '<p>左の立体図は、友だち追加したときに出る<b>メニュー</b>です。今は「ヘルプ」だけが置いてあります。</p>'
      }),
      S({
        title: '開催案内が届く',
        menu: 'main',
        html:
          '<p>次の活動の<b>開催案内</b>が、保護者のLINEグループに届きます。集合・解散・場所・もちものなどが、決まった形でまとまっています。</p>' +
          U.chat([{ who: 'bot', text: SAMPLE_ANNOUNCE }], '保護者グループ') +
          '<p>案内は、管理者(指導者)がカブ8通信から作って、内容を確認してから送っています。</p>'
      }),
      S({
        title: 'お知らせも決まった時刻に届く',
        menu: 'main',
        html:
          '<p>活動の前日のお知らせなどは、管理者が<b>日時を決めて予約</b>しておくと、その時刻に<b>自動で</b>グループへ届きます。</p>' +
          U.chat([{ who: 'sys', text: '10月15日(木) 19:00' }, { who: 'bot', text: '明日は秋の野外活動です。\n集合は 9:00 〇〇公園です。\nお弁当と水筒をお忘れなく！' }], '保護者グループ') +
          '<p>届いた時刻に通知が鳴るので、見逃しにくくなります。</p>'
      }),
      S({
        title: 'グループで話しかけても返事はしません',
        menu: 'main',
        html:
          '<p>カブ8ちゃんは、<b>管理者の操作だけ</b>に反応します。保護者の方がグループで話しかけたり、メッセージを送ったりしても、<b>返事はしません</b>(ほかの人のトークの邪魔になりません)。</p>' +
          U.chat([{ who: 'sys', text: 'グループの会話' }, { who: 'me', text: '明日の集合は9時ですか？' }, { who: 'sys', text: '(カブ8ちゃんは反応しません)' }], '保護者グループ') +
          '<p>活動についての質問は、これまでどおり<b>指導者に直接</b>聞いてください。</p>'
      }),
      S({
        title: '「ヘルプ」ボタン',
        menu: 'main', hl: 'ヘルプ',
        html:
          '<p>カブ8ちゃんと<b>1:1のトーク</b>を開くと、「<b>ヘルプ</b>」ボタンがあります。保護者向けの機能は、<b>これから追加していく予定</b>です。</p>' +
          U.chat([{ who: 'me', text: 'ヘルプ' }, { who: 'bot', text: '今後実装予定です' }], 'カブ8ちゃん') +
          '<p>「こんな機能がほしい」があれば、指導者に伝えてください。</p>'
      }),
      S({
        title: '管理者になるには',
        menu: 'main',
        html:
          '<p>指導者の仲間として、お知らせの作成などを手伝ってもらうときは、<b>管理者に追加</b>します。次の手順です。</p>' +
          '<ol><li>カブ8ちゃんを<b>友だち追加</b>する</li>' +
          '<li>1:1トークで「<b>マイID</b>」と送る → <b>自分のID</b>が返ってくる</li>' +
          '<li>そのIDを、<b>オーナー(最初の管理者)</b>に伝える</li>' +
          '<li>管理者がIDを登録すると、メニューが<b>管理者用</b>に切り替わる</li></ol>' +
          U.chat([{ who: 'me', text: 'マイID' }, { who: 'bot', text: 'あなたのuserIdです\nU0123456789abcdef0123456789abcdef\n\n管理者にしてほしい時は、この文字列を管理者に伝えてね' }], 'カブ8ちゃん') +
          '<p>管理者向けの使い方は、<a href="tutorial-admin.html">管理者向けチュートリアル</a>にあります。</p>' +
          '<p class="gg-files">このページの人名・ID・グループ名は、すべてダミーです。</p>'
      }),
    ],
  });
})();
</script>
</body>
</html>
