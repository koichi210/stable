<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デンリーダーのお仕事</title>
<!--
  デンリーダー(DL)のお仕事の紹介。来年度のDL募集で、保護者に「DLが何をするのか」を見せるためのページ(カブナビ8ちゃんのメニュー「DLのお仕事」から開く)。
  ・demo.html と同じ、字幕付きで自動再生する動画風のページ。3Dの広場で、子ども・DL・指導者のコマを動かして見せる。
  ・台本は下の CHAPTERS(章ごとに 長さ・字幕・カメラ・動き)。動きは章の中の経過時間 t から毎フレーム計算するので、どこへ飛んでも絵が崩れない。
  ・公開ページなので、人名は書かない(役割名だけ)。書くのは、DLのお仕事についての客観的な事実だけ。
-->
<style>
  :root { --bg: #17142a; --ink: #f4f1ff; --green: #06c755; --gold: #f59e0b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Yu Gothic", "Meiryo", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 56px; bottom: 56px; right: 440px; }
  canvas#gl { display: block; width: 100%; height: 100%; }
  .top { position: fixed; left: 0; right: 0; top: 0; height: 56px; display: flex; gap: 8px; align-items: center; padding: 0 14px; z-index: 2; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0; white-space: nowrap; scrollbar-width: none; }
  .top a.back { color: #cfc8ff; text-decoration: none; font-size: 14px; margin-right: 6px; white-space: nowrap; }
  .top h1 { font-size: 16px; margin: 0 12px 0 0; white-space: nowrap; }
  .chip { border: 1px solid #ffffff44; background: #ffffff14; color: var(--ink); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { background: var(--gold); border-color: var(--gold); color: #2b1a00; font-weight: bold; }
  .cap-wrap { position: fixed; right: 20px; top: 56px; bottom: 56px; width: 400px; display: flex; align-items: center; pointer-events: none; z-index: 2; }
  .cap { width: 100%; background: #ffffff10; border: 1px solid #ffffff2a; color: #fff; padding: 18px 22px; border-radius: 14px; font-size: 19px; line-height: 1.75; text-align: left; white-space: pre-line; }
  .cap:empty { display: none; }
  .cap small { display: block; font-size: 14px; color: #ffd98a; margin-bottom: 6px; font-weight: bold; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 10px 14px; background: #000000b0; z-index: 3; }
  .bar select { border: 1px solid #ffffff55; background: #2a2640; color: #fff; border-radius: 8px; padding: 6px 6px; font: inherit; font-size: 14px; cursor: pointer; }
  .bar button { border: 1px solid #ffffff55; background: #ffffff1c; color: #fff; border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .prog { flex: 1; height: 10px; background: #ffffff30; border-radius: 5px; overflow: hidden; cursor: pointer; }
  .prog i { display: block; height: 100%; width: 0; background: var(--gold); }
  .time { font-size: 12px; color: #cfc8ff; min-width: 78px; text-align: right; }
  @media (max-width: 900px) {
    .bar { gap: 8px 6px; padding: 8px 8px 10px; flex-wrap: wrap; }
    .prog { order: -1; flex: 1 1 100%; }
    .time { margin-left: auto; min-width: 0; }
    .bar button, .bar select { padding: 6px 8px; font-size: 13px; }
    .bar .wide { display: none; }
    #stage { right: 0; bottom: 200px; }
    .cap-wrap { left: 12px; right: 12px; width: auto; top: auto; bottom: 80px; height: 114px; }
    .cap { font-size: 14.5px; padding: 10px 14px; line-height: 1.6; max-height: 114px; overflow-y: auto; }
    .top h1 { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas></div>
<div class="top"><a class="back" href="index.html">← もどる</a><h1>🧢 デンリーダーのお仕事</h1><span id="chips"></span></div>
<div class="cap-wrap"><div class="cap" id="cap"></div></div>
<div class="bar">
  <button id="play">⏸ 一時停止</button><button id="back10" title="10秒もどる(←キー)">⏪ 10秒</button><button id="fwd10" title="10秒すすむ(→キー)">10秒 ⏩</button><select id="speed" title="再生速度"><option value="0.8">0.8倍</option><option value="1" selected>1.0倍</option><option value="1.2">1.2倍</option><option value="1.5">1.5倍</option><option value="2">2.0倍</option></select><button id="restart" class="wide">⟲ 最初から</button>
  <div class="prog" id="prog"><i id="progi"></i></div><span class="time" id="time">0:00</span>
</div>

<script>
(function () {
  'use strict';
  var FONT = '"Yu Gothic","Meiryo",sans-serif';

  // ================= 小道具 =================
  var clamp = function (x, a, b) { return Math.max(a, Math.min(b, x)); };
  var lerp = function (a, b, k) { return a + (b - a) * k; };
  // t(ミリ秒)が start から dur のあいだに 0→1 へ進む(ゆっくり始まってゆっくり止まる)
  function ph(t, start, dur) { var x = clamp((t - start) / dur, 0, 1); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  var COLOR = {
    kid: 0x3b82f6, dl: 0xf59e0b, leader: 0x15803d, helper: 0xec4899, parent: 0x9ca3af,
    groups: [0xef4444, 0x3b82f6, 0x22c55e, 0xeab308, 0xa855f7],
  };

  // ================= 3D(Three.js) =================
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17142a);
  scene.fog = new THREE.Fog(0x17142a, 30, 60);
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var key = new THREE.DirectionalLight(0xffffff, 0.85); key.position.set(5, 10, 8); scene.add(key);
  var rim = new THREE.PointLight(0x8b7bff, 1.0, 40); rim.position.set(-8, 4, -6); scene.add(rim);

  // 広場(地面)と、ふわふわ浮く光の粒(demo.html と同じ雰囲気)
  var ground = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: 0x24452f, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  var NP = 200, ppos = new Float32Array(NP * 3), seed = [];
  for (var i = 0; i < NP; i++) { ppos[i * 3] = (Math.random() - 0.5) * 34; ppos[i * 3 + 1] = 1 + Math.random() * 12; ppos[i * 3 + 2] = -6 - Math.random() * 14; seed.push(Math.random() * 6.28); }
  var pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
  scene.add(new THREE.Points(pg, new THREE.PointsMaterial({ color: 0xb9a8ff, size: 0.09, transparent: true, opacity: 0.8 })));

  // 文字の札(常に正面を向く)。h は1行ぶんの高さ(3D空間の単位)
  function sprite(text, o) {
    o = o || {};
    var fs = 64, lines = String(text).split('\n'), plain = o.bg === 'none', pad = plain ? 6 : 24;
    var c = document.createElement('canvas'), x = c.getContext('2d');
    x.font = 'bold ' + fs + 'px ' + FONT;
    var w = 0; lines.forEach(function (l) { w = Math.max(w, x.measureText(l).width); });
    var lh = fs * 1.3;
    c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(lines.length * lh + pad);
    x.font = 'bold ' + fs + 'px ' + FONT;
    if (!plain) {
      var r = Math.min(30, c.height / 2);
      x.fillStyle = o.bg || 'rgba(20,16,40,0.82)';
      x.beginPath(); x.moveTo(r, 0); x.arcTo(c.width, 0, c.width, c.height, r); x.arcTo(c.width, c.height, 0, c.height, r); x.arcTo(0, c.height, 0, 0, r); x.arcTo(0, 0, c.width, 0, r); x.closePath(); x.fill();
    }
    x.fillStyle = o.fg || '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    lines.forEach(function (l, j) { x.fillText(l, c.width / 2, pad / 2 + lh * (j + 0.5)); });
    var tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    var hh = (o.h || 0.42) * (c.height / lh);
    s.scale.set(hh * c.width / c.height, hh, 1); s.renderOrder = 10;
    s.userData.base = s.scale.clone();
    return s;
  }
  // 札をぽんと出す(k=0で消えて、1で元の大きさ)
  function pop(s, k) { s.visible = k > 0.01; var b = s.userData.base; var e = k < 1 ? k * (1 + 0.25 * Math.sin(k * Math.PI)) : 1; s.scale.set(b.x * e, b.y * e, 1); }

  // 人のコマ(胴+頭)。size: 子ども0.85 / 大人1.3。label を付けると頭の上に札が出る
  var GEO = { body: new THREE.CylinderGeometry(0.2, 0.28, 0.62, 16), head: new THREE.SphereGeometry(0.19, 20, 14) };
  var SKIN = new THREE.MeshStandardMaterial({ color: 0xf2c9a0, roughness: 0.8 });
  function person(color, size, label, labelOpt) {
    var g = new THREE.Group();
    var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
    var b = new THREE.Mesh(GEO.body, mat); b.position.y = 0.31; g.add(b);
    var h = new THREE.Mesh(GEO.head, SKIN); h.position.y = 0.8; g.add(h);
    g.scale.setScalar(size); g.userData.mat = mat; g.userData.size = size;
    if (label) {
      var sp = sprite(label, labelOpt || {});
      sp.scale.multiplyScalar(1 / size); sp.userData.base = sp.scale.clone(); sp.position.y = 1.4;
      g.add(sp); g.userData.label = sp;
    }
    return g;
  }
  function place(o, x, z, y) { o.position.set(x, y || 0, z); }
  // a → b へ歩く(k: 0→1)。歩いているあいだだけ、ぴょこぴょこ跳ねる
  function walk(o, a, b, k) { place(o, lerp(a[0], b[0], k), lerp(a[1], b[1], k), k > 0 && k < 1 ? Math.abs(Math.sin(k * Math.PI * 7)) * 0.1 : 0); }
  function ringMesh(color) {
    var m = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.42, 48), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.y = 0.02; return m;
  }

  // ---- 組の並べ方(組の数 N、子どもの数 K) ----
  function centerOf(i, N) {
    var R = [0, 0, 2.6, 3.4, 3.9, 4.5][N];
    var a = Math.PI / 2 + (i + 0.5) * 2 * Math.PI / N + Math.PI;
    return [Math.cos(a) * R, Math.sin(a) * R];
  }
  function kidSpots(N, K) {
    var out = [];
    for (var i = 0; i < K; i++) {
      var gi = i % N, idx = Math.floor(i / N), cnt = Math.floor((K - 1 - gi) / N) + 1, c = centerOf(gi, N);
      var a = idx / cnt * 2 * Math.PI + 0.5, r = cnt > 5 ? 0.95 : 0.8;
      out.push([c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r]);
    }
    return out;
  }
  // 広場に、子ども K 人・組 maxN 個ぶんの輪とDLを作って、N 組の並びに置く
  function makeField(root, N, K, maxN) {
    maxN = maxN || N;
    var f = { kids: [], dls: [], rings: [], tags: [] };
    for (var i = 0; i < K; i++) { var k = person(COLOR.kid, 0.85); root.add(k); f.kids.push(k); }
    for (var j = 0; j < maxN; j++) {
      var r = ringMesh(COLOR.groups[j]); root.add(r); f.rings.push(r);
      var tag = sprite((j + 1) + '組', { bg: '#' + COLOR.groups[j].toString(16).padStart(6, '0'), h: 0.34 }); root.add(tag); f.tags.push(tag);
      var d = person(COLOR.dl, 1.3, 'DL', { bg: '#b45309', h: 0.36 }); root.add(d); f.dls.push(d);
    }
    setField(f, N, K, 1);
    return f;
  }
  // N 組の並びに置く。vis=0〜1 で、N 組目以降の輪の出方(組が増えるところ)
  function setGroup(f, j, c, vis) {
    var r = f.rings[j]; r.visible = vis > 0.01; r.scale.setScalar(Math.max(0.01, vis)); place(r, c[0], c[1], 0.02);
    var tg = f.tags[j]; pop(tg, vis); place(tg, c[0], c[1] + 1.75, 0.3);
  }
  function setField(f, N, K) {
    var spots = kidSpots(N, K);
    f.kids.forEach(function (k, i) { place(k, spots[i][0], spots[i][1]); });
    for (var j = 0; j < f.rings.length; j++) {
      var on = j < N, c = centerOf(j, Math.max(N, 2));
      setGroup(f, j, c, on ? 1 : 0); f.dls[j].visible = on; if (on) place(f.dls[j], c[0], c[1]);
    }
  }

  // ---- 3段の塔(上: 指導者=運営 / 中: DL=活動を支える / 下: お手伝いの保護者=DLを支える)。全体図と⑧で使う ----
  var TIER_H = 0.7;
  function makeTower(root) {
    var T = { g: new THREE.Group(), discs: [], labels: [], kids: [], dls: [], helpers: [] };
    root.add(T.g);
    [[1.9, COLOR.leader, '指導者　活動を運営する', '#14532d'], [2.8, COLOR.dl, 'DL　組について活動を支える', '#b45309'], [3.7, COLOR.helper, 'お手伝いの保護者　DLを支える', '#9d174d']].forEach(function (d) {
      var m = new THREE.Mesh(new THREE.CylinderGeometry(d[0], d[0], 1, 56), new THREE.MeshStandardMaterial({ color: d[1], roughness: 0.6 }));
      m.userData = { r: d[0], color: new THREE.Color(d[1]) }; T.g.add(m); T.discs.push(m);
      var s = sprite(d[2], { h: 0.28, bg: d[3] }); T.g.add(s); T.labels.push(s);
    });
    for (var i = 0; i < 5; i++) { var a = i / 5 * Math.PI * 2 + 0.3, k = person(COLOR.kid, 0.75); k.userData.at = [Math.cos(a) * 0.95, Math.sin(a) * 0.95 - 0.35]; T.g.add(k); T.kids.push(k); }
    T.leader = person(COLOR.leader, 1.0); T.g.add(T.leader);
    [Math.PI - 0.25, Math.PI + 0.4, 0.25, -0.4].forEach(function (a) { var p = person(COLOR.dl, 1.0); p.userData.at = [Math.cos(a) * 2.35, Math.sin(a) * 2.35]; T.g.add(p); T.dls.push(p); });
    [Math.PI - 0.15, 0.15, -0.5].forEach(function (a) { var p = person(COLOR.helper, 1.0); p.userData.at = [Math.cos(a) * 3.25, Math.sin(a) * 3.25]; T.g.add(p); T.helpers.push(p); });
    T.tag = sprite('🏕️ 隊活動', { h: 0.42 }); T.g.add(T.tag);
    return T;
  }
  // o: kt/km/kb = 各段の出方(0〜1) / bh = 下の段の厚み(1が普通) / strain = 負担(0〜1) / down = 指導者が中段へ降りる(0〜1) / away[i] = お手伝いの人が離れる(0〜1)
  function setTower(T, o, t) {
    var hb = TIER_H * o.kb * (o.bh == null ? 1 : o.bh), hm = TIER_H * o.km, ht = TIER_H * o.kt, strain = o.strain || 0;
    var hs = [ht, hm, hb], bases = [hb + hm, hb, 0], ks = [o.kt, o.km, o.kb];
    T.discs.forEach(function (m, i) {
      m.visible = hs[i] > 0.005; m.scale.set(1, Math.max(0.001, hs[i]), 1); m.position.y = bases[i] + hs[i] / 2;
      m.material.color.copy(m.userData.color);
      if (i < 2) m.material.color.lerp(new THREE.Color(0xdc2626), strain * (i === 1 ? 0.55 : 0.35));
      pop(T.labels[i], ks[i]); T.labels[i].position.set(0, bases[i] + hs[i] / 2, m.userData.r + 0.05);
    });
    var top = hb + hm + ht, d = o.down || 0;
    T.kids.forEach(function (k, i) { k.visible = o.kt > 0.5; place(k, k.userData.at[0], k.userData.at[1], top + Math.max(0, Math.sin(t * 0.004 + i * 1.3)) * 0.05); });
    T.leader.visible = o.kt > 0.5;
    var la = [-1.25, 1.0], lb = [-1.45, 1.85];
    place(T.leader, lerp(la[0], lb[0], d), lerp(la[1], lb[1], d), lerp(top, hb + hm, d) + (d > 0 && d < 1 ? Math.sin(d * Math.PI) * 0.4 : 0));
    T.dls.forEach(function (p) { p.visible = o.km > 0.4; place(p, p.userData.at[0], p.userData.at[1], hb + hm); });
    T.helpers.forEach(function (p, i) {
      var aw = (o.away && o.away[i]) || 0, out = [p.userData.at[0] > 0 ? 7 : -7, p.userData.at[1] + 1];
      p.visible = o.kb > 0.4 && aw < 1; walk(p, p.userData.at, out, aw); p.position.y += hb * (1 - aw);
    });
    pop(T.tag, o.kt); T.tag.position.set(0, top + 1.7, 0);
    T.g.rotation.z = Math.sin(t * 0.012) * 0.03 * strain;
  }

  // ================= 台本(章ごと) =================
  // caps: [開始ミリ秒, 字幕] / cam(t): { p: カメラの位置, l: 見る点 } / update(t): その章の動き
  var CHAPTERS = [];
  function chapter(o) { o.root = new THREE.Group(); scene.add(o.root); o.build(o.root, o); CHAPTERS.push(o); }

  chapter({
    title: 'はじめに', dur: 8000,
    caps: [[0, 'デンリーダー(DL)は、カブ隊の活動を支える保護者の役割です。\nどんなお仕事なのか、順番に見ていきます。']],
    build: function (root, ch) {
      ch.f = makeField(root, 4, 20);
      var ld = person(COLOR.leader, 1.3, '指導者', { bg: '#14532d', h: 0.36 }); place(ld, 0, 0); root.add(ld);
      ch.title3d = sprite('デンリーダーのお仕事', { bg: 'none', h: 0.9, fg: '#ffd98a' }); ch.title3d.position.set(0, 4.2, 0); root.add(ch.title3d);
    },
    cam: function (t) { var a = 0.5 + t * 0.00008; return { p: [Math.sin(a) * 12, 8.5, Math.cos(a) * 12], l: [0, 0.8, 0] }; },
    update: function (t, ch) { pop(ch.title3d, ph(t, 300, 900)); },
  });

  chapter({
    title: '全体図', dur: 13500,
    caps: [
      [0, 'カブ隊の活動は、3つの役割で支えられています。'],
      [1200, '指導者が、活動を運営します。'],
      [4400, 'DLが、組について活動を支えます。'],
      [7500, 'お手伝いの保護者が、さらにDLを支えます。'],
      [10500, 'このページでは、まん中の「DL」のお仕事を紹介します。'],
    ],
    build: function (root, ch) { ch.T = makeTower(root); },
    cam: function (t) { var a = -0.25 + t * 0.00003; return { p: [Math.sin(a) * 11.5, 6.2, Math.cos(a) * 11.5], l: [0, 1.5, 0] }; },
    update: function (t, ch) {
      setTower(ch.T, { kt: ph(t, 1200, 900), km: ph(t, 4400, 1200), kb: ph(t, 7500, 1200) }, t);
      // 最後に、まん中の段(DL)を光らせる
      var glow = t > 10500 ? 0.5 + 0.5 * Math.sin((t - 10500) * 0.006) : 0;
      ch.T.discs[1].material.emissive.setHex(0x7c3a00).multiplyScalar(glow);
    },
  });

  chapter({
    title: '① DLとは', dur: 11000,
    caps: [
      [0, 'カブ隊は、子どもたちを「組(デン)」に分けて活動します。'],
      [3000, '組ごとに、保護者が1人ずつ「デンリーダー(DL)」としてつきます。'],
      [7500, 'デンのリーダーなので、デンリーダーです。\n担当するのは1年間です。'],
    ],
    build: function (root, ch) { ch.f = makeField(root, 4, 20); },
    cam: function () { return { p: [0, 10.5, 10], l: [0, 0, 0.3] }; },
    update: function (t, ch) {
      ch.f.dls.forEach(function (d, j) {
        var c = centerOf(j, 4), from = [c[0] * 3.2, c[1] * 3.2], k = ph(t, 3200 + j * 600, 1800);
        d.visible = true; walk(d, from, c, k);
      });
    },
  });

  // 3組 → 4組 → 5組。DLが1人来るたびに、子どもが組に分かれ直す
  var K2 = 20;
  chapter({
    title: '② DLの人数と組', dur: 16000,
    caps: [
      [0, 'DLの人数で、組の数が決まります。'],
      [2600, 'DLが1人増えると…'],
      [5200, '組が1つ増えて、1つの組の人数が少なくなります。'],
      [12800, '反対に、DLが足りないと組の数が減って、1つの組の人数が多くなります。'],
    ],
    build: function (root, ch) {
      ch.f = makeField(root, 3, K2, 5);
      ch.L = [3, 4, 5].map(function (n) { return { kids: kidSpots(n, K2), c: [0, 1, 2, 3, 4].map(function (j) { return centerOf(j, n); }) }; });

      var dl = person(COLOR.dl, 1.3, 'DL', { bg: '#b45309', h: 0.36 }); place(dl, 0, 2.6); root.add(dl);
      ch.cards = JOBS.map(function (job, i) {
        // 横に並べる
        var m = jobCard(job); m.userData.at = [(i - (JOBS.length - 1) / 2) * 2.3, 3.7]; root.add(m); return m;
      });
    },
    cam: function () { return { p: [0, 3.0, 10.2], l: [0, 2.5, 0] }; },
    update: function (t, ch) {
      ch.cards.forEach(function (m, i) {
        var k = ph(t, 1200 + i * 1700, 900), a = m.userData.at;
        m.visible = k > 0.01; m.scale.setScalar(Math.max(0.01, k));
        m.position.set(lerp(0, a[0], k), lerp(1.6, a[1], k) + Math.sin(t * 0.002 + i) * 0.04, -0.6);
        m.rotation.y = (1 - k) * Math.PI;
      });
    },
  });

  chapter({
    title: '⑨ みんなで支える', dur: 16500,
    caps: [
      [0, '隊活動は、指導者・DL・お手伝いの保護者のみんなで支えています。'],
      [4000, 'お手伝いの保護者が少ない日は、その分をDLや指導者が受け持つことになります。'],
      [7800, '指導者が手伝いに回ると、活動の進行にも影響が出てしまいます。'],
      [11200, 'お手伝いに来ていただけると、DLの負担がぐっと軽くなります。\nDLを担当しない年も、できる範囲でご協力をお願いします。'],
    ],
    // 全体図と同じ3段の塔。下の段(お手伝い)がうすくなると、塔がぐらつき、指導者が中段へ手伝いに降りる
    build: function (root, ch) {
      ch.T = makeTower(root);
      ch.sweat = [0, 1].map(function () { var s = sprite('💦', { bg: 'none', h: 0.5 }); ch.T.g.add(s); return s; });
      ch.qs = [1, 3].map(function () { var s = sprite('❓', { bg: 'none', h: 0.42 }); ch.T.g.add(s); return s; });
    },
    cam: function () { return { p: [0, 6.2, 11.5], l: [0, 1.5, 0] }; },
    update: function (t, ch) {
      var down = ph(t, 4000, 2600), up = ph(t, 11200, 2600), thin = down * (1 - up);
      var leave = ph(t, 4000, 1600), back = function (i) { return ph(t, 11000 + i * 300, 1800); };
      var aw = [0, 1, 2].map(function (i) { return i === 0 ? 0 : back(i) > 0 ? 1 - back(i) : leave; });
      var lead = ph(t, 7800, 1400) * (1 - ph(t, 11800, 1400));
      setTower(ch.T, { kt: 1, km: 1, kb: 1, bh: 1 - 0.65 * thin, strain: thin, down: lead, away: aw }, t);
      var dl = ch.T.dls[2], ld = ch.T.leader;
      [dl, ld].forEach(function (p, i) {
        var s = ch.sweat[i]; pop(s, thin > 0.3 && (i === 0 || lead > 0.5) ? 1 : 0);
        s.position.set(p.position.x + 0.45, p.position.y + 1.6 + Math.abs(Math.sin(t * 0.006 + i)) * 0.12, p.position.z);
      });
      // 指導者が降りているあいだ、上の段の子どもたちは「?」
      ch.qs.forEach(function (s, j) {
        var k = ch.T.kids[[1, 3][j]]; pop(s, lead > 0.6 ? 1 : 0);
        s.position.set(k.position.x, k.position.y + 1.25 + Math.sin(t * 0.008 + j) * 0.05, k.position.z);
      });
    },
  });

  chapter({
    title: '⑩ 決め方', dur: 12500,
    caps: [
      [0, 'まず指導者から、来年度のDLを決めたいと連絡があります。'],
      [3400, '担当いただける保護者が、手を挙げます。'],
      [9200, 'DLの登録の費用は、隊が出します(DLの負担はありません)。'],
    ],
    build: function (root, ch) {
      ch.parents = [];
      for (var i = 0; i < 6; i++) {
        var a = i / 6 * Math.PI * 2 + Math.PI / 2, p = person(COLOR.parent, 1.25, 'DL', { bg: '#b45309', h: 0.36 });
        place(p, Math.cos(a) * 1.8, Math.sin(a) * 1.8); root.add(p); ch.parents.push(p);
        var hd = sprite('✋', { bg: 'none', h: 0.5 }); hd.position.set(Math.cos(a) * 1.8 + 0.35, 1.75, Math.sin(a) * 1.8); root.add(hd); p.userData.hand = hd;
      }
      ch.leader = person(COLOR.leader, 1.3, '指導者', { bg: '#14532d', h: 0.36 }); place(ch.leader, 3.6, 1.2); root.add(ch.leader);
      ch.call = sprite('📢 来年度のDLを決めます', { h: 0.34, bg: 'rgba(21,128,61,0.92)' }); ch.call.position.set(3.0, 2.6, 1.2); root.add(ch.call);
    },
    cam: function () { return { p: [0, 6.8, 10.8], l: [0, 0.9, 0.2] }; },
    update: function (t, ch) {
      // 手を挙げた4人が、順にDLになる
      var dlOrder = [0, 3, 2, 5];
      ch.parents.forEach(function (p, i) {
        var n = dlOrder.indexOf(i);
        var hk = n < 0 || t > 7200 ? 0 : ph(t, 3700 + n * 500, 500);
        pop(p.userData.hand, hk); p.userData.hand.position.y = 1.75 + Math.sin(t * 0.008 + i) * 0.06;
        var k = n < 0 ? 0 : ph(t, 7200 + n * 450, 600);
        p.userData.mat.color.set(COLOR.parent).lerp(new THREE.Color(COLOR.dl), k);
        pop(p.userData.label, k);
      });
      pop(ch.call, t < 3400 ? ph(t, 300, 600) : 0);
    },
  });

  chapter({
    title: '⑪ 相談', dur: 10000,
    caps: [
      [0, '分からないことや不安なことは、指導者に気軽に聞いてください。'],
      [6500, 'デンリーダーのお仕事の紹介は、以上です。'],
    ],
    build: function (root, ch) {
      var p = person(COLOR.parent, 1.3, '保護者', { h: 0.34 }); place(p, -2.4, 0); root.add(p);
      var ld = person(COLOR.leader, 1.3, '指導者', { bg: '#14532d', h: 0.36 }); place(ld, 2.4, 0); root.add(ld);
      ch.q = sprite('❓', { bg: 'none', h: 0.6 }); ch.q.position.set(-2.4, 2.5, 0); root.add(ch.q);
      ch.a = sprite('💡', { bg: 'none', h: 0.6 }); ch.a.position.set(2.4, 2.5, 0); root.add(ch.a);
      ch.smile = sprite('😊', { bg: 'none', h: 0.6 }); ch.smile.position.set(-2.4, 2.5, 0); root.add(ch.smile);
      ch.dots = [0, 1, 2, 3, 4].map(function () { var m = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffd98a })); root.add(m); return m; });
    },
    cam: function () { return { p: [0, 3.4, 8.2], l: [0, 1.2, 0] }; },
    update: function (t, ch) {
      pop(ch.q, t < 5200 ? ph(t, 300, 500) : 0);
      ch.dots.forEach(function (m, i) {
        var k = clamp((t - 1300 - i * 350) / 1500, 0, 1);
        m.visible = k > 0 && k < 1;
        m.position.set(lerp(-2.1, 2.1, k), 1.6 + Math.sin(k * Math.PI) * 1.0, 0);
      });
      pop(ch.a, t < 6000 ? ph(t, 3900, 500) : 0);
      pop(ch.smile, ph(t, 5200, 500));
    },
  });

  // ================= 再生 =================
  var TOTAL = 0;
  CHAPTERS.forEach(function (c) { c.at = TOTAL; TOTAL += c.dur; });
  document.documentElement.dataset.chapters = JSON.stringify(CHAPTERS.map(function (c) { return [c.title, c.at]; })) + ' total=' + TOTAL;
  var vt = 0, playing = true, snap = true;
  function chapterAt(ms) { var cur = 0; CHAPTERS.forEach(function (c, i) { if (ms >= c.at) cur = i; }); return cur; }
  function seek(ms) { vt = clamp(ms, 0, TOTAL); snap = true; }

  function resize() {
    var el = document.getElementById('stage'), w = el.clientWidth, h = el.clientHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  var camP = new THREE.Vector3(), camL = new THREE.Vector3(), lastIdx = -1;
  function frame(wall) {
    var idx = chapterAt(Math.min(vt, TOTAL - 1)), ch = CHAPTERS[idx], t = vt - ch.at;
    if (idx !== lastIdx) snap = true;
    lastIdx = idx;
    CHAPTERS.forEach(function (c, i) { c.root.visible = i === idx; });
    ch.update(t, ch);
    // カメラ: 縦長の画面では、少し引いて全体が入るようにする
    var c = ch.cam(t, ch), fit = camera.aspect < 1.3 ? Math.min(1.65, 1.3 / camera.aspect) : 1;
    var p = new THREE.Vector3(c.l[0] + (c.p[0] - c.l[0]) * fit, c.l[1] + (c.p[1] - c.l[1]) * fit, c.l[2] + (c.p[2] - c.l[2]) * fit);
    var l = new THREE.Vector3(c.l[0], c.l[1], c.l[2]);
    if (snap) { camP.copy(p); camL.copy(l); snap = false; } else { camP.lerp(p, 0.06); camL.lerp(l, 0.06); }
    camera.position.copy(camP); camera.lookAt(camL);
    for (var i = 0; i < NP; i++) pg.attributes.position.array[i * 3 + 1] += Math.sin(wall + seed[i]) * 0.0016;
    pg.attributes.position.needsUpdate = true;
    renderer.render(scene, camera);
  }

  // ================= 画面まわり(字幕・ボタン) =================
  var capEl = document.getElementById('cap'), progi = document.getElementById('progi'), timeEl = document.getElementById('time');
  var chipsEl = document.getElementById('chips'), playBtn = document.getElementById('play');
  function setPlaying(v) { playing = v; playBtn.textContent = v ? '⏸ 一時停止' : '▶ 再生'; }
  var chipBtns = CHAPTERS.map(function (c) {
    var b = document.createElement('button'); b.className = 'chip'; b.textContent = c.title.replace(/^[①-⑳] /, '');
    b.onclick = function () { seek(c.at + 50); setPlaying(true); };
    chipsEl.appendChild(b); return b;
  });
  function fmt(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  var lastCapKey = '';
  function ui() {
    var idx = chapterAt(Math.min(vt, TOTAL - 1)), ch = CHAPTERS[idx], t = vt - ch.at, text = '';
    ch.caps.forEach(function (c) { if (t >= c[0]) text = c[1]; });
    var keyStr = ch.title + '|' + text;
    if (keyStr !== lastCapKey) {
      lastCapKey = keyStr; capEl.innerHTML = '';
      if (text) { var sm = document.createElement('small'); sm.textContent = ch.title; capEl.appendChild(sm); capEl.appendChild(document.createTextNode(text)); }
    }
    progi.style.width = (vt / TOTAL * 100) + '%'; timeEl.textContent = fmt(vt) + ' / ' + fmt(TOTAL);
    chipBtns.forEach(function (b, i) { b.classList.toggle('on', i === idx); });
  }
  playBtn.onclick = function () { if (vt >= TOTAL) seek(0); setPlaying(!playing); };
  document.getElementById('restart').onclick = function () { seek(0); setPlaying(true); };
  document.getElementById('prog').onclick = function (e) { var r = this.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); };
  function skip(ms) { seek(vt + ms); if (vt >= TOTAL) setPlaying(false); }
  document.getElementById('back10').onclick = function () { skip(-10000); };
  document.getElementById('fwd10').onclick = function () { skip(10000); };
  var speed = 1, speedEl = document.getElementById('speed');
  try { var saved = Number(localStorage.getItem('demoSpeed')); if ([0.8, 1, 1.2, 1.5, 2].indexOf(saved) >= 0) speed = saved; } catch (e) {}
  speedEl.value = String(speed);
  speedEl.onchange = function () { speed = Number(speedEl.value) || 1; try { localStorage.setItem('demoSpeed', String(speed)); } catch (e) {} };
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(SELECT|INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') { skip(-10000); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { skip(10000); e.preventDefault(); }
    else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { playBtn.click(); e.preventDefault(); }
  });

  // URLの #t=ミリ秒 で、その時刻から一時停止で開く(確認用)
  var m = location.hash.match(/t=(\d+)/);
  if (m) { seek(Number(m[1])); setPlaying(false); }

  var prev = performance.now();
  function loop(now) {
    var dt = Math.min(100, now - prev); prev = now;
    if (playing) { vt = Math.min(TOTAL, vt + dt * speed); if (vt >= TOTAL) setPlaying(false); }
    frame(now / 1000);
    ui();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
