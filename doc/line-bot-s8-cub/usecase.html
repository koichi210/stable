<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-s8-cub ユースケース</title>
<link rel="stylesheet" href="lib/guide.css">
<link rel="stylesheet" href="lib/cub-tutorial.css">
<style>
  /* デモ再生の字幕とコントロール(3Dの上に重ねる) */
  .demo-ov { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .demo-cap { margin: 0 auto 12px; width: fit-content; max-width: 84%; background: #000000b8; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 17px; line-height: 1.6; text-align: center; }
  .demo-cap:empty { display: none; }
  .demo-bar { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #000000a0; }
  .demo-bar button { border: 1px solid #ffffff55; background: #ffffff1c; color: #fff; border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .demo-bar button.on { background: #06c755; border-color: #06c755; }
  .demo-prog { flex: 1; height: 6px; background: #ffffff30; border-radius: 3px; overflow: hidden; }
  .demo-prog i { display: block; height: 100%; width: 0; background: #06c755; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
<script src="lib/cub-scene.js"></script>
<script src="lib/cub-menu.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors, U = CubMenu.ui, at = U.at;
  var WIDE = { pos: [0, 30, 24], target: [0, 0, -2] };
  var PACKETS = ['pk0', 'pk1', 'pk2', 'pdfdoc'];

  var ANNOUNCE =
    'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。\n\n' +
    '10月17日(土) 秋の野外活動\n集 合 ：  9:00 〇〇公園\n解 散 ：  15:00 〇〇公園\n活動場所： 〇〇公園\nもちもの ： お弁当・水筒・雨具\n\n' +
    '雨天の場合は前日に連絡します。\n\nよろしくお願いします。';
  var REMIND = '明日は秋の野外活動です。\n集合は 9:00 〇〇公園です。\nお弁当と水筒をお忘れなく！';

  // 見せる範囲(箱と矢印)。流れるパケットとPDFは、どのステップでも明るく
  function F(nodes, links) { return CubScene.ids(nodes, links).concat(PACKETS); }

  // ---- デモ再生の仕組み ----
  var guide = null, timers = [], playing = false, t0 = 0, lastIndex = -1, STEPS = null;
  var capEl, playBtn, progEl;

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  // data-at(ms) を持つ要素を、ステップに入ってから ms 後にふわっと出す(トークの吹き出しなど)
  function reveal(g) {
    clearTimers();
    Array.prototype.forEach.call(g.bodyEl.querySelectorAll('[data-at]'), function (el) {
      el.classList.add('tu-hid');
      timers.push(setTimeout(function () { el.classList.remove('tu-hid'); }, Number(el.getAttribute('data-at'))));
    });
  }
  function enter(caption) { return function (g) { reveal(g); capEl.textContent = caption; }; }

  // 矢印 link の上を、start秒から dur秒かけてパケット(球)が流れる。流れていない間は画面外へ
  function fly(g, name, link, t, start, dur) {
    var o = g.get(name), k = g.linear(t, start, dur);
    if (k <= 0 || k >= 1) { o.position.y = -50; return; }
    o.position.copy(g.get('a-' + link).userData.curve.getPoint(k));
    if (name === 'pdfdoc') o.rotation.y = t * 2;
  }
  function glow(g, id, t, from) { if (t >= from) g.pulse(g.get(id), t, 0.07); }

  function restartStep(i) { guide.stepIndex = -1; guide.go(i); lastIndex = i; t0 = Date.now(); }
  function setPlaying(on) {
    playing = on;
    playBtn.textContent = on ? '⏸ 一時停止' : '▶ 自動で再生';
    playBtn.classList.toggle('on', on);
    if (on) {
      if (guide.stepIndex >= STEPS.length - 1) restartStep(0); else restartStep(guide.stepIndex < 0 ? 0 : guide.stepIndex);
    }
  }

  function buildOverlay(g) {
    var ov = document.createElement('div');
    ov.className = 'demo-ov';
    ov.innerHTML = '<div class="demo-cap"></div><div class="demo-bar"><button data-k="play">▶ 自動で再生</button><button data-k="restart">⏮ 最初から</button><div class="demo-prog"><i></i></div></div>';
    g.stage.appendChild(ov);
    capEl = ov.querySelector('.demo-cap'); playBtn = ov.querySelector('[data-k=play]'); progEl = ov.querySelector('.demo-prog i');
    playBtn.onclick = function () { setPlaying(!playing); };
    ov.querySelector('[data-k=restart]').onclick = function () { restartStep(0); setPlaying(true); };
    // 自動再生: いまの章が dur 秒たったら次の章へ。手でステップを変えたら、その章から数え直す
    setInterval(function () {
      var i = g.stepIndex;
      if (i < 0) return;
      if (i !== lastIndex) { lastIndex = i; t0 = Date.now(); }
      var dur = STEPS[i].dur * 1000, el = Date.now() - t0;
      progEl.style.width = playing ? Math.min(100, el / dur * 100) + '%' : '0';
      if (playing && el >= dur) {
        if (i < STEPS.length - 1) g.go(i + 1); else setPlaying(false);
      }
    }, 150);
  }

  GameGuide.start({
    title: 'カブナビ8ちゃん ユースケース',
    subtitle: '「▶ 自動で再生」を押すと、最初の準備から毎月の流れまで、デモ動画のように流れます',
    camera: WIDE,
    build: function (g) {
      guide = g;
      // 舞台はアーキテクチャと同じ。デモ用に、新しい管理者の箱・案内文を設定する矢印・流れるパケットを足す
      var s = CubScene.create(g);
      s.buildBase();
      s.node('newadmin', -17, -11, '🙋 新しい管理者\n(これから手伝う人)', '#9ad0ff', 4.4, 2.2);
      s.link('set-nt', 'admin', 'notice', 'ヘッダ・フッタ・テンプレを設定', C.me, 3);
      s.link('na-ad', 'newadmin', 'admin', '「マイID」で分かった\nIDを伝える', '#9ad0ff', 1.2);
      ['pk0', 'pk1', 'pk2'].forEach(function (id) {
        g.sphere({ id: id, radius: 0.42, pos: [0, -50, 0], color: '#ffffff', emissive: '#7ef0ff', emissiveIntensity: 0.9 });
      });
      g.box({ id: 'pdfdoc', size: [1.5, 0.25, 1.9], pos: [0, -50, 0], color: '#ffffff', edges: false, label: '📄 PDF', labelSize: 0.5, labelBg: '#1b1830ee' });
      buildOverlay(g);
    },
    steps: STEPS = [
      {
        title: '0. デモの見かた',
        dur: 10,
        camera: WIDE,
        enter: enter('「▶ 自動で再生」を押すと、最初の準備から毎月の流れまで、順番に流れます。'),
        html:
          '<p>カブナビ8ちゃんの使い方を、<b>デモ動画のように</b>流します。左の図で<b>データが動き</b>、右に<b>管理者のトーク画面や入力画面</b>が現れます。</p>' +
          '<table><tr><th>章</th><th>内容</th></tr>' +
          '<tr><td>1〜3</td><td><b>最初に(1回だけ)</b>: グループ登録・案内文の設定・管理者の追加</td></tr>' +
          '<tr><td>4〜7</td><td><b>毎月</b>: PDF取り込み → 確認 → 送る(すぐ / 予約)</td></tr>' +
          '<tr><td>8</td><td><b>保護者</b>: 届くお知らせを見るだけ</td></tr>' +
          '<tr><td>9</td><td>まとめ(チェックリスト)</td></tr></table>' +
          '<ul><li>下の「▶ 自動で再生」で連続再生。「⏸」で止めて、番号ボタンで好きな章へ。</li>' +
          '<li>白い玉が、メッセージやデータの動きです。ドラッグで3Dを回せます。</li></ul>'
      },
      {
        title: '1. 【最初に】送信先グループを登録する',
        dur: 14,
        focus: F(['line', 'groups'], ['reg']),
        camera: { pos: [13, 16, 10], target: [13, 0, -4] },
        enter: enter('保護者のグループにカブナビ8ちゃんを招待して、グループの中で「グループ追加」と送ります。'),
        update: function (g, t) { fly(g, 'pk0', 'reg', t, 1.4, 2.6); glow(g, 'groups', t, 4.0); },
        html:
          '<p>開催案内とアナウンスは、<b>登録したグループ</b>へ届きます。グループごとに<b>1回だけ</b>行います。</p>' +
          U.chat([
            { who: 'me', text: '@カブナビ8ちゃん グループ追加', at: 800 },
            { who: 'bot', text: 'このグループを送信先に登録したよ👥\n保護者グループ', at: 4200 },
          ], '保護者グループ') +
          at(6500, '<div class="gg-note">✅ このグループが、<b>保護者用</b>として登録されました(送信先になります)。指導者のグループは「グループ追加 指導者」で登録します。送れるのは<b>管理者だけ</b>です。</div>')
      },
      {
        title: '2. 【最初に】案内文(ヘッダ・フッタ・テンプレ)を設定する',
        dur: 12,
        focus: F(['admin', 'notice'], ['set-nt']),
        camera: { pos: [-8, 18, 10], target: [-8, 0, -7] },
        enter: enter('開催案内の文面を決めます。一度決めれば、毎月使い回せます。'),
        update: function (g, t) { fly(g, 'pk0', 'set-nt', t, 1.5, 3.0); glow(g, 'notice', t, 4.5); },
        html:
          '<p>管理者用 → 保護者連絡 → <b>案内文設定</b>。入力画面に、今の設定が最初から入っています。</p>' +
          at(800, U.liff('ヘッダ設定', [U.ta('ヘッダ', 'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。'), U.btn('保存する')])) +
          at(5000, U.liff('フッタ設定', [U.ta('フッタ', '雨天の場合は前日に連絡します。\nよろしくお願いします。'), U.btn('保存する')])) +
          at(9000, '<div class="gg-note">✅ 保存した内容は、次のプレビューからすぐ反映されます。</div>')
      },
      {
        title: '3. 【最初に】仲間を管理者にする(必要なら)',
        dur: 14,
        focus: F(['newadmin', 'admin', 'admins'], ['na-ad', 'ad-ls']),
        camera: { pos: [-14, 15, 6], target: [-14, 0, -7] },
        enter: enter('新しい人の「マイID」を教えてもらい、管理者に追加します。削除は管理者ならだれでもできますが、オーナーだけは外せません。'),
        update: function (g, t) {
          fly(g, 'pk0', 'na-ad', t, 2.4, 2.4); glow(g, 'admin', t, 4.8);
          fly(g, 'pk1', 'ad-ls', t, 6.0, 2.6); glow(g, 'admins', t, 8.6);
        },
        html:
          '<p>お知らせの作成を手伝う人を、<b>管理者に追加</b>します。</p>' +
          U.chat([
            { who: 'me', text: 'マイID', at: 800 },
            { who: 'bot', text: 'あなたのuserIdです\nU0123456789abcdef0123456789abcdef', at: 1800 },
          ], '新しい人のトーク') +
          at(5600, U.liff('管理者追加(管理者の画面)', [U.field('ユーザーID', 'U0123456789abcdef0123456789abcdef'), U.btn('追加する')])) +
          at(9500, '<div class="gg-note">✅ 追加した瞬間に、相手のメニューが<b>管理者用</b>に切り替わります。</div>')
      },
      {
        title: '4. 【毎月】カブ8通信のPDFを取り込む',
        dur: 18,
        focus: F(['admin', 'pdf', 'events'], ['pdf', 'read']),
        camera: { pos: [-12, 16, 13], target: [-12, 0, -1] },
        enter: enter('「カブ8取り込み」と合図して、5分以内にPDFを送ります。Botが予定を読み取って保存します。'),
        update: function (g, t) {
          fly(g, 'pdfdoc', 'pdf', t, 3.2, 2.6); glow(g, 'pdf', t, 5.8);
          fly(g, 'pk0', 'read', t, 6.6, 2.4); glow(g, 'events', t, 9.0);
        },
        html:
          '<p>管理者用 → 活動予定 →「<b>カブ8取り込み</b>」。</p>' +
          U.chat([
            { who: 'me', text: 'カブ8取り込み', at: 600 },
            { who: 'bot', text: '📄 次に送られたカブ8通信のPDFを取り込むよ(5分以内・1回だけ)', at: 1800 },
            { who: 'file', text: 'カブ8_10月号.pdf', at: 3200 },
            { who: 'bot', text: '📄 カブ8_10月号.pdf を取り込んだよ(追加 6件 / 上書き 0件)\n\n・10月17日(土) 秋の野外活動\n・11月 3日(祝) …', at: 9200 },
          ]) +
          at(11500, '<div class="gg-note">PDFそのものは保存せず、読み取った<b>予定だけ</b>を保存します。合図をした本人が、同じトークへ送ったPDFだけが対象です。</div>')
      },
      {
        title: '5. 【毎月】予定と文面を確認する(プレビュー)',
        dur: 16,
        focus: F(['admin', 'events', 'notice', 'preview'], ['ev-pv', 'nt-pv', 'pv-ad']),
        camera: { pos: [-7, 20, 12], target: [-7, 0, -6] },
        enter: enter('予定と案内文設定から、開催案内の文面ができます。送る前に、プレビューで確認します。'),
        update: function (g, t) {
          fly(g, 'pk0', 'ev-pv', t, 1.2, 2.2); fly(g, 'pk1', 'nt-pv', t, 1.2, 2.2); glow(g, 'preview', t, 3.4);
          fly(g, 'pk2', 'pv-ad', t, 4.6, 2.8); glow(g, 'admin', t, 7.4);
        },
        html:
          '<p>保護者連絡 → 案内文設定 →「<b>プレビュー表示</b>」で、予定をラジオボタンで選びます。</p>' +
          at(4800, U.liff('プレビュー表示', [U.radios(['10月17日(土)\n秋の野外活動', '11月 3日(祝)\n文化の日の活動'], 0)])) +
          at(7800, U.liff('開催案内', [U.ta('文面', ANNOUNCE)])) +
          at(12500, '<div class="gg-note">不要な予定は「予定削除」でチェックして消せます。日付が過ぎた予定は自動で消えます。</div>')
      },
      {
        title: '6. 【毎月】今すぐ送る',
        dur: 14,
        focus: F(['preview', 'groups', 'line'], ['send', 'gr-pv']),
        camera: { pos: [9, 18, 11], target: [9, 0, -4] },
        enter: enter('「次回を送信」と送ると、登録したグループへ、今すぐ開催案内が届きます。'),
        update: function (g, t) { fly(g, 'pk0', 'send', t, 2.2, 3.2); glow(g, 'line', t, 5.4); },
        html:
          U.chat([
            { who: 'me', text: '次回を送信', at: 800 },
            { who: 'bot', text: '📤 次回(10月17日(土))の開催案内を送ったよ\n✅ 保護者グループ', at: 5600 },
          ], '管理者のトーク') +
          at(5800, U.chat([{ who: 'bot', text: ANNOUNCE }], '保護者グループ(届いた画面)'))
      },
      {
        title: '7. 【毎月】日時を決めて送る(アナウンス予約)',
        dur: 22,
        focus: F(['admin', 'preview', 'resv', 'groups', 'cron', 'line'], ['add-rs', 'pv-rs', 'gr-rs', 'cr-rs', 'rs-ln']),
        camera: WIDE,
        enter: enter('宛先・日時・本文を入れて予約すると、時刻になったとき自動で届きます。'),
        update: function (g, t) {
          fly(g, 'pk0', 'pv-rs', t, 1.0, 2.0);
          fly(g, 'pk1', 'add-rs', t, 3.0, 3.0); glow(g, 'resv', t, 6.0);
          if (t > 8 && t < 17) g.pulse(g.get('cron'), t, 0.09);
          fly(g, 'pk2', 'cr-rs', t, t < 12 ? 9.0 : 12.2, 1.6);   // cronが毎分(ここでは数秒おき)呼び出す様子
          if (t > 17) { fly(g, 'pk0', 'rs-ln', t, 17.2, 2.8); glow(g, 'line', t, 20.0); }
        },
        html:
          '<p>保護者連絡 → アナウンス →「<b>アナウンス追加</b>」。</p>' +
          at(800, U.liff('アナウンス追加', [U.field('宛先グループ', '保護者グループ', 'select'), U.field('日付', '2026/10/15'), U.field('時刻', '19:00'), U.ta('送信する本文', REMIND), U.btn('予約する')])) +
          at(8500, '<div class="gg-note">⏰ cron-job.org が<b>毎分</b>Botを呼び出し、「いま送る時刻の予約」があるか確認します。</div>') +
          at(17200, '<div class="gg-note">📢 10/15 19:00 になった呼び出しで、予約が<b>自動で送信</b>され、予約は消えます(1回きり)。</div>') +
          at(19600, U.chat([{ who: 'sys', text: '10月15日(木) 19:00' }, { who: 'bot', text: REMIND }], '保護者グループ(届いた画面)'))
      },
      {
        title: '8. 【保護者】やること',
        dur: 12,
        focus: F(['line'], []),
        camera: { pos: [14, 26, 20], target: [14, 0, 0] },
        enter: enter('保護者は操作不要です。グループに届くお知らせを見るだけです。'),
        update: function (g, t) { glow(g, 'line', t, 0.5); },
        html:
          '<p><b>操作は不要です。</b>グループに届くお知らせを見るだけで大丈夫です。</p>' +
          U.chat([
            { who: 'bot', text: ANNOUNCE, at: 800 },
            { who: 'sys', text: '10月15日(木) 19:00', at: 4500 },
            { who: 'bot', text: REMIND, at: 4800 },
          ], '保護者グループ') +
          at(7500, '<ul><li>届いた<b>開催案内</b>で、集合時間・場所・もちものを確認します。</li><li>カブナビ8ちゃんは<b>管理者の操作だけ</b>に反応します。グループで話しかけても返事はしません(質問は指導者に直接)。</li></ul>')
      },
      {
        title: '9. まとめ',
        dur: 12,
        camera: WIDE,
        enter: enter('これで、最初の準備と、毎月の流れはおしまいです。'),
        html:
          '<p><b>最初に(1回だけ)</b></p>' +
          at(500, '<ul><li>☑ 保護者グループに招待して「グループ追加」</li><li>☑ ヘッダ・フッタ・テンプレを設定</li><li>☑ 手伝う人を管理者に追加(必要なら)</li></ul>') +
          '<p><b>毎月</b></p>' +
          at(2500, '<ul><li>☑ 「カブ8取り込み」→ 5分以内にPDFを送る</li><li>☑ プレビューで確認(不要な予定は予定削除)</li><li>☑ すぐ送る →「次回を送信」 / 日時を決める →「アナウンス追加」</li></ul>') +
          at(5000, '<table><tr><th>こんなとき</th><th>確認すること</th></tr>' +
            '<tr><td>グループに届かない</td><td>そのグループの中で「グループ追加」したか(グループ一覧)</td></tr>' +
            '<tr><td>PDFが取り込まれない</td><td>「カブ8取り込み」の後、<b>5分以内</b>に<b>同じトーク</b>へ送ったか</td></tr>' +
            '<tr><td>予約できない</td><td>日時が<b>2分以上先</b>か、送信先グループがあるか</td></tr></table>') +
          at(8000, '<p>しくみは<a href="overview.html">アーキテクチャ</a>、ボタンの順番は<a href="structure.html">メニュー階層</a>で見られます。</p><p class="gg-files">人名・ID・グループ名は、すべてダミーです。</p>')
      },
    ],
  });
})();
</script>
</body>
</html>
