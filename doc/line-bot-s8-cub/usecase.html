<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-s8-cub ユースケース</title>
<link rel="stylesheet" href="lib/guide.css">
<link rel="stylesheet" href="lib/cub-tutorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
<script src="lib/cub-scene.js"></script>
<script src="lib/cub-menu.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors, U = CubMenu.ui, ids = CubScene.ids;
  var WIDE = { pos: [0, 30, 24], target: [0, 0, -2] };

  var SAMPLE_ANNOUNCE =
    'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。\n\n' +
    '10月17日(土) 秋の野外活動\n集 合 ：  9:00 〇〇公園\n解 散 ：  15:00 〇〇公園\n活動場所： 〇〇公園\nもちもの ： お弁当・水筒・雨具\n\n' +
    '雨天の場合は前日に連絡します。\n\nよろしくお願いします。';

  GameGuide.start({
    title: 'カブナビ8ちゃん ユースケース',
    subtitle: '誰が・いつ・何をするか。しくみ図の上で、役割ごとの手順を追う',
    camera: WIDE,
    build: function (g) {
      // 舞台はしくみ図と同じ。ユースケース用に、新しい管理者の箱と、案内文を設定する矢印だけ足す
      var s = CubScene.create(g);
      s.buildBase();
      s.node('newadmin', -17, -11, '🙋 新しい管理者\n(これから手伝う人)', '#9ad0ff', 4.4, 2.2);
      s.link('set-nt', 'admin', 'notice', 'ヘッダ・フッタ・テンプレを設定', C.me, 3);
      s.link('na-ad', 'newadmin', 'admin', '「マイID」で分かった\nIDを伝える', '#9ad0ff', 1.2);
    },
    steps: [
      {
        title: 'はじめに：誰が何をするか',
        camera: WIDE,
        html:
          '<p>カブナビ8ちゃんの使い方を、<b>役割ごとの手順</b>にまとめました。しくみ図と同じ図の上で、<b>今どこを使っているか</b>が光ります。</p>' +
          '<table><tr><th>誰</th><th>やること</th></tr>' +
          '<tr><td>🧑‍💼 管理者</td><td><b>最初に</b>準備(1回だけ)、<b>毎月</b>開催案内を出す</td></tr>' +
          '<tr><td>💬 保護者</td><td>届くお知らせを見るだけ(操作は不要)</td></tr></table>' +
          '<p><b>この順で見ていきます</b></p>' +
          '<ol><li><b>【管理者・最初に】</b>送信先グループの登録 → 案内文の設定 → 仲間を管理者に</li>' +
          '<li><b>【管理者・毎月】</b>PDFの取り込み → 確認 → 送る(すぐ / 日時を決めて)</li>' +
          '<li><b>【保護者】</b>やること</li>' +
          '<li>こんなときは(困りごとの確認表)</li></ol>' +
          '<p>各ステップに<b>チェックリスト</b>を付けています。ドラッグで3Dを回せます。</p>'
      },
      {
        title: '【管理者・最初に】① 送信先グループを登録する',
        focus: ids(['line', 'groups'], ['reg']),
        camera: { pos: [13, 16, 10], target: [13, 0, -4] },
        html:
          '<p>開催案内とアナウンスは、<b>登録したグループ</b>へ届きます。グループごとに<b>1回だけ</b>行います。</p>' +
          '<ol><li>保護者のLINEグループに、カブナビ8ちゃんを<b>招待</b></li>' +
          '<li>そのグループの<b>中で</b>、カブナビ8ちゃんに@メンションして「<b>グループ追加</b>」と送る</li></ol>' +
          U.chat([{ who: 'me', text: '@カブナビ8ちゃん グループ追加' }, { who: 'bot', text: 'このグループを送信先に登録したよ👥\n保護者グループ' }], '保護者グループ') +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ グループに招待した</li><li>☐ グループの中で「グループ追加」を送り、登録できた</li><li>☐ 「グループ一覧」で、登録を確認した</li></ul>' +
          '<div class="gg-note">1:1トークでボタンを押しても登録はできません(「グループの中で送ってね」と案内が返るだけ)。送れるのは<b>管理者だけ</b>です。同じグループに別のBot(ミライなど)がいると、招待が止まることがあります。</div>'
      },
      {
        title: '【管理者・最初に】② 案内文を設定する',
        focus: ids(['admin', 'notice'], ['set-nt']),
        camera: { pos: [-8, 18, 10], target: [-8, 0, -7] },
        html:
          '<p>開催案内の文面の<b>ヘッダ・フッタ・テンプレ</b>を設定します。<b>一度決めれば使い回せます</b>(毎月触るのは予定だけ)。</p>' +
          '<p>管理者用 → <b>保護者連絡</b> → <b>案内文設定</b> から、3つの入力画面を開きます。今の設定が最初から入っています。</p>' +
          U.liff('ヘッダ設定', [U.ta('ヘッダ', 'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。'), U.btn('保存する')]) +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ ヘッダを設定した</li><li>☐ フッタを設定した</li><li>☐ テンプレを確認した(差し込み項目 <code>{日付}</code> <code>{集合}</code> <code>{フッタ}</code> など)</li></ul>' +
          '<div class="gg-note">文面は、あとで「プレビュー表示」で確認できます。</div>'
      },
      {
        title: '【管理者・最初に】③ 仲間を管理者にする(必要なら)',
        focus: ids(['newadmin', 'admin', 'admins'], ['na-ad', 'ad-ls']),
        camera: { pos: [-14, 15, 6], target: [-14, 0, -7] },
        html:
          '<p>お知らせの作成を手伝ってもらう人は、<b>管理者に追加</b>します。</p>' +
          '<ol><li>新しい人が、カブナビ8ちゃんを友だち追加して、1:1で「<b>マイID</b>」と送る</li>' +
          '<li>返ってきた<b>ID</b>を、管理者に伝える</li>' +
          '<li>管理者が、管理者用 → <b>管理者編集</b> → 「管理者追加」でIDを入力</li></ol>' +
          U.chat([{ who: 'me', text: 'マイID' }, { who: 'bot', text: 'あなたのuserIdです\nU0123456789abcdef0123456789abcdef' }], 'カブナビ8ちゃん(新しい管理者の画面)') +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ 新しい人からIDを教えてもらった</li><li>☐ 管理者追加でIDを入力した</li><li>☐ 相手のメニューが管理者用に変わった</li></ul>' +
          '<div class="gg-note">追加は管理者なら誰でも、<b>削除はオーナーだけ</b>です(オーナーは外せません)。</div>'
      },
      {
        title: '【管理者・毎月】① カブ8通信のPDFを取り込む',
        focus: ids(['admin', 'pdf', 'events'], ['pdf', 'read']),
        camera: { pos: [-12, 16, 13], target: [-12, 0, -1] },
        html:
          '<p>カブ8通信が届いたら、管理者用 → <b>活動予定</b> →「<b>カブ8取り込み</b>」を押し、<b>5分以内</b>に同じトークへPDFを送ります。</p>' +
          U.chat([
            { who: 'me', text: 'カブ8取り込み' },
            { who: 'bot', text: '📄 次に送られたカブ8通信のPDFを取り込むよ(5分以内・1回だけ)' },
            { who: 'file', text: 'カブ8_10月号.pdf' },
            { who: 'bot', text: '📄 カブ8_10月号.pdf を取り込んだよ(追加 6件 / 上書き 0件)' },
          ]) +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ 「カブ8取り込み」を押してから、5分以内にPDFを送った</li><li>☐ 取り込み結果(追加・上書きの件数)を確認した</li></ul>' +
          '<div class="gg-note">取り込めるのは、合図をした<b>本人</b>が<b>同じトーク</b>へ送った<b>PDF</b>だけ。PDFそのものは保存せず、読み取った<b>予定だけ</b>を保存します。</div>'
      },
      {
        title: '【管理者・毎月】② 予定と文面を確認する',
        focus: ids(['admin', 'events', 'notice', 'preview'], ['ev-pv', 'nt-pv', 'pv-ad']),
        camera: { pos: [-7, 20, 12], target: [-7, 0, -6] },
        html:
          '<p>取り込んだ予定を確認し、<b>送る文面</b>をプレビューで見ます。</p>' +
          '<ul><li><b>予定一覧</b>で確認。不要な予定は<b>予定削除</b>でチェックして消せます。</li>' +
          '<li>保護者連絡 → 案内文設定 →「<b>プレビュー表示</b>」で、予定を<b>ラジオボタンで選ぶ</b>と、開催案内の文面が出ます。</li></ul>' +
          U.liff('プレビュー表示', [U.radios(['10月17日(土)\n秋の野外活動', '11月 3日(祝)\n文化の日の活動'], 0), U.ta('開催案内', SAMPLE_ANNOUNCE)]) +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ 予定一覧で、取り込めたことを確認した</li><li>☐ 不要な予定があれば、予定削除で消した</li><li>☐ プレビューで、送る文面を確認した</li></ul>' +
          '<div class="gg-note">日付が過ぎた予定は、一覧やプレビューを開いたときに自動で消えます。</div>'
      },
      {
        title: '【管理者・毎月】③-A 今すぐ送る',
        focus: ids(['preview', 'groups', 'line'], ['send', 'gr-pv']),
        camera: { pos: [9, 18, 11], target: [9, 0, -4] },
        html:
          '<p>開催案内を<b>今すぐ</b>送るときは、チャットで「<b>次回を送信</b>」(または「次の次を送信」)と送ります。</p>' +
          U.chat([{ who: 'me', text: '次回を送信' }, { who: 'bot', text: '📤 次回(10月17日(土))の開催案内を送ったよ\n✅ 保護者グループ' }]) +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ 送り先は、登録したグループ全部だと分かっている</li><li>☐ 返ってきた結果(✅/❌)を確認した</li></ul>' +
          '<div class="gg-note">日時を決めて送りたいときは、次の「予約して送る」を使います。</div>'
      },
      {
        title: '【管理者・毎月】③-B 日時を決めて送る(アナウンス予約)',
        focus: ids(['admin', 'preview', 'resv', 'groups', 'cron', 'line'], ['add-rs', 'pv-rs', 'gr-rs', 'cr-rs', 'rs-ln']),
        camera: WIDE,
        html:
          '<p>保護者連絡 → <b>アナウンス</b> →「<b>アナウンス追加</b>」で、<b>宛先・日時・本文</b>を入れて予約します。時刻になると自動で届きます(1回きり)。</p>' +
          U.liff('アナウンス追加', [U.field('宛先グループ', '保護者グループ', 'select'), U.field('日付', '2026/10/15'), U.field('時刻', '19:00'), U.ta('送信する本文', SAMPLE_ANNOUNCE), U.btn('予約する')]) +
          '<p><b>チェックリスト</b></p>' +
          '<ul><li>☐ 宛先グループを選んだ</li><li>☐ 日時を<b>2分以上先</b>にした</li><li>☐ 本文は、プレビューの文面をコピペして手直しした</li><li>☐ 「アナウンス一覧」で、予約を確認した(取り消しは「アナウンス削除」)</li></ul>' +
          '<div class="gg-note">毎分Botを呼び出して時刻を知らせるのは、外の<b>cron-job.org</b>です。送れた予約は自動で消え、失敗した分は残って再送されます。</div>'
      },
      {
        title: '【保護者】やること',
        focus: ids(['line'], []),
        camera: { pos: [14, 26, 20], target: [14, 0, 0] },
        html:
          '<p><b>操作は不要です。</b>グループに届くお知らせを見るだけで大丈夫です。</p>' +
          U.chat([{ who: 'bot', text: SAMPLE_ANNOUNCE }], '保護者グループ') +
          '<ul><li>届いた<b>開催案内</b>で、集合時間・場所・もちものを確認します。</li>' +
          '<li>アナウンスは、管理者が決めた<b>日時に自動で</b>届きます。</li>' +
          '<li>カブナビ8ちゃんは<b>管理者の操作だけ</b>に反応します。グループで話しかけても返事はしません(質問は指導者に直接)。</li>' +
          '<li>1:1の「ヘルプ」は、今は「今後実装予定です」と返ります。</li></ul>' +
          '<div class="gg-note">管理者として手伝うことになったら、1:1で「マイID」と送り、返ってきたIDをオーナーに伝えます。</div>'
      },
      {
        title: 'こんなときは',
        camera: WIDE,
        html:
          '<table><tr><th>困りごと</th><th>確認すること</th></tr>' +
          '<tr><td>開催案内を送ったのに、グループに届かない</td><td>グループが登録されているか(グループ一覧)。登録は<b>そのグループの中</b>で「グループ追加」</td></tr>' +
          '<tr><td>PDFを送っても取り込まれない</td><td>先に「カブ8取り込み」を押したか。<b>5分以内</b>か。<b>同じトーク</b>へ<b>PDF</b>を送ったか</td></tr>' +
          '<tr><td>「次回」の予定がない</td><td>今日以降の予定が取り込まれているか(過ぎた予定は自動で消える)</td></tr>' +
          '<tr><td>プレビューにフッタが出ない</td><td>テンプレに <code>{フッタ}</code> が入っているか(初期化すると既定に戻る)</td></tr>' +
          '<tr><td>アナウンスが予約できない</td><td>日時が<b>2分以上先</b>か。送信先グループが登録されているか</td></tr>' +
          '<tr><td>予約した時刻に届かない</td><td>「アナウンス一覧」にまだ残っているか。cron-job.orgが毎分呼び出せているか</td></tr>' +
          '<tr><td>メニューが管理者用にならない</td><td>管理者に追加されているか。トークを開き直す。管理者追加をやり直す</td></tr></table>'
      },
      {
        title: 'まとめ：チェックリスト',
        camera: WIDE,
        html:
          '<p><b>最初に(1回だけ)</b></p>' +
          '<ul><li>☐ 保護者グループに招待して「グループ追加」</li><li>☐ ヘッダ・フッタ・テンプレを設定</li><li>☐ 手伝う人を管理者に追加(必要なら)</li></ul>' +
          '<p><b>毎月</b></p>' +
          '<ul><li>☐ 「カブ8取り込み」→ 5分以内にPDFを送る</li><li>☐ 予定一覧・プレビューで確認(不要な予定は予定削除)</li>' +
          '<li>☐ すぐ送る →「次回を送信」 / 日時を決める →「アナウンス追加」</li></ul>' +
          '<p>機能どうしのつながりは<a href="overview.html">しくみ図</a>、ボタンを押す順番は<a href="structure.html">メニューの階層</a>で見られます。</p>' +
          '<p class="gg-files">人名・ID・グループ名は、すべてダミーです。</p>'
      },
    ],
  });
})();
</script>
</body>
</html>
