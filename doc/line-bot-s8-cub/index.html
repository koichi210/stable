<script>
ToolPage.start({

  id: 'line-bot-s8-cub',

        '今すぐ送るか、日時を決めて<b>予約</b>すると、保護者の LINE グループに届きます。保護者は届いたお知らせを見るだけで、操作はいりません。',
  say: ['毎月の開催案内を、保護者のグループに送りたい', '決めた日時に、お知らせを自動で流したい', '活動予定を自分で見たい（保護者）', 'どのボタンを押せばいいか知りたい'],
  sayTitle: 'こんなときに',
  shot: { src: 'img/announce-sample.png', title: '画面の見本', cap: '開催案内・案内文編集・カブ8通信の見本（名前・場所はダミー）' },

    { id: 'admin', type: 'person', label: '管理者', at: [-9, 0],

    { id: 'pdf', type: 'file', label: 'カブ8通信 PDF', at: [-6, 4],

    { id: 'cron', type: 'service', label: 'cron-job.org', sub: '毎分', at: [0.5, -5],

    { id: 'events', type: 'store', label: '活動予定', at: [2, 1.5],

    ['line', 'groups'], ['line', 'parent'],

    { by: 'admin', title: '操作できるのは管理者だけ', flow: [['admin', 'bot'], ['bot', 'members']],

      note: '管理者にした・外した瞬間に、その人のメニューが管理者用 ⇔ 一般用に切り替わる。オーナーだけは外せない' },

    { by: 'preview', title: '【毎月】今すぐ送る「次回を送信」', flow: [['preview', 'line'], ['line', 'parent']], focus: ['preview', 'line', 'groups', 'parent'],

    { by: 'cron', title: '【毎月】日時を決めて送る（アナウンス予約）', flow: [['admin', 'bot'], ['bot', 'resv'], ['cron', 'bot'], ['resv', 'line']], focus: ['admin', 'bot', 'resv', 'cron', 'groups', 'line'],
      text: '保護者連絡 →「アナウンス追加」で、宛先（登録した保護者グループから選ぶ）・日時・本文を入れて予約する。本文は、上のプルダウンで予定を選ぶと案内文が入るので、それを直すのが基本(「フリーフォーマット」なら自由に書ける)。cron-job.org が毎分ボットを呼び出し、時刻になった予約を送る。送れた予約は消え、失敗した分は次の呼び出しで再送する。',

      text: '保護者は操作不要。グループに届いた開催案内で、集合時間・場所・もちものを確かめる。予定を自分で見たいときは、ボットとの1:1トークのメニュー「活動予定」→「予定表」を開く。',

  pages: [
    { href: 'structure.html', icon: '🌳', title: 'メニュー階層', desc: '管理者 → 管理者用 → 保護者連絡 → アナウンス追加／削除… と、ボタンを押す順番を階層(ツリー)で。管理者と一般(保護者)のメニューの両方、各ボタンでできることの表付き（全10ステップ）' },
    { href: 'overview.html', icon: '🗺️', title: 'アーキテクチャ', desc: 'グループ・アナウンス・案内文編集・活動予定・メンバ(管理者 / ユーザ)が、どうつながっているかを図で。データの流れを矢印で追える（全8ステップ）' },
    { href: 'usecase.html', icon: '🎬', title: 'ユースケース', desc: 'デモ動画のように、役割別の使い方が流れる。最初の準備 → 毎月の開催案内 → 保護者が見る画面まで、字幕付き（自動再生・全10章）' },
  ],
  note: '人名・ID・グループ名は<b>すべてダミー</b>です。「メニュー階層」は、Bot本体の <code>scripts/rich-menu-config.js</code> から自動生成した <code>menus-data.js</code> を読んで組み立てています。メニューを変えたら、Bot側のリポジトリで <code>node scripts/build-tutorial-data.js</code> を実行して <code>menus-data.js</code> を更新します。' +
        '3D図解の共通フレームワーク（<code>lib/guide.js</code> / <code>lib/guide.css</code>）は line-bot-mirai のドキュメントからのコピーです。',
});
