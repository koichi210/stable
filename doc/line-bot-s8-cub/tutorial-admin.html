<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-s8-cub 使い方(管理者向け)</title>
<link rel="stylesheet" href="lib/guide.css">
<link rel="stylesheet" href="lib/cub-tutorial.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
<script src="menus-data.js"></script>
<script src="lib/cub-menu.js"></script>
</head>
<body>
<script>
(function () {
  var S = CubMenu.step, U = CubMenu.ui;

  // 実際のBotの返事に合わせたサンプル(人名・IDはダミー)
  var SAMPLE_ANNOUNCE =
    'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。\n\n' +
    '10月17日(土) 秋の野外活動\n集 合 ：  9:00 〇〇公園\n解 散 ：  15:00 〇〇公園\n活動場所： 〇〇公園\nもちもの ： お弁当・水筒・雨具\n\n' +
    '雨天の場合は前日に連絡します。\n\nよろしくお願いします。';

  GameGuide.start({
    title: 'カブナビ8ちゃん 使い方(管理者向け)',
    subtitle: 'リッチメニューを立体で追いながら、初回の準備と毎月の流れを覚える',
    camera: { pos: [0, 4, 11.5], target: [0, 1.7, 0] },
    build: function (g) {
      CubMenu.build(g, ['main-admin', 'admin', 'parents', 'groups', 'notice', 'events', 'announcement', 'admins', 'other']);
    },
    steps: [
      S({
        title: 'はじめに：メニューは3Dで追いかけよう',
        menu: 'main-admin',
        html:
          '<p>カブナビ8ちゃんは、<b>カブ8通信のPDF</b>から次回の活動予定を読み取り、<b>保護者のLINEグループへ開催案内を届ける</b>Botです。</p>' +
          '<p>操作はほぼ全部、トーク画面下の<b>リッチメニュー</b>のボタンでできます。左の立体図が実際のメニューと同じ並びです。' +
          '<b>押すボタンだけが手前に飛び出し</b>、ほかは薄くなります。ドラッグで回せます。</p>' +
          '<div class="gg-note">⚠️ このメニューは<b>管理者にだけ</b>出ます(管理者以外には「ヘルプ」だけのメニュー)。</div>' +
          '<p><b>全体の流れ</b></p>' +
          '<ol><li><b>初回だけ</b>：送信先グループの登録、案内文(ヘッダ・フッタ・テンプレ)の設定</li>' +
          '<li><b>毎月</b>：カブ8通信PDFの取り込み → プレビュー確認 → アナウンスを予約</li>' +
          '<li>必要なとき：管理者の追加・削除</li></ol>' +
          '<p>キーボードの ← → でもステップを送れます。機能どうしのつながりは<a href="overview.html">しくみ図</a>で見られます。</p>'
      }),
      S({
        title: '🔧 管理者用メニューを開く',
        menu: 'main-admin', hl: '🔧 管理者用',
        html:
          '<p>まず「<b>🔧 管理者用</b>」を押します。管理者向けの機能が、分類ごとのサブメニューに分かれています。</p>' +
          '<p>どのサブメニューにも<b>「◀ 戻る」が右下</b>にあり、1つ前のメニューに戻れます。</p>' +
          '<p>「その他」には、自分のIDを確認する「マイID」と「ヘルプ」があります(最後のステップで説明します)。</p>'
      }),
      S({
        title: '📣 保護者連絡 = 保護者に伝える機能の入口',
        menu: 'admin', hl: '📣 保護者連絡',
        html:
          '<p>管理者用メニューの左上「<b>📣 保護者連絡</b>」の中に、保護者への連絡に関わる機能がまとまっています。</p>' +
          '<ul><li>📢 <b>アナウンス</b>：日時を決めてグループへ自動送信</li>' +
          '<li>✏️ <b>案内文設定</b>：ヘッダ・フッタ・テンプレ、プレビュー</li>' +
          '<li>👥 <b>グループ</b>：送信先グループの管理</li></ul>' +
          '<p>まずは<b>初回の準備</b>から始めましょう。</p>'
      }),
      S({
        title: '【初回】送信先グループを登録する',
        menu: 'groups', hl: 'グループ追加',
        html:
          '<p>開催案内とアナウンスは、ここで登録した<b>グループ</b>に届きます。</p>' +
          '<ol><li>保護者のLINEグループに<b>カブナビ8ちゃんを招待</b></li>' +
          '<li><b>そのグループの中で</b>、カブナビ8ちゃんに@メンションして「<b>グループ追加</b>」と送る</li></ol>' +
          U.chat([
            { who: 'me', text: '@カブナビ8ちゃん グループ追加' },
            { who: 'bot', text: 'このグループを送信先に登録したよ👥\n保護者グループ' },
          ], '保護者グループ') +
          '<div class="gg-note">ボタンを1:1トークで押しても登録はできません(「グループの中で@メンションして送ってね」と案内が返るだけ)。グループ内でBotに話しかけたときも、<b>管理者の発言だけ</b>が処理されます。</div>' +
          '<div class="gg-note">⚠️ 同じグループに別のBot(ミライなど)が入っていると、招待が「招待中」のまま止まることがあります。</div>'
      }),
      S({
        title: '【初回】登録の確認と解除',
        menu: 'groups', hl: ['グループ一覧', 'グループ削除'],
        html:
          '<p>「<b>グループ一覧</b>」で、登録済みの送信先を確認できます。</p>' +
          U.chat([{ who: 'me', text: 'グループ一覧' }, { who: 'bot', text: '👥 登録済みのグループだよ\n・保護者グループ' }]) +
          '<p>送信先から外したいときは、<b>外したいグループの中で</b>@メンションして「<b>グループ削除</b>」と送ります(1:1トークの名前指定はできません)。</p>'
      }),
      S({
        title: '【初回】✏️ 案内文設定を開く',
        menu: 'parents', hl: '✏️ 案内文設定',
        html:
          '<p>開催案内の文面は、<b>ヘッダ</b>(先頭の挨拶)・<b>本文のテンプレ</b>・<b>フッタ</b>(末尾の挨拶)でできています。' +
          'ここで一度設定しておけば、毎月は予定を取り込むだけで文面が整います。</p>' +
          '<p>「保護者連絡」の右上「<b>✏️ 案内文設定</b>」を押します。</p>'
      }),
      S({
        title: '【初回】ヘッダ設定',
        menu: 'notice', hl: 'ヘッダ設定',
        html:
          '<p>案内文の<b>先頭に付く固定の文章</b>です。ボタンを押すと入力画面が開き、<b>今の設定が最初から入っています</b>。</p>' +
          U.liff('ヘッダ設定', [U.ta('ヘッダ', 'カブ隊保護者のみなさま\n副長の〇〇です。次回の活動についてご連絡致します。'), U.btn('保存する')]) +
          '<p>空にして保存すると、ヘッダ無しになります。</p>'
      }),
      S({
        title: '【初回】フッタ設定',
        menu: 'notice', hl: 'フッタ設定',
        html:
          '<p>案内文の<b>最後に付く固定の文章</b>です。使い方はヘッダ設定と同じです。</p>' +
          U.liff('フッタ設定', [U.ta('フッタ', '雨天の場合は前日に連絡します。\nよろしくお願いします。'), U.btn('保存する')]) +
          '<div class="gg-note">フッタはテンプレートの <code>{フッタ}</code> の位置に入ります。テンプレから <code>{フッタ}</code> を消すと案内文に出なくなるので、その場合は画面に警告が出ます。</div>'
      }),
      S({
        title: '【初回】テンプレ設定',
        menu: 'notice', hl: 'テンプレ設定',
        html:
          '<p>案内文の<b>形</b>を決めます。<code>{日付}</code> や <code>{集合}</code> などの<b>差し込み項目</b>が、予定の中身に置き換わります。</p>' +
          U.liff('テンプレ設定', [
            U.ta('テンプレート', '{ヘッダ}\n\n{日付} {タイトル}\n集 合 ： {集合}\n解 散 ： {解散}\n…\n{フッタ}'),
            '<div class="tu-lb">使える差し込み項目</div><div class="tu-field">{ヘッダ} {日付} {タイトル} {サブタイトル} {集合} {解散} {活動場所} {もちもの} {備考} {フッタ}</div>',
            U.btn('保存する'), U.btn('初期化(既定のテンプレートに戻す)', true),
          ]) +
          '<ul><li>中身が空の項目の行は、見出しごと自動で消えます(「予定のみ」で集合がまだ分からないときなど)。</li>' +
          '<li><b>初期化</b>ボタンで既定のテンプレートに戻せます(確認が出ます)。</li></ul>'
      }),
      S({
        title: '【毎月】📄 活動予定を開く',
        menu: 'admin', hl: '📄 活動予定',
        html:
          '<p>ここからは<b>毎月の作業</b>です。カブ8通信が届いたら、管理者用メニューの左下「<b>📄 活動予定</b>」から始めます。</p>'
      }),
      S({
        title: '【毎月】カブ8通信のPDFを取り込む',
        menu: 'events', hl: 'カブ8取り込み',
        html:
          '<p>「<b>カブ8取り込み</b>」を押すと、Botが<b>PDFの受付</b>を始めます。そのあと<b>5分以内</b>に、同じトークへPDFを送ります。</p>' +
          U.chat([
            { who: 'me', text: 'カブ8取り込み' },
            { who: 'bot', text: '📄 次に送られたカブ8通信のPDFを取り込むよ(5分以内・1回だけ)\n\n・スマホ: 入力欄の左の「＋」→「ファイル」→ PDFを選ぶ' },
            { who: 'file', text: 'カブ8_10月号.pdf' },
            { who: 'bot', text: '📄 カブ8_10月号.pdf を取り込んだよ(追加 6件 / 上書き 0件)\n\n・10月17日(土) 秋の野外活動\n・11月 3日(祝) …' },
          ]) +
          '<ul><li>取り込めるのは、<b>合図をした本人</b>が<b>そのトーク</b>へ送った<b>PDF</b>を<b>1回だけ</b>。合図が無いファイルや画像は無視されます。</li>' +
          '<li>同じ日付・タイトルの予定は上書きされます。</li></ul>'
      }),
      S({
        title: '【毎月】予定の一覧と削除',
        menu: 'events', hl: ['予定一覧', '予定削除'],
        html:
          '<p>「<b>予定一覧</b>」で、取り込み済みの予定を確認できます。</p>' +
          '<p>不要な予定は「<b>予定削除</b>」で、<b>チェックを入れて削除</b>できます。</p>' +
          U.liff('予定削除', [U.checks(['10月17日(土)\n秋の野外活動', '11月 3日(祝)\n文化の日の活動'], [1]), U.btn('選択した1件を削除', true)]) +
          '<div class="gg-note">日付が過ぎた予定は、一覧やプレビューを開いたときに自動で消えます。</div>'
      }),
      S({
        title: '【毎月】プレビューで案内文を確認する',
        menu: 'notice', hl: 'プレビュー表示',
        html:
          '<p>「保護者連絡 → 案内文設定」の「<b>プレビュー表示</b>」で、予定を<b>ラジオボタンで選ぶ</b>と、その予定の開催案内が下のテキストボックスに出ます。</p>' +
          U.liff('プレビュー表示', [
            U.radios(['10月17日(土)\n秋の野外活動', '11月 3日(祝)\n文化の日の活動'], 0),
            U.ta('開催案内', SAMPLE_ANNOUNCE),
          ]) +
          '<p>文面を長押しでコピーして、次の「アナウンス追加」に貼り付けられます。ヘッダ・フッタ・テンプレの設定が、この文面にそのまま反映されます。</p>' +
          '<div class="gg-note">チャットで「次回」「次の次」と送っても同じプレビューが出ます。「次回を送信」と送ると、登録済みのグループへ<b>今すぐ</b>送ることもできます。</div>'
      }),
      S({
        title: '【毎月】📢 アナウンスを予約する',
        menu: 'announcement', hl: 'アナウンス追加',
        html:
          '<p>「保護者連絡 → アナウンス → <b>アナウンス追加</b>」で、<b>送る日時と文面</b>を決めて予約します。時刻になると、宛先グループへ自動で届きます(1回きり)。</p>' +
          U.liff('アナウンス追加', [
            U.field('宛先グループ', '保護者グループ', 'select'),
            U.field('日付', '2026/10/15'), U.field('時刻', '19:00'),
            U.ta('送信する本文', SAMPLE_ANNOUNCE),
            U.btn('予約する'),
          ]) +
          '<ul><li>本文は、プレビューの文面を貼り付けて、必要なら手直しします。</li>' +
          '<li>日時は<b>2分以上先</b>を指定します。</li>' +
          '<li>送信できたものは、自動で予約から消えます。</li></ul>'
      }),
      S({
        title: '【毎月】予約の確認と取り消し',
        menu: 'announcement', hl: ['アナウンス一覧', 'アナウンス削除'],
        html:
          '<p>「<b>アナウンス一覧</b>」で、予約中のアナウンスを確認できます。</p>' +
          U.chat([{ who: 'me', text: 'アナウンス一覧' }, { who: 'bot', text: '📢 予約中のアナウンスだよ\n\n1. [保護者グループ] 2026-10-15 19:00\nカブ隊保護者のみなさま…' }]) +
          '<p>取り消したいときは「<b>アナウンス削除</b>」で、<b>チェックを入れて削除</b>します。</p>' +
          U.liff('アナウンス削除', [U.checks(['[保護者グループ] 2026-10-15 19:00\nカブ隊保護者のみなさま…'], [0]), U.btn('選択した1件を削除', true)])
      }),
      S({
        title: '👑 管理者編集を開く',
        menu: 'admin', hl: '👑 管理者編集',
        html:
          '<p>管理者は複数人にできます。管理者の追加・削除は、管理者用メニューの右上「<b>👑 管理者編集</b>」から行います。</p>' +
          '<div class="gg-note"><b>オーナー</b>(最初の管理者)は、常に管理者で、外すことはできません。</div>'
      }),
      S({
        title: '管理者を追加する',
        menu: 'admins', hl: '管理者追加',
        html:
          '<p>追加したい人の<b>ユーザーID</b>を入力して追加します。IDは、<b>本人がBotに1:1で「マイID」</b>と送ると分かります(次の「その他」のステップ)。</p>' +
          U.liff('管理者追加', [U.field('ユーザーID', 'U0123456789abcdef0123456789abcdef'), U.btn('追加する')]) +
          '<p>追加されると、その人のメニューがすぐ<b>管理者用</b>に切り替わります。</p>'
      }),
      S({
        title: '管理者を削除する・確認する',
        menu: 'admins', hl: ['管理者削除', '管理者一覧'],
        html:
          '<p>「<b>管理者削除</b>」は<b>チェックを入れて削除</b>します。事故防止のため、削除できるのは<b>オーナーだけ</b>です。</p>' +
          U.liff('管理者削除', [U.checks(['田中さん', '鈴木さん'], [1]), U.btn('選択した1人を削除', true)]) +
          '<p>「<b>管理者一覧</b>」で、今の管理者を確認できます。削除された人のメニューは、一般用(ヘルプだけ)に戻ります。</p>'
      }),
      S({
        title: 'その他：マイIDとヘルプ',
        menu: 'other', hl: ['🆔 マイID', 'ヘルプ'],
        html:
          '<p>メインメニューの「その他」にあります。</p>' +
          '<p>「<b>🆔 マイID</b>」は、<b>自分のユーザーIDを返します</b>。管理者になってもらう人には、1:1トークで押してもらい、返ってきたIDを管理者に伝えてもらいます(管理者以外でも使えます)。</p>' +
          U.chat([{ who: 'me', text: 'マイID' }, { who: 'bot', text: 'あなたのuserIdです\nU0123456789abcdef0123456789abcdef' }]) +
          '<p>「<b>ヘルプ</b>」は、使えるコマンドの一覧を返します。</p>'
      }),
      S({
        title: 'まとめ',
        menu: 'main-admin',
        html:
          '<table><tr><th>いつ</th><th>やること</th><th>どこから</th></tr>' +
          '<tr><td rowspan="3">初回だけ</td><td>送信先グループを登録</td><td>グループ内で「グループ追加」</td></tr>' +
          '<tr><td>ヘッダ・フッタ・テンプレ設定</td><td>管理者用 → 保護者連絡 → 案内文設定</td></tr>' +
          '<tr><td>管理者を追加</td><td>管理者用 → 管理者編集</td></tr>' +
          '<tr><td rowspan="3">毎月</td><td>PDFを取り込む</td><td>管理者用 → 活動予定 → カブ8取り込み</td></tr>' +
          '<tr><td>プレビューで確認</td><td>管理者用 → 保護者連絡 → 案内文設定 → プレビュー表示</td></tr>' +
          '<tr><td>アナウンスを予約</td><td>管理者用 → 保護者連絡 → アナウンス → アナウンス追加</td></tr></table>' +
          '<p>困ったら、チャットで「<b>ヘルプ</b>」と送ると、コマンドの一覧が返ります。</p>' +
          '<p class="gg-files">このページの人名・ID・グループ名は、すべてダミーです。</p>'
      }),
    ],
  });
})();
</script>
</body>
</html>
