<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-mirai ユースケース</title>
<!--
  ミライBotのユースケース(役割別の使い方を、デモ動画のように流すページ)。作りは line-bot-s8-cub/usecase.html と同じ。
  ・左の3Dは「ミライBotの中(Upstash Redisに保存しているもの)」と「外(人・LINEグループ・cron・外部API)」の箱と矢印。
  ・右のパネルのトーク画面はHTMLのモック。LIFFの画面とリッチメニューは、機能デモ(demo.html)と同じ本物の画面のスクショ
    (lib/demo-assets.js。作り直しは Bot側 scripts/demo/ の手順)を、上の部分だけ切り取って使っている。
  ・返事の文面は Bot のソース(api/index.js)と機能デモに合わせている。名前・ID・予定・グループ名はすべてダミー。
-->
<link rel="stylesheet" href="lib/guide.css">
<link rel="stylesheet" href="lib/mirai-tutorial.css">
<style>
  /* デモ再生の字幕とコントロール(3Dの上に重ねる) */
  .demo-ov { position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; }
  .demo-cap { margin: 0 auto 12px; width: fit-content; max-width: 84%; background: #000000b8; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 17px; line-height: 1.6; text-align: center; }
  .demo-cap:empty { display: none; }
  .demo-bar { pointer-events: auto; display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #000000a0; }
  .demo-bar button { border: 1px solid #ffffff55; background: #ffffff1c; color: #fff; border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  .demo-bar button.on { background: #06c755; border-color: #06c755; }
  .demo-prog { flex: 1; height: 6px; background: #ffffff30; border-radius: 3px; overflow: hidden; }
  .demo-prog i { display: block; height: 100%; width: 0; background: #06c755; }
  /* 見る人(ステークホルダー)の切り替え。3Dの左上に重ねる */
  .demo-tog { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #000000a0; padding: 6px 8px; border-radius: 10px; color: #fff; font-size: 13px; max-width: calc(100% - 24px); }
  .demo-tog button { border: 1px solid #ffffff55; background: #ffffff14; color: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .demo-tog button.on { background: #f59e0b; border-color: #f59e0b; color: #1b1830; font-weight: bold; }
  /* 本物の画面のスクショ(上の部分だけ切り取る) */
  .mi-shot { max-width: 270px; margin: 0 auto 12px; border: 1px solid #d5d5d5; border-radius: 12px; overflow: hidden; background: #fff; }
  .mi-shot.wide { max-width: 100%; }
  .mi-shot img { display: block; width: 100%; }
  .mi-shot-cap { text-align: center; font-size: 11.5px; opacity: .75; margin: -6px 0 12px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
<script src="lib/mirai-ui.js"></script>
<script src="lib/demo-assets.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors, U = MiraiUI.ui, at = U.at, A = window.MiraiDemoAssets;
  var FONT = '"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif';
  var WIDE = { pos: [0, 34, 27], target: [0, 0, -4] };
  var PACKETS = ['pk0', 'pk1', 'pk2'];
  var UID = 'U0123456789abcdef0123456789abcdef';   // ダミー

  // ---- 本物の画面のスクショ ----
  // LIFFの画面は 780px 幅(スマホ390px×2倍)。ボタンの下までで切り取る(下は余白なので)
  var CROP = { 'address': 676, 'calendar': 1248, 'todo-add': 558, 'reminder-add': 1152, 'announce-add': 1264, 'access-add': 600 };
  function shot(key, note) {
    return '<div class="mi-shot" style="aspect-ratio:780/' + CROP[key] + '"><img alt="" src="' + A.shots[key] + '"></div>' +
      (note ? '<div class="mi-shot-cap">' + note + '</div>' : '');
  }
  function menuShot(key, note) {
    var m = A.menus[key];
    return '<div class="mi-shot wide" style="aspect-ratio:' + m.w + '/' + m.h + '"><img alt="" src="' + m.img + '"></div>' +
      (note ? '<div class="mi-shot-cap">' + note + '</div>' : '');
  }

  // ---- 文面(Botのソース・機能デモと同じ) ----
  var WEATHER = '📍神奈川県相模原市中央区 の今日の天気だよ\n天気: 晴れ\n気温: 最高18℃ / 最低8℃\n現在の気温: 14.2℃(湿度52%)\n降水確率: 10%';
  var TODAY = '📅 今日の予定だよ\n09:30-10:30 打ち合わせ\n12:00-13:00 ランチ\n19:00-20:00 ジム';
  var ANNOUNCE = '次回の開催案内です!\n集合は19時、〇〇公民館です。';

  // 見る人ごとの「フロント」(人が触る・意識する場所)。ここだけ明るくして、裏側(保存先・cron・外部APIなど)は少し暗くする
  var STAKE = {
    use: {
      nodes: ['user', 'fixed', 'addr', 'cal', 'memo', 'remind', 'gcal'], links: ['u-fx', 'u-addr', 'u-cal', 'u-gc', 'u-memo', 'u-rm', 'rm-u'], tag: '👆 触る',
      tags: { remind: '⏰ 時刻に届く', gcal: '💻 共有だけ(パソコン)' },
    },
    admin: {
      nodes: ['admin', 'allow', 'groups', 'resv', 'group'], links: ['ad-al', 'gp-gr', 'ad-rs', 'gr-rs'], tag: '👆 触る',
      tags: { group: '👥 グループ内で登録' },
    },
    member: {
      nodes: ['group', 'resv', 'cron'], links: ['cr-rs', 'rs-gp'], tag: '👀 ここに届く',
      tags: { resv: '📢 予約した時刻に', cron: '⏰ 毎分チェック' },
    },
  };
  // 3Dに浮かべる画面。src: 画像(data URI)、crop: 元画像の [幅, 高さ](上から切り取る)、cw: キャンバスの幅(px)、
  // draw: 画像の代わりに描くトーク画面。at: 置く場所 [x, z](画像の下端の高さは y)、node: 破線でつなぐ箱、width: 3Dでの幅
  var SHOTS = [
    { id: 'img-menu', stake: 'use', src: A.menus.main.img, crop: [A.menus.main.w, A.menus.main.h], cw: 1000, node: 'user', at: [-19.5, -4], y: 7.5, width: 9.5, caption: '📱 メニュー(使う人)' },
    { id: 'img-todo', stake: 'use', src: A.shots['todo-add'], crop: [780, CROP['todo-add']], cw: 780, node: 'memo', at: [-10, -4], y: 7.5, width: 6.8, caption: '📝 メモ追加' },
    { id: 'img-remind', stake: 'use', src: A.shots['reminder-add'], crop: [780, CROP['reminder-add']], cw: 780, node: 'remind', at: [-2.5, -4], y: 7.5, width: 6.8, caption: '⏰ リマインド追加' },
    { id: 'img-cal', stake: 'use', src: A.shots['calendar'], crop: [780, CROP['calendar']], cw: 780, node: 'cal', at: [5, -4], y: 7.5, width: 6.8, caption: '📅 カレンダー登録' },
    { id: 'img-admin', stake: 'admin', src: A.menus['main-admin'].img, crop: [A.menus['main-admin'].w, A.menus['main-admin'].h], cw: 1000, node: 'admin', at: [-17, 4.5], y: 7.5, width: 9.5, caption: '🔧 管理者のメニュー' },
    { id: 'img-access', stake: 'admin', src: A.shots['access-add'], crop: [780, CROP['access-add']], cw: 780, node: 'allow', at: [-5, -4], y: 7.5, width: 6.8, caption: '✅ 権限許可' },
    { id: 'img-announce', stake: 'admin', src: A.shots['announce-add'], crop: [780, CROP['announce-add']], cw: 780, node: 'resv', at: [3, -4], y: 7.5, width: 6.8, caption: '📢 アナウンス追加' },
    { id: 'img-group', stake: 'member', draw: [
        { who: 'sys', text: '11月20日(金) 19:00' }, { who: 'bot', text: ANNOUNCE },
        { who: 'me', text: '@ミライBot メモ登録 名札を持っていく' }, { who: 'bot', text: 'メモを追加したよ📝\n1. 名札を持っていく' },
      ], title: 'サークルA(グループ)', cw: 520, node: 'group', at: [14, -2], y: 7.5, width: 9, caption: '💬 グループに届いた画面' },
  ];
  // 画像と、その画像から下の箱へ引く破線(id は 'link-' + 画像のid)
  Object.keys(STAKE).forEach(function (k) {
    STAKE[k].shots = SHOTS.filter(function (s) { return s.stake === k; }).reduce(function (r, s) { return r.concat([s.id, 'link-' + s.id]); }, []);
  });
  function tagId(kind, node) { return 'tag-' + kind + '-' + node; }
  function tagIds(kind) { return STAKE[kind].nodes.map(function (n) { return tagId(kind, n); }); }

  // 箱と矢印を明るく見せる id。流れるパケットは、どのステップでも明るく
  function ids(nodes, links) {
    var r = ['plate'];
    nodes.forEach(function (n) { r.push(n); });
    links.forEach(function (l) { r.push('a-' + l, 'f-' + l); });
    return r;
  }
  function F(nodes, links) { return ids(nodes, links).concat(PACKETS); }

  // ---- 3Dに浮かべるトーク画面(キャンバスに描く) ----
  function wrap(ctx, text, maxW) {
    var out = [];
    text.split('\n').forEach(function (para) {
      var line = '';
      Array.prototype.forEach.call(para, function (ch) {
        if (line && ctx.measureText(line + ch).width > maxW) { out.push(line); line = ''; }
        line += ch;
      });
      out.push(line);
    });
    return out;
  }
  // msgs を描く。ctx が null なら高さだけ測る
  function paintChat(ctx, w, title, msgs, measure) {
    var g = measure, top = 54, y = top + 14, fs = 21, lh = 30, pad = 12, maxW = w * 0.66;
    g.font = fs + 'px ' + FONT;
    var rows = msgs.map(function (m) {
      g.font = (m.who === 'sys' ? 17 : fs) + 'px ' + FONT;
      var lines = wrap(g, m.text, m.who === 'sys' ? w - 60 : maxW);
      var bw = Math.max.apply(null, lines.map(function (l) { return g.measureText(l).width; }));
      return { m: m, lines: lines, bw: bw };
    });
    rows.forEach(function (r) {
      var bh = r.lines.length * lh + pad * 2 - 6;
      if (ctx) {
        var m = r.m;
        if (m.who === 'sys') {
          ctx.font = '17px ' + FONT; ctx.fillStyle = '#0000002e';
          var sw = r.bw + 30; round(ctx, (w - sw) / 2, y, sw, 30, 15); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(m.text, w / 2, y + 21);
        } else {
          var bot = m.who === 'bot', bx = bot ? 70 : w - 18 - r.bw - pad * 2, by = bot ? y + 22 : y;
          if (bot) {
            ctx.fillStyle = '#7c5cff'; ctx.beginPath(); ctx.arc(38, y + 22, 20, 0, 7); ctx.fill();
            ctx.fillStyle = '#fff'; ctx.font = 'bold 18px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('ミ', 38, y + 29);
            ctx.fillStyle = '#fff'; ctx.font = '15px ' + FONT; ctx.textAlign = 'left'; ctx.fillText('ミライBot', bx + 4, y + 14);
          }
          ctx.fillStyle = bot ? '#fff' : '#8de055'; round(ctx, bx, by, r.bw + pad * 2, bh, 16); ctx.fill();
          ctx.fillStyle = '#222'; ctx.font = fs + 'px ' + FONT; ctx.textAlign = 'left';
          r.lines.forEach(function (l, j) { ctx.fillText(l, bx + pad, by + pad + 18 + j * lh); });
        }
      }
      y += (r.m.who === 'sys' ? 30 : r.m.who === 'bot' ? bh + 22 : bh) + 16;
    });
    if (ctx) {
      ctx.fillStyle = '#6d87a8'; ctx.fillRect(0, 0, w, top);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 21px ' + FONT; ctx.textAlign = 'center'; ctx.fillText(title, w / 2, 35);
    }
    return y + 8;
  }
  function round(ctx, x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---- デモ再生の仕組み(line-bot-s8-cub/usecase.html と同じ) ----
  var guide = null, timers = [], playing = false, t0 = 0, lastIndex = -1, STEPS = null;
  var capEl, playBtn, progEl;

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  // data-at(ms) を持つ要素を、ステップに入ってから ms 後にふわっと出す(トークの吹き出しなど)
  function reveal(g) {
    clearTimers();
    Array.prototype.forEach.call(g.bodyEl.querySelectorAll('[data-at]'), function (el) {
      el.classList.add('tu-hid');
      timers.push(setTimeout(function () {
        el.classList.remove('tu-hid');
        // 現れた吹き出しがパネルの下に隠れていたら、見える所までスクロールする
        var p = g.bodyEl, r = el.getBoundingClientRect(), pr = p.getBoundingClientRect();
        if (r.bottom > pr.bottom) p.scrollTo({ top: p.scrollTop + Math.min(r.bottom - pr.bottom + 12, r.top - pr.top), behavior: 'smooth' });
      }, Number(el.getAttribute('data-at'))));
    });
  }
  function enter(caption) { return function (g) { reveal(g); capEl.textContent = caption; }; }

  // 矢印 link の上を、start秒から dur秒かけてパケット(球)が流れる。back なら矢印と逆向き(返事)。
  // 同じ球を1つのステップで何度も流すので、毎フレームまず全部を画面外へ置き(parkFirst)、流れている区間だけ置き直す
  function fly(g, name, link, t, start, dur, back) {
    var k = g.linear(t, start, dur);
    if (k <= 0 || k >= 1) return;
    g.get(name).position.copy(g.get('a-' + link).userData.curve.getPoint(back ? 1 - k : k));
  }
  function parkFirst(steps) {
    steps.forEach(function (s) {
      var up = s.update;
      if (!up) return;
      s.update = function (g, t) { PACKETS.forEach(function (id) { g.get(id).position.y = -50; }); up(g, t); };
    });
    return steps;
  }
  function glow(g, id, t, from) { if (t >= from) g.pulse(g.get(id), t, 0.07); }

  function restartStep(i) { guide.stepIndex = -1; guide.go(i); lastIndex = i; t0 = Date.now(); }
  function lastDemoIndex() { var i = STEPS.length - 1; while (i > 0 && STEPS[i].stake) i--; return i; }
  function stakeIndex(kind) { for (var i = 0; i < STEPS.length; i++) if (STEPS[i].stake === kind) return i; return -1; }
  function setPlaying(on, keepStep) {
    playing = on;
    playBtn.textContent = on ? '⏸ 一時停止' : '▶ 自動で再生';
    playBtn.classList.toggle('on', on);
    if (on && !keepStep) {
      var cur = STEPS[guide.stepIndex];
      if (!cur || cur.stake || guide.stepIndex >= lastDemoIndex()) restartStep(0); else restartStep(guide.stepIndex < 0 ? 0 : guide.stepIndex);
    }
  }

  function buildOverlay(g) {
    var ov = document.createElement('div');
    ov.className = 'demo-ov';
    ov.innerHTML = '<div class="demo-cap"></div><div class="demo-bar"><button data-k="play">▶ 自動で再生</button><button data-k="restart">⏮ 最初から</button><div class="demo-prog"><i></i></div></div>';
    g.stage.appendChild(ov);
    capEl = ov.querySelector('.demo-cap'); playBtn = ov.querySelector('[data-k=play]'); progEl = ov.querySelector('.demo-prog i');
    // 見る人の切り替え(デモ / 使う人 / 管理者 / グループのみんな)。選んでいるものをもう一度押すと、デモに戻る
    var tog = document.createElement('div');
    tog.className = 'demo-tog';
    tog.innerHTML = '見る人: <button data-k="demo">デモ</button><button data-k="use">使う人</button><button data-k="admin">管理者</button><button data-k="member">グループのみんな</button>';
    g.stage.appendChild(tog);
    function syncToggle() {
      var cur = g.stepIndex >= 0 && STEPS[g.stepIndex] ? STEPS[g.stepIndex].stake : null;
      Array.prototype.forEach.call(tog.querySelectorAll('button'), function (b) {
        var k = b.getAttribute('data-k');
        b.classList.toggle('on', k === 'demo' ? !cur : k === cur);
      });
    }
    tog.onclick = function (e) {
      var k = e.target.getAttribute && e.target.getAttribute('data-k');
      if (!k) return;
      var cur = STEPS[g.stepIndex] && STEPS[g.stepIndex].stake;
      setPlaying(false, true);
      if (k === 'demo' || k === cur) { g.stepIndex = -1; g.go(0); } else g.go(stakeIndex(k));
      syncToggle();
    };
    setInterval(syncToggle, 200);
    playBtn.onclick = function () { setPlaying(!playing); };
    ov.querySelector('[data-k=restart]').onclick = function () { restartStep(0); setPlaying(true); };
    // 自動再生: いまの章が dur 秒たったら次の章へ。手でステップを変えたら、その章から数え直す
    setInterval(function () {
      var i = g.stepIndex;
      if (i < 0) return;
      if (i !== lastIndex) { lastIndex = i; t0 = Date.now(); }
      var dur = STEPS[i].dur * 1000, el = Date.now() - t0;
      progEl.style.width = playing ? Math.min(100, el / dur * 100) + '%' : '0';
      if (STEPS[i].stake) { if (playing) setPlaying(false, true); return; }
      if (playing && el >= dur) {
        if (i < lastDemoIndex()) g.go(i + 1); else setPlaying(false);
      }
    }, 150);
  }

  // 見る人のステップ(人が触る・意識するところだけ明るくする)
  function stakeStep(kind, title, camera, caption, html) {
    var s = STAKE[kind];
    return {
      title: title, stake: kind, dur: 9999,
      focus: F(s.nodes, s.links).concat(s.shots),
      show: tagIds(kind).concat(s.shots),
      camera: camera,
      enter: function (g) {
        reveal(g); capEl.textContent = caption;
        // フロント以外は「少し暗く」(共通の初期値より明るめ(0.3)にして、位置関係は見えるまま)
        Object.keys(g.dim).forEach(function (id) { if (g.dim[id].target < 1) g.dim[id].target = 0.3; });
      },
      update: function (g, t) { s.nodes.forEach(function (n) { glow(g, n, t, 0.2); }); },
      html: html,
    };
  }

  GameGuide.start({
    title: 'ミライBot ユースケース',
    subtitle: '「▶ 自動で再生」を押すと、友だち追加から、管理者のアナウンスまで、デモ動画のように流れます',
    camera: WIDE,
    build: function (g) {
      guide = g;
      // 画面は「ミライBotの中(Upstash Redisに保存しているもの)」と「外(人・LINEグループ・cron・外部API)」に分けて並べる。
      // 座標は [x, y, z]。奥が -z、手前が +z。箱の高さは 0.8 で、中心 y = 0.4。
      var N = {};
      function node(id, x, z, label, color, w, d) {
        w = w || 4.4; d = d || 2;
        N[id] = { x: x, z: z, w: w, d: d };
        g.box({ id: id, size: [w, 0.8, d], pos: [x, 0.4, z], color: color, radius: 0.2, edges: false, label: label, labelSize: 0.5, labelOffset: [0, 1.5, 0], labelBg: '#1b1830ee', labelBorder: color });
      }
      // 箱の縁から縁へ矢印を引く(箱の中に潜り込まないように、向きに応じて縁の位置を求める)
      function edge(n, tx, tz) {
        var dx = tx - n.x, dz = tz - n.z;
        var tX = dx ? (n.w / 2) / Math.abs(dx) : 1e9, tZ = dz ? (n.d / 2) / Math.abs(dz) : 1e9;
        var t = Math.min(tX, tZ) + 0.03;
        return [n.x + dx * t, 0.4, n.z + dz * t];
      }
      // dz: 行きと帰りの矢印が上から見て重ならないよう、奥行き方向へずらす量
      function link(id, from, to, label, color, lift, dz) {
        var a = N[from], b = N[to], p = edge(a, b.x, b.z), q = edge(b, a.x, a.z);
        if (dz) { p[2] += dz; q[2] += dz; }
        var L = g.arrow(p, q, { id: 'a-' + id, color: color, label: label, labelSize: 0.34, labelBg: '#1b1830dd', lift: lift == null ? 1.0 : lift });
        g.flow(L.userData.curve, { id: 'f-' + id, color: color, count: 4 });
      }

      g.plate({ id: 'plate', size: [26, 19], pos: [0, 0.03, -4], color: '#241f38', opacity: 0.95, radius: 0.5, label: '🤖 ミライBotの中(Upstash Redisに保存しているもの)', labelSize: 0.55, labelOffset: [0, 0.5, 9.7] });
      // 中(3段: 天気・予定・許可 / メモ・リマインド / その場で答えるもの・グループ・アナウンス)
      node('addr', -8, -10.5, '🌤️ 地域設定\n(天気の住所)', C.good);
      node('cal', 0, -10.5, '📅 カレンダーID\n(1つのIDは1人だけ)', C.data);
      node('allow', 8, -10.5, '✅ リマインダー\n許可リスト', C.server);
      node('memo', -8, -4, '📝 メモ\n(自分用・グループ用)', C.gold);
