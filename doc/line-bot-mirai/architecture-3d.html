<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>line-bot-mirai | 仕組み図解</title>
<link rel="stylesheet" href="lib/guide.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="lib/guide.js"></script>
</head>
<body>
<script>
(function () {
  var C = GameGuide.colors;

  // =========================================================================
  // 2つのシーンを1つの3D空間に並べて置き、ステップごとにカメラで見せ分けている。
  //   ランタイム編（動いているときの構成）  : x = 0 付近
  //   セットアップ編（どのサイトで何を設定するか）: x = SU(=30) 付近
  // =========================================================================
  var SU = 30;

  // ランタイム編の主要な座標（[x, y, z] / 奥が -z、手前が +z）
  var P_USER   = [-10, 1.2, 8.6];
  var P_LINE   = [-10, 1.6, 0.5];
  var P_VERCEL = [-2, 1.9, 0.5];
  var P_REDIS  = [8, 1.2, -6];
  var P_CRON   = [3, 1.0, 6.5];

  // セットアップ編：Vercelの環境変数ボードに並べる行 [変数名, 取得元の番号, 色]
  var ENV_ROWS = [
    ['LINE_CHANNEL_ACCESS_TOKEN', '①', '#06c755'],
    ['LINE_CHANNEL_SECRET', '①', '#06c755'],
    ['LIFF_ID', '⑤', '#9b84ff'],
    ['LINE_CHANNEL_ID', '⑤', '#9b84ff'],
    ['GOOGLE_SERVICE_ACCOUNT_EMAIL', '⑥', '#ea4335'],
    ['GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY', '⑥', '#ea4335'],
    ['ADMIN_USER_ID', '⑦', '#7ef0ff'],
    ['CRON_SECRET', '④', '#ffd166'],
    ['UPSTASH_REDIS_REST_KV_REST_API_URL', '③', '#00e9a3'],
    ['UPSTASH_REDIS_REST_KV_REST_API_TOKEN', '③', '#00e9a3']
  ];
  var ROW0 = -2.45, ROWD = 0.55;             // 1行目のz座標と行間
  function rowZ(i) { return ROW0 + i * ROWD; }
  function envIds(from, to) {               // 行の id をまとめて作る（focus指定用）
    var a = [];
    for (var i = from; i <= to; i++) { a.push('env-' + i, 'env-l-' + i); }
    return a;
  }

  // 1件のデータが pts を順番に旅していく様子。1区間 segDur 秒、loop 秒で先頭に戻る
  function travel(g, t, pts, segDur, loop) {
    g.get('pkt').visible = true;
    var k = (t % loop) / segDur;
    var i = Math.floor(k);
    if (i > pts.length - 2) { i = pts.length - 2; k = pts.length - 1; }
    g.arcPos('pkt', pts[i], pts[i + 1], k - i, 0.5);
    return i;
  }

  GameGuide.start({
    title: 'line-bot-mirai',
    back: 'index.html',
    subtitle: 'LINEボット「ミライ」の構成と、立ち上げるときに触るサイト（Node.js + Express / Vercel / Upstash Redis）',
    camera: { pos: [-3, 20, 24], target: [-3, 0, -0.5] },

    build: function (g) {

      // ===================================================================
      // シーンA：ランタイム編
      // ===================================================================
      g.group('rt', { pos: [0, 0, 0] });

      // ---- ユーザー（人の形） ----
      g.group('user', { parent: 'rt', pos: [-10, 0, 8.6] });
      g.cylinder({ id: 'user-body', parent: 'user', radius: 0.5, height: 1.1, pos: [0, 0.55, 0], color: C.me });
      g.sphere({ id: 'user-head', parent: 'user', radius: 0.36, pos: [0, 1.5, 0], color: C.me });
      g.label('ユーザー\n(LINEアプリ)', [0, 2.5, 0], { id: 'user-label', parent: 'user', size: 0.32, bg: '#00000088' });

      // ---- ユーザーの画面（リッチメニューとLIFFフォーム） ----
      g.box({
        id: 'richmenu', parent: 'rt', size: [2.6, 1.8, 0.12], pos: [-13.4, 1.0, 6.2], rot: [-0.18, 0.4, 0],
        color: '#2d2944', emissive: '#06c755', emissiveIntensity: 0.22,
        label: 'リッチメニュー\n(タップで定型文を送る)', labelSize: 0.27
      });
      g.box({
        id: 'liff', parent: 'rt', size: [2.6, 2.2, 0.12], pos: [-6.6, 1.2, 6.2], rot: [-0.18, -0.4, 0],
        color: '#2d2944', emissive: '#9b84ff', emissiveIntensity: 0.18,
        label: 'LIFFフォーム\napi/liff-reminder.html', labelSize: 0.27
      });

      // ---- LINE Platform ----
      g.box({
        id: 'line', parent: 'rt', size: [3.4, 1.5, 2.3], pos: [-10, 0.75, 0.5], radius: 0.2,
        color: '#06c755', label: 'LINE Platform\nMessaging API', labelSize: 0.3
      });

      // ---- Vercel（サーバーレス関数＝Expressアプリ本体） ----
      g.box({
        id: 'vercel', parent: 'rt', size: [5.0, 1.7, 2.7], pos: [-2, 0.85, 0.5], radius: 0.22,
        color: C.server, label: 'Vercel（サーバーレス関数）\napi/index.js = Express', labelSize: 0.3
      });
      g.label('呼ばれた時だけ起きて、\n終わると全部忘れる', [-2, 4.1, 1.6],
        { id: 'vercel-note', parent: 'rt', size: 0.27, color: '#ffd9a8', bg: '#00000088' });

      // ---- lib/ の機能モジュール ----
      g.group('libs', { parent: 'rt', pos: [-2.5, 0, -6] });
      [
        ['lib-weather', '天気\nweather.js', '#4dd0e1'],
        ['lib-calendar', '予定\ncalendar.js', '#ea4335'],
        ['lib-reminder', 'リマインド\nreminder.js', '#ffd166'],
        ['lib-todo', 'メモ\ntodo.js', '#5ee6a8'],
        ['lib-announce', 'アナウンス\nannouncement.js', '#c77dff'],
        ['lib-fun', 'ゴミ / おみくじ\n/ ミニゲーム', '#b8b2d6']
      ].forEach(function (e, i) {
        g.box({
          id: e[0], parent: 'libs', size: [1.9, 0.6, 1.5], pos: [-5.75 + i * 2.3, 0.3, 0], radius: 0.1,
          color: e[2], label: e[1], labelSize: 0.25
        });
      });
      g.label('lib/ … 機能ごとに1ファイル', [-2.5, 2.0, -8.1], { id: 'libs-label', parent: 'rt', size: 0.3, bg: '#00000088' });

      // ---- Upstash Redis ----
      g.cylinder({
        id: 'redis', parent: 'rt', radius: 1.2, height: 1.6, pos: [8, 0.8, -6],
        color: '#00e9a3', emissive: '#00e9a3', emissiveIntensity: 0.15,
        label: 'Upstash Redis\n唯一の保存場所', labelSize: 0.3
      });

      // ---- 外部API ----
      g.group('ext', { parent: 'rt', pos: [8, 0, 1.5] });
      g.box({ id: 'ext-nominatim', parent: 'ext', size: [3.0, 1.0, 1.5], pos: [0, 0.5, -1.7], radius: 0.12, color: '#7f9cf5', label: 'Nominatim\n住所→緯度経度', labelSize: 0.26 });
      g.box({ id: 'ext-openmeteo', parent: 'ext', size: [3.0, 1.0, 1.5], pos: [0, 0.5, 1.0], radius: 0.12, color: '#4dd0e1', label: 'Open-Meteo\n天気予報', labelSize: 0.26 });
      g.box({ id: 'ext-gcal', parent: 'ext', size: [3.0, 1.0, 1.5], pos: [0, 0.5, 3.7], radius: 0.12, color: '#ea4335', label: 'Google Calendar API\n予定', labelSize: 0.26 });
      g.label('外部API（キー不要のものと、要るもの）', [8, 1.6, 8.8], { id: 'ext-label', parent: 'rt', size: 0.28, bg: '#00000088' });

      // ---- 外部cronサービス ----
      g.box({
        id: 'cron', parent: 'rt', size: [3.2, 1.0, 1.7], pos: [3, 0.5, 6.5], radius: 0.12,
        color: C.gold, label: 'cron-job.org\n1分おきにGET', labelSize: 0.28
      });

      // ---- GitHub ----
      g.box({
        id: 'github', parent: 'rt', size: [3.2, 1.0, 1.9], pos: [-10, 0.5, -7.0], radius: 0.12,
        color: '#8b8b9e', label: 'GitHub\npushすると自動デプロイ', labelSize: 0.27
      });

      // ---- 矢印・データの流れ ----
      g.arrow(P_USER, [-10, 1.6, 2.0], { id: 'a-send', parent: 'rt', color: C.me, lift: 1.4, label: 'メッセージ送信', labelSize: 0.28 });
      g.arrow([-8.1, 1.6, 0.0], [-4.7, 1.6, 0.0], { id: 'a-webhook', parent: 'rt', color: C.data, lift: 0.7, label: 'POST /webhook\n+ 署名ヘッダ', labelSize: 0.26 });
      g.arrow([-4.7, 0.7, 1.2], [-8.1, 0.7, 1.2], { id: 'a-reply', parent: 'rt', color: C.good, lift: 0.7, label: 'replyMessage', labelSize: 0.26 });
      g.arrow([-10, 1.6, 2.4], P_USER, { id: 'a-deliver', parent: 'rt', color: C.good, lift: 1.4, head: 0.3 });

      g.flow([-2.5, 1.4, -0.9], [-2.5, 1.0, -4.9], { id: 'f-libs', parent: 'rt', color: C.data, lift: 0.8, count: 5 });
      g.flow([3.6, 0.9, -6.0], [6.6, 1.0, -6.0], { id: 'f-redis', parent: 'rt', color: '#00e9a3', lift: 0.6, count: 5 });
      g.arrow([3.6, 0.9, -7.0], [6.6, 0.9, -7.0], { id: 'a-redis', parent: 'rt', color: '#00e9a3', lift: 0.5, label: 'hset / hget', labelSize: 0.26 });

      g.flow([0.6, 1.4, 0.5], [6.4, 1.1, 0.0], { id: 'f-ext1', parent: 'rt', color: '#7f9cf5', lift: 1.0, count: 4 });
      g.flow([0.6, 1.4, 1.3], [6.4, 1.1, 2.5], { id: 'f-ext2', parent: 'rt', color: '#4dd0e1', lift: 1.0, count: 4 });
      g.flow([0.6, 1.4, 2.1], [6.4, 1.1, 5.2], { id: 'f-ext3', parent: 'rt', color: '#ea4335', lift: 1.2, count: 4 });

      g.arrow([1.3, 1.0, 6.2], [-0.2, 1.3, 2.0], { id: 'a-cron', parent: 'rt', color: C.gold, lift: 1.0, label: 'GET /cron/reminder?secret=…', labelSize: 0.26 });
      g.arrow([-7.0, 1.6, 5.7], [-3.6, 1.8, 1.9], { id: 'a-liff', parent: 'rt', color: '#9b84ff', lift: 1.2, label: 'POST /liff/…\n+ IDトークン', labelSize: 0.26 });
      g.arrow([-10, 1.0, -6.0], [-4.3, 1.3, -0.3], { id: 'a-deploy', parent: 'rt', color: '#b8b2d6', lift: 1.6, label: 'git push →\nビルド & デプロイ', labelSize: 0.26 });
      g.arrow([-2, 2.2, -0.9], [-9.0, 2.2, 0.2], { id: 'a-push', parent: 'rt', color: '#ff5f6d', lift: 2.6, label: 'pushMessage（月200通の無料枠）', labelSize: 0.26 });

      // 旅する1件のデータ。build時は非表示にしておき、使うステップだけ表示する
      g.sphere({ id: 'pkt', parent: 'rt', radius: 0.24, pos: P_USER, color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.6 }).visible = false;

      // ---- 管理者だけの経路 ----
      g.group('admin', { parent: 'rt', pos: [-15.5, 0, 3.0] });
      g.cylinder({ id: 'admin-body', parent: 'admin', radius: 0.5, height: 1.1, pos: [0, 0.55, 0], color: '#ff5f6d' });
      g.sphere({ id: 'admin-head', parent: 'admin', radius: 0.36, pos: [0, 1.5, 0], color: '#ff5f6d' });
      g.label('管理者\nADMIN_USER_IDと\n一致する人だけ', [0, 2.8, 0], { id: 'admin-label', parent: 'admin', size: 0.29, bg: '#00000088' });
      g.arrow([-15.0, 1.4, 2.0], [-11.4, 1.6, 0.8], { id: 'a-admin', parent: 'rt', color: '#ff5f6d', lift: 0.9, label: 'main-admin\nリッチメニュー', labelSize: 0.25 });

      // ===================================================================
      // シーンB：セットアップ編
      // ===================================================================
      g.group('su', { pos: [SU, 0, 0] });

      // ---- 真ん中：Vercelの環境変数ボード ----
      g.plate({ id: 'env-board', parent: 'su', size: [8.8, 6.6], pos: [0, 0.02, 0.1], color: '#1f1b31', opacity: 0.96, radius: 0.2 });
      g.label('Vercel の環境変数（Environment Variables）\n＝ 各サイトで取った値の集約先', [0, 0.9, 4.1],
        { id: 'env-title', parent: 'su', size: 0.34, bg: '#00000088' });
      ENV_ROWS.forEach(function (e, i) {
        var z = rowZ(i);
        g.plate({ id: 'env-' + i, parent: 'su', size: [8.0, 0.42], pos: [0, 0.07, z], color: e[2], opacity: 0.3, radius: 0.08 });
        g.label(e[1] + '  ' + e[0], [0, 0.4, z], { id: 'env-l-' + i, parent: 'su', size: 0.3, color: e[2] });
      });

      // ---- まわりのサイト ----
      var SITES = [
        ['site-line', [-10.2, 0.65, -3.2], [4.0, 1.3, 2.4], '#06c755', '① LINE Developers\nMessaging APIチャネル'],
        ['site-login', [-10.2, 0.65, 0.4], [4.0, 1.3, 2.4], '#9b84ff', '⑤ LINE Developers\nLINEログインチャネル + LIFF'],
        ['site-gcloud', [-10.2, 0.65, 4.0], [4.0, 1.3, 2.4], '#ea4335', '⑥ Google Cloud\nサービスアカウント'],
        ['site-vercel', [0, 0.7, -6.6], [5.4, 1.4, 2.4], '#ff9f43', '② Vercel\nImport してデプロイ'],
        ['site-github', [-7.6, 0.6, -9.2], [3.8, 1.2, 2.2], '#8b8b9e', '② GitHub\nリポジトリを push'],
        ['site-upstash', [10.2, 0.65, -1.0], [4.0, 1.3, 2.4], '#00e9a3', '③ Upstash\nRedis（無料枠）'],
        ['site-cron', [10.2, 0.65, 3.4], [4.0, 1.3, 2.4], '#ffd166', '④ cron-job.org\n1分おきのcron'],
        ['site-myid', [2.4, 0.6, 8.4], [4.4, 1.2, 2.2], '#7ef0ff', '⑦ LINEのトーク\n「マイID」で userId を確認']
      ];
      SITES.forEach(function (s) {
        g.box({ id: s[0], parent: 'su', pos: s[1], size: s[2], radius: 0.16, color: s[3], label: s[4], labelSize: 0.28 });
      });

      // ---- サイト → 環境変数行 への矢印 ----
      g.arrow([-8.2, 1.2, -3.2], [-4.6, 0.5, rowZ(0) + ROWD / 2], { id: 'a-env-line', parent: 'su', color: '#06c755', lift: 1.1 });
      g.arrow([-8.2, 1.2, 0.4], [-4.6, 0.5, rowZ(2) + ROWD / 2], { id: 'a-env-login', parent: 'su', color: '#9b84ff', lift: 1.1 });
      g.arrow([-8.2, 1.2, 4.0], [-4.6, 0.5, rowZ(4) + ROWD / 2], { id: 'a-env-gcloud', parent: 'su', color: '#ea4335', lift: 1.1 });
      g.arrow([2.4, 1.1, 7.3], [1.6, 0.5, rowZ(6)], { id: 'a-env-myid', parent: 'su', color: '#7ef0ff', lift: 1.8 });
      g.arrow([8.2, 1.2, 3.4], [4.6, 0.5, rowZ(7)], { id: 'a-env-cron', parent: 'su', color: '#ffd166', lift: 1.1 });
      g.arrow([8.2, 1.2, -1.0], [4.6, 0.5, rowZ(8) + ROWD / 2], { id: 'a-env-upstash', parent: 'su', color: '#00e9a3', lift: 1.1 });

      // ---- GitHub → Vercel → 環境変数ボード / Webhook URLの貼り直し ----
      g.arrow([-5.8, 1.1, -9.0], [-2.6, 1.2, -7.0], { id: 'a-su-deploy', parent: 'su', color: '#b8b2d6', lift: 0.9, label: 'Import / 自動デプロイ', labelSize: 0.26 });
      g.arrow([0, 1.3, -5.4], [0, 0.6, -3.4], { id: 'a-su-env', parent: 'su', color: '#ff9f43', lift: 0.5 });
      g.arrow([-2.8, 1.5, -6.2], [-8.4, 1.5, -3.6], { id: 'a-su-webhook', parent: 'su', color: '#ff5f6d', lift: 2.2, label: '発行されたURLを\nWebhook URL に貼り直す', labelSize: 0.26 });
      g.arrow([10.2, 1.3, 2.2], [10.2, 1.3, 0.3], { id: 'a-su-upstash-link', parent: 'su', color: '#ffd166', lift: 0.6 });

      // ---- ローカルから叩くスクリプト ----
      g.box({
        id: 'site-scripts', parent: 'su', pos: [-4.6, 0.55, 8.6], size: [5.6, 1.1, 2.2], radius: 0.14, color: '#4a4466',
        label: '⑧ 手元のPC\nnode scripts/setup-rich-menu.js', labelSize: 0.27
      });
      g.arrow([-6.0, 1.1, 7.5], [-9.6, 1.2, 1.7], { id: 'a-su-scripts', parent: 'su', color: '#b8b2d6', lift: 1.6, label: 'リッチメニューを\nLINEへ直接登録', labelSize: 0.26 });
    },

    steps: [
      // =================================================================
      // ランタイム編
      // =================================================================
      {
        title: 'まずは全体像（動いているときの構成）',
        show: ['rt'],
        camera: { pos: [-3, 20, 24], target: [-3, 0, -0.5] },
        html:
          '<p>登場人物はこれだけ。<b>サーバーを自分で持っていない</b>のがポイントで、全部よそのサービスの無料枠を組み合わせて動いてる。</p>' +
          '<table><tr><th>役</th><th>やってること</th></tr>' +
          '<tr><td>ユーザー</td><td>LINEアプリから話しかける</td></tr>' +
          '<tr><td>LINE Platform</td><td>メッセージを中継する。Botの代わりに吹き出しを出す</td></tr>' +
          '<tr><td>Vercel</td><td><code>api/index.js</code>（Express）が全リクエストを受ける本体</td></tr>' +
          '<tr><td>lib/*.js</td><td>機能ごとの処理。天気・予定・リマインド・メモ・アナウンス…</td></tr>' +
          '<tr><td>Upstash Redis</td><td>覚えておきたいものを置く唯一の場所</td></tr>' +
          '<tr><td>外部API</td><td>住所→座標、天気予報、Googleカレンダー</td></tr>' +
          '<tr><td>cron-job.org</td><td>1分おきに叩いてくれる外部の時計</td></tr>' +
          '<tr><td>GitHub</td><td>pushするとVercelが勝手に作り直す</td></tr></table>' +
          '<div class="gg-note">Vercelのサーバーレス関数は<b>リクエストが来た時だけ起きて、返したら全部忘れる</b>。なので「さっきの続き」はコードの中に持てない。この制約がこの後の設計ぜんぶに効いてくる。</div>' +
          '<p class="gg-files">📄 <code>api/index.js</code>（約1,060行）、<code>lib/</code> に13ファイル</p>'
      },
      {
        title: 'ひとこと送って返ってくるまで',
        show: ['rt'],
        focus: ['user', 'richmenu', 'line', 'vercel', 'a-send', 'a-webhook', 'a-reply', 'a-deliver', 'pkt'],
        camera: { pos: [-16, 10, 15], target: [-6, 1.0, 3.5] },
        html:
          '<p>白い玉が1件のメッセージ。<b>行きは水色（Webhook）、帰りは緑（返信）</b>で、必ずこの往復で1回分が完結する。</p>' +
          '<ol>' +
          '<li>ユーザーが「天気 〇〇市」と送る</li>' +
          '<li>LINE Platform が <code>POST /webhook</code> でVercelに投げる</li>' +
          '<li><code>@line/bot-sdk</code> の <code>middleware()</code> が <code>X-Line-Signature</code> をチャネルシークレットで検証する。<b>ここだけ <code>express.json()</code> を通していない</b>（署名の計算に生のリクエストボディが必要だから）</li>' +
          '<li><code>handleEvent()</code> がコマンドを判定して処理</li>' +
          '<li><code>replyMessage</code> で返事。LINEがユーザーに表示する</li>' +
          '</ol>' +
          '<div class="gg-note"><code>replyToken</code> は<b>そのイベント1回だけ・短時間だけ</b>有効。だから「あとで送る」ものは返信では作れず、別途 <code>pushMessage</code> が必要になる（STEP 7）。</div>' +
          '<p class="gg-files">📄 <code>api/index.js</code> の <code>app.post(\'/webhook\', middleware(config), …)</code></p>',
        update: function (g, t) {
          travel(g, t, [P_USER, P_LINE, P_VERCEL, P_LINE, P_USER], 1.1, 5.4);
          g.setColor('pkt', (t % 5.4) < 2.2 ? '#7ef0ff' : '#5ee6a8');
        }
      },
      {
        title: 'コマンドの振り分けは「上から順の1本道」',
        show: ['rt'],
        focus: ['vercel', 'libs', 'lib-weather', 'lib-calendar', 'lib-reminder', 'lib-todo', 'lib-announce', 'lib-fun', 'f-libs', 'libs-label'],
        camera: { pos: [-2, 12, 10], target: [-2, 0.8, -3] },
        html:
          '<p>ルーティングはフレームワーク任せではなく、<code>COMMANDS</code> という<b>[判定, ハンドラ] の配列</b>を上から試して、最初に当たった1つだけを実行する形。</p>' +
